, including China, France, Rwanda, and Italy. Plastic bags can be re-used in a variety of ways and can carry 2,500 times their own weight! Despite their convenience, plastic bags pose significant environmental challenge, and these problems are becoming increasingly widespread. Fortunately, more people are becoming aware of this issue and taking action to mitigate it.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. Plastic bags are extremely slow to decompose taking around…… years if not recycled</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">three hundred</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">one hundred</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">one hundred and fifty</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">two hundred</span>"], "c": 0, "e": "ذكر النص أن الأكياس البلاستيكية تستغرق حوالي 300 عام لتتحلل إذا لم يُعَد تدويرها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. Which of the following sentences summarizes the second paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Because plastic bags are easy to discard, they end up polluting the environment and causing disease.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags are only harmful when they reach rivers and coastal areas.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags are useful in daily life despite their minor environmental impact.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Governments have successfully reduced plastic bag pollution in public spaces.</span>"], "c": 0, "e": "توضح الفقرة الثانية كيف يؤدي التخلص العشوائي من الأكياس لانسداد المصارف وانتشار الأمراض."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. Based on the text, which judgment evaluates the impact of banning single-use plastic bags?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is unnecessary because bag use has little effect on the environment.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is a meaningful step because it encourages more sustainable practices.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is ineffective because people will switch to other harmful materials.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is harmful because it creates difficulties for consumers and shops.</span>"], "c": 1, "e": "حظر الأكياس البلاستيكية في أكثر من 40 دولة خطوة هامة نحو ممارسات أكثر استدامة كما يوحي النص."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. According to the passage, by the coming years, sea animal&rsquo;s slow starvation will continue unless ……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">environment problems are actively highlighted</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">feeding sea animals is properly organized</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">climate change issues are widely addressed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the consumption of plastic bags is strictly controlled</span>"], "c": 3, "e": "استمرار موت الحيوانات البحرية جوعًا مرتبط مباشرة باستهلاك الأكياس البلاستيكية، فالحل هو ضبط استهلاكها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Plastic bags are widely used because they are ……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">heavy and durable materials</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">convenient, lightweight, and easy to throw away</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mainly designed for long-term reuse</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">difficult to produce and therefore more valuable</span>"], "c": 1, "e": "ذكر النص أن الأكياس خفيفة الوزن وسهلة الاستخدام والتخلص منها، ما يجعلها منتشرة رغم أضرارها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. According to the passage, plastic bags always end up ….………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">flying in the air or drifting in rivers</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">buried in soil</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">planted in land or stored in gardens</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">packed in boxes</span>"], "c": 0, "e": "وصف النص الأكياس وهي تطير في الهواء أو تطفو على الأنهار كمصير شائع لها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. Unlike Plastic, bags paper bags can reduce………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">productivity</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">pollution</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">donations</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">creativity</span>"], "c": 1, "e": "الأكياس الورقية بديل أكثر صداقة للبيئة، فهي تقلل من التلوث الناتج عن البلاستيك."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. Everyone at the meeting suggested that, Dina ……………… the team leader during the expedition.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">assigns</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">assigning</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should assign</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">be assigned</span>"], "c": 3, "e": "suggest that + مصدر بدون to، ودينا تتلقى الفعل (مبني للمجهول): be assigned."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">We think that the conference not to be a failure.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">We don't think the conference to be a failure.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">We don't think the conference will be a failure.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">We think that the conference will be not a failure.</span>"], "c": 2, "e": "النفي المنقول (Transferred Negation) يُنسب عادة للفعل الرئيسي (don't think) وليس للجملة الفرعية."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. The company was fined, ……... it had breached safety regulations.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">owing to</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">since</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">so that</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">as the result of</span>"], "c": 1, "e": "since + جملة كاملة بفعل (had breached) تفيد السببية؛ أما owing to فتحتاج اسمًا فقط."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. I watched a lot of people at the opening of the grand museum, most of ……...were tourists.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">they</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">which</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">whom</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">that</span>"], "c": 2, "e": "most of + ضمير وصل للأشخاص في حالة المفعول به: whom."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. Excuse me sir. There&rsquo;s.......... Mr. James in the waiting area. He wants to meet you.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">no article</span>"], "c": 0, "e": "a + اسم علم يعني “شخص يُدعى...” (غير معروف من قبل): a Mr. James."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. Mr. Ali is such an amazing person. He had us …… all through the meal.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to laugh</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laughed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laughs</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laughing</span>"], "c": 3, "e": "have + مفعول + Gerund (استمرارية الفعل): had us laughing."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. The team all wanted coffee so I made ……………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">it them</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">it some</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">them some</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">d some of them</span>"], "c": 2, "e": "مفعولان: غير مباشر (them) ومباشر (some [coffee]): made them some."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. She was upset at Lina …………... to her.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lying</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to lie</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lied</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">of lying</span>"], "c": 0, "e": "حرف الجر at + Gerund: at Lina's lying (lying)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>The path to success is never paved with roses. It&rsquo;s a journey that demands efforts and sacrifices although you will face obstacles but the thrill of reaching the top wipes away all the pain and fatigue.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">طريق النجاح ليس مفروشًا بالورود، إنها رحلة تتطلب الجهد والتضحيات. فعلى الرغم من مواجهة العديد من العقبات فإن متعة بلوغ القمة تمحو كل الألم والتعب.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">طريق النجاح ليس مفروشًا بالورود، إنها رحلة تتطلب الجهد والتعب. فعلى الرغم من مواجهة العديد من العقبات ولكن فرحة الوصول تنسف كل الألم والتعب.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">طريق النجاح ليس محاطًا بالورود، إنها رحلة تتطلب الجهد والتضحية. فعلى الرغم من مواجهة صعوبات كثيرة ولكن فرحة الوصول تُحيي كل الألم والتعب.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">طريق النجاح ليس محاطًا بالورود، إنها رحلة تحتاج الجهد والتعب. فعلى الرغم من مصارعة العقبات الكثيرة ولكن فرحة الوصول تمحو كل الألم والتعب.</span>"], "c": 0, "e": "الخيار (a) وحده يترجم “efforts and sacrifices” (الجهد والتضحيات) و“wipes away” (تمحو) بدقة؛ باقي الخيارات تستبدل “التضحيات” بـ“التعب” (تكرار) أو تستخدم أفعالاً بمعنى معاكس مثل “تُحيي”."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Humans are using more natural resources than the Earth can replenish each year, which is leading to deforestation, desertification, soil erosion and contaminated air and water.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يستخدم البشر الموارد الطبيعية بشكل أكبر مما تستطيع الأرض تعويضه كل عام، التي تؤدي إلى إزالة الحدائق والتصحر وتآكل السطح وتلوث الهواء والماء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يستخدم الإنسان المصادر الطبيعية بشكل أعمق مما تستطيع الأرض نشره كل عام، مما يؤدي إلى إزالة الغابات والتصحر وتآكل التربة وتلوث الهواء والماء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يستخدم الإنسان المصادر الطبيعية بشكل يفوق قدرة الأرض على تغييرها كل عام، كما تؤدي إلى إزالة الغابات والتصحر وتآكل السطح وتلوث الهواء والماء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يستخدم البشر الموارد الطبيعية بشكل يفوق قدرة الأرض على تجديدها كل عام، مما يؤدي إلى إزالة الغابات والتصحر وتآكل التربة وتلوث الهواء والماء.</span>"], "c": 3, "e": "الخيار (d) هو الوحيد الدقيق بالكامل: “replenish” = تجديدها (وليس تعويضه/نشره/تغييرها)، “deforestation” = إزالة الغابات (وليس الحدائق)، و“soil erosion” = تآكل التربة (وليس السطح)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>المتحف القومي للحضارة المصرية هو أول متحف مصري مخصص لعرض العصور المتعددة عبر التاريخ المصري. وتضم قاعات العرض مجموعات من القطع الأثرية النفيسة.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The National Museum of Egyptian Civilization is the first Egyptian museum dedicated to exhibiting the multiple eras across the Egyptian history. Its exhibition halls encompass arrays of precious artefacts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The National Museum of Egyptian Civilization is first Egyptian museum delighted to exhibiting the multiple areas from across Egypt history. Its exhibition halls encompasses an array of precious artefacts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The National Museum of Egyptian Civilization is first Egyptian museum dedicated to exhibiting the multiple eras across Egypt history. Its exhibition halls encompasses an array of precious historic objects.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The National Museum of Egyptian Civilization is the first Egyptian museum delighted to exhibiting the multiple eras from across Egypt culture. Its exhibition halls encompass an array of precious rare objects.</span>"], "c": 0, "e": "الخيار (a) سليم تمامًا نحويًا (the first، dedicated، encompass مطابق للفاعل الجمع halls)؛ باقي الخيارات بها أخطاء (delighted بدل dedicated، عدم تطابق الفعل مع الفاعل، أو حذف أداة التعريف)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>حتى أحلك الليالي تستسلم في النهاية لنور الفجر، لتذكرنا أن الحزن لا يدوم إلى الأبد، وأن الأمل يجد دومًا طريقًا للنهوض، وأن العمل الجاد هو الطريق الوحيد للنجاح.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Even the deepest night will surrender to the light of down, reminding us that sorrow lasts forever, hope always light a way to rise and hard work is the only way to success.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Even the deepest nights will surrender to the light of dawn, reminding us that no sorry lasts forever, hope always find a way to raise and hard work is the only way to succeed.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Even the darkest nights will eventually give up to the light of dawn, reminding us that sorrow never lasts forever, hope always finds a way to rise and hard work is the only way to success.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Even the darkest night will eventually give up to the light of dawn, reminding us that sorrow never least forever, hope always finds a way to rise and hard work is the only way to succeed.</span>"], "c": 2, "e": "الخيار (c) سليم تمامًا نحويًا وإملائيًا (nights جمع مطابق للفعل will، dawn وليس down، sorrow never lasts وليس least)؛ باقي الخيارات بها أخطاء إملائية أو نحوية (down بدل dawn، sorry بدل sorrow، least بدل lasts، عدم تطابق العدد)."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. &ldquo;Taking revenge in The Count of Monte Cristo is driven by multiple motives&rdquo;. Explain giving two examples from the novel, highlighting the reason behind Edmund&rsquo;s actions.</span>", "model": "Edmond's revenge is driven by several distinct motives rather than a single simple desire. First, his revenge against Fernand is deeply personal and rooted in heartbreak and betrayal, since Fernand stole both his freedom and the woman he loved, Mercédès, making Edmond's actions against him driven by wounded love and jealousy. Second, his revenge against Danglars is motivated more by a desire for justice against pure professional greed, since Danglars conspired against Edmond purely to prevent him from becoming captain, showing that Edmond's revenge responds differently to each type of betrayal he suffered.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. Do you think Edmond should have waited for another chance instead of risking everything for freedom? Explain your answer in detail, providing at least two reasons supported by evidence from the novel.</span>", "model": "In my opinion, Edmond was right to risk everything for his freedom rather than simply waiting. First, he had already spent many years unjustly imprisoned with no indication that his situation would ever improve through official channels, so waiting passively could have meant dying in prison for a crime he never committed. Second, his escape allowed him to recover Abbé Faria's treasure and use his freedom and wealth to pursue justice against those who wronged him, an outcome that would have been impossible had he continued to wait patiently behind bars. Taking the risk, therefore, was ultimately what allowed him to reclaim both his life and his sense of justice.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write an introductory paragraph of SIX (6) lines on the following topic: &ldquo;Three passive effects of using AI widely&rdquo;</span>", "model": "Artificial intelligence has rapidly become part of everyday life, transforming the way we work, learn, and communicate. While AI offers many benefits, its widespread use also brings several passive, often overlooked effects on society. One such effect is the gradual decline of certain human skills, as people increasingly rely on AI tools instead of developing their own abilities. Another effect is the growing concern over job displacement, as automation quietly replaces roles once performed by humans. Finally, excessive reliance on AI can weaken critical thinking, as people accept machine-generated answers without questioning them. This paragraph will explore these three passive effects in more detail.", "marks": 5}];

let ci=0,ans={},viewedEssay={},po=false;
const $M=document.getElementById('MC'),$sC=document.getElementById('sC'),$sW=document.getElementById('sW'),$sT=document.getElementById('sT'),$pT=document.getElementById('pTx'),$pF=document.getElementById('pFl'),$bP=document.getElementById('bP'),$bN=document.getElementById('bN'),$ov=document.getElementById('ov'),$nP=document.getElementById('nP'),$nG=document.getElementById('nG'),$cO=document.getElementById('cO'),$sBg=document.getElementById('sBg'),$sNm=document.getElementById('sNm'),$pNav=document.getElementById('pNav');

function curSec(){for(let i=0;i<SECS.length;i++){const s=SECS[i];if(ci>=s.s&&ci<=s.e)return Object.assign({},s,{idx:i});}return Object.assign({},SECS[0],{idx:0});}
function mcqCount(sec){return Q.slice(sec.s,sec.e+1).filter(q=>q.type==='mcq').length;}

function ld(){try{const s=localStorage.getItem('samy_namozag_v1');if(s){const d=JSON.parse(s);if(d){ans=d.a||{};viewedEssay=d.v||{};ci=d.i!=null&&d.i<Q.length?d.i:0;}}}catch(e){}}
function sv(){try{localStorage.setItem('samy_namozag_v1',JSON.stringify({a:ans,v:viewedEssay,i:ci}));}catch(e){}}
function gs(sec){let c=0,w=0,t=0;for(let i=sec.s;i<=sec.e;i++){const q=Q[i];if(q.type!=='mcq')continue;const k='q'+i;if(k in ans){t++;if(ans[k]===q.c)c++;else w++;}}return{c,w,t};}
const PICO=["📘","📖","🌱","✍️","🌐","📝","📚","🔤","💬","🧩","🎯","🗂️"];
function bPN(){let h='';SECS.forEach((s,i)=>{const lbl=s.n.split(':')[0];const ic=PICO[i%PICO.length];h+=`<button class="pnBtn" data-i="${i}" title="${s.n}"><span class="pnIcon">${ic}</span><span class="pnLbl">${lbl}</span></button>`;});
 $pNav.innerHTML=h;$pNav.querySelectorAll('.pnBtn').forEach(el=>{el.addEventListener('click',()=>{const i=+el.dataset.i;goT(SECS[i].s);});});}
function ui(){const sec=curSec();const{c,w,t}=gs(sec);$sC.textContent=c;$sW.textContent=w;$sT.textContent=t;const mc=mcqCount(sec);$pT.textContent=t+' من '+mc;$pF.style.width=(mc?(t/mc)*100:0)+'%';$bP.disabled=ci<=0;$bN.disabled=ci>=Q.length-1;
$sBg.textContent='Test '+(sec.idx+1);$sNm.textContent=sec.n;
$pNav.querySelectorAll('.pnBtn').forEach(el=>{el.classList.toggle('act',+el.dataset.i===sec.idx);});
rNG();}

function rQ(){const q=Q[ci];const sec=curSec();const localNum=ci-sec.s+1;const localTotal=sec.e-sec.s+1;
let ph='';if(q.passage){ph=`<div class="rp">${q.passage.replace('<div class="rp" dir="ltr">','').replace(/<\/div>$/,'')}</div>`;}
if(q.type==='essay'){
  const k='q'+ci,viewed=!!viewedEssay[k];
  let eh='';
  if(viewed){
    eh=`<div class="eb sh em"><div class="ebg bm">✎ نموذج إجابة مقترح</div><div class="etx ltrtx">${q.model}</div></div>`;
  }
  $M.innerHTML=`<article class="qc"><div class="qh es"><div class="qn es">سؤال مقالي ${localNum}</div><div class="pr"><span class="mmb">${q.marks} ${q.marks===1?'درجة':'درجات'}</span></div></div><div class="qb">${ph}<div class="qt">${q.q}</div>${viewed?'':'<button class=\"essayBtn\" id=\"showModelBtn\">إظهار نموذج الإجابة</button>'}</div>${eh}</article>`;
  if(!viewed){document.getElementById('showModelBtn').addEventListener('click',()=>{viewedEssay[k]=true;sv();rQ();});}
  ui();window.scrollTo({top:0,behavior:'smooth'});
  return;
}
const k='q'+ci,a=k in ans,si=a?ans[k]:-1,ok=a&&si===q.c;
let oh='';for(let i=0;i<q.o.length;i++){let cl='op',ic='';if(a){cl+=' lk';if(i===q.c){cl+=' ok';ic='<span class="oic">&#10003;</span>';}else if(i===si){cl+=' no';ic='<span class="oic">&#10007;</span>';}else cl+=' dm';}
oh+=`<div class="${cl}" data-i="${i}" role="button" tabindex="0"><div class="ol">${LT[i]}</div><div class="otx">${q.o[i]}</div>${ic}</div>`;}
let eh='';if(a){const ec=ok?'ec':'ew',bc=ok?'bc':'bw',bt=ok?'&#10003; إجابة صحيحة':'&#10007; إجابة خاطئة';let ca='';if(!ok)ca=`<div class="eca">الإجابة الصحيحة: ${LT[q.c]}) ${q.o[q.c]}</div>`;eh=`<div class="eb sh ${ec}"><div class="ebg ${bc}">${bt}</div><div class="etx">${q.e}</div>${ca}</div>`;}
const{c,w,t}=gs(sec);const mc=mcqCount(sec);let cp='';if(t===mc&&mc>0){const p=Math.round((c/mc)*100);cp=`<div class="cpb"><h3>&#127942; تمت الإجابة على جميع الأسئلة الموضوعية في ${sec.n.split(':')[0]}!</h3><p>نتيجتك النهائية: ${c} صحيح من ${mc} (${p}%) — ${w} إجابة خاطئة</p><p style="margin-top:8px;font-size:.85rem;color:var(--tl)">لا تنسَ مراجعة نماذج الإجابة على الأسئلة المقالية. بالتوفيق في الامتحان إن شاء الله!</p></div>`;}
$M.innerHTML=`<article class="qc"><div class="qh"><div class="qn">السؤال ${localNum} <span style="opacity:.6;font-weight:500">/ ${localTotal}</span></div><div class="pr">صفحة <span class="pgb">${q.pg}</span></div></div><div class="qb">${ph}<div class="qt">${q.q}</div><div class="og">${oh}</div></div>${eh}</article>${cp}`;
if(!a){$M.querySelectorAll('.op').forEach(el=>{el.addEventListener('click',()=>hA(+el.dataset.i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hA(+el.dataset.i);}});});}
ui();window.scrollTo({top:0,behavior:'smooth'});}

function hA(i){const k='q'+ci;if(k in ans)return;ans[k]=i;sv();rQ();}
function nav(d){const n=ci+d;if(n<0||n>=Q.length)return;ci=n;sv();rQ();}
function goT(i){if(i<0||i>=Q.length)return;ci=i;sv();rQ();if(po)tgP();}
function rNG(){const sec=curSec();let h='';for(let i=sec.s;i<=sec.e;i++){const q=Q[i],k='q'+i;let cl='nc';if(i===ci)cl+=' cu';
if(q.type==='essay'){if(viewedEssay[k])cl+=' ne';}
else{if(k in ans)cl+=(ans[k]===q.c)?' cc':' cw';}
h+=`<div class="${cl}" data-i="${i}" role="button" tabindex="0">${i-sec.s+1}</div>`;}
$nG.innerHTML=h;$nG.querySelectorAll('.nc').forEach(el=>{el.addEventListener('click',()=>goT(+el.dataset.i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goT(+el.dataset.i);}});});}
function tgP(){po=!po;$nP.classList.toggle('op',po);$ov.classList.toggle('sh',po);if(po)rNG();}
$cO.querySelector('.cby').addEventListener('click',()=>{ans={};viewedEssay={};ci=0;sv();$cO.classList.remove('sh');if(po)tgP();rQ();});
$cO.querySelector('.cbn').addEventListener('click',()=>$cO.classList.remove('sh'));
$bP.addEventListener('click',()=>nav(-1));$bN.addEventListener('click',()=>nav(1));document.getElementById('bG').addEventListener('click',tgP);$ov.addEventListener('click',tgP);document.getElementById('pCl').addEventListener('click',tgP);document.getElementById('bR').addEventListener('click',()=>$cO.classList.add('sh'));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
if(e.key==='ArrowLeft'){e.preventDefault();nav(1);}else if(e.key==='ArrowRight'){e.preventDefault();nav(-1);}else if(e.key==='g'||e.key==='G'){e.preventDefault();tgP();}else if(e.key==='Escape'){if($cO.classList.contains('sh'))$cO.classList.remove('sh');else if(po)tgP();}else if(['1','2','3','4'].includes(e.key)){const i=+e.key-1;const q=Q[ci];if(q&&q.type==='mcq'&&i<q.o.length&&!('q'+ci in ans)){e.preventDefault();hA(i);}}});
bPN();ld();rQ();
</script>
</body>
</html>
