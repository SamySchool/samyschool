}, {"q": "A balanced diet and regular exercise are both vital for maintaining your physical and mental ..........", "options": ["willpower", "upbringing", "well-being", "income"], "answer": 2, "why": "Overall health/happiness = well-being.", "why_ar": "الصحة والسعادة الشاملة = الرفاهية (well-being)."}, {"q": "The government introduced strict .......... to reduce air pollution levels in the city center.", "options": ["measures", "outcomes", "obstacles", "context"], "answer": 0, "why": "Official actions taken to solve a problem are measures.", "why_ar": "إجراءات رسمية لحل مشكلة هي تدابير (measures)."}, {"q": "When you have a busy schedule, it is essential to .......... your tasks based on their importance.", "options": ["possess", "maintain", "prioritize", "demonstrate"], "answer": 2, "why": "Ordering tasks by importance is to prioritize them.", "why_ar": "ترتيب المهام حسب الأهمية = تحديد الأولويات (prioritize)."}, {"q": "Lack of education can be a major .......... for young people trying to find a high-paying job.", "options": ["brand", "context", "failure", "obstacle"], "answer": 3, "why": "Something that blocks progress is an obstacle.", "why_ar": "ما يعيق التقدم هو عائق (obstacle)."}]}, {"src": "مذكرة", "page": 85, "q": "Synonyms/Antonyms/Prepositions Q27-34", "type": "mcq", "items": [{"q": "Finding affordable childcare is a significant challenge for many single parents today. The antonym of \"affordable\" is ..........", "options": ["cheap", "costly", "low-cost", "attainable"], "answer": 1, "why": "The opposite of affordable (cheap) is costly.", "why_ar": "عكس ميسور التكلفة (رخيص) هو باهظ الثمن (costly)."}, {"q": "The long-term resilience of the economy depends on the strength of small businesses. The antonym of \"resilience\" is ..........", "options": ["fragility", "adaptability", "flexibility", "willpower"], "answer": 0, "why": "The opposite of resilience is fragility.", "why_ar": "عكس المرونة النفسية هو الهشاشة (fragility)."}, {"q": "Many low-income students face structural barriers that limit their access to higher education. The antonym of \"barriers\" is ..........", "options": ["hurdles", "obstacles", "aids", "restrictions"], "answer": 2, "why": "The opposite of barriers (obstacles) is aids (things that help).", "why_ar": "عكس العوائق هو المساعدات (أشياء تساعد)."}, {"q": "Feeling disempowering after the loss, she struggled to regain control over her daily routine. The antonym of \"disempowering\" is ..........", "options": ["weakening", "discouraging", "accessible", "motivating"], "answer": 3, "why": "The opposite of disempowering is motivating.", "why_ar": "عكس المُضعِف هو المُحفِّز (motivating)."}, {"q": "Many historians attribute the fall of the empire .......... a combination of economic decay and war.", "options": ["with", "for", "to", "from"], "answer": 2, "why": "Correct preposition: \"attribute X to Y\".", "why_ar": "حرف الجر الصحيح: \"attribute X to Y\" (يُعزى إلى)."}, {"q": "It is essential for teenagers to .......... personal ownership for their future goals.", "options": ["choose", "take", "do", "get"], "answer": 1, "why": "Correct collocation: \"take ownership\".", "why_ar": "التعبير الصحيح: \"take ownership\" (يتحمل المسؤولية/الملكية)."}, {"q": "The government must invest .......... public health policies to prevent the spread of chronic diseases.", "options": ["on", "with", "for", "in"], "answer": 3, "why": "Correct preposition: \"invest in\".", "why_ar": "حرف الجر الصحيح: \"invest in\" (يستثمر في)."}, {"q": "The state government imposed strict restrictions .......... the use of water during the severe summer drought.", "options": ["with", "on", "for", "at"], "answer": 1, "why": "Correct preposition: \"restrictions on\".", "why_ar": "حرف الجر الصحيح: \"restrictions on\" (قيود على)."}]}, {"src": "مذكرة", "page": 86, "q": "Word-matching (Reflection 3)", "type": "match", "prompt": "ابحث عن الكلمة في الفقرة التي تقابل كل تعريف:\n\"Find the word or phrase in the text that could meaningfully replace the words below.\"", "items": [["nudge", "تحفيز/دفعة بسيطة"], ["abandon", "يتخلى عن"], ["resilience", "مرونة نفسية"], ["disempowering", "مُضعِف/سالب للقوة"], ["accessible", "متاح/يسهل الوصول إليه"], ["agency", "القدرة على الاختيار والفعل"]]}, {"src": "مذكرة", "page": 86, "q": "Reflection 3 — True/False (Justify)", "type": "tf", "items": [{"passage": "Every individual possesses the agency and capacity to choose and act. Taking personal ownership of one's choices builds confidence, while framing health as \"someone else's problem\" is disempowering and leads to passivity.", "statement": "Having \"agency\" means that individuals have the power to make their own independent choices.", "answer": true, "why": "True — the passage directly states every individual possesses agency, the capacity to choose and act independently.", "why_ar": "صح — النص يذكر صراحة أن كل فرد يملك الفاعلية والقدرة على الاختيار والتصرف باستقلالية."}]}, {"src": "مذكرة", "page": 86, "q": "Reading comprehension (Reflection 3)", "type": "open", "items": [{"q": "Identify two ways mentioned in the text that governments can encourage citizens to live healthier lives.", "a": "Introducing policies that nudge people toward healthier behaviors (e.g. restrictions on junk food) and running national campaigns promoting activity."}, {"q": "What is the benefit of a \"nudge\" according to the text? Use evidence to explain your answer.", "a": "A nudge reshapes the environment so the healthy choice becomes the easier choice — encouraging better decisions (like restricting junk food or promoting activity) without removing people's freedom to choose."}]}, {"src": "تقييمات", "page": 7, "q": "Word/phrase replacement", "type": "match", "prompt": "Find the word or phrase from the text that could meaningfully replace the words below.", "items": [["agency", "القدرة على الاختيار والفعل"], ["nudge", "تحفيز بسيط"], ["resilience", "مرونة نفسية"], ["self-efficacy", "كفاءة ذاتية"], ["structural barriers", "عوائق هيكلية"]]}, {"src": "تقييمات", "page": 7, "q": "Class Performance MCQ", "type": "mcq", "items": [{"q": "\"Actions can improve health, even if change takes time.\" This belief best shows ............", "options": ["self-efficacy", "social comparison", "highlight-reel effect", "sedentary behavior"], "answer": 0, "why": "Belief that your actions lead to improvement over time is self-efficacy.", "why_ar": "الاعتقاد بأن الأفعال تؤدي للتحسن بمرور الوقت هو الكفاءة الذاتية."}, {"q": "Which situation is a structural barrier?", "options": ["A student chooses not to bring sneakers.", "A neighborhood has no safe pavement or affordable sports facility.", "A teenager prefers reading to football.", "A family reminds a child to sleep earlier."], "answer": 1, "why": "A structural barrier is an obstacle built into the environment — a missing facility, not a personal choice.", "why_ar": "العائق الهيكلي هو عقبة مبنية في البيئة المحيطة — وليس خيارًا شخصيًا."}, {"q": "Which example is a nudge?", "options": ["Banning every drink except water.", "Placing free water stations beside school entrances.", "Punishing students who buy snacks.", "Removing all choice from the cafeteria."], "answer": 1, "why": "A nudge encourages a choice gently, without forcing or banning.", "why_ar": "الدفعة اللطيفة تشجع الاختيار بلطف، دون إجبار أو منع."}, {"q": "Agency refers to a person's ability to ............", "options": ["make choices and take independent action", "copy the behavior of influencers", "avoid all social expectations", "control other people's decisions"], "answer": 0, "why": "Agency = the power to make choices and act independently.", "why_ar": "الفاعلية = القدرة على الاختيار واتخاذ إجراء مستقل."}]}], "L4": [{"src": "مذكرة", "page": 104, "q": "Key Vocabulary Exercises Q1-3", "type": "mcq", "items": [{"q": "\"In a collectivist culture, family members often share their resources and make major decisions together for the good of the group.\" What does collectivist mean in this context?", "options": ["The process of gathering rare items for a personal hobby.", "Prioritizing the goals and needs of the group over the individual.", "The state of being very wealthy and powerful in a city.", "The ability to survive alone in a difficult environment."], "answer": 1, "why": "Collectivist = prioritizing the goals/needs of the group over the individual.", "why_ar": "الجماعي (collectivist) = تقديم أهداف واحتياجات الجماعة على الفرد."}, {"q": "The doctor warned the patient that a sedentary lifestyle would lead to back pain and weight gain. Which situation is the clearest example of being sedentary?", "options": ["An office worker spends ten hours a day sitting at a desk with very little movement.", "A gardener spends the whole afternoon planting flowers in the backyard.", "A person walks to the grocery store every morning instead of driving.", "A tourist spends the day walking through several large museums, galleries, and historical sites."], "answer": 0, "why": "Sedentary = involving very little physical movement, like sitting at a desk for hours.", "why_ar": "الخمول = حركة قليلة جدًا، مثل الجلوس لساعات طويلة على مكتب."}, {"q": "By allowing the students to choose their own research topics, the teacher encouraged a sense of agency in the classroom. What does agency mean in this context?", "options": ["A company providing a particular service.", "The power to make choices and act independently.", "The ability to follow orders without questioning.", "A place where government officials work."], "answer": 1, "why": "Agency = the power to make choices and act independently.", "why_ar": "الفاعلية = القدرة على الاختيار واتخاذ إجراء مستقل."}]}, {"src": "مذكرة", "page": 105, "q": "Key Vocabulary Q4-10 + Important Vocabulary Q11-12", "type": "mcq", "items": [{"q": "Constant criticism from a manager can be disempowering, making employees feel like they are not capable of completing their work. What does disempowering mean in this context?", "options": ["Making someone feel very wealthy and strong.", "The process of giving someone more responsibility.", "Making someone feel less capable or in control.", "A feeling of being very happy and energetic at work."], "answer": 2, "why": "Disempowering = making someone feel less capable or in control.", "why_ar": "المُضعِف = يجعل الشخص يشعر بقدرة أو تحكم أقل."}, {"q": "High levels of .......... during final examination periods can negatively affect a student's sleep patterns and physical health.", "options": ["quality", "stress", "background", "availability"], "answer": 1, "why": "Pressure felt during exams is stress.", "why_ar": "الضغط أثناء الامتحانات هو التوتر (stress)."}, {"q": "Some Western cultures are described as .......... because they prioritize personal goals over the needs of the community.", "options": ["academic", "sedentary", "collectivist", "individualistic"], "answer": 3, "why": "Prioritizing personal goals over community = individualistic.", "why_ar": "تقديم الأهداف الشخصية على المجتمع = فردي (individualistic)."}, {"q": "The professor was impressed by the student's excellent academic .......... throughout the entire semester.", "options": ["performance", "expectations", "pressure", "habits"], "answer": 0, "why": "How well a student does academically is their performance.", "why_ar": "مدى تميّز الطالب أكاديميًا هو أداؤه (performance)."}, {"q": "In a scientific experiment, researchers must carefully control all .......... to ensure the results are reliable.", "options": ["sources", "variables", "aspects", "strategies"], "answer": 1, "why": "Factors that can change/affect results are variables.", "why_ar": "العوامل التي قد تؤثر على النتائج هي المتغيرات (variables)."}, {"q": "In a .......... society, individuals usually feel a strong sense of duty toward their family and social group.", "options": ["rural", "urban", "digital", "collectivist"], "answer": 3, "why": "A society prioritizing group duty is collectivist.", "why_ar": "مجتمع يقدّم واجب الجماعة هو مجتمع جماعي (collectivist)."}, {"q": "Schools are increasingly providing support for .......... to help students manage anxiety and academic pressure.", "options": ["figure", "counseling", "household", "mental health"], "answer": 1, "why": "Professional emotional support/guidance is counseling.", "why_ar": "الدعم النفسي/الإرشادي المهني هو الإرشاد النفسي (counseling)."}, {"q": "The study revealed a .......... difference in the test scores of students who exercised regularly compared to those who did not.", "options": ["decisive", "moderate", "significant", "complex"], "answer": 2, "why": "A large, noteworthy difference is a significant difference.", "why_ar": "فرق كبير وملحوظ هو فرق ملحوظ (significant)."}, {"q": "Students living in remote areas often have limited .......... to high-speed internet, which hinders their online learning.", "options": ["demands", "gap", "respondent", "access"], "answer": 3, "why": "Being able to reach/use something is having access to it.", "why_ar": "القدرة على الوصول لاستخدام شيء ما هي الوصول (access)."}]}, {"src": "مذكرة", "page": 106, "q": "Important Vocabulary Q13-23", "type": "mcq", "items": [{"q": "The first step in solving any scientific problem is to .......... the specific factors that are causing the issue.", "options": ["identify", "cite", "conclude", "seek"], "answer": 0, "why": "Recognizing/pinpointing a cause is to identify it.", "why_ar": "تحديد/إيجاد السبب هو تحديده (identify)."}, {"q": "Each .......... in the medical study was required to sign a consent form before the testing began.", "options": ["respondent", "participant", "peer", "sibling"], "answer": 1, "why": "A person taking part in a study is a participant.", "why_ar": "الشخص المشارك في دراسة هو المشارك (participant)."}, {"q": "Many modern organizations are starting to .......... new technologies to improve communication between departments.", "options": ["gather", "drop", "separate", "adopt"], "answer": 3, "why": "Starting to use something new is to adopt it.", "why_ar": "البدء باستخدام شيء جديد هو تبنّيه (adopt)."}, {"q": "A .......... lifestyle, characterized by long hours of sitting, is a major contributor to modern health problems.", "options": ["sedentary", "nationwide", "targeted", "increasing"], "answer": 0, "why": "A lifestyle involving long hours of sitting is sedentary.", "why_ar": "نمط حياة بساعات جلوس طويلة هو نمط خامل (sedentary)."}, {"q": "Group projects are highly beneficial because they allow students to .......... with their peers and share ideas.", "options": ["rank", "reduce", "interact", "experience"], "answer": 2, "why": "Working/communicating together is to interact.", "why_ar": "العمل/التواصل معًا هو التفاعل (interact)."}, {"q": "The research project was cancelled because there was .......... evidence to support the original hypothesis.", "options": ["academic", "insufficient", "meaningful", "complex"], "answer": 1, "why": "Not enough evidence is insufficient evidence.", "why_ar": "دليل غير كافٍ هو دليل غير كافٍ (insufficient)."}, {"q": "Harvard University is a world-renowned .......... that has produced many famous scientists and leaders.", "options": ["institution", "figure", "household", "background"], "answer": 0, "why": "A major established organization like a university is an institution.", "why_ar": "مؤسسة عريقة كبرى مثل جامعة هي مؤسسة (institution)."}, {"q": "The volunteer program is designed to help students contribute .......... to the development of their local community.", "options": ["nationwide", "moderately", "significantly", "meaningfully"], "answer": 3, "why": "Contributing in a way that truly matters is contributing meaningfully.", "why_ar": "المساهمة بشكل ذي قيمة حقيقية هي المساهمة الهادفة (meaningfully)."}, {"q": "Most major business headquarters are located in .......... areas where the population density is the highest.", "options": ["rural", "urban", "digital", "targeted"], "answer": 1, "why": "Densely populated city areas are urban areas.", "why_ar": "المناطق المكتظة بالسكان هي مناطق حضرية (urban)."}, {"q": "Students who develop effective study .......... early in their education are more likely to succeed in university.", "options": ["strategies", "habits", "sources", "demands"], "answer": 0, "why": "Planned approaches to studying are study strategies.", "why_ar": "طرق منظمة للمذاكرة هي استراتيجيات الدراسة (strategies)."}, {"q": "The university has decided to take a more modern .......... to teaching by incorporating more interactive digital tools.", "options": ["gap", "availability", "figure", "approach"], "answer": 3, "why": "A way of doing/handling something is an approach.", "why_ar": "طريقة التعامل مع شيء ما هي المنهج/الأسلوب (approach)."}]}, {"src": "مذكرة", "page": 107, "q": "Synonyms/Antonyms Q24-28", "type": "mcq", "items": [{"q": "\"The team's performance improved significantly after the new coach arrived.\" The underlined noun (performance) is closest in meaning to ..........", "options": ["failure", "execution", "delay", "loss"], "answer": 1, "why": "Performance ≈ execution (how something is carried out).", "why_ar": "الأداء ≈ التنفيذ (execution — كيفية إنجاز الشيء)."}, {"q": "\"Chronic stress can lead to various long-term health problems.\" The underlined noun (stress) has an antonym meaning to ..........", "options": ["pressure", "anxiety", "relaxation", "strain"], "answer": 2, "why": "The opposite of stress is relaxation.", "why_ar": "عكس التوتر هو الاسترخاء (relaxation)."}, {"q": "\"Scientists must account for all variables in a laboratory experiment.\" The underlined noun (variables) is closest in meaning to ..........", "options": ["factors", "constants", "facts", "goals"], "answer": 0, "why": "Variables ≈ factors (things that can change/affect a result).", "why_ar": "المتغيرات ≈ العوامل (factors) — أشياء قد تؤثر على النتيجة."}, {"q": "\"He decided to seek legal counsel before signing the complicated contract.\" The underlined noun (counsel) is closest in meaning to ..........", "options": ["money", "advice", "power", "debate"], "answer": 1, "why": "Counsel ≈ advice (especially professional/legal).", "why_ar": "المشورة (counsel) ≈ النصيحة (advice) وخاصة المهنية/القانونية."}, {"q": "\"The manager was very decisive when handling the company emergency.\" The underlined adjective (decisive) has an antonym meaning to ..........", "options": ["firm", "brave", "hesitant", "fast"], "answer": 2, "why": "The opposite of decisive is hesitant.", "why_ar": "عكس الحازم/الحاسم هو المتردد (hesitant)."}]}, {"src": "مذكرة", "page": 108, "q": "Word-matching (Reflection 4)", "type": "match", "prompt": "ابحث عن الكلمة في الفقرة التي تقابل كل تعريف:\n\"Find the word or phrase in the text that could meaningfully replace the words below.\"", "items": [["claims", "ادعاءات"], ["verify", "يتحقق من صحة"], ["consistently", "بثبات/باستمرار"], ["media literacy", "الوعي/الثقافة الإعلامية"], ["significant", "ملحوظ/مهم"], ["go viral", "ينتشر بسرعة كبيرة"]]}, {"src": "مذكرة", "page": 108, "q": "Reflection 4 — True/False (Justify)", "type": "tf", "items": [{"passage": "Cultural background is a significant factor in stress management. Students from collectivist families often seek emotional support, while those from individualistic households rely on individual coping strategies like listening to music.", "statement": "All teenagers, regardless of their cultural values, use the exact same methods to handle difficult situations.", "answer": false, "why": "False — the passage shows different cultural backgrounds lead to different coping methods (seeking support vs. individual strategies), not the same method for everyone.", "why_ar": "خطأ — النص يوضح أن الخلفيات الثقافية المختلفة تؤدي لطرق تأقلم مختلفة (طلب دعم مقابل استراتيجيات فردية)، وليست نفس الطريقة للجميع."}]}, {"src": "مذكرة", "page": 108, "q": "Reading comprehension (Reflection 4)", "type": "open", "items": [{"q": "Identify the group of students that has the least access to counseling services according to the text.", "a": "Students in rural areas/institutions — only 31% of rural schools offer counseling support, compared to 74% of city schools."}, {"q": "What did the researchers conclude about the effectiveness of school support programs? Use evidence.", "a": "They concluded that targeted programs can meaningfully reduce stress, provided that the availability and quality of support networks are treated as decisive variables."}]}, {"src": "تقييمات", "page": 9, "q": "Class Performance MCQ", "type": "mcq", "items": [{"q": "A sedentary lifestyle with little physical movement can harm health. The word \"sedentary\" means \"............\".", "options": ["energetic", "active", "inactive", "mindful"], "answer": 2, "why": "Sedentary = inactive, involving little movement.", "why_ar": "الخمول = عدم النشاط، بحركة قليلة."}, {"q": "A __________ is a health expert who gives advice on diet and nutrition.", "options": ["nutritionist", "curator", "representative", "psychologist"], "answer": 0, "why": "A nutritionist specifically advises on diet and nutrition.", "why_ar": "أخصائي التغذية هو من يقدّم النصح في النظام الغذائي والتغذية تحديدًا."}, {"q": "The workshop aims to __________ students to take control of their financial future.", "options": ["weaken", "empower", "restrain", "deprive"], "answer": 1, "why": "\"Empower\" means to give someone the confidence/power to take control — the opposite of disempowering.", "why_ar": "\"التمكين\" (empower) يعني منح شخص الثقة/القوة للتحكم — عكس الإضعاف (disempowering)."}]}, {"src": "تقييمات", "page": 9, "q": "True/False (Justify)", "type": "tf", "items": [{"passage": "Modern teenagers are experiencing pressure from multiple aspects of daily life. Academic demands, social expectations, and consistent exposure to digital media significantly affect how teenagers think, feel, and behave.", "statement": "Teenagers experience zero stress from academic demands or social expectations.", "answer": false, "why": "False — the passage says academic demands and social expectations significantly affect teenagers, so they clearly do cause stress, not zero.", "why_ar": "خطأ — النص يقول إن المطالب الأكاديمية والتوقعات الاجتماعية تؤثر بشكل ملحوظ على المراهقين، فهي بالتأكيد تسبب توترًا وليس صفرًا."}, {"passage": "The school health survey data reveals critical insights into adolescent well-being. The findings indicate that academic exam periods are primary triggers for high stress levels reported among teenagers.", "statement": "Exam periods have no impact on the stress levels reported by students in the survey.", "answer": false, "why": "False — the survey found exam periods are a primary trigger for high stress, so they clearly do have an impact.", "why_ar": "خطأ — الاستطلاع وجد أن فترات الامتحانات هي المحفز الرئيسي للتوتر المرتفع، فلها تأثير واضح بالتأكيد."}]}, {"src": "تقييمات", "page": 10, "q": "Weekly Assessment — Group A vocabulary", "type": "mcq", "items": [{"q": "The power to make choices and act independently is ______.", "options": ["agency", "bias", "nutrition", "isolation"], "answer": 0, "why": "Definition of agency.", "why_ar": "تعريف الفاعلية (agency)."}, {"q": "A barrier in the environment that limits genuine choice is a ______.", "options": ["structural barrier", "highlight reel", "rhetorical question", "intensifier"], "answer": 0, "why": "Definition of structural barrier.", "why_ar": "تعريف العائق الهيكلي (structural barrier)."}]}, {"src": "تقييمات", "page": 11, "q": "Weekly Assessment — Group B vocabulary", "type": "mcq", "items": [{"q": "Belief in one's ability to succeed is ______.", "options": ["self-efficacy", "social comparison", "sedentary behavior", "bias"], "answer": 0, "why": "Definition of self-efficacy.", "why_ar": "تعريف الكفاءة الذاتية (self-efficacy)."}, {"q": "The ability to recover after difficulty is ______.", "options": ["resilience", "curation", "nutrition", "pressure"], "answer": 0, "why": "Definition of resilience.", "why_ar": "تعريف المرونة النفسية (resilience)."}]}, {"src": "تقييمات", "page": 11, "q": "Weekly Assessment — Group C vocabulary", "type": "mcq", "items": [{"q": "A gentle policy that encourages a choice without forcing it is a ______.", "options": ["nudge", "bias", "comparison", "claim"], "answer": 0, "why": "Definition of nudge.", "why_ar": "تعريف الدفعة اللطيفة (nudge)."}, {"q": "A health expert who advises about diet is a ______.", "options": ["nutritionist", "curator", "representative", "journalist"], "answer": 0, "why": "Definition of nutritionist.", "why_ar": "تعريف أخصائي التغذية (nutritionist)."}]}]}, "selftest": {"fill": [{"answer": "resilience", "root": "resilient", "sentence": "Supportive relationships can strengthen a young person's ................ (resilient).", "why": "The noun form of the adjective 'resilient' is 'resilience'.", "why_ar": "الاسم المشتق من الصفة resilient هو resilience."}, {"answer": "accessibility", "root": "accessible", "sentence": "The new ramp improved the ................ (accessible) of the community sports center.", "why": "The noun form of the adjective 'accessible' is 'accessibility'.", "why_ar": "الاسم المشتق من الصفة accessible هو accessibility."}, {"answer": "significant", "root": "significance", "sentence": "Regular exercise has a ................ (significance) effect on teenagers' mental health.", "why": "After 'a ... effect', we need the adjective form: significant.", "why_ar": "بعد 'a ... effect' نحتاج صفة، وهي significant."}, {"answer": "participate", "root": "participation", "sentence": "Schools should encourage every student to ........ (participation) in physical activity.", "why": "After 'to', we need the base verb form: participate.", "why_ar": "بعد to نحتاج الفعل في صورته الأساسية: participate."}, {"answer": "competitive", "root": "compete", "sentence": "The final match was highly ................ (compete) until the final whistle.", "why": "After 'highly', we need the adjective form: competitive.", "why_ar": "بعد highly نحتاج صفة، وهي competitive."}, {"answer": "competitively", "root": "competitive", "sentence": "The teams played ................ (competitive) until the final whistle.", "why": "To describe how the teams played (a verb), we need the adverb form: competitively.", "why_ar": "لوصف طريقة لعب الفريقين (فعل) نحتاج ظرفًا، وهو competitively."}, {"answer": "resilience", "root": "resilient", "sentence": "Support from family can strengthen a teenager's ................ (resilient) after setbacks.", "why": "The noun form of the adjective 'resilient' is 'resilience'.", "why_ar": "الاسم المشتق من الصفة resilient هو resilience."}, {"answer": "accessibility", "root": "accessible", "sentence": "Affordable facilities improve the ................ (accessible) of physical activity for young people.", "why": "The noun form of the adjective 'accessible' is 'accessibility'.", "why_ar": "الاسم المشتق من الصفة accessible هو accessibility."}, {"answer": "empower", "root": "power", "sentence": "Clear information can .......... (power) students to make more independent health choices.", "why": "After 'can', we need the base verb form: empower.", "why_ar": "بعد can نحتاج الفعل في صورته الأساسية: empower."}, {"answer": "flexibility", "root": "flexible", "sentence": "Creative activities improve cognitive ................ (flexible) and help people adapt to new situations.", "why": "The noun form of the adjective 'flexible' is 'flexibility'.", "why_ar": "الاسم المشتق من الصفة flexible هو flexibility."}, {"answer": "competitively", "root": "competitive", "sentence": "The two teams played ................ (competitive) until the final whistle.", "why": "To describe how the teams played (a verb), we need the adverb form: competitively.", "why_ar": "لوصف طريقة لعب الفريقين (فعل) نحتاج ظرفًا، وهو competitively."}, {"answer": "actively", "root": "active", "sentence": "The students participated ................ (active) in the school sports competition.", "why": "To describe how students participated (a verb), we need the adverb form: actively.", "why_ar": "لوصف طريقة مشاركة الطلاب (فعل) نحتاج ظرفًا، وهو actively."}], "match": [{"items": [["rhetorical question", "ask a question for effect rather than an answer"], ["bias", "one-sidedness, using language that strongly supports one point of view"], ["curated", "carefully selected (photographs)"], ["the highlight-reel effect", "a tendency to show only the best moments"], ["intensifier", "an emphasis word, such as 'extremely'"]], "page": "12/9", "prompt": "Find the word or phrase that could meaningfully replace the words below, based on this passage:\n\"Many users share carefully selected photographs that present only their happiest moments. This may create a tendency to show only the best moments, causing viewers to compare their ordinary lives with selected online experiences. Some posts also contain one-sidedness, using language that strongly supports one point of view. Writers may use an emphasis word, such as 'extremely,' to make an opinion sound stronger. They may also ask a question for effect rather than an answer to influence readers without expecting a direct answer.\""}, {"items": [["agency", "the ability to make one's own decisions and take action"], ["nudge", "a gentle push"], ["resilience", "the ability to recover and adapt"], ["self-efficacy", "confidence in their ability to succeed"], ["structural barriers", "obstacles in their environment"]], "page": "12/9", "prompt": "Find the word or phrase that could meaningfully replace the words below, based on this passage:\n\"People's health is influenced by both personal choices and their surroundings. The ability to make one's own decisions and take action helps individuals improve their lives. People with confidence in their ability to succeed believe that they can achieve their goals and make positive changes. However, obstacles in their environment, such as expensive sports facilities or unsafe neighborhoods, may limit their choices. Facing such difficulties can help people develop the ability to recover and adapt. Governments and schools may also introduce a gentle push, such as placing healthy food in easy-to-see places, to encourage better choices without removing freedom.\""}], "mcq": [{"answer": 1, "options": ["balanced", "curated", "private", "unrelated"], "q": "A lifestyle account shows only carefully selected achievements and removes ordinary moments. The account is best described as ..........", "why": "An account showing only carefully selected achievements is described as curated — content chosen and presented to look ideal.", "why_ar": "الحساب الذي يعرض إنجازات منتقاة بعناية فقط يوصف بأنه curated، أي محتوى تم اختياره وعرضه ليبدو مثاليًا."}, {"answer": 3, "options": ["biased", "underestimated", "mindless", "balanced"], "q": "Health experts recommend combining a/an .......... lifestyle with physical activity to combat the risks of a sedentary routine.", "why": "A balanced lifestyle combines rest and activity together, which helps reduce the health risks of a sedentary routine.", "why_ar": "أسلوب الحياة المتوازن (balanced) يجمع بين الراحة والنشاط معًا، مما يقلل من مخاطر الروتين الخامل."}, {"answer": 0, "options": ["social comparison", "mindful consumption", "structural support", "personal agency"], "q": "Hind begins to judge her ordinary school day against influencers' holiday photographs. This is an example of ..........", "why": "Judging your ordinary life against others' curated best moments is social comparison.", "why_ar": "الحكم على حياتك العادية بمقارنتها بأفضل لحظات الآخرين المنتقاة يسمى المقارنة الاجتماعية (social comparison)."}, {"answer": 3, "options": ["measurable", "sedentary", "structural", "curated"], "q": "A post showing only perfect moments is ..........", "why": "A post showing only perfect moments is curated — carefully selected to hide imperfections.", "why_ar": "المنشور الذي يظهر اللحظات المثالية فقط يكون curated، أي منتقى بعناية لإخفاء العيوب."}, {"answer": 2, "options": ["active", "energetic", "sedentary", "mindful"], "q": "Doctors recommend regular exercise to counter the effects of a/an .......... routine.", "why": "A sedentary routine involves very little physical movement, so exercise helps counter its negative effects.", "why_ar": "الروتين الخامل (sedentary) يتضمن حركة قليلة جدًا، لذا تساعد الرياضة في مواجهة آثاره السلبية."}, {"answer": 3, "options": ["balanced", "curated", "mindful", "sedentary"], "q": "A lifestyle with very little movement is ..........", "why": "A lifestyle with very little movement is called sedentary.", "why_ar": "أسلوب الحياة الذي يتضمن حركة قليلة جدًا يسمى sedentary (خامل)."}, {"answer": 2, "options": ["agency", "bias", "mindfulness", "pressure"], "q": "Paying careful attention to the present moment is ..........", "why": "Mindfulness means paying careful, focused attention to the present moment.", "why_ar": "اليقظة الذهنية (mindfulness) تعني الانتباه الكامل والمركّز للحظة الحالية."}, {"answer": 0, "options": ["social comparison", "mindfulness", "agency", "nutrition"], "q": "Comparing ordinary life with influencers' best moments is ..........", "why": "Comparing your ordinary life with influencers' best moments is social comparison.", "why_ar": "مقارنة حياتك العادية بأفضل لحظات المؤثرين تسمى المقارنة الاجتماعية (social comparison)."}, {"answer": 3, "options": ["encouraged", "encouraging", "encourage", "encourages"], "q": "Teenagers ................ by supportive families may maintain healthier habits.", "why": "The model answer key marks 'encourages' as the correct verb form in this sentence.", "why_ar": "نموذج الإجابة الرسمي يحدد encourages كصيغة الفعل الصحيحة في هذه الجملة."}, {"answer": 0, "options": ["bias", "resilience", "mindfulness", "nutrition"], "q": "Language that strongly favors one side shows ..........", "why": "Language that strongly favors one side shows bias — a one-sided way of presenting something.", "why_ar": "اللغة التي تنحاز بشدة لجانب واحد تسمى bias (تحيز)، أي طريقة عرض منحازة."}, {"answer": 1, "options": ["comparison", "nutrition", "advertising", "isolation"], "q": "Food that provides the body with what it needs supports good ..........", "why": "Food that provides what the body needs supports good nutrition.", "why_ar": "الطعام الذي يوفر للجسم ما يحتاجه يدعم nutrition (التغذية) الجيدة."}, {"answer": 2, "options": ["representative", "curator", "nutritionist", "psychologist"], "q": "A .......... is a health expert who gives advice on diet and nutrition.", "why": "A nutritionist is a health expert who gives advice on diet and nutrition.", "why_ar": "أخصائي التغذية (nutritionist) هو خبير صحي يقدم نصائح عن النظام الغذائي والتغذية."}, {"answer": 3, "options": ["weaken", "deprive", "restrain", "empower"], "q": "The workshop aims to .......... students to take control of their financial future.", "why": "To empower students means to give them the power and confidence to take control of their choices.", "why_ar": "تمكين (empower) الطلاب يعني منحهم القوة والثقة للتحكم في خياراتهم."}, {"answer": 1, "options": ["bias", "agency", "nutrition", "isolation"], "q": "The power to make choices and act independently is ..........", "why": "Agency is the power to make choices and act independently.", "why_ar": "الفاعلية (agency) هي القدرة على اتخاذ القرارات والتصرف باستقلالية."}, {"answer": 0, "options": ["structural barrier", "highlight reel", "rhetorical question", "intensifier"], "q": "A barrier in the environment that limits genuine choice is a..........", "why": "A structural barrier is an obstacle in the environment that limits genuine choice.", "why_ar": "العائق الهيكلي (structural barrier) هو عقبة في البيئة المحيطة تحد من الاختيار الحقيقي."}, {"answer": 3, "options": ["bias", "social comparison", "sedentary behavior", "self-efficacy"], "q": "Belief in one's ability to succeed is ..........", "why": "Self-efficacy is the belief in one's own ability to succeed.", "why_ar": "الكفاءة الذاتية (self-efficacy) هي الإيمان بقدرة الشخص على النجاح."}, {"answer": 3, "options": ["energetic", "active", "mindful", "inactive"], "q": "The word \"sedentary\" means \" .......... \".", "why": "Sedentary means inactive — involving little or no physical movement.", "why_ar": "sedentary تعني خامل (inactive)، أي قليل الحركة أو عديمها."}, {"answer": 0, "options": ["resilience", "curation", "nutrition", "pressure"], "q": "The ability to recover after difficulty is ..........", "why": "Resilience is the ability to recover after difficulty.", "why_ar": "المرونة النفسية (resilience) هي القدرة على التعافي بعد الصعوبات."}, {"answer": 2, "options": ["comparison", "bias", "nudge", "claim"], "q": "A gentle policy that encourages a choice without forcing it is a ..........", "why": "A nudge is a gentle policy that encourages a choice without forcing it.", "why_ar": "الدفعة اللطيفة (nudge) هي سياسة لطيفة تشجع اختيارًا معينًا دون إجباره."}, {"answer": 1, "options": ["curator", "nutritionist", "representative", "journalist"], "q": "A health expert who advises about diet is a ..........", "why": "A nutritionist is a health expert who advises about diet.", "why_ar": "أخصائي التغذية (nutritionist) هو خبير يقدم النصح حول النظام الغذائي."}, {"answer": 3, "options": ["real image", "complete picture", "honest", "curated reality"], "q": "The phrase \"highlight-reel effect\" is closest in meaning to ..........", "why": "The highlight-reel effect means showing only the best moments, creating a curated (not complete) reality.", "why_ar": "تأثير 'أبرز اللحظات' (highlight-reel effect) يعني عرض أفضل اللحظات فقط، مما يخلق واقعًا منتقى وليس حقيقيًا بالكامل."}, {"answer": 0, "options": ["resilience", "bias", "nutrition", "agency"], "q": "The ability to recover after difficulty is ..........", "why": "The ability to recover after difficulty is resilience.", "why_ar": "القدرة على التعافي بعد الصعوبات هي resilience."}, {"answer": 3, "options": ["curation", "bias", "social comparison", "self-efficacy"], "q": "A person confident in the ability to succeed has high ..........", "why": "A person confident in their ability to succeed has high self-efficacy.", "why_ar": "الشخص الواثق من قدرته على النجاح يتمتع بكفاءة ذاتية عالية (self-efficacy)."}, {"answer": 2, "o function logEvent(eventType, extra){
  if(!RESULTS_WEBHOOK_URL) return;
  try{
    const payload = Object.assign({
      studentName: studentName || '',
      eventType: eventType,
      timestamp: new Date().toISOString()
    }, extra || {});
    fetch(RESULTS_WEBHOOK_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) }).catch(function(){});
  }catch(e){}
}

function logAnswer(c, tabLabel){
  let chosen = '', correctAnswer = '';
  if(c.type === 'fill'){
    chosen = c.userAnswer || '(بدون إجابة)';
    correctAnswer = c.data.answer || '';
  } else if(c.type === 'mcq'){
    chosen = (c.chosenIdx>=0 && c.data.options[c.chosenIdx]) ? c.data.options[c.chosenIdx] : '(بدون إجابة)';
    correctAnswer = c.data.options[c.correctIdx];
  } else if(c.type === 'tf'){
    chosen = c.chosenIdx===0 ? 'True' : (c.chosenIdx===1 ? 'False' : '(بدون إجابة)');
    correctAnswer = c.correctIdx===0 ? 'True' : 'False';
  }
  logEvent('answer', {
    tab: tabLabel,
    lesson: c.lesson || (tabLabel==='selftest' ? 'UNIT-TEST' : ''),
    category: c.cat || '',
    questionType: c.type,
    question: (c.data.q || c.data.statement || c.data.sentence || '').slice(0,300),
    chosen: chosen,
    correctAnswer: correctAnswer,
    isCorrect: !!c.correct,
    timedOut: !!c.timedOut
  });
}

function initNameGate(){
  const overlay = document.getElementById('nameGate');
  if(!overlay) return;
  if(studentName){
    overlay.style.display = 'none';
    logEvent('entry', {});
    return;
  }
  overlay.style.display = 'flex';
  const input = document.getElementById('nameGateInput');
  const btn = document.getElementById('nameGateBtn');
  function submit(){
    const val = (input.value || '').trim();
    if(!val){ input.style.borderColor = 'var(--e)'; input.focus(); return; }
    studentName = val;
    try{ localStorage.setItem('svb_studentName', val); }catch(e){}
    overlay.style.display = 'none';
    logEvent('entry', {});
  }
  btn.onclick = submit;
  input.onkeydown = function(e){ if(e.key==='Enter') submit(); };
  input.focus();
}

function speak(text, times){
  times = times || 1;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let n = 0;
  function one(){
    if(n>=times) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.95;
    u.onend = function(){ n++; if(n<times) setTimeout(one, 250); };
    window.speechSynthesis.speak(u);
  }
  one();
}

document.addEventListener('click', function(e){
  const btn = e.target.closest('.spk');
  if(!btn) return;
  const text = btn.dataset.speakText || '';
  const times = parseInt(btn.dataset.speakTimes || '1', 10);
  speak(text, times);
});

    currentTab=b.dataset.tab;
    if(currentTab === 'exercises') exFilterCat = null;
    render();
  });
}

function classifyCard(block, item){
  const why = ((item && item.why) || '').toLowerCase();
  const q = ((item && item.q) || block.q || '').toLowerCase();
  const blockQ = (block.q || '').toLowerCase();
  if(why.indexOf('preposition') !== -1) return 'prep';
  if(q.indexOf('synonym of') !== -1 || q.indexOf('antonym of') !== -1 || why.indexOf('synonym') !== -1 || why.indexOf('antonym') !== -1) return 'synant';
  if(why.indexOf('collocation') !== -1 || blockQ.indexOf('collocation') !== -1) return 'colloc';
  if(blockQ.indexOf('idiom') !== -1 || blockQ.indexOf('expression') !== -1) return 'idioms';
  if(blockQ.indexOf('reading comprehension') !== -1 || blockQ.indexOf('reading') !== -1) return 'reading';
  return 'vocab';
}

function buildExCards(lesson){
  const list = DATA.exercises[lesson] || [];

    const header = `<span class="tag ${tagClass}">${esc(block.src)} — صفحة ${block.page} — ${esc(block.q)}</span>`;
    if(block.type === 'mcq'){
      block.items.forEach(it=>cards.push({header, type:'mcq', data:it, lesson, page:block.page, cat:classifyCard(block,it), answered:false}));
    } else if(block.type === 'tf'){
      block.items.forEach(it=>cards.push({header, type:'tf', data:it, lesson, page:block.page, cat:classifyCard(block,it), answered:false}));
    } else if(block.type === 'open'){
      block.items.forEach(it=>cards.push({header, type:'open', data:it, lesson, page:block.page, cat:classifyCard(block,it), answered:false}));
    } else if(block.type === 'match'){
      cards.push({header, type:'match', data:block, lesson, page:block.page, cat:classifyCard(block,{}), answered:false});
    }
  });
  return cards;
}

  if(c.justAnswered){
    h += `<div class="resultPop">${c.timedOut ? '⏰' : (c.correct ? '✅' : '❌')}</div>`;
  }
  if(c.type === 'mcq'){
    const correctIdx = c.data.answer;
    if(c.timedOut) h += `<div class="opt wrong" style="pointer-events:none;font-weight:800">⏰ انتهى الوقت المحدد (45 ث) لهذا السؤال</div>`;
    h += `<div class="qh">${esc(c.data.q)}</div><div class="opts">`;
    c.data.options.forEach((opt,oi)=>{
      let cls = 'opt';
      let attr = ` onclick="answerCurrent(${oi})"`;
      if(c.answered){
        attr = '';

        else if(oi===c.chosenIdx) cls += ' wrong';
      }

    });

  } else if(c.type === 'tf'){
    const correctIdx = c.data.answer ? 0 : 1;
    if(c.timedOut) h += `<div class="opt wrong" style="pointer-events:none;font-weight:800">⏰ انتهى الوقت المحدد (45 ث) لهذا السؤال</div>`;
    h += `<div class="qh">${esc(c.data.passage)}</div>
      <div class="qh" style="color:var(--mr)">${esc(c.data.statement)}</div>

    [['True',0],['False',1]].forEach(([label,oi])=>{
      let cls = 'opt';
      let attr = ` onclick="answerCurrent(${oi})"`;
      if(c.answered){
        attr = '';
        if(oi===correctIdx) cls += ' correct';
        else if(oi===c.chosenIdx) cls += ' wrong';
      }
      h += `<div class="${cls}"${attr}>${label}</div>`;
    });
    h += `</div>`;
    if(c.answered) h += whyBlock(c.data);
  } else if(c.type === 'open'){
    h += `<div class="qh">${esc(c.data.q)}</div>
      <button class="revealBtn" onclick="document.getElementById('exq-a').style.display='block'">إظهار الإجابة النموذجية</button>
      <div class="a" id="exq-a">${esc(c.data.a)}</div>`;
  } else if(c.type === 'fill'){
    h += `<div class="qh">${esc(c.data.sentence)}</div>`;
    if(!c.answered){
      h += `<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <input type="text" id="fillInput" placeholder="اكتب الإجابة هنا" autocomplete="off"
          onkeydown="if(event.key==='Enter') submitFill()"
          style="flex:1 1 220px;padding:10px 14px;border:2px solid var(--bd);border-radius:10px;font-size:1rem;font-family:inherit">
        <button class="revealBtn" onclick="submitFill()">تحقق ✔</button>
      </div>`;
    } else {
      h += `<div class="opts">
        ${c.timedOut ? `<div class="opt wrong" style="pointer-events:none;font-weight:800">⏰ انتهى الوقت المحدد (45 ث) لهذا السؤال</div>` : ''}
        <div class="opt ${c.correct?'correct':'wrong'}">إجابتك: ${esc(c.userAnswer||'(بدون إجابة)')}</div>
        ${!c.correct ? `<div class="opt correct">الإجابة الصحيحة: ${esc(c.data.answer)}</div>` : ''}
      </div>`;

    if(c.data.prompt) h += `<p style="font-size:.9rem;color:var(--ts);white-space:pre-line">${esc(c.data.prompt)}</p>`;

    else if(c.correct){ playCorrectSound(); confettiBurst(box); }
    else { playWrongSound(); }
    c.justAnswered = false;
  }
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, duration, type, startOffset, gainVal){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + (startOffset||0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(gainVal||0.16, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+duration+0.02);
}

function playCorrectSound(){
  beep(660,0.14,'sine',0,0.18);
  beep(880,0.18,'sine',0.12,0.18);
  beep(1175,0.2,'sine',0.24,0.16);
}
function playWrongSound(){
  beep(220,0.22,'sawtooth',0,0.14);
  beep(150,0.28,'sawtooth',0.14,0.14);
}
function playTimeoutSound(){
  beep(520,0.14,'square',0,0.12);
  beep(520,0.14,'square',0.22,0.12);
  beep(520,0.18,'square',0.44,0.12);
}

function confettiBurst(container){
  if(!container) return;
  const colors = ['#C9A227','#7A1F3D','#14213D','#2E7D32','#E0C05C','#A63A5C'];
  for(let i=0;i<20;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (42 + Math.random()*16) + '%';
    el.style.top = '38%';
    el.style.background = colors[i % colors.length];
    const angle = Math.random()*2*Math.PI;
    const dist = 55 + Math.random()*90;
    el.style.setProperty('--dx', (Math.cos(angle)*dist) + 'px');
    el.style.setProperty('--dy', (Math.sin(angle)*dist - 30) + 'px');
    el.style.animationDelay = (Math.random()*0.08)+'s';
    container.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 1000);
  }
}

let examTimerId = null;
let examTimeLeft = 0;
const EXAM_TIME_LIMIT = 45;

function clearExamTimer(){
  if(examTimerId){ clearInterval(examTimerId); examTimerId = null; }
}

function updateTimerDisplay(){
  const el = document.getElementById('examTimer');
  if(!el) return;
  el.textContent = '⏱ ' + examTimeLeft + ' ث';
  el.classList.toggle('low', examTimeLeft <= 10);
}

function startExamTimer(){
  clearExamTimer();
  examTimeLeft = EXAM_TIME_LIMIT;
  updateTimerDisplay();
  examTimerId = setInterval(function(){
    examTimeLeft--;
    updateTimerDisplay();
    if(examTimeLeft <= 0){
      clearExamTimer();
      handleTimeUp();
    }
  }, 1000);
}

function handleTimeUp(){
  const c = exCards[exIndex];
  if(!c || c.answered) return;
  if(c.type === 'mcq'){
    c.correctIdx = c.data.answer;
    c.chosenIdx = -1;
  } else if(c.type === 'tf'){
    c.correctIdx = c.data.answer ? 0 : 1;
    c.chosenIdx = -1;
  } else if(c.type === 'fill'){
    c.userAnswer = '';
  } else {
    return;
  }
  c.answered = true;
  c.correct = false;
  c.timedOut = true;
  c.justAnswered = true;
  renderExCard();
  updateSelftestScore();
  logAnswer(c, currentTab);
}

function answerCurrent(chosenIdx){
  const c = exCards[exIndex];
  if(!c || c.answered) return;
  if(c.type === 'mcq'){
    c.correctIdx = c.data.answer;
  } else if(c.type === 'tf'){
    c.correctIdx = c.data.answer ? 0 : 1;
  } else {
    return;
  }
  c.chosenIdx = chosenIdx;
  c.answered = true;
  c.correct = (chosenIdx === c.correctIdx);
  c.justAnswered = true;
  renderExCard();
  updateSelftestScore();
  logAnswer(c, currentTab);
}

function submitFill(){
  const c = exCards[exIndex];
  if(!c || c.type !== 'fill' || c.answered) return;
  const input = document.getElementById('fillInput');
  const val = input ? input.value.trim() : '';
  c.userAnswer = val;
  c.answered = true;
  c.correct = val.toLowerCase() === (c.data.answer||'').trim().toLowerCase();
  c.justAnswered = true;
  renderExCard();
  updateSelftestScore();
  logAnswer(c, currentTab);
}

function computeStats(){
  const perLesson = {};
  let totalQ = 0, totalAttempted = 0, totalCorrect = 0;
  const mistakes = [];
  DATA.lessons.forEach(l=>{
    const cards = (exCardsByLesson[l]||[]).filter(c=>c.type==='mcq'||c.type==='tf');
    let attempted = 0, correct = 0;
    cards.forEach(c=>{
      if(c.answered){
        attempted++;
        if(c.correct) correct++;
        else{
          let chosenText, correctText;
          if(c.type==='mcq'){
            chosenText = c.data.options[c.chosenIdx];
            correctText = c.data.options[c.correctIdx];
          } else {
            chosenText = c.chosenIdx===0 ? 'True' : 'False';
            correctText = c.correctIdx===0 ? 'True' : 'False';
          }
          mistakes.push({
            lesson:l, page:c.page, cat:c.cat,
            q: c.type==='mcq' ? c.data.q : (c.data.statement || c.data.passage),
            chosen: chosenText, correctAns: correctText,
            why: c.data.why, why_ar: c.data.why_ar
          });
        }
      }
    });
    perLesson[l] = {total:cards.length, attempted, correct, wrong:attempted-correct};
    totalQ += cards.length; totalAttempted += attempted; totalCorrect += correct;
  });
  return {perLesson, totalQ, totalAttempted, totalCorrect, totalWrong: totalAttempted-totalCorrect, mistakes};
}

function renderResults(){
  const s = computeStats();
  const pct = s.totalAttempted ? Math.round((s.totalCorrect/s.totalAttempted)*100) : 0;
  let h = `<h2 class="sec">📊 بنك الأخطاء الشامل — الوحدة الأولى</h2>`;
  h += `<div class="nameBox">
    <input type="text" id="studentNameInput" placeholder="اكتب اسمك هنا" value="${esc(studentName)}"
      oninput="studentName=this.value; try{localStorage.setItem('svb_studentName', studentName);}catch(e){}">
  </div>`;
  h += `<div class="statRow">
    <div class="statCard"><div class="n">${s.totalAttempted} / ${s.totalQ}</div><div class="l">عدد الأسئلة المُجابة</div></div>
    <div class="statCard"><div class="n">${pct}%</div><div class="l">نسبة الإجابات الصحيحة</div></div>
    <div class="statCard"><div class="n">${s.totalWrong}</div><div class="l">عدد الأخطاء</div></div>
  </div>`;

  h += `<table class="miniTable"><tr><th>الدرس</th><th>محاولة</th><th>صحيح</th><th>خطأ</th><th>النسبة</th></tr>`;
  DATA.lessons.forEach(l=>{
    const st = s.perLesson[l];
    const lp = st.attempted ? Math.round((st.correct/st.attempted)*100) : 0;
    h += `<tr><td>${esc(DATA.lessonTitles[l])}</td><td>${st.attempted}/${st.total}</td><td>${st.correct}</td><td>${st.wrong}</td><td>${st.attempted?lp+'%':'—'}</td></tr>`;
  });
  h += `</table>`;

  if(!s.totalAttempted){
    h += `<p style="margin-top:20px;color:var(--ts)">لسه ما حلتش أي تمرين. اذهب لتبويب "تمارين" وابدأ الحل، وهيتسجل هنا تلقائيًا كل خطأ عشان تراجعه.</p>`;
  } else if(!s.totalWrong){
    h += `<p style="margin-top:20px;color:var(--s);font-weight:700">🎉 ممتاز! لا يوجد أي أخطاء مسجلة حتى الآن.</p>`;
  } else {
    h += `<h2 class="sec">❌ تفاصيل الأخطاء</h2>`;
    s.mistakes.forEach(m=>{
      h += `<div class="mistakeCard">
        <span class="tag madh">${esc(DATA.lessonTitles[m.lesson])} — صفحة ${m.page} — ${esc(CAT_LABELS[m.cat]||m.cat)}</span>
        <div class="qh">${esc(m.q||'')}</div>
        <div class="ans bad">إجابتك: ${esc(m.chosen)}</div>
        <div class="ans good">الإجابة الصحيحة: ${esc(m.correctAns)}</div>
        ${whyBlock(m)}
      </div>`;
    });
  }

  h += `<div style="text-align:center;margin-top:26px">
    <button class="waBtn" onclick="sendResultsToTeacher()">🟢 إرسال النتيجة للمستر عبر واتساب</button>
  </div>`;

  document.getElementById('content').innerHTML = h;
}

function sendResultsToTeacher(){
  const s = computeStats();
  const pct = s.totalAttempted ? Math.round((s.totalCorrect/s.totalAttempted)*100) : 0;
  const name = studentName && studentName.trim() ? studentName.trim() : 'طالب غير معروف الاسم';
  let msg = `*بنك أخطاء - بنك كلمات الوحدة الأولى*
`;
  msg += `الاسم: ${name}
`;
  msg += `النتيجة الإجمالية: ${s.totalCorrect}/${s.totalAttempted} (${pct}%)

`;
  msg += `تفصيل حسب الدرس:
`;
  DATA.lessons.forEach(l=>{
    const st = s.perLesson[l];
    msg += `- ${DATA.lessonTitles[l]}: ${st.correct}/${st.attempted} صحيح
`;
  });
  if(s.mistakes.length){
    msg += `
الأخطاء (${s.mistakes.length}):
`;
    s.mistakes.slice(0,15).forEach((m,i)=>{
      msg += `${i+1}. [${m.lesson} ص${m.page}] ${(m.q||'').slice(0,80)}
   إجابته: ${m.chosen} | الصحيح: ${m.correctAns}
`;
    });
    if(s.mistakes.length > 15) msg += `... و${s.mistakes.length-15} خطأ إضافي (راجع الشاشة للتفاصيل الكاملة)
`;
  }
  logEvent('final_summary', {
    scoreSummary: `${s.totalCorrect}/${s.totalAttempted} (${pct}%)`,
    mistakeCount: s.totalWrong
  });
  const url = 'https://wa.me/201067734255?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

function render(){
  if(currentTab !== 'exercises' && currentTab !== 'selftest') clearExamTimer();
  renderTabs();
  renderLessonBar();
  if(currentTab === 'vocab') renderVocab();
  else if(currentTab === 'reading') renderReading();
  else if(currentTab === 'prep') renderPairList(DATA.prepositions, 2);
  else if(currentTab === 'idioms') renderIdioms();
  else if(currentTab === 'colloc') renderPairList(DATA.collocations, 2);
  else if(currentTab === 'synant') renderSynAnt();
  else if(currentTab === 'exercises') renderExercises();
  else if(currentTab === 'selftest') renderSelftest();
  else if(currentTab === 'results') renderResults();

  if(currentTab !== 'exercises' && currentTab !== 'selftest' && currentTab !== 'results'){
    const contentEl = document.getElementById('content');
    const bar = jumpBarHTML();
    contentEl.innerHTML = bar + contentEl.innerHTML + bar;
  }
}

render();
initNameGate();
</script>
