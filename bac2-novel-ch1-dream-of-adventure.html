<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Lost World | Chapter 1: A Dream of Adventure | SamySchool</title>
<style>
:root{
  --p:#14213D; --pd:#0A1226; --pdd:#050912; --pl:#2B3F66; --pb:#E8EAF0; --pbl:#F3F5F9;
  --s:#2E7D32; --sl:#66BB6A; --sb:#E8F5E9;
  --e:#C62828; --el:#EF5350; --eb:#FFEBEE;
  --m:#4A2C17; --ml:#7A5033; --mb:#F1E6D8;
  --t:#241A0F; --ts:#5B4636; --tl:#8C7A66;
  --c:#FFFDF8; --bd:#D9C9A8; --bl:#F1E6D0; --bg:#F5EEDD;
  --mr:#7A1F3D; --mrl:#A63A5C; --mrb:#F7E8ED;
  --g:#C9A227; --gl:#E0C05C; --gb:#FBF3DC;
  --r:14px; --rs:10px; --rl:20px;
}
/* PROJECTOR MODE: read on a classroom projector from a long room, so the base font size is
   raised above normal web-reading size for legibility from the back row. */
html{font-size:24px}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
.tb{position:sticky;top:0;z-index:50;padding:10px 24px;background:linear-gradient(120deg,var(--pdd),var(--pd) 55%,var(--p));
    display:flex;align-items:center;gap:14px;color:#fff;flex-wrap:wrap}
.tb .logo{width:46px;height:46px;border-radius:50%;object-fit:contain;background:#fff;
    border:2.5px solid #ffffff66;box-shadow:0 1px 6px #0004;flex:0 0 46px}
.wm-fixed{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
.wm-fixed .ring{position:absolute;border-radius:50%;border:2.5px solid var(--g);opacity:.22}
.wm-fixed .ring.r1{width:30vw;height:30vw;max-width:420px;max-height:420px;min-width:220px;min-height:220px}
.wm-fixed .ring.r2{width:36vw;height:36vw;max-width:500px;max-height:500px;min-width:260px;min-height:260px;
    border-color:var(--mr);opacity:.15}
.wm-fixed .ring.r3{width:24vw;height:24vw;max-width:340px;max-height:340px;min-width:180px;min-height:180px;
    border:1.5px dashed var(--g);opacity:.28}
.wm-fixed img{width:20vw;max-width:280px;min-width:150px;opacity:.14;filter:grayscale(.12)}
.tb,.tabs,.mc,footer{position:relative;z-index:1}
.tb h1{font-size:1.25rem;margin:0}
.tb .sub{font-size:.88rem;opacity:.8;margin:0}
.tb .phone{margin-inline-start:auto;font-size:1rem;background:#25D36633;border:1px solid #25D36688;
    color:#fff;padding:7px 14px;border-radius:var(--rs);text-decoration:none;cursor:pointer;transition:.15s}
.tb .phone:hover{background:#25D36655}
.tabs{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bl);
      border-bottom:2px solid var(--bd)}
.tabsScroll{display:flex;gap:7px;overflow-x:auto;flex:1 1 auto;min-width:0}
.tabsScroll button{flex:0 0 auto;padding:10px 16px;border-radius:12px;border:2px solid var(--bd);background:var(--c);
      color:var(--ts);font-weight:700;font-size:1.02rem;cursor:pointer;white-space:nowrap;transition:.15s}
.tabsScroll button.act{background:linear-gradient(120deg,var(--gl),var(--g));color:#3a2b06;border-color:var(--g);
      box-shadow:0 0 0 3px #c9a22733}
.mc{max-width:1300px;margin:0 auto;padding:20px 24px 70px}
.panel{display:none}
.panel.act{display:block}
h2.sec{font-size:1.6rem;color:var(--m);border-bottom:3px solid var(--bd);padding-bottom:10px;margin:0 0 16px}
.srcNote{font-size:.95rem;color:var(--ts);background:var(--gb);border:1px solid var(--g);border-radius:10px;
    padding:10px 16px;margin-bottom:18px;line-height:1.6}
.badge{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;margin-inline-start:8px;
    vertical-align:middle;white-space:nowrap}
.badge.both{background:var(--sb);color:var(--s);border:1px solid var(--s)}
.badge.moaser{background:var(--pb);color:var(--p);border:1px solid var(--p)}
.badge.gem{background:var(--mrb);color:var(--mr);border:1px solid var(--mr)}
.charGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.charCard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:18px 20px;box-shadow:0 2px 8px #0001}
.charCard .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.charCard .name{font-size:1.25rem;font-weight:800;color:var(--p)}
.charCard .name_ar{font-size:1.1rem;color:var(--mr);font-weight:700;direction:rtl;margin-inline-start:4px}
.charCard ul{margin:0;padding-inline-start:20px}
.charCard li{margin-bottom:8px;font-size:1.05rem;line-height:1.55}
.charCard li .ar{display:block;margin-top:3px;color:var(--m);direction:rtl;font-size:1rem;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.wcard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:14px 16px;box-shadow:0 2px 8px #0001}
.wcard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wcard .word{font-size:1.3rem;font-weight:800;color:var(--p)}
.wcard .pos{font-size:.85rem;color:var(--tl);font-style:italic}
.wcard .ar{margin-top:6px;font-size:1.1rem;color:var(--mr);font-weight:700;direction:rtl}
.phraseRow{display:flex;justify-content:space-between;gap:10px;border:1px dashed var(--bd);border-radius:8px;
    padding:9px 12px;margin-bottom:7px;font-size:1.05rem;align-items:center;background:rgba(255,253,248,.7)}
.phraseRow .a{direction:rtl;color:var(--mr);margin-inline-start:auto}
.pointsList{list-style:none;margin:0;padding:0}
.pointsList li{background:rgba(255,253,248,.93);border:1px solid var(--bd);border-inline-start:5px solid var(--g);
    border-radius:12px;padding:14px 18px;margin-bottom:12px}
.pointsList .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:.95rem;margin-inline-end:10px}
.pointsList .en{font-size:1.15rem;line-height:1.6}
.pointsList .ar{margin-top:6px;font-size:1.08rem;color:var(--mr);direction:rtl;line-height:1.7}
.readingCard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:22px 26px;margin-bottom:18px}
.readingCard p{line-height:1.9;font-size:1.25rem;margin:0 0 16px}
.readingCard p:last-child{margin-bottom:0}
.qtag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;
    border-radius:7px;background:var(--mr);color:#fff;font-weight:800;font-size:.8rem;margin:0 2px;vertical-align:middle}
.sqBox{background:var(--gb);border:1.5px solid var(--g);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.sqBox h3{margin:0 0 10px;color:var(--m);font-size:1.15rem}
.sqBox .row{display:flex;gap:8px;margin-bottom:8px;font-size:1.05rem;line-height:1.5}
.sqBox .row .n{flex:0 0 auto;font-weight:800;color:var(--mr)}
.qaCard{background:rgba(255,253,248,.93);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.qaCard .q{font-weight:700;color:var(--t);font-size:1.15rem;line-height:1.5}
.qaCard .q_ar{margin-top:4px;font-size:1.05rem;color:var(--p);direction:rtl;line-height:1.6}
.qaCard .a{margin-top:10px;background:var(--sb);border-radius:8px;padding:10px 14px;font-size:1.1rem;line-height:1.55}
.qaCard .a_ar{margin-top:8px;direction:rtl;text-align:right;color:var(--m);font-weight:600;font-size:1.05rem;line-height:1.7}
.catHdr{font-size:1.1rem;font-weight:800;color:var(--p);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--pb)}
.catHdr:first-child{margin-top:0}
.jreCard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:14px;padding:16px 20px;margin-bottom:16px}
.jreCard .q{font-weight:700;color:var(--t);font-size:1.15rem;margin-bottom:4px}
.jreCard .q_ar{font-size:1.02rem;color:var(--p);direction:rtl;margin-bottom:10px;line-height:1.6}
.jreTable{width:100%;border-collapse:collapse;font-size:1.05rem}
.jreTable td{border:1px solid var(--bd);padding:10px 14px;vertical-align:top;line-height:1.55}
.jreTable td.lbl{width:110px;font-weight:800;background:var(--pbl);color:var(--p)}
.practiceList{list-style:none;margin:0;padding:0;counter-reset:pq}
.practiceList li{counter-increment:pq;background:rgba(255,253,248,.93);border:1px solid var(--bd);border-radius:10px;
    padding:12px 16px;margin-bottom:10px;font-size:1.12rem;line-height:1.6;display:flex;gap:10px}
.practiceList li::before{content:counter(pq) ".";font-weight:800;color:var(--p);flex:0 0 auto}
footer{text-align:center;padding:20px;color:var(--tl);font-size:1rem}
@media (max-width:768px){
  html{font-size:18px}
  .tb h1{font-size:1.05rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

const DATA = {"characters": [{"name": "Edward Malone", "name_ar": "إدوارد مالون", "src": "both", "bullets": [{"en": "A young journalist who works for the Daily Gazette in London.", "ar": "صحفي شاب يعمل في جريدة ديلي جازيت في لندن."}, {"en": "First-person narrator of the expedition — he tells much of the story and records the group's experiences.", "ar": "هو راوي الأحداث بضمير المتكلم — يحكي معظم القصة ويسجل تجارب المجموعة."}, {"en": "He is brave, curious, and eager for adventure.", "ar": "شجاع وفضولي ومتحمس للمغامرة."}, {"en": "Gladys's challenge leads him to investigate Professor Challenger to prove himself as a capable reporter.", "ar": "تحدي جلاديس يدفعه للتحقيق مع الأستاذ تشالنجر ليثبت أنه صحفي قادر."}, {"en": "He learns that courage is responsible action when fear is real.", "ar": "يتعلم أن الشجاعة الحقيقية هي التصرف بمسؤولية عندما يكون الخوف حقيقيًا."}]}, {"name": "Professor George Edward Challenger", "name_ar": "البروفيسور جورج إدوارد تشالنجر", "src": "both", "bullets": [{"en": "A brilliant but proud and confident scientist — a famous zoologist.", "ar": "عالِم بارع لكنه فخور وواثق من نفسه — عالِم حيوان مشهور."}, {"en": "He believes that prehistoric creatures still exist in a remote part of South America.", "ar": "يعتقد أن مخلوقات ما قبل التاريخ ما زالت موجودة في منطقة نائية بأمريكا الجنوبية."}, {"en": "He leads the expedition to the mysterious plateau and is determined to prove his scientific theory.", "ar": "يقود الرحلة الاستكشافية إلى الهضبة الغامضة، ومُصمم على إثبات نظريته العلمية."}, {"en": "Brilliant and determined, but often forceful and difficult with journalists.", "ar": "بارع ومُصمم، لكنه غالبًا عنيف وصعب التعامل مع الصحفيين."}, {"en": "His living pterodactyl later becomes public proof of his claims.", "ar": "الزاحف الطائر الحي الذي يحضره لاحقًا يصبح دليلًا علنيًا على صحة ادعاءاته."}]}, {"name": "Professor Summerlee", "name_ar": "البروفيسور سمرلي", "src": "both", "bullets": [{"en": "An elderly scientist and Challenger's rival.", "ar": "عالِم مسن ومنافس لتشالنجر."}, {"en": "At first, he doubts Challenger's extraordinary claim and insists that scientists need reliable evidence.", "ar": "في البداية يشكك في ادعاء تشالنجر غير العادي، ويصر على أن العلماء يحتاجون أدلة موثوقة."}, {"en": "He joins the expedition to examine the evidence himself.", "ar": "ينضم إلى الرحلة ليفحص الأدلة بنفسه."}, {"en": "Although sceptical, he is intelligent, brave, and committed to science.", "ar": "رغم أنه متشكك، فهو ذكي وشجاع وملتزم بالعلم."}, {"en": "Seeing the creatures with his own eyes later changes his opinion.", "ar": "رؤية المخلوقات بعينه لاحقًا تغيّر رأيه."}]}, {"name": "Lord John Roxton", "name_ar": "اللورد جون روكستون", "src": "both", "bullets": [{"en": "A brave and experienced explorer and hunter.", "ar": "مستكشف وصياد شجاع وذو خبرة."}, {"en": "He is calm, practical, and skilled at dealing with dangerous situations.", "ar": "هادئ وعملي وماهر في التعامل مع المواقف الخطرة."}, {"en": "He has experience fighting against slavery in South America.", "ar": "لديه خبرة في محاربة تجارة الرقيق في أمريكا الجنوبية."}, {"en": "He becomes an important member of the expedition and helps protect the others.", "ar": "يصبح عضوًا مهمًا في الرحلة ويساعد في حماية الآخرين."}, {"en": "By the end, he chooses further exploration over a quiet life.", "ar": "في النهاية يفضّل الاستمرار في الاستكشاف على حياة هادئة."}]}, {"name": "Zambo", "name_ar": "زامبو", "src": "both", "bullets": [{"en": "A loyal and strong African servant who accompanies the explorers.", "ar": "خادم إفريقي قوي ومخلص يرافق المستكشفين."}, {"en": "He remains at the base of the plateau (below, after the tree bridge is destroyed) while the others explore.", "ar": "يبقى عند قاعدة الهضبة (أسفلها بعد تدمير الجسر الشجري) بينما يستكشف الآخرون."}, {"en": "He helps the group by providing food and supplies.", "ar": "يساعد المجموعة بتوفير الطعام والمؤن."}, {"en": "He is dependable and loyal — his rescue party later shows loyalty and teamwork.", "ar": "جدير بالثقة ومخلص — فرقة الإنقاذ التي ينظمها لاحقًا تُظهر الولاء والعمل الجماعي."}]}, {"name": "Gladys Hungerton", "name_ar": "جلاديس هونجيرتون", "src": "gem", "bullets": [{"en": "Edward Malone's love interest at the beginning of the novel.", "ar": "محل إعجاب إدوارد مالون في بداية الرواية."}, {"en": "She encourages Malone to become a brave and successful man.", "ar": "تشجع مالون على أن يصبح رجلًا شجاعًا وناجحًا."}, {"en": "His desire to prove himself is partly connected to his feelings for her.", "ar": "رغبته في إثبات نفسه مرتبطة جزئيًا بمشاعره تجاهها."}]}, {"name": "The Ape-Men", "name_ar": "رجال القردة", "src": "gem", "bullets": [{"en": "They are primitive human-like creatures living on the plateau.", "ar": "مخلوقات بدائية شبيهة بالبشر تعيش على الهضبة."}, {"en": "They are enemies of the human tribe living there.", "ar": "أعداء القبيلة البشرية التي تعيش هناك."}, {"en": "Their conflict with the humans creates some of the novel's major dangers.", "ar": "صراعهم مع البشر يخلق بعض أخطر أحداث الرواية."}]}, {"name": "The Indians", "name_ar": "الهنود", "src": "gem", "bullets": [{"en": "A group of human inhabitants living on the plateau.", "ar": "مجموعة من السكان البشريين الذين يعيشون على الهضبة."}, {"en": "They are involved in a long conflict with the Ape-Men.", "ar": "في صراع طويل مع رجال القردة."}, {"en": "The explorers help them in their struggle.", "ar": "يساعدهم المستكشفون في كفاحهم."}]}], "vocab": [{"w": "aggressive", "pos": "adj", "ar": "عدواني", "src": "both"}, {"w": "appointment", "pos": "n", "ar": "موعد", "src": "both"}, {"w": "assignment", "pos": "n", "ar": "مهمة / تكليف", "src": "both"}, {"w": "brave", "pos": "adj", "ar": "شجاع", "src": "moaser"}, {"w": "challenge", "pos": "n", "ar": "تحدٍّ", "src": "moaser"}, {"w": "claim", "pos": "v/n", "ar": "يدّعي / ادّعاء", "src": "moaser"}, {"w": "courage", "pos": "n", "ar": "شجاعة", "src": "both"}, {"w": "study", "pos": "n", "ar": "مكتب العمل أو الدراسة", "src": "moaser"}, {"w": "demand", "pos": "v (ed)", "ar": "يطلب بلهجة آمرة", "src": "moaser"}, {"w": "editor", "pos" ": "matter", "pos": "n/v (ed)", "ar": "أمر / يهم", "src": "gem"}, {"w": "measure", "pos": "v (d)", "ar": "يقيس", "src": "gem"}, {"w": "mention", "pos": "v (ed)", "ar": "يذكر", "src": "gem"}, {"w": "mistaken", "pos": "adj", "ar": "مخطئ", "src": "gem"}, {"w": "plain", "pos": "adj", "ar": "واضح / جلي", "src": "gem"}, {"w": "question", "pos": "v (ed)", "ar": "يستجوب", "src": "gem"}, {"w": "roar", "pos": "v (ed)", "ar": "يزأر / يرتفع ضجيجه", "src": "gem"}, {"w": "servant", "pos": "n", "ar": "خادم", "src": "gem"}, {"w": "sketches", "pos": "n", "ar": "مخططات / رسومات", "src": "gem"}, {"w": "theory", "pos": "n", "ar": "نظرية", "src": "gem"}, {"w": "willing", "pos": "adj", "ar": "راغب / مستعد", "src": "gem"}], "phrases": [{"p": "argue with", "ar": "يتجادل مع"}, {"p": "explain the matter in person", "ar": "يشرح الأمر شخصيًا"}, {"p": "get through", "ar": "يجتاز"}, {"p": "give ... an appointment", "ar": "يحدد موعدًا لشخص"}, {"p": "give ... an idea", "ar": "يعطي ... فكرة"}, {"p": "give my life a clearer purpose", "ar": "يعطي حياتي هدفًا أكثر وضوحًا"}, {"p": "hear of", "ar": "يسمع من"}, {"p": "her words stayed with me", "ar": "ظلت كلماتها معي"}, {"p": "in the way I hoped", "ar": "بالطريقة التي كنت أتمنى"}, {"p": "stare at", "ar": "يحدق في"}, {"p": "take a risk", "ar": "يخاطر"}, {"p": "take my chance", "ar": "أغتنم فرصتي"}, {"p": "travel into", "ar": "يسافر إلى"}, {"p": "went straight to", "ar": "اتجه مباشرة إلى"}], "points": [{"en": "Edward Malone is a 23-year-old young reporter who works for the Daily Gazette in London. He is energetic and wants to do something important with his life.", "ar": "إدوارد مالون شاب صحفي يبلغ من العمر ٢٣ عامًا ويعمل في جريدة ديلي جازيت في لندن. كان نشيطًا ويريد أن يفعل شيئًا مهمًا في حياته."}, {"en": "Edward loves a young woman named Gladys Hungerton and decides to ask her to marry him.", "ar": "كان إدوارد يحب فتاة تُدعى جلاديس هانجرتون، وقرر أن يطلب منها الزواج."}, {"en": "Gladys tells Edward that she likes him as a friend, but she does not love him in the way he wishes.", "ar": "أخبرت جلاديس إدوارد أنها تحبه كصديق، لكنها لا تحبه بالطريقة التي يتمناها."}, {"en": "Gladys says that she could love a man who is brave, faces danger, travels to unknown places, and proves his courage.", "ar": "قالت جلاديس إنها يمكن أن تحب رجلًا شجاعًا يواجه الخطر، ويسافر إلى أماكن مجهولة، ويثبت شجاعته."}, {"en": "Gladys's words make Edward think about his life. He decides that he needs a difficult and dangerous challenge.", "ar": "جعلته كلمات جلاديس يفكر في حياته، وقرر أنه يحتاج إلى تحدٍّ صعب وخطير."}, {"en": "The next day, Edward goes to his editor, Mr McArdle, and asks him for a dangerous assignment.", "ar": "في اليوم التالي، ذهب إدوارد إلى رئيس تحريره السيد مكاردل وطلب منه مهمة خطيرة."}, {"en": "McArdle tells Edward about Professor George Edward Challenger, a famous but difficult zoologist.", "ar": "أخبر مكاردل إدوارد عن البروفيسور جورج إدوارد تشالنجر، وهو عالم حيوان مشهور لكنه صعب التعامل."}, {"en": "Challenger had returned from South America with a strange story about unknown animals. However, he refused to give scientists or reporters clear information.", "ar": "عاد تشالنجر من أمريكا الجنوبية بقصة غريبة عن حيوانات مجهولة، لكنه رفض أن يعطي العلماء أو الصحفيين معلومات واضحة."}, {"en": "McArdle asks Edward to discover whether Challenger's story is true or false.", "ar": "طلب مكاردل من إدوارد أن يكتشف ما إذا كانت قصة تشالنجر حقيقية أم كاذبة."}, {"en": "Edward learns that Challenger strongly dislikes journalists and usually refuses to speak to them.", "ar": "عرف إدوارد أن تشالنجر يكره الصحفيين بشدة، وعادةً ما يرفض التحدث معهم."}, {"en": "Edward asks his friend Tarp Henry for help. He gets a scientific paper by Challenger and uses a difficult sentence from it in a letter.", "ar": "طلب إدوارد المساعدة من صديقه تارب هنري، وحصل على بحث علمي لتشالنجر واستخدم جملة صعبة منه في رسالة."}, {"en": "In the letter, Edward pretends to be a young student who has a question about Challenger's scientific ideas.", "ar": "تظاهر إدوارد في الرسالة بأنه طالب شاب لديه سؤال عن أفكار تشالنجر العلمية."}, {"en": "Challenger replies to the letter. Although he says Edward does not understand the subject well, he agrees to meet him and explain it.", "ar": "رد تشالنجر على الرسالة، ورغم أنه قال إن إدوارد لا يفهم الموضوع جيدًا، فإنه وافق على مقابلته وشرح أمره."}, {"en": "On Wednesday, Edward visits Challenger's large house in Kensington. Challenger's wife warns him that her husband can become very angry and difficult.", "ar": "يوم الأربعاء، ذهب إدوارد إلى منزل تشالنجر الكبير في كنسينجتون، وحذّرته زوجة تشالنجر من أن زوجها قد يصبح غاضبًا ويصعب التعامل معه."}, {"en": "Edward enters Challenger's study and sees a strong, broad man with a large black beard and sharp grey-blue eyes.", "ar": "دخل إدوارد غرفة دراسة تشالنجر ورأى رجلًا قويًا وعريض الجسم، له لحية سوداء كبيرة وعينان حادتان رماديتان مزرقتان."}, {"en": "Challenger immediately questions Edward and challenges his knowledge.", "ar": "بدأ تشالنجر في استجواب إدوارد وتحدي معلوماته فورًا."}], "readingParagraphs": ["My name is Edward Malone, and at the time this story began I was a young reporter on the Daily Gazette in London. I was twenty-three, full of energy, and certain that a great life was waiting for me. The problem was that I had no idea how to begin it.", "There was also Gladys Hungerton. I admired her more than anyone I had ever met, and one evening I finally asked her to marry me. She did not laugh at me or become angry. Instead, she looked serious and told me that she valued our friendship but did not love me in the way I hoped.", "“What kind of man could you love?” I asked.", "Gladys thought for a moment. “A man who has done something brave,”{{Q1}} she said. “Someone who has faced danger, travelled into unknown places, and proved that he can act when it matters.”", "I tried to joke. “So, I must discover a new country before you will consider me?” “Not for me,” she replied. “If a man is truly brave, he does not act just to impress someone else. He acts because courage is part of his character.”", "Her words stayed with me. I left her house feeling disappointed, but also strangely excited.", "London suddenly seemed too safe. I wanted a challenge{{Q2}} — something that would test me and give my life a clearer purpose.", "The next evening, I went straight to my editor, Mr McArdle. He was an experienced newspaper man who had seen every kind of young reporter. When I asked him to send me on a dangerous assignment, he pushed his glasses up and stared at me.", "“You want danger?” he said. “Most sensible people want to avoid it.” “I want a real story, sir. Something difficult.”", "He studied me for a moment, then smiled. “Perhaps I do have a job for you. Have you heard of Professor George Edward Challenger?”{{Q3}}", "Of course I had. Almost everyone in the newspaper world knew his name. Challenger was a famous zoologist, brilliant but extremely difficult. He had recently returned from South America with an extraordinary story about unknown animals.{{Q4}} When scientists questioned him, he refused to give clear details. When reporters tried to interview him, he often threw them out of his house — sometimes literally.", "“Do you want me to interview him?” I asked.", "“If you can get through the front door,” McArdle replied. “Two years ago Challenger travelled alone through a little-known part of South America. He came back claiming that something remarkable had happened. He had damaged photographs, strange sketches, and a few pieces of evidence, but he would not reveal the exact place. Most people think he is either mistaken or lying. Find out which.”", "This was exactly the kind of chance I had been looking for. Yet there was one problem: Challenger hated journalists.{{Q5}} If I arrived honestly and said I worked for the Gazette, the interview would probably end before it began.", "That night I went to the Savage Club, where many writers and scientists met. I found my friend Tarp Henry, who worked for a scientific journal, and asked what he knew about Challenger.", "“He is clever,” Henry said, “but impossible. He argues with everyone. At a scientific meeting in Vienna he almost started a battle over a theory of evolution. If you want to speak to him, do not mention newspapers.”", "That gave me an idea. I asked Henry to find Challenger's latest scientific paper. It was full of technical language I barely understood, but I copied one complicated sentence and used it in a letter. I pretended to be a young student who admired Challenger's work but had a question about one of his arguments.", "Henry read the letter and laughed. “You are taking a risk, Malone. He may realize at once that you know nothing about the subject.”", "“I only need to get inside his study,” I said. “After that, I will take my chance.” Two days later a reply arrived. The handwriting looked as aggressive as the man himself. Challenger wrote that my question showed poor understanding, but he was willing to explain the matter in person. He gave me an appointment for eleven o'clock on Wednesday morning.", "I should have been nervous. Instead, I felt as if my real life had finally begun. On Wednesday I travelled to Professor Challenger's large house in Kensington.{{Q6}} A quiet servant named Austin opened the door. Before he could take me to the study, a small, lively woman stopped me in the hall.", "“You have come to see my husband?” she asked. “Yes, Mrs Challenger.” She lowered her voice. “Then I should warn you. George is a perfectly impossible person. If he becomes angry, do not argue too long.”", "A deep voice suddenly roared from behind a closed door. Austin opened it, and I entered. Professor Challenger sat behind a wide desk covered with books, maps, fossils, and papers.", "He was shorter than I expected, but enormously broad. His black beard spread across his chest, and his sharp grey-blue eyes seemed to measure every weakness in me.", "“Well?” he demanded. “You are the young man who has difficulty understanding plain science?” I had entered looking for adventure. I had found it sooner than I expected."], "suggestedQuestions": [{"n": 1, "q": "What qualities did Gladys admire in the kind of man she could love?"}, {"n": 2, "q": "What kind of challenge did Malone want?"}, {"n": 3, "q": "Who was Mr McArdle?"}, {"n": 4, "q": "What did Challenger bring back from South America?"}, {"n": 5, "q": "Why did Malone decide not to introduce himself as a journalist to Challenger?"}, {"n": 6, "q": "Where was Professor Challenger's house?"}], "readingNote": "النص متطابق تقريبًا في المعاصر وجيم (نفس ترجمة القصة الأصلية لـ Arthur Conan Doyle). الأسئلة المقترحة المرقمة بالهامش من نسخة المعاصر.", "qa": [{"cat": "Understand", "src": "both", "q": "Explain how Gladys's idea of courage changes Malone's plans for his future.", "q_ar": "اشرح كيف غيّر مفهوم جلاديس للشجاعة خطط مالون لمستقبله.", "a": "Her idea makes him want to leave his safe, ordinary life and seek a challenge that will test him and give his life a clearer purpose.", "a_ar": "لقد جعلته فكرتها يريد أن يترك حياته الآمنة المعتادة ويبحث عن تحدٍّ يختبره ويمنح حياته هدفًا أوضح."}, {"cat": "Understand", "src": "both", "q": "Why does Malone ask Mr McArdle to give him a dangerous assignment?", "q_ar": "لماذا يطلب مالون من السيد مكاردل أن يعطيه مهمة خطرة؟", "a": "He wants a real and difficult story because he is looking for adventure, a test of courage, and a clearer purpose in life.", "a_ar": "يريد قصة حقيقية وصعبة لأنه يبحث عن المغامرة واختبار الشجاعة وهدف أوضح في الحياة."}, {"cat": "Understand", "src": "both", "q": "Explain why Malone writes to Professor Challenger as if he understands Challenger's scientific work.", "q_ar": "وضح لماذا يكتب مالون إلى الأستاذ تشالنجر كما لو أنه يفهم عمله العلمي.", "a": "He knows that Challenger hates journalists, so he pretends to be an interested student to get into his study and obtain an interview.", "a_ar": "يعرف مالون أن تشالنجر يكره الصحفيين، لذلك يتظاهر بأنه طالب مهتم لكي يدخل مكتبه ويحصل على مقابلة."}, {"cat": "Understand", "src": "moaser", "q": "Why does Mrs Challenger warn Malone before he enters the study?", "q_ar": "لماذا تحذّر السيدة تشالنجر مالون قبل أن يدخل المكتب؟", "a": "Because she knows that her husband can become very angry and difficult to argue with.", "a_ar": "لأنها تعرف أن زوجها قد يغضب كثيرًا ويصعب الجدال معه."}, {"cat": "Understand", "src": "gem", "q": "Describe Malone's personality as shown through his conversation with Gladys and his visit to McArdle.", "q_ar": "صف شخصية مالون كما تجلت من خلال محادثته مع جلاديس وزيارته لمكاردل.", "a": "Malone seems hopeful, bold, and a bit impulsive. He doesn't give up after Gladys says no — he quickly goes to McArdle looking for adventure.", "a_ar": "يبدو مالون متفائلًا وجريئًا ومندفعًا بعض الشيء؛ فهو لا يستسلم بعد رفض جلاديس، بل يذهب بسرعة إلى مكاردل بحثًا عن المغامرة."}, {"cat": "Understand", "src": "gem", "q": "Why does Tarp Henry laugh when Malone tells him his plan?", "q_ar": "لماذا يضحك تارب هنري عندما يخبره مالون بخطته؟", "a": "He laughs because the plan seems risky — Malone knows little science but is pretending to be a smart student. Henry thinks Challenger might notice the trick.", "a_ar": "يضحك لأن الخطة تبدو محفوفة بالمخاطر، فمالون يعرف القليل عن العلم لكنه يتظاهر بأنه طالب ذكي، ويظن هنري أن تشالنجر قد يلاحظ الخدعة."}, {"cat": "Analyze", "src": "moaser", "q": "If you were Malone, how could you prepare honestly for an interview with a difficult scientist?", "q_ar": "لو كنت مكان مالون، كيف يمكنك الاستعداد بصدق لإجراء مقابلة مع عالِم يصعُب التعامل معه؟", "a": "I could read reliable information about the scientist's work, prepare clear questions, introduce myself honestly, and listen carefully.", "a_ar": "يمكنني قراءة معلومات موثوقة عن عمل العالِم، وإعداد أسئلة واضحة، والتعريف بنفسي بصدق، والاستماع بعناية."}, {"cat": "Analyze", "src": "moaser", "q": "Compare Malone's first idea of courage with Gladys's idea of courage.", "q_ar": "قارن بين فكرة مالون الأولى عن الشجاعة وفكرة جلاديس عنها.", "a": "Malone first links courage to winning Gladys's admiration through adventure. Gladys sees courage as an inner quality that guides a person's actions.", "a_ar": "يربط مالون الشجاعة في البداية بكسب إعجاب جلاديس من خلال المغامرة، أما جلاديس فترى الشجاعة صفة داخلية توجّه أفعال الشخص."}, {"cat": "Analyze", "src": "both", "q": "Analyze what Mr McArdle's reaction to Malone's request reveals about Malone's attitude to danger.", "q_ar": "حلّل ما تكشفه ردة فعل السيد مكاردل تجاه طلب مالون عن موقف مالون من الخطر.", "a": "McArdle's surprise shows that Malone actively wants danger while most sensible people avoid it. Malone sees danger as a way to find purpose and prove himself.", "a_ar": "يكشف استغراب مكاردل أن مالون يسعى إلى الخطر بينما يتجنبه معظم الناس العقلاء؛ ويرى مالون الخطر وسيلة لتحقيق هدف وإثبات نفسه."}, {"cat": "Analyze", "src": "both", "q": "Analyze the role Tarp Henry plays in helping Malone gain access to Professor Challenger.", "q_ar": "حلّل دور تارب هنري في مساعدة مالون على الوصول إلى الأستاذ تشالنجر.", "a": "Henry explains Challenger's personality, warns Malone about the risks, and indirectly helps Malone create the false student letter.", "a_ar": "يشرح هنري شخصية تشالنجر، ويحذّر مالون من المخاطر، ويساعده بصورة غير مباشرة على كتابة رسالة الطالب غير الحقيقي."}, {"cat": "Analyze", "src": "gem", "q": "Why does Challenger refuse to reveal the exact location of his discoveries in South America?", "q_ar": "لماذا يرفض تشالنجر الكشف عن الموقع الدقيق لاكتشافاته في أمريكا الجنوبية؟", "a": "The text doesn't say exactly why, but it seems Challenger doesn't trust others and wants to protect his discovery. This makes people suspect he is lying.", "a_ar": "لا يذكر النص السبب بالتحديد، لكن يبدو أن تشالنجر لا يثق بالآخرين ويريد حماية اكتشافه، مما يجعل الناس يشكّون في أنه يكذب."}, {"cat": "Analyze", "src": "gem", "q": "Explain why Professor Challenger has a bad reputation among scientists and journalists.", "q_ar": "اشرح لماذا يتمتع الأستاذ تشالنجر بسمعة سيئة بين العلماء والصحفيين.", "a": "Challenger is brilliant but very difficult. He argues with people and throws journalists out of his house. His claims also have no clear proof, so people doubt him.", "a_ar": "تشالنجر بارع لكنه صعب جدًا؛ فهو يجادل الناس ويطرد الصحفيين من منزله، كما أن ادعاءاته لا دليل واضحًا عليها فيشك فيه الناس."}, {"cat": "Analyze", "src": "both", "q": "How do Mrs Challenger's warning and Challenger's first appearance build suspense at the end of the chapter?", "q_ar": "كيف يسهم تحذير السيدة تشالنجر وظهور تشالنجر في زيارته الأولى في بناء التشويق في نهاية الفصل؟", "a": "The warning makes the reader expect trouble. Then the deep roar, the closed door, and Challenger's frightening appearance make the meeting feel dangerous.", "a_ar": "يجعل التحذير القارئ يتوقع مشكلة، ثم يجعل الصوت العميق والباب المغلق والمظهر المخيف للقاء يبدو خطرًا."}, {"cat": "Analyze", "src": "gem", "q": "What does Mrs Challenger's behavior in the hallway suggest about her relationship with her husband?", "q_ar": "بماذا يوحي سلوك السيدة تشالنجر في الردهة بشأن علاقتها بزوجها؟", "a": "She seems caring but also used to his temper. She warns Malone kindly, showing that she tries to protect visitors from her husband's anger.", "a_ar": "تبدو مهتمة لكنها معتادة على مزاجه؛ فهي تحذّر مالون بلطف، مما يدل على أنها تحاول حماية الزوار من غضب زوجها."}, {"cat": "Analyze", "src": "gem", "q": "Analyze how the setting of Challenger's study reflects his character.", "q_ar": "حلّل كيف يعكس مكتب تشالنجر شخصيته.", "a": "The messy desk full of books, maps, and fossils shows that Challenger is a serious, busy scientist. It also reflects his big, intense personality.", "a_ar": "يُظهر المكتب المزدحم بالكتب والخرائط والحفريات أن تشالنجر عالِم جاد ومشغول، كما يعكس شخصيته القوية والمكثفة."}, {"cat": "Evaluate", "src": "both", "q": "Evaluate Malone's decision to use deception in order to get an interview with Challenger. Was his method acceptable? Give reasons.", "q_ar": "قيّم قرار مالون استخدام الخداع للحصول على مقابلة مع تشالنجر. هل كانت طريقته مقبولة؟ اذكر أسبابًا.", "a": "His aim was understandable because the story was important, but his method was not fully acceptable. Deception may help him gain access, yet it damages trust.", "a_ar": "كان هدفه مفهومًا لأن القصة كانت مهمة، لكن طريقته لم تكن مقبولة تمامًا؛ فالخداع قد يساعده على الوصول لكنه يضر بالثقة."}, {"cat": "Evaluate", "src": "both", "q": "Evaluate Malone's desire for adventure at this stage. Does it show maturity, impulsiveness, or both? Explain.", "q_ar": "قيّم رغبة مالون في المغامرة في هذه المرحلة. هل تُظهر نضجًا أم اندفاعًا أم كليهما؟ وضح ذلك.", "a": "It shows both. He wants a meaningful challenge, which suggests maturity, but he also acts quickly and wants to impress Gladys, which suggests impulsiveness.", "a_ar": "تُظهر كليهما؛ فهو يريد تحديًا هادفًا وهذا يدل على النضج، لكنه يتصرف بتسرُّع ويريد إبهار جلاديس أيضًا، وهذا يدل على الاندفاع."}, {"cat": "Evaluate", "src": "moaser", "q": "Is Gladys's definition of courage convincing? Why?", "q_ar": "هل تعريف جلاديس للشجاعة مقنع؟ لماذا؟", "a": "Yes. It is convincing because true courage should come from character and responsibility, not from a desire for praise.", "a_ar": "نعم، إنه مقنع لأن الشجاعة الحقيقية ينبغي أن تنبع من الشخصية والمسؤولية، وليس من الرغبة في الحصول على المديح."}, {"cat": "Evaluate", "src": "moaser", "q": "Was Mr McArdle justified in sending a young reporter to meet Challenger?", "q_ar": "هل كان مكاردل محقًا في إرسال صحفي شاب لمقابلة تشالنجر؟", "a": "Maybe he was justified because Malone asked for a difficult assignment, but he should also have considered Challenger's hostility towards reporters.", "a_ar": "كان محقًا جزئيًا لأن مالون طلب مهمة صعبة، لكن كان ينبغي أن يراعي أيضًا عداء تشالنجر للصحفيين."}, {"cat": "Evaluate", "src": "moaser", "q": "Which matters more for a reporter: obtaining a story or behaving honestly?", "q_ar": "أيهما أهم للصحفي: الحصول على خبر أم التصرف بنزاهة؟", "a": "Honest behavior matters more because reporting must be trustworthy. A story obtained through deception can harm people and reduce public trust.", "a_ar": "السلوك الأمين أهم لأن الصحافة يجب أن تكون موثوقة؛ فالخبر الذي يُنال بالخداع قد يضر بالناس ويقلل ثقة الجمهور."}, {"cat": "Evaluate", "src": "gem", "q": "Evaluate the ending line, “I had entered looking for adventure. I had found it sooner than I expected.” What does it suggest?", "q_ar": "قيّم جملة النهاية: «لقد دخلت أبحث عن مغامرة. لقد وجدتها في وقت أقرب مما كنت أتوقع». بماذا توحي هذه العبارة؟", "a": "It hints that Malone's meeting with Challenger will be dramatic and difficult, not calm or simple.", "a_ar": "توحي بأن لقاء مالون مع تشالنجر سيكون مثيرًا وصعبًا، وليس هادئًا أو بسيطًا."}], "jre": [{"src": "both", "q": "Is Gladys a positive influence on Malone at the beginning of the story?", "q_ar": "هل تُعدّ جلاديس تأثيرًا إيجابيًا على مالون في بداية القصة؟", "justify": "Yes, overall, although her influence is initially intervened with Malone's desire to impress her.", "reason": "Her definition of courage gives him a clearer goal and pushes him to seek a challenge.", "evidence": "She says bravery means facing danger for reasons of character; afterward, he decides London is too safe and asks Mr McArdle for a dangerous assignment."}, {"src": "both", "q": "Is Malone truly ready for the kind of adventure he is seeking by the end of this chapter?", "q_ar": "هل مالون مستعد حقًا لنوع المغامرة التي يسعى إليها بحلول نهاية هذا الفصل؟", "justify": "Only partly.", "reason": "He has energy and initiative, but he is inexperienced and willing to use risky deception.", "evidence": "He actively seeks a dangerous assignment and consults Tarp Henry, yet he copies scientific information he barely understands and walks into a meeting after several warnings."}, {"src": "moaser", "q": "Which explanation best shows why Malone changes direction after Gladys explains her idea of courage?", "q_ar": "أي تفسير يوضح بصورة أفضل لماذا يغيّر مالون اتجاه حياته بعد أن توضح جلاديس فكرتها عن الشجاعة؟", "justify": "Her words give Malone a new purpose, although his first reaction is partly personal.", "reason": "He connects courage with facing danger and decides that ordinary life in London is too safe.", "evidence": "He leaves disappointed but excited, then asks Mr McArdle for a dangerous assignment."}, {"src": "moaser", "q": "If Malone had introduced himself openly as a reporter at the door, what would be the most suitable response based on what happens to Challenger?", "q_ar": "إذا قدّم مالون نفسه عند الباب بصراحة على أنه صحفي، فما الاستجابة الأنسب استنادًا إلى ما يحدث مع تشالنجر؟", "justify": "He would probably need another respectful method to earn a hearing.", "reason": "Challenger's hostility to journalists makes a direct, unprepared approach unlikely to succeed.", "evidence": "Reporters are often thrown out, and Malone expects an honest introduction to end the interview before it begins."}, {"src": "gem", "q": "Is Malone a determined person?", "q_ar": "هل مالون شخص مُصمِّم على تحقيق هدفه؟", "justify": "Yes, Malone is determined because he does not give up easily.", "reason": "He finds different ways to achieve his goal.", "evidence": "He asks McArdle for a dangerous assignment and creates a plan to meet Challenger."}, {"src": "gem", "q": "Is Malone's decision to hide the truth from Challenger justified?", "q_ar": "هل يُعد قرار مالون بإخفاء الحقيقة عن تشالنجر مبررًا؟", "justify": "Yes, it was understandable because Challenger hated journalists.", "reason": "He knows that Challenger may refuse to meet him if he knows he is a reporter.", "evidence": "Challenger often rejected journalists, and he had even thrown reporters out of his house."}, {"src": "gem", "q": "Is Mr McArdle helpful to Malone?", "q_ar": "هل كان السيد مكاردل مفيدًا لمالون؟", "justify": "Yes, McArdle helps Malone by giving him a chance to find a real story.", "reason": "He tells Malone about Challenger and gives him a difficult assignment.", "evidence": "He tells Malone about Challenger's journey to South America and asks him to discover the truth."}, {"src": "gem", "q": "Does Malone show good problem-solving skills?", "q_ar": "هل يُظهر مالون مهارات جيدة في حل المشكلات؟", "justify": "Yes, Malone shows good problem-solving skills.", "reason": "He makes a clever plan and pretends to be a student.", "evidence": "He copies a difficult sentence from Challenger's paper and uses it in his letter."}], "practice": [{"src": "moaser", "q": "Describe Malone's life at the beginning of the chapter."}, {"src": "moaser", "q": "What does Gladys mean by true courage?"}, {"src": "moaser", "q": "How does Gladys's response affect Malone?"}, {"src": "moaser", "q": "Do you think Malone is satisfied with his life at the beginning of the chapter? Why/Why not?"}, {"src": "moaser", "q": "Do you agree with Gladys's idea of 'true courage'? Justify your answer."}, {"src": "moaser", "q": "Was Malone right to ask Mr McArdle for a dangerous assignment? Justify your answer."}, {"src": "moaser", "q": "Do you think Challenger deserves his reputation for being difficult? Give reasons for your judgment."}, {"src": "moaser", "q": "How reliable do you think Henry's description of Challenger is? Give evidence from the chapter."}, {"src": "moaser", "q": "Do you think Malone's method of getting an appointment with Challenger was clever or dishonest? Justify your judgment."}, {"src": "gem", "q": "Evaluate McArdle's role as an editor. Is he helpful to Malone, or is he simply testing him? Why?"}, {"src": "gem", "q": "Why does Gladys refuse Malone's marriage proposal, and what does she say she wants in a man?"}, {"src": "gem", "q": "Explain what kind of man Gladys says she could love and what qualities he should have."}, {"src": "gem", "q": "How do Gladys's words change Malone's feelings and plans for his future?"}, {"src": "gem", "q": "Analyse why Malone suddenly feels that London is too safe and that he needs a new challenge."}, {"src": "gem", "q": "Explain what Mr McArdle tells Malone about Professor Challenger and his unusual story."}, {"src": "gem", "q": "Why is Professor Challenger famous, and why are many people interested in his story about South America?"}, {"src": "gem", "q": "Analyse what McArdle wants Malone to discover about Challenger's story and why this is an important task."}, {"src": "gem", "q": "How does Malone use Challenger's scientific paper to make his false identity as a student more believable?"}, {"src": "gem", "q": "Explain how Challenger responds to Malone's letter and what his response allows Malone to do."}, {"src": "gem", "q": "Why does Mrs Challenger warn Malone before he enters her husband's study?"}, {"src": "gem", "q": "Analyse what Challenger's first words to Malone reveal about his personality and attitude toward him."}, {"src": "gem", "q": "Evaluate Malone's decision to deceive Challenger by pretending to be a student. Was it a successful plan?"}, {"src": "gem", "q": "Evaluate Malone's desire for adventure in this chapter. Does it show courage, impulsiveness, or both?"}, {"src": "gem", "q": "Analyse how Malone's first meeting with Challenger creates excitement and prepares the reader for the next part of the story."}, {"src": "gem", "q": "Is Tarp Henry an important part of Malone's plan?"}, {"src": "gem", "q": "Is Malone's decision to seek adventure a good response to Gladys's rejection?"}, {"src": "gem", "q": "Is Malone brave or simply eager to prove himself?"}, {"src": "gem", "q": "Does the chapter show that Malone's adventure has only just begun?"}, {"src": "gem", "q": "Does Gladys want Malone to become a different person, or does she simply want him to show his true character?"}]};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

  if(src === 'both') return '<span class="badge both">المعاصر + جيم</span>';
  if(src === 'moaser') return '<span class="badge moaser">المعاصر</span>';
  if(src === 'gem') return '<span class="badge gem">جيم</span>';
  return '';
}

}

  h += '<div class="charGrid">';
  DATA.characters.forEach(c => {
    h += `<div class="charCard"><div class="hd"><span class="name">${esc(c.name)}</span>
      <span class="name_ar">${esc(c.name_ar)}</span>${srcBadge(c.src)}</div><ul>`;

      h += `<li>${esc(b.en)}<span class="ar">${esc(b.ar)}</span></li>`;

    h += '</ul></div>';
  });
  h += '</div>';
  return h;
}

function renderVocab(){
  let h = '<h2 class="sec">📘 مفردات الفصل الأول (Vocabulary)</h2>';
  h += '<div class="srcNote">مُجمّعة من المعاصر وجيم معًا — الكلمات المشتركة بين الكتابين عليها علامة "المعاصر + جيم".</div>';
  h += '<div class="grid">';
  DATA.vocab.forEach(v => {
    h += `<div class="wcard"><div class="top"><span class="word">${esc(v.w)}</span>
      <span class="pos">(${esc(v.pos)})</span>${srcBadge(v.src)}</div>
      <div class="ar">${esc(v.ar)}</div></div>`;
  });
  h += '</div>';
  h += '<h2 class="sec" style="margin-top:28px">🔤 تعبيرات وحروف جر (Expressions, Phrases &amp; Prepositions)</h2>';
  DATA.phrases.forEach(p => {
    h += `<div class="phraseRow"><b>${esc(p.p)}</b><span class="a">${esc(p.ar)}</span></div>`;
  });
  return h;
}

function renderPoints(){
  let h = '<h2 class="sec">🧩 أحداث الفصل الأول (Chapter in Points)</h2>';
  h += '<div class="srcNote">القائمة الموسّعة من جيم (16 نقطة) — تغطي نفس أحداث نسخة المعاصر (11 نقطة) بتفصيل أكبر.</div>';
  h += '<ul class="pointsList">';
  DATA.points.forEach((p, i) => {
    h += `<li><span class="num">${i+1}</span><span class="en">${esc(p.en)}</span>
      <div class="ar">${esc(p.ar)}</div></li>`;
  });
  h += '</ul>';
  return h;
}

function renderReading(){
  let h = '<h2 class="sec">📜 نص الفصل الأول (Chapter Text) — A Dream of Adventure</h2>';
  h += `<div class="srcNote">${esc(DATA.readingNote)}</div>`;
  h += '<div class="readingCard">';
  DATA.readingParagraphs.forEach(p => {
    let txt = esc(p).replace(/\{\{Q(\d+)\}\}/g, function(_, n){ return `<span class="qtag">${n}</span>`; });
    h += `<p>${txt}</p>`;
  });
  h += '</div>';
  h += '<div class="sqBox"><h3>💡 Suggested Questions</h3>';
  DATA.suggestedQuestions.forEach(q => {
    h += `<div class="row"><span class="n">${q.n}.</span><span>${esc(q.q)}</span></div>`;
  });
  h += '</div>';
  return h;
}

function renderQA(){
  let h = '<h2 class="sec">💬 أسئلة وإجابات (Questions &amp; Model Answers)</h2>';
  h += '<div class="srcNote">مُدمجة من المعاصر وجيم — الأسئلة المكررة في الكتابين (من بنك أسئلة الكتاب المدرسي) عليها علامة "المعاصر + جيم".</div>';
  let lastCat = null;
  DATA.qa.forEach(item => {
    if(item.cat !== lastCat){
      const catAr = {Understand:'🟢 Understand', Analyze:'🔵 Analyze', Evaluate:'🟣 Evaluate'}[item.cat] || item.cat;
      h += `<div class="catHdr">${catAr}</div>`;
      lastCat = item.cat;
    }
    h += `<div class="qaCard"><div class="q">${esc(item.q)}${srcBadge(item.src)}</div>
      <div class="q_ar">${esc(item.q_ar)}</div>
      <div class="a">${esc(item.a)}</div>
      <div class="a_ar">${esc(item.a_ar)}</div></div>`;
  });
  return h;
}

function renderJRE(){
  let h = '<h2 class="sec">⚖️ Justify, Reasoning &amp; Evidence (JRE)</h2>';
  h += '<div class="srcNote">إجابات نموذجية مُدمجة من المعاصر وجيم.</div>';
  DATA.jre.forEach(item => {
    h += `<div class="jreCard"><div class="q">${esc(item.q)}${srcBadge(item.src)}</div>
      <div class="q_ar">${esc(item.q_ar)}</div>
      <table class="jreTable">
        <tr><td class="lbl">Justify</td><td>${esc(item.justify)}</td></tr>
        <tr><td class="lbl">Reason</td><td>${esc(item.reason)}</td></tr>
        <tr><td class="lbl">Evidence</td><td>${esc(item.evidence)}</td></tr>
      </table></div>`;
  });
  return h;
}

function renderPractice(){
  let h = '<h2 class="sec">📝 أسئلة للمناقشة والتدريب (بدون إجابات)</h2>';
  h += '<div class="srcNote">بنك أسئلة مُدمج من المعاصر وجيم لطرحه في الحصة شفهيًا أو كتدريب.</div>';
  h += '<ul class="practiceList">';
  DATA.practice.forEach(p => {
    h += `<li><span>${esc(p.q)}${srcBadge(p.src)}</span></li>`;
  });
  h += '</ul>';
  return h;
}

function render(){
  const el = document.getElementById('content');
  let h = '';
  if(currentTab === 'characters') h = renderCharacters();
  else if(currentTab === 'vocab') h = renderVocab();
  else if(currentTab === 'points') h = renderPoints();
  else if(currentTab === 'reading') h = renderReading();
  else if(currentTab === 'qa') h = renderQA();
  else if(currentTab === 'jre') h = renderJRE();
  else if(currentTab === 'practice') h = renderPractice();
  el.innerHTML = `<div class="panel act">${h}</div>`;
}

renderTabs();
render();
initEntry();
</script>
</body>
</html>
