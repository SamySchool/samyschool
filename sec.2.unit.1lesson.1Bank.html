<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SamySchool — Lesson 1.1 — Parallel Practice</title>
<style>
:root{
  --p:#14213D;   --pd:#0A1226;  --pdd:#050912; --pl:#2B3F66;  --pb:#E8EAF0;  --pbl:#F3F5F9;
  --s:#2E7D32;   --sl:#66BB6A;  --sb:#E8F5E9;
  --e:#C62828;   --el:#EF5350;  --eb:#FFEBEE;
  --m:#4A2C17;   --ml:#7A5033;  --mb:#F1E6D8;
  --t:#241A0F;   --ts:#5B4636;  --tl:#8C7A66;
  --c:#FFFDF8;   --bd:#D9C9A8;  --bl:#F1E6D0;  --bg:#F5EEDD;
  --mr:#7A1F3D;  --mrl:#A63A5C; --mrb:#F7E8ED;
  --g:#C9A227;   --gl:#E0C05C;  --gb:#FBF3DC;
  --r:14px; --rs:10px; --rl:20px;

  /* platform defaults — exactly as the reference */
  --mc:900px; --qt:1.25rem; --opf:1.02rem; --ol:34px; --pass:1.02rem;
}
/* projector / large screens scale up so nobody has to zoom */
@media (min-width:1400px){:root{--mc:1480px;--qt:2rem;  --opf:1.42rem;--ol:46px;--pass:1.3rem}}
@media (min-width:1800px){:root{--mc:1660px;--qt:2.35rem;--opf:1.65rem;--ol:54px;--pass:1.45rem}}
body.compact{--mc:900px;--qt:1.25rem;--opf:1.02rem;--ol:34px;--pass:1.02rem}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--t); line-height:1.6;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- top bar ---------- */
.tb{
  flex:0 0 auto; position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px; padding:10px 24px;
  background:linear-gradient(135deg,var(--pdd),var(--pd) 55%,var(--p));
  color:#fff; box-shadow:0 2px 10px rgba(5,9,18,.28);
}
.li-img{width:50px;height:50px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);
  flex:0 0 auto;object-fit:cover;background:#fff}
.tb .ti{flex:1 1 auto;min-width:0}
.tb .ti h1{font-size:1.02rem;font-weight:700;letter-spacing:.2px;line-height:1.25}
.tb .ti p{font-size:.78rem;color:#C7CEDD;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .tr{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.sc{background:rgba(255,255,255,.1);border:1.5px solid rgba(201,162,39,.55);
  border-radius:var(--rs);padding:5px 12px;font-weight:800;font-size:.94rem;
  color:var(--gl);white-space:nowrap;font-variant-numeric:tabular-nums}
.sc small{color:#C7CEDD;font-weight:600}

.nb{font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;
  padding:9px 18px;border-radius:var(--rs);border:2px solid var(--bd);
  background:var(--c);color:var(--t);transition:background .15s,border-color .15s,color .15s}
.nb:hover:not(:disabled){background:var(--bl);border-color:var(--g)}
.nb:disabled{opacity:.42;cursor:default}
.nb:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.nb.pri{background:var(--p);border-color:var(--p);color:#fff}
.nb.pri:hover{background:var(--pd);border-color:var(--pd)}
.tb .nb{padding:7px 13px;font-size:.8rem;background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);color:#fff}
.tb .nb:hover{background:rgba(255,255,255,.22);border-color:var(--gl)}

/* ---------- index bar ---------- */
.pnav{flex:0 0 auto;display:flex;gap:7px;align-items:center;overflow-x:auto;
  padding:9px 18px;background:var(--c);border-bottom:1px solid var(--bd);
  scrollbar-width:thin}
.pnBtn{flex:0 0 auto;min-width:78px;padding:6px 9px;border:2px solid var(--bd);
  border-radius:12px;background:var(--bl);color:var(--ts);font-family:inherit;
  font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s}
.pnBtn:hover{border-color:var(--gl);color:var(--t)}
.pnBtn.act{background:var(--gb);border-color:var(--g);color:var(--m);
  box-shadow:0 0 0 3px rgba(201,162,39,.2)}
.pnBtn:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.pnWa{margin-inline-start:auto;background:#25D366;border-color:#25D366;color:#fff}
.pnWa:hover{background:#1DA851;border-color:#1DA851;color:#fff}

/* ---------- section name bar ---------- */
.sbar{flex:0 0 auto;padding:7px 24px;background:var(--pbl);
  border-bottom:1px solid var(--bd);font-size:.84rem;color:var(--ts);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbar b{color:var(--p);font-weight:800}
.pgb{background:var(--mr);color:#fff;border-radius:7px;padding:2px 9px;
  font-size:.75rem;font-weight:800;flex:0 0 auto}
.sbar .arn{color:var(--tl);direction:rtl}

/* ---------- deck: one question fills the screen ---------- */
#deck{flex:1 1 auto;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:none;overflow-y:auto}
.slide.on{display:block}
.mc{max-width:var(--mc);margin:18px auto;padding:0 18px}

.qc{background:var(--c);border:1px solid var(--bd);border-radius:var(--rl);
  overflow:hidden;box-shadow:0 3px 14px rgba(36,26,15,.09)}
.qh{padding:12px 24px;background:linear-gradient(135deg,var(--pb),var(--pbl));
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qh .qn{width:var(--ol);height:var(--ol);border-radius:50%;background:var(--p);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:calc(var(--opf)*.92);flex:0 0 auto}
.qh .qi{flex:1 1 auto;min-width:0;font-size:.83rem;color:var(--ts);font-weight:600}
.qh.es{background:linear-gradient(135deg,var(--mb),#F8F1E7)}
.qh.es .qn{background:var(--m)}
.qb{padding:24px 28px 20px}
.qt{font-size:var(--qt);font-weight:700;line-height:1.85;color:var(--t)}
.qt em{color:var(--mr);font-style:normal}
.qt b{color:var(--p)}

.og{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}
.og.one{grid-template-columns:1fr}
.op{display:flex;align-items:flex-start;gap:12px;text-align:start;width:100%;
  padding:13px 16px;border:2.5px solid var(--bd);border-radius:var(--r);
  background:#fff;color:var(--t);font-family:inherit;font-size:var(--opf);
  line-height:1.55;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.op:hover:not(:disabled){border-color:var(--pl);background:var(--pbl)}
.op:disabled{cursor:default}
.op:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.op .ol{width:var(--ol);height:var(--ol);border-radius:50%;background:var(--pb);color:var(--p);
  display:grid;place-items:center;font-weight:800;flex:0 0 auto;
  font-size:calc(var(--opf)*.88);text-transform:lowercase}
.op.ok{border-color:var(--s);background:var(--sb)}
.op.ok .ol{background:var(--s);color:#fff}
.op.no{border-color:var(--e);background:var(--eb)}
.op.no .ol{background:var(--e);color:#fff}
.op.dim{opacity:.45}

.ansbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ansbar input{font-family:inherit;font-size:var(--opf);color:var(--t);background:#fff;
  border:2.5px solid var(--bd);border-radius:var(--r);padding:12px 16px;width:min(420px,100%)}
.ansbar input:focus{outline:3px solid var(--gl);outline-offset:1px;border-color:var(--pl)}
.ansbar input.ok{border-color:var(--s);background:var(--sb)}
.ansbar input.no{border-color:var(--e);background:var(--eb)}
.ansbar .hint{font-size:.94rem;color:var(--tl);font-style:italic}
textarea{width:100%;margin-top:18px;min-height:150px;font-family:inherit;font-size:var(--opf);
  color:var(--t);background:#fff;border:2.5px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;resize:vertical;line-height:1.65}
textarea:focus{outline:3px solid var(--gl);outline-offset:1px;border-color:var(--pl)}

.fb{margin-top:18px;border-radius:var(--r);padding:14px 18px;border-inline-start:6px solid;
  animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--sb);border-color:var(--s)}
.fb.no{background:var(--eb);border-color:var(--e)}
.fb.md{background:var(--mb);border-color:var(--m)}
.fb h4{font-size:calc(var(--opf)*1.02);font-weight:800;margin-bottom:6px}
.fb.ok h4{color:var(--s)} .fb.no h4{color:var(--e)} .fb.md h4{color:var(--m)}
.fb .en{font-size:calc(var(--opf)*.96);line-height:1.7;color:var(--ts)}
.fb .ar{font-size:calc(var(--opf)*.98);line-height:1.9;color:var(--ts);
  margin-top:7px;direction:rtl;text-align:right;border-top:1px dashed var(--bd);padding-top:7px}

.psg{background:var(--bl);border:1px solid var(--bd);border-radius:var(--r);
  padding:18px 22px;font-size:var(--pass);line-height:1.95;color:var(--t)}
.psg p+p{margin-top:10px}
.psg b{color:var(--mr)}
details.src{margin-top:16px;border:2px solid var(--bd);border-radius:var(--r);
  background:var(--bl);overflow:hidden}
details.src>summary{cursor:pointer;list-style:none;padding:9px 16px;font-size:.84rem;
  font-weight:700;color:var(--m);background:var(--mb)}
details.src>summary::-webkit-details-marker{display:none}
details.src>summary::before{content:"\25B8";display:inline-block;margin-inline-end:7px;transition:transform .2s}
details.src[open]>summary::before{transform:rotate(90deg)}
details.src .psg{border:0;border-radius:0;background:transparent}

.cover{text-align:center;padding:26px 0}
.cover .pgb{display:inline-block;margin-bottom:14px}
.cover h2{font-size:calc(var(--qt)*1.25);color:var(--p);font-weight:800;line-height:1.3}
.cover .sub{font-size:var(--opf);color:var(--ts);margin-top:10px}
.cover .arn{font-size:var(--opf);color:var(--tl);margin-top:6px;direction:rtl}
.cover .cnt{margin-top:16px;display:inline-block;background:var(--gb);border:2px solid var(--g);
  border-radius:var(--rs);padding:7px 16px;font-weight:700;color:var(--m);font-size:.92rem}

/* ---------- bottom nav ---------- */
.foot{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:9px 24px;
  background:var(--c);border-top:1px solid var(--bd)}
.prog{flex:1 1 auto;height:8px;background:var(--bl);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--mr),var(--g));transition:width .25s}
.pos{font-size:.82rem;font-weight:700;color:var(--ts);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- question map panel ---------- */
.np{position:fixed;top:0;right:0;bottom:0;width:330px;max-width:88vw;z-index:60;
  background:var(--c);border-inline-start:1px solid var(--bd);
  box-shadow:-6px 0 24px rgba(36,26,15,.2);transform:translateX(100%);
  transition:transform .25s ease;display:flex;flex-direction:column}
.np.open{transform:none}
.np .nph{padding:12px 18px;background:linear-gradient(135deg,var(--pdd),var(--p));color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.np .nph h3{font-size:.98rem;font-weight:700}
.np .npx{background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;padding:0 4px}
.np .npb{flex:1 1 auto;overflow-y:auto;padding:14px 18px}
.np h5{font-size:.78rem;font-weight:800;color:var(--m);margin:14px 0 7px;
  text-transform:uppercase;letter-spacing:.04em}
.np h5:first-child{margin-top:0}
.ncg{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.nc{aspect-ratio:1;border-radius:7px;border:2px solid var(--bd);background:#fff;
  color:var(--ts);font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;
  display:grid;place-items:center;transition:transform .12s}
.nc:hover{transform:scale(1.07);border-color:var(--g)}
.nc:focus-visible{outline:3px solid var(--gl);outline-offset:1px}
.nc.ok{background:var(--sb);border-color:var(--s);color:var(--s)}
.nc.no{background:var(--eb);border-color:var(--e);color:var(--e)}
.nc.now{background:var(--p);border-color:var(--p);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(36,26,15,.42);z-index:55;display:none}
.scrim.on{display:block}

@media (max-width:768px){
  :root{--qt:1.05rem;--opf:.96rem;--ol:30px}
  .tb{padding:9px 14px;gap:10px}
  .li-img{width:42px;height:42px}
  .tb .ti p{display:none}
  .og{grid-template-columns:1fr}
  .qb{padding:18px 16px 16px}
  .qh{padding:10px 16px}
  .mc{padding:0 12px;margin:12px auto}
  .np{width:270px}
  .sbar{padding:6px 14px;font-size:.78rem}
  .foot{padding:8px 14px;gap:10px}
}
@media (max-width:480px){
  .tb .ti h1{font-size:.9rem}
  .sc{padding:4px 9px;font-size:.84rem}
  .nb{padding:8px 12px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
