const Q=[{"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. Educational projects often support ............. groups who lack equal opportunities.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">popular</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">central</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">powerful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">marginalized</span>"], "c": 3, "e": "marginalized تعني “مُهمَّشة”، وهي الوحيدة المناسبة لوصف فئات تفتقر لتكافؤ الفرص."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. Don&rsquo;t ............. the difficulty of this exam; it&rsquo;s very challenging.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">understand</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">underline</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">underestimate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">undertake</span>"], "c": 2, "e": "underestimate تعني “يقلّل من شأن/يستهين بـ”، وهذا هو المعنى المطلوب هنا."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. The sky was ............., so we could not see the sun.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">overcast</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bright</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sunny</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">vague</span>"], "c": 0, "e": "overcast تعني “ملبَّدة بالغيوم”، وهذا يفسّر سبب عدم رؤية الشمس."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. The baby began to ............. loudly when it was hungry.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">whisper</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">moan</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laugh</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">clap</span>"], "c": 1, "e": "moan تعني “يئنّ/يتأوّه بصوت عالٍ”، وهي أقرب كلمة تصف بكاء الرضيع من الجوع."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. The chicks are ............. from their eggs now.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hatching</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">catching</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">watching</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">matching</span>"], "c": 0, "e": "hatching تعني “يفقس من البيضة”، وهو الفعل الصحيح المرتبط بالكتاكيت."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. Cars ……………… harmful gas emissions that pollute the air.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">produce</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">introduce</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">deduce</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">misuse</span>"], "c": 0, "e": "produce تعني “ينتج”، والسيارات تنتج انبعاثات غازية ضارة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. When we went out, it was …………… cats and dogs.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">watching</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dropping</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">playing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">raining</span>"], "c": 3, "e": "“It's raining cats and dogs” تعبير اصطلاحي ثابت يعني “تمطر بغزارة شديدة”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. We …………………. dinner at 8 p.m. yesterday.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had had</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were having</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has</span>"], "c": 2, "e": "الحدث كان مستمرًا في لحظة محددة بالماضي (8 p.m. yesterday)، لذا نستخدم Past Continuous: were having."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. He wants to study at ……………..University of Oxford.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">no article</span>"], "c": 2, "e": "نستخدم أداة التعريف the قبل أسماء الجامعات بصيغة “University of...”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. Which of the following is the correct form of the reported speech of this sentence?<br>She said, &ldquo;I am tired.&rdquo;</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said that she was tired.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said that she is tired.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said she will be tired.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said she had been tired.</span>"], "c": 0, "e": "عند تحويل الكلام المباشر لغير مباشر: am تتحول إلى was، وI تتحول إلى she."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. We were robbed as I remembered not ………… the door.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">locking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to lock</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">locked</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lock</span>"], "c": 0, "e": "remember + Gerund تعني تذكّر فعل قام به الشخص بالفعل في الماضي (تذكّر أنه لم يُقفل الباب)."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. What is the central idea of the story?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator&rsquo;s holiday in Saint Catherine was boring.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator&rsquo;s holiday took an unexpected turn.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The restaurant owner prepared a delicious meal.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A horrible holiday the narrator would always remember.</span>"], "c": 1, "e": "بدأت الرحلة عادية ثم قابل الراوي عرّافًا غامضًا يعرف تفاصيل ماضيه، وهذا تحوّل غير متوقع.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>A few years ago, while I was on holiday in Sinai near Saint Catherine, I stopped for the night in a small desert village. It was a poor place, and there was no real hotel, but the owner of a local restaurant, Mr. Hassan, kindly offered me a bed for the night.</p><p>&ldquo;Please wait here,&rdquo; he said, pointing to a wooden table outside. &ldquo;I&rsquo;ll prepare your room.&rdquo;</p><p>The evening was beautiful. The sun was setting behind the rugged mountains, and the stars were just beginning to appear. Families were lighting small fires to cook their evening meals, and the pleasant smell of wood smoke filled the cool desert air.</p><p>Then I realized I was no longer alone. An old man with a long white beard had quietly sat at the table beside me. His clothes were dusty and almost in rags.</p><p>&ldquo;How can I help you?&rdquo; I asked. &ldquo;Let me tell your fortune, sir,&rdquo; he said.</p><p>I laughed. &ldquo;I don&rsquo;t believe in that kind of thing.&rdquo; But he gently held my hand and refused to let go. &ldquo;Very well,&rdquo; I said. &ldquo;First, tell me about my past. If you can do that, I&rsquo;ll let you talk about the future.&rdquo;</p><p>He read my palm lines in silence and then began to describe my childhood in Alexandria, my family, and even places where I had lived and worked in other cities. Every word was true!</p><p>&ldquo;Stop!&rdquo; I cried. &ldquo;How do you know all this?&rdquo; &ldquo;I know about the past, the present, and even the future,&rdquo; he whispered. &ldquo;Do you want to hear it?&rdquo;</p><p>I hesitated. Just then, Mr. Hassan returned. &ldquo;Your room is ready, sir. Were you talking to someone?&rdquo;</p><p>I looked around, but the old man had vanished. The owner smiled, &ldquo;Oh, that must be Mahmoud, the village mysterious man. He always thinks he can tell fortunes!&rdquo;</p></div>"}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. Where did the narrator first meet the old man?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Inside his hotel room</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">In the restaurant kitchen</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Outside the restaurant</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">In the village market</span>"], "c": 2, "e": "ذكر النص أن الرجل العجوز جلس بجواره على طاولة خشبية “outside” المطعم."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. What did the restaurant owner call the old man?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A fortune-teller</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The village mysterious man</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A holy man</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A tourist guide</span>"], "c": 1, "e": "هذا هو التعبير الحرفي الذي استخدمه صاحب المطعم لوصف الرجل العجوز."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. Which of the following can summarize the middle part of the story (the meeting with the old man)?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator met an old man who accurately told him about his past and claimed to know the future.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator stayed in a hotel where a kind owner prepared his room and made his dinner.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator spent the evening watching the sunset and smelling the wood smoke.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The narrator believed in fortune-telling and asked the old man to predict his future.</span>"], "c": 0, "e": "هذا هو جوهر الجزء الأوسط من القصة: لقاء العجوز الذي عرف تفاصيل ماضي الراوي بدقة وادّعى معرفة المستقبل."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. The event that changes the narrator&rsquo;s opinion about the old man is when…</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he offered to tell the future</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the restaurant owner returned</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he revealed the narrator&rsquo;s past</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the old man disappeared</span>"], "c": 2, "e": "تغيّرت نظرة الراوي (من عدم التصديق للدهشة) عندما كشف العجوز تفاصيل دقيقة عن ماضيه."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. When the old man described the narrator&rsquo;s childhood, he was………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">angry and disappointed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">excited but shocked</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">entertained but terrified</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doubtful and nervous</span>"], "c": 1, "e": "صُدم الراوي من دقة كلام العجوز فصرخ متسائلًا “كيف عرفت كل هذا؟”، وهذا يدل على الدهشة والصدمة."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. Throughout the story the narrator&rsquo;s feelings towards the old man changed from……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fear to anger</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disbelief to surprise</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">respect to hatred</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sadness to happiness</span>"], "c": 1, "e": "بدأ الراوي بعدم التصديق (“I don't believe in that kind of thing”) ثم انتقل للدهشة الشديدة."}, {"pg": "2", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. What is the most likely reason the old man disappeared before Mr. Hassan returned?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He didn&rsquo;t want Mr. Hassan to see him.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was a traveler who left to find food.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was only in the narrator&rsquo;s imagination.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He went to get the narrator&rsquo;s room ready.</span>"], "c": 2, "e": "اختفاء العجوز المفاجئ وتعليق صاحب المطعم المتشكك يوحيان بأنه كان من نسج خيال الراوي."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the text is that renewable energy …………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is too costly to be practical</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can replace fossil fuels in a sustainable way</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">harms the environment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is only used in Europe</span>"], "c": 1, "e": "هذه هي الفكرة الرئيسية التي يؤكدها النص بالكامل: أن الطاقة المتجددة حل مستدام بديل للوقود الأحفوري.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>In recent decades, the world has faced serious environmental challenges such as climate change, air pollution, and the depletion of natural resources. As a result, many countries have turned to renewable energy sources as a sustainable solution for the future. Renewable energy comes from natural sources that are continuously renewed, such as sunlight, wind, water, and geothermal heat. Unlike fossil fuels, these sources do not produce harmful greenhouse gases when used to generate electricity.</p><p>One of the most popular forms of renewable energy is solar power. Solar panels capture sunlight and convert it into electricity through a process known as the photovoltaic effect. The cost of solar technology has dropped significantly over the past decade, making it more accessible to homes and businesses. Another important source is wind energy, produced when turbines convert the movement of air into mechanical power. Wind farms, both on land and at sea, now supply a large portion of electricity in many European countries.</p><p>Hydropower, which uses flowing water to generate electricity, remains one of the oldest and most reliable energy sources. In addition, geothermal energy, which harnesses heat from beneath the Earth&rsquo;s surface, provides a steady source of power in countries such as Iceland and New Zealand.</p><p>However, renewable energy also faces challenges. Solar and wind power depend on weather conditions, while building large dams for hydropower can affect local ecosystems. To overcome these issues, scientists are working on advanced energy storage systems and more efficient technologies.</p><p>Despite these challenges, renewable energy offers a path to a cleaner, healthier planet. By investing in sustainable solutions today, we can protect our environment and ensure that future generations enjoy a safe and prosperous world.</p></div>"}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. Based on the ideas in paragraph 1, what does the writer indirectly encourage readers to do about resource depletion?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ignore it because it is a natural process.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Recognize how serious it is and take action to stop it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Assume that it will solve itself over time.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Think it only affects scientists and not ordinary people.</span>"], "c": 1, "e": "يشير الكاتب إلى خطورة استنزاف الموارد كدافع للتوجه نحو حلول الطاقة المتجددة، أي التوعية والعمل."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. Which form of energy produced from sunlight?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hydropower</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Wind energy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Solar power</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Geothermal energy</span>"], "c": 2, "e": "ذكر النص أن الألواح الشمسية (Solar power) تلتقط ضوء الشمس وتحوّله إلى كهرباء."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. According to the text, what is one problem with renewable energy?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It depends on weather conditions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It causes air pollution</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It cannot produce electricity</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is more harmful than fossil fuels</span>"], "c": 0, "e": "ذكر النص أن الطاقة الشمسية وطاقة الرياح تعتمدان على حالة الطقس."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. The tone of the passage is mostly ……………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">critical</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">humorous</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">emotional</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">informative</span>"], "c": 3, "e": "النص يقدّم معلومات علمية موضوعية دون انحياز أو فكاهة، فالنبرة معلوماتية (informative)."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Based on the passage, what can we infer about the future of renewable energy?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It will be replaced by fossil fuels</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It will likely continue to grow</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It will disappear soon</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is not supported by governments</span>"], "c": 1, "e": "يتوقع النص استمرار نمو الطاقة المتجددة رغم التحديات المذكورة، من خلال البحث والتطوير المستمر."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. According to the passage, which country is mentioned as using geothermal energy?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">France</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Iceland</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Egypt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Japan</span>"], "c": 1, "e": "ذُكرت أيسلندا (Iceland) ونيوزيلندا كمثالين على استخدام الطاقة الحرارية الأرضية."}, {"pg": "3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. Which statement summarizes paragraph 2 of the passage?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It explains how solar and wind energy convert natural resources into electricity and are becoming more common.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It argues that solar energy remains too costly for most people to install or maintain.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It describes how hydropower is the oldest and most reliable energy source still used in many countries today.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It focuses on the environmental problems caused by burning fossil fuel for electricity.</span>"], "c": 0, "e": "الفقرة الثانية تتحدث تحديدًا عن الطاقة الشمسية وطاقة الرياح وكيفية تحويلهما لكهرباء وانتشارهما المتزايد."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. &ldquo;While we watched TV, the phone rang.&rdquo; Which of the following corrects the mistake in this sentence?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">While &rarr; after</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rang &rarr; was ringing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">While &rarr; before</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">watched &rarr; were watching</span>"], "c": 3, "e": "بعد While نحتاج فعلًا مستمرًا (خلفية) قاطعه فعل قصير (rang)، فتصبح: While we were watching TV."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Which sentence is correctly punctuated?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Many students who studied hard passed the exam.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Many students who studied hard, passed the exam.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Many students, who studied hard, passed the exam.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Many students; who studied hard; passed the exam.</span>"], "c": 0, "e": "جملة الوصل هنا تعريفية/ضرورية (تحدد أي طلاب بالتحديد)، فلا توضع فواصل حولها."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Which of the following sentences contains a relative clause?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I don&rsquo;t know where she lives.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He runs faster than me.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The book that you gave me is interesting.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She went home when she was tired.</span>"], "c": 2, "e": "“that you gave me” جملة وصل تصف الاسم “the book”، وهي الوحيدة التي تحتوي ضمير وصل."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. Choose the correct reported form for the following sentence:<br>She said, &ldquo;Had I known he was coming, I would have prepared something special.&rdquo;</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said if she had known he was coming, she would prepare something special.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said that if she had known he was coming, she would have prepared something special.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said that had she known he was coming, she prepared something special.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She said she had known he was coming, and she would have prepared something.</span>"], "c": 1, "e": "الجملة الشرطية النوع الثالث لا تتغير أزمنتها عند تحويلها لكلام منقول، فقط تتغير الضمائر."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. Which sentence shows an action interrupted by another action?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I finished my work early but I didn&rsquo;t go out.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He washed the car and set off.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I was cooking when the lights went out.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I was revising the reports as Ali was trying to fix the machine.</span>"], "c": 2, "e": "Past Continuous + when + Past Simple هو الصيغة القياسية لحدث طويل قاطعه حدث قصير مفاجئ."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Running through the park, the rain started to fall.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Running through the park, I saw the rain starting to fall.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The rain started to fall, running through the park.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Running through the park, raining was started.</span>"], "c": 1, "e": "فاعل جملة الـ Participle (Running) يجب أن يطابق فاعل الجملة الرئيسية؛ هنا الفاعل “I” هو من كان يجري."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. She doesn&rsquo;t usually drink coffee, but she does enjoy a cup in the morning sometimes.<br>What is the function of the underlined word &ldquo;does&rdquo;?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Auxiliary for forming questions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Modal of ability</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Contrastive conjunction</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emphatic</span>"], "c": 3, "e": "does قبل الفعل الأصلي في جملة خبرية (وليس سؤالًا) تُستخدم للتوكيد (Emphatic do)."}, {"pg": "4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. The manager had the report checked before sending it to the director.<br>What does this sentence mean?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The manager checked the report personally.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Someone else checked the report for the manager.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The manager forgot to check the report.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The report was not checked at all.</span>"], "c": 1, "e": "تركيب السببية “have something done” يعني أن شخصًا آخر قام بالفعل نيابة عن الفاعل."}, {"pg": "5", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Although artificial intelligence can write, paint, and compose music, many people believe it can never replace human creativity. Will the future prove them right or wrong?</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">على الرغم من أن الذكاء الاصطناعي يمكنه أن يكتب ويرسم ويؤلف الموسيقى، إلا أن كثيرًا من الناس يعتقدون أنه لن يستطيع أبدًا أن يحل محل الإبداع البشري. فهل سيثبت المستقبل أنهم على حق أم على خطأ؟</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">رغم أن الذكاء الاصطناعي يستطيع الكتابة أو الرسم أو تلحين الموسيقى، إلا أن بعض الناس يظنون أنه أفضل من الإبداع البشري. فهل سيثبت المستقبل أنهم محقون؟</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">بالرغم من قدرة الذكاء الاصطناعي على الكتابة والرسم وتلحين الموسيقى، يرى البعض أنه يمكن أن يحل محل بعض أشكال الذكاء البشري في المستقبل.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">رغم أن الذكاء الاصطناعي يمكنه الكتابة والرسم والتأليف الموسيقي، يرى بعض الناس أنه من الخطأ أنه سيحل محل الإبداع البشري في المستقبل.</span>"], "c": 0, "e": "الخيار (a) هو الترجمة الدقيقة الوحيدة؛ باقي الخيارات تعكس المعنى الأصلي (تجعل الذكاء الاصطناعي “يحل محل” الإبداع، بينما النص يقول العكس)."}, {"pg": "5", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Online learning provides students with great flexibility, but it also requires strong self-discipline and time management skills. Can technology ever replace real classrooms?</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يوفر التعلم عبر الإنترنت للطلاب مرونة كبيرة، لكنه يتطلب أيضًا انضباطًا ذاتيًا قويًا ومهارات في إدارة الوقت. فهل يمكن للتكنولوجيا أن تحل محل الفصول الدراسية الحقيقية؟</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">التعلم عبر الإنترنت لا يمنح الطلاب أي حرية، بل يجعلهم أقل انضباطًا وأكثر فوضى في استخدام وقتهم.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الدراسة عبر الإنترنت سهلة جدًا، ولا تحتاج إلى أي جهد أو تنظيم من جانب الطلاب.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يوفر التعليم عبر الإنترنت مرونة تامة للطلاب، ولا يحتاجون بعد الآن إلى حضور أي فصول دراسية في حياتهم.</span>"], "c": 0, "e": "الخيار (a) وحده يترجم المعنى بدقة، بما في ذلك ضرورة الانضباط الذاتي؛ الخيارات الأخرى تعكس المعنى أو تبالغ فيه."}, {"pg": "5", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>على الرغم من التقدم العلمي الهائل، إلا أن الكون لا يزال يحتفظ بالكثير من الأسرار التي يعجز العلماء عن تفسيرها مثل مثلث برمودا والثقوب السوداء. فهل سيأتي اليوم الذي نكتشف فيه أن هناك أماكن أخرى يوجد فيها حياة مثل التي نعيش فيها؟</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Despite the tremendous scientific progress, the universe still holds many secrets that scientists cannot explain, such as the Bermuda Triangle and black holes. Will the day come when we discover that there are other places where life exists, similar to the one we live in?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Although the huge scientific progress, the universe still holds many secrets that scientists cannot explain, such as the Bermuda Triangle and black holes. Will the day come when we discover that there is other places where life exists, similar to the one we live in?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Although the tremendous science progress, the universe still hold many secrets that scientists cannot explain, such as the Bermuda Triangle and black holes. Will the day come when we discover that there are other places where life exists, similar to the one we live in?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Despite the huge science progress, the universe still hold many secrets that scientists cannot explain, such as the Bermuda Triangle and black holes. Will the day come when we discover that there are other places where life exists, similar to the one we live in?</span>"], "c": 0, "e": "الخيار (a) هو الوحيد السليم قواعديًا (Despite + اسم) والدقيق في المعنى؛ باقي الخيارات بها أخطاء نحوية مثل “Although + اسم” أو عدم تطابق الفعل مع الفاعل."}, {"pg": "5", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>على الرغم من أن التكنولوجيا جعلت حياتنا أسهل وأسرع، إلا أن الناس في العصر الحديث يشعرون أن وقتهم أصبح أقل من أي وقت مضى. فهل السبب هو كثرة المهام أم أننا لا نحسن تنظيم وقتنا؟</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Although technology has made our lives easier and faster, people in the modern age feel that they have less time than ever before. Is the reason too many tasks, or is it our poor time management?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Despite that technology made our life more easy and quick, people in modern times feel their time became less than before. Is the reason many works or our bad organizing of time?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Although the technology has made our lives easy and fast, but people nowadays feel that their time is shorter than any time before. Is it because of too many jobs or because we don&rsquo;t manage our time well?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Despite the fast technology, people in this age feel they don&rsquo;t have enough time. Is the reason having a lot of things to do or they can&rsquo;t organize their time?</span>"], "c": 0, "e": "الخيار (a) هو الأدق نحويًا ومعنى؛ الخيار (c) يجمع خطأً بين Although و but في نفس الجملة، وباقي الخيارات ركيكة أو تحذف جزءًا من المعنى."}, {"pg": "6", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. Compare Edmond&rsquo;s hope with Fernand&rsquo;s jealousy. How do these two emotions lead to conflict? Give two points.</span>", "model": "Edmond's hope kept him believing in a bright future with Mercédès and his promotion, making him trusting and open-hearted. Fernand's jealousy, on the other hand, filled him with bitterness because he wanted Mercédès for himself. First, Fernand's jealousy pushed him to conspire with Danglars to falsely accuse Edmond of treason, destroying Edmond's hopeful future. Second, while Edmond's hope helped him endure years of imprisonment and plan his revenge, Fernand's jealousy eventually consumed him and led to his own downfall when the truth was revealed.", "marks": 2}, {"pg": "6", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. How do you think the promise of great wealth can motivate someone to survive hardships? Give two reasons.</span>", "model": "The promise of great wealth can give a person a powerful reason to endure suffering. First, it provides a clear goal that keeps hope alive, helping someone survive difficult conditions such as imprisonment, as it did for Edmond Dantès, who used the thought of the hidden treasure to endure years in prison. Second, wealth can offer the means to achieve justice or take revenge on those who wronged them, giving extra determination to survive no matter how hard the circumstances become.", "marks": 2}, {"pg": "6", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a six-line body paragraph about the factors that motivate you to overcome challenges in your life.</span>", "model": "Several factors motivate me to overcome the challenges I face in life. Firstly, my strong desire to achieve my future goals, such as attending university and having a successful career, pushes me to keep working hard. Secondly, the constant support and encouragement from my family give me the confidence to continue even when things get difficult. In addition, remembering people who overcame far greater obstacles inspires me to never give up. Moreover, my belief that every challenge teaches a valuable lesson helps me see difficulties as opportunities rather than obstacles. Finally, setting small, achievable goals along the way keeps me motivated and makes the bigger challenge feel manageable.", "marks": 5}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. The people are confident that the government will meet the………… posed by the rising Nile water level.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">challengeable</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">challenging</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">challenged</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">challenges</span>"], "c": 3, "e": "الفراغ يحتاج اسمًا (مفعول به لفعل meet) تصفه جملة “posed by”، لذا نستخدم الاسم: challenges."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. The astronauts managed to troubleshoot the shuttle&rsquo;s sudden pause. To troubleshoot means to………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hinder</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">diagnose</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">maximize</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">transfer</span>"], "c": 1, "e": "troubleshoot تعني “يشخّص ويحل المشكلة”، وأقرب الكلمات معنى هي diagnose."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. In the recent decades, severe climate changes have had ……………. effects on coastal areas.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">trivial</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">superficial</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">tolerable</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">profound</span>"], "c": 3, "e": "profound تعني “عميقة/بالغة الأثر”، وهي المناسبة مع “severe climate changes”."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. Our team put forward a perfect scheme that would guarantee fast and accurate………………. of the project.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">implementation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">explanation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">determination</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">collaboration</span>"], "c": 0, "e": "implementation تعني “تنفيذ”، وهي المناسبة لسياق تنفيذ خطة المشروع بسرعة ودقة."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. His speech had clear implications that the team would have a new coach next season. The word &ldquo;implications&rdquo; here means………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sources</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">effects</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hints</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">customs</span>"], "c": 2, "e": "implications هنا تعني “تلميحات/دلالات غير مباشرة”، أي hints."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. I&rsquo;ve got myself……………… in problems I&rsquo;ve nothing to do with.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dedicated</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">steamed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">entangled</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rescued</span>"], "c": 2, "e": "entangled تعني “متورط/متشابك في”، وهي المناسبة مع “in problems”."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. The teacher pretended not to have noticed his mistake to give him a chance for improvement. She had to…………………….to it.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wipe with relief</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">come to a standstill</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bear the brunt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">turn a blind eye</span>"], "c": 3, "e": "“turn a blind eye to” تعبير اصطلاحي يعني “يتجاهل عمدًا/يتغاضى عن”، وهو المطلوب هنا."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. A smart entrepreneur should…………………in innovations rather than in capital.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">invest</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">thrive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">detect</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">perform</span>"], "c": 0, "e": "invest in تعني “يستثمر في”، وهي التركيب الصحيح مع “innovations” و“capital”."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. The students………. well for this event so it is getting everyone&rsquo;s admiration.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has prepared</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had been preparing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have been preparing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have prepared</span>"], "c": 2, "e": "النتيجة مستمرة وواضحة الآن (is getting)، مع جهد مستمر حتى الآن = Present Perfect Continuous: have been preparing."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. Amal&rsquo;s boss ordered that his instructions…………….be carried out literally the following day.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">might</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had to</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">need</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has to</span>"], "c": 1, "e": "must/have to تتحول إلى had to في الكلام المنقول (Reported Speech)."}, {"pg": "11", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. Part of the secretary&rsquo;s daily tasks is to get all reports……………before the manager&rsquo;s arrival.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">typing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">type</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">typed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to type</span>"], "c": 2, "e": "get something done: التقارير تتلقى الفعل (مبني للمجهول) = typed."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The suitable title of this passage is &ldquo;………………………….&rdquo;</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Unavoidable Road Accidents</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A life lost, a lesson learned</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Tolerable Road Casualties</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No Pain, No Gain</span>"], "c": 1, "e": "يجمع هذا العنوان بين وقوع الحادث المأساوي (فقدان حياة) والعبرة/الدرس المستفاد منه (اتباع قواعد السلامة).", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Every year, thousands of accidents occur simply because drivers lose focus for a few seconds. One morning last year a man was driving through the center of the town, distracted by the shops. Suddenly a pedestrian stepped off the pavement and was struck by the car. The impact threw the person onto the bonnet before falling onto the road, where a faint trace of blood marked the dust &mdash; a heart-breaking and distressing reminder of the accident.</p><p>A few minutes later, the police arrived and made a report. &lsquo;One person killed, one car damaged in road accident.&rsquo; However, who was the victim? A mother out shopping, a father returning from work, or a student on her way to university? This was one of many tragedies that could have been avoided if people had followed three simple rules: first, concentrate; second, think ahead; and third, use clear signals to communicate their intentions to others.</p><p>A driver loses control whenever attention drifts &mdash; whether to the scenery, to conversation, or to thoughts unrelated to driving. To avoid accidents, drivers should anticipate potential dangers &mdash; not only reacting to what is happening but also predicting what might occur next.</p><p>Finally, drivers must clearly warn other road users of their presence and intentions. If they turn, change lanes, or overtake without signaling or giving proper warning, they may at best alarm others or at worst cause a fatal accident. Responsible driving depends on three essential habits: concentration, foresight, and communication. Following these simple principles can prevent countless tragedies.</p></div>"}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. Last year&rsquo;s accident happened when…………………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">somebody hit into the car with his bike</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the driver was talking to someone in the street</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a pedestrian stepped into the road suddenly</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the driver was looking back to someone in the car</span>"], "c": 2, "e": "ذكر النص أن أحد المارة نزل من الرصيف فجأة (stepped off the pavement) واصطدمت به السيارة."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the last paragraph is &ldquo;………….&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Drivers should always use the phone when driving to avoid accidents</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Pedestrians need to stay alert so drivers do not hit them</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Drivers should use signals and warnings to let others know what they plan to do; otherwise, they may cause casualties</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Drivers only need to signal when motorists are driving near them</span>"], "c": 2, "e": "الفقرة الأخيرة تتحدث عن ضرورة استخدام السائقين للإشارات لتحذير الآخرين، وإلا فقد يتسببون في حوادث."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. The driver&rsquo;s distraction with the shops tragically resulted in …………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a damaged car but no one was seriously injured</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">one casualty and a ruined vehicle</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">two victims and a destroyed car</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an injured driver and a pedestrian lost his life</span>"], "c": 1, "e": "أشار تقرير الشرطة إلى مقتل شخص واحد (المشاة) وتضرر سيارة واحدة: one casualty and a ruined vehicle."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. According to the passage, many accidents could have been prevented if.......</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">drivers had followed the three basic safety rules</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">pedestrians had stopped when the lights are red</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">cars had been checked carefully before each trip</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">drivers had lost control when their focus shifted away from driving</span>"], "c": 0, "e": "ذكر النص القواعد الثلاث: التركيز، والتفكير المسبق، واستخدام الإشارات الواضحة."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. We can infer from the text that the more distractions the driver finds…….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the less the road casualties</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the better the road safety</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the more attentive and patient he will be</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the less control he will have over the car</span>"], "c": 3, "e": "كلما زادت مشتتات الانتباه، قلّت سيطرة السائق على السيارة، وفقًا لمنطق النص."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. The driver and the pedestrians were similar in that they both…………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">concentrated well on the road</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">acted quickly at the right time</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were not paying enough attention to the road</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">followed all the rules of road safety</span>"], "c": 2, "e": "كلاهما (السائق المشتت والمشاة الذي نزل فجأة) لم يكونا منتبهين بما يكفي للطريق."}, {"pg": "2-3", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. The scene of &lsquo;a faint trace of blood marked the dust&rsquo; can be described as……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hopeless</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">painful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">vague</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">comforting</span>"], "c": 1, "e": "هذا الوصف مؤلم ومؤثر (painful)؛ فهو يذكّرنا بمأساة فقدان حياة إنسان."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of this passage is that …………………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">embarrassing situations can sometimes spoil people&rsquo;s enjoyment.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hani and his family were out watching a famous play which they intended to act.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">experiencing a different theatre show makes one feel as being part of the incidents.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hani is inspired with the play and decides he wants to become an actor.</span>"], "c": 2, "e": "شعر هاني أنه جزء من أحداث المسرحية لدرجة أنه ظن أحد الممثلين شخصًا حقيقيًا متأخرًا، وهذا جوهر الفكرة الرئيسية.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>&lsquo;Macbeth, Act 1, Scene 1 &ndash; An Open Place. &ldquo;Thunder and Lightning.&rdquo; I knew that the first scene of &lsquo;Macbeth&rsquo; happened during a thunderstorm so I was not surprised when bright lights and loud noises filled the theatre. The next scene was quieter. Old king Duncan came on and he heard from a soldier how bravely Macbeth had been fighting against enemies of the king. Duncan did not know yet that Macbeth was going to kill him and I was not going to tell him because then they would have to change the play.</p><p>While I was thinking about this, I noticed a man in strange clothes standing in the aisle next to me. I assumed he had come late and was waiting to get to his seat. &lsquo;Excuse me,&rsquo; I whispered. &ldquo;Do you want to get past? Is your seat in this row?&rdquo; The strangely dressed man did not answer. I stood up and said &lsquo;Excuse me!&rsquo; A little louder. &lsquo;Sit down!&rsquo; said the person sitting behind me. &ldquo;God save the king.&rdquo; The man in the aisle shouted suddenly and ran towards the stage. That was embarrassing, as I suddenly understood why he had not said anything. He was in the play! Oh, dear I wanted to hide under my seat.</p><p>At the end of the third act there were lots of battles and fights, then there was an interval. &lsquo;Very good&rsquo;, said Dad. &lsquo;Very interesting.&rsquo; &lsquo;Isn&rsquo;t it exciting?&rsquo; said Mum. Dina was too busy with an ice-cream. After the interval people came into the play from every part of the theatre. In one battle scene soldiers were running all over the place fighting all the time. It was fantastic. &lsquo;Wasn&rsquo;t it great?&rsquo; said Dina in the taxi on the way home. &lsquo;Hani, why don&rsquo;t you become an actor? You&rsquo;d be good.&rsquo; We all laughed. &lsquo;No, Dina, I wouldn&rsquo;t like acting,&rsquo; I answered.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. The idea of Hani becoming an actor …………………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">appealed to everyone in the family</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reminded Hani of his inspiring dream</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">aroused everyone&rsquo;s joy and laughter</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">encouraged Hani to join acting at school</span>"], "c": 2, "e": "النص يذكر “We all laughed” ردًا على اقتراح دينا، فالفكرة أثارت الضحك وليست الحماس الجاد."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. The sentence that summarizes the second paragraph is………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hani knew the plot of the play and didn&rsquo;t try to spoil it, though he faced an embarrassing situation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Macbeth is a play which attracts everyone to share the actors the play</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hani finds himself in trouble while trying to guide an audience to his seat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Macbeth is in thunderstorm trying to kill Duncan to become king</span>"], "c": 0, "e": "الفقرة الثانية تحكي كيف اعتقد هاني أن الممثل متفرج متأخر فحاول مساعدته، فوقع في موقف محرج دون أن يفسد العرض."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. The man in the aisle was actually…………………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a real soldier in Macbeth&rsquo;s army</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">acting a role in the play</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an audience searching for his seat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">playing the role of Macbeth</span>"], "c": 1, "e": "تبين أن الرجل كان ممثلاً يؤدي دوره في المسرحية، وليس متفرجًا كما ظن هاني."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. If Hani had revealed the secret of Macbeth………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he would have saved Duncan</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the play would have been ruined</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he would have helped Macbeth</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the audience would have been happy</span>"], "c": 1, "e": "لو كشف هاني ما يعرفه عن الأحداث القادمة، لكان أفسد مفاجأة العرض المسرحي على الجمهور."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Next time Hani goes to the theatre he will probably ……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">avoid sitting next to an aisle seat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">take an action to help the audience</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">uncover unknown incidents in the play</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stop interference while watching</span>"], "c": 3, "e": "بعد الموقف المحرج، الدرس المستفاد أن هاني على الأرجح سيمتنع عن التدخل فيما لا يعنيه أثناء المشاهدة مستقبلاً (كما أكدته نسخة الإجابة النموذجية من الوزارة)."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. Despite being interrupted by Hani, the man in the aisle.………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">went on performing for the audience</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decided to abandon his seat for Hani</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stopped acting and left the stage</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sat down quietly in his aisle seat</span>"], "c": 0, "e": "استمر الرجل في أداء دوره وركض نحو خشبة المسرح رغم مقاطعة هاني له."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. We can learn from the story that……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">acting is a rewarding career we all must do</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">embarrassing situations teach us something</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">we need to learn acting to avoid embarrassment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">family gatherings can cause us trouble</span>"], "c": 1, "e": "الدرس المستفاد أن المواقف المحرجة قد تعلّمنا شيئًا (مثل الانتباه لما حولنا قبل التصرف)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. Mum wanted to know……… to make the school request her presence.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">what I had done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">if I had done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">what have I done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">whether I have done</span>"], "c": 0, "e": "سؤال بأداة استفهام (what) في كلام منقول، والفعل يتحول لـ Past Perfect (سبق طلب المدرسة): what I had done."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Do you know how to sign up for an e-mail account or shall I…………?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have you to make one</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">get someone to make it</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have it to be made</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">get it made for you</span>"], "c": 3, "e": "get something done (تركيب سببية مبني للمجهول): get it made for you."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Which of the following is structurally correct?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ali my best friend is thirty year old.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ali, my best friend, is a thirty years old.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ali, my best friend, is thirty years old.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ali my best friend is a thirty year old.</span>"], "c": 2, "e": "“my best friend” جملة اعتراضية توضع بين فاصلتين، وthirty years old لا تسبقها أداة نكرة وتكون بصيغة الجمع."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. The amazingly shaped statue of the king…………… everyone of the visitors</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">admired</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was admired by</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had admired</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">admires</span>"], "c": 1, "e": "التمثال لا “يُعجب” بالمعنى الفاعلي، بل هو مصدر إعجاب الزوار به = مبني للمجهول: was admired by."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. When writing a formal email, you shouldn&rsquo;t………………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">state the topic of the email directly in your subject</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">give casual greetings</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">introduce yourself or explain your relationship or significance to the recipient</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">proofread before sending your email</span>"], "c": 1, "e": "الرسائل الرسمية تتطلب تحية رسمية، فاستخدام تحيات عامية (casual greetings) غير مناسب."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. ………… use this slow and old model laptop? There are other upgraded ones available.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Do you have to</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Must you</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Should you</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Could you</span>"], "c": 0, "e": "تُستخدم have to في الأسئلة التي تحمل معنى الانتقاد أو الاستياء من أمر ما (مثل استخدام جهاز قديم رغم توفر البديل)، وهذا ما أكدته نسخة الإجابة النموذجية من الوزارة."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. A strict policeman doesn&rsquo;t allow………………... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the law be violated</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">anyone violate the law</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the law being violate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">anyone to violate the law</span>"], "c": 3, "e": "allow + مفعول + to + مصدر: anyone to violate the law."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. No survivors have been recorded in the avalanche catastrophe. All the climbers…………….. buried under thick layers of ice.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can&rsquo;t have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can&rsquo;t have</span>"], "c": 2, "e": "استنتاج شبه مؤكد عن حدث ماضٍ بناءً على دليل قوي (عدم وجود ناجين) + مبني للمجهول = must have been."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Man has always explored the world in a try to understand and discover the secrets of the cosmos. He could never resist the desire to find out what&rsquo;s beyond our planet in space.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">لقد كان الإنسان دائمًا يستكشف العالم في محاولة أن يفهم ويكتشف أسرار الطبيعة. ولم يفكر يومًا في رغبته في اكتشاف ما وراء كوكبنا في الفضاء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">لقد كان الإنسان دائمًا يستكشف العالم في محاولة أن يفهم ويكتشف أسرار الكون. ولم يستطع يومًا مقاومة رغبته في اكتشاف ما وراء كوكبنا في الفضاء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">لقد كان الإنسان دائمًا يستكشف العالم في محاولة أن يفتش ويكتشف أسرار الكون. ولم يتخلَّ يومًا عن سعيه في اكتشاف ما وراء كوكبنا في الفضاء.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">لقد كان الإنسان دائمًا يستكشف العالم في محاولة أن يفهم ويكتشف أسرار الوجود. ولم يتخلَّ يومًا عن مقاومة رغبته في اكتشاف ما وراء كوكبنا في الفضاء.</span>"], "c": 1, "e": "الخيار (b) وحده يترجم “cosmos” بدقة (الكون) و“could never resist” بمعناها الصحيح (لم يستطع مقاومة)؛ باقي الخيارات تستخدم كلمات غير دقيقة (الطبيعة/الوجود) أو تعكس المعنى."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Land transport can be said to have begun with the invention of the wheel in Mesopotamia over 5,000 years ago. Before that, if one wanted to travel, one walked or rode on the back of an animal.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقال إن النقل البري بدأ مع اختراع العجلة في بلاد الرافدين منذ خمسة آلاف سنة. وقبل هذا إذا أراد أي شخص السفر فكان يسير على قدميه أو يمتطي ظهر حيوان.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يعتقد أن السباق الأرضي بدأ مع اختراع الدراجة في بلاد الرافدين منذ خمسة آلاف سنة. وقبل هذا إذا أراد أي شخص السفر فإنه كان يسير على قدميه أو يمتطي ظهر حيوان.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقال إن النقل البري بدأ مع اكتشاف العجلة في بلاد الرافدين منذ خمسة آلاف سنة. وبعد هذا إذا أراد أي شخص السفر فإنه كان يمشي أو يمتطي ظهر حيوان.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يعتقد أن النقل الأرضي بدأ مع اختراع العجلة في بلاد الرافدين منذ خمسة آلاف سنة. وفوق هذا إذا أراد أي شخص السفر فإنه كان يمشي أو يمتطي ظهر حيوان.</span>"], "c": 0, "e": "الخيار (a) هو الترجمة الدقيقة الوحيدة: “land transport” = النقل البري، “invention” = اختراع (وليس اكتشاف)، و“before that” = قبل هذا (وليس بعد/فوق)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>المستشفى مؤسسة شديدة التعقيد ومصممة للتعامل مع العديد من المشاكل. ويمكن أن نرى هذا بالنظر عن قرب فيما يحدث مع مختلف أنواع المرضى الذين يتلقون فيها العلاج.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The hospital is a very complex formation and is designed to deal with a variety of problems. We can see this by locking closely at what happens to the different types of patients who are treated in it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The hospital is a very complex organization and is designed to deal from a variety of problems. We can see this by looking closely at what happens to the different types of patience who are treated in it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The hospital is a very complex organization and is signed to deal with a variety of problems. We can see this by looking nearly at what happens to the different types of patients who are treated in it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The hospital is a very complex foundation and is designed to deal with variety of problems. We can see this by looking closely at what happens to the different types of patients who are treated in it.</span>"], "c": 3, "e": "الخيار (d) هو الأقرب صوابًا: “foundation” ترجمة مقبولة لـ“مؤسسة”، بينما باقي الخيارات بها أخطاء واضحة في المفردات (formation/locking، deal from/patience، signed/nearly)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>الناس لديها أسباب مختلفة للالتحاق بالجامعة. فالبعض ببساطة يريد أن يتعلم أن يكون مستقلاً، والبعض ينظر إليها على أنها تجربة مختلفة، ولكن الغالبية مع ذلك يذهبون للجامعة للشغف الحقيقي والاهتمام بالعلم الذي يدرسونه.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People have different reasons for joining university. Some simply want to learn to be independent; others regard it as a different experience. The majority, however, go to university for the real passion and interest in the science they are studying.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People have different factors for going to university. Some simply want to learn to be independent, others regard it as a different opportunity. Most people, however, go to university for a real passion and interest in the science they are studying.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People have different reasons for going to university. Some simply want to learn to be dependent, others see it as a different experience. Many people, despite, go to university for a real passion and interest in the science they are studying.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People have different reasons for going to university. Some simply want to learn to be independent, others regard it as a different experiment. Most people, however, go to university for a rail passion and interest in the science they are studying.</span>"], "c": 0, "e": "الخيار (a) هو الترجمة السليمة تمامًا دون أخطاء؛ باقي الخيارات بها كلمات خاطئة (factors/opportunity، dependent وهو عكس المعنى، experiment، rail بدلًا من real)."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. How far do you think Edmund&rsquo;s revenge of his enemies compensated for his loss?</span>", "model": "Edmond's revenge brought him a strong sense of satisfaction and justice, as he successfully exposed and punished Fernand, Danglars, and Villefort for betraying him and destroying his life. However, this revenge could never fully compensate for what he had lost: fourteen years of his youth spent in prison, his beloved Mercédès, who married Fernand, and the chance to build a normal life and family. In my opinion, although the revenge gave Edmond a sense of closure and restored his honour, it could not truly heal his emotional wounds or return the years he had lost, showing that revenge, however satisfying, has its limits.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. Who do you think deserved Edmund&rsquo;s greatest punishment? Why?</span>", "model": "In my opinion, Fernand deserved Edmond's greatest punishment because his betrayal was the most personal and cruel. He was Edmond's rival in love, and out of pure jealousy he conspired to have Edmond falsely accused and imprisoned, then married Mercédès himself, taking everything Edmond held dear. Unlike Danglars and Villefort, whose motives were mainly greed or self-protection, Fernand's actions were driven by a deep personal betrayal of a friend, which makes his crime the most unforgivable.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a body paragraph of not less than six (6) lines on the following topic:<br>&ldquo;Schools can be attractive in four ways&rdquo;</span>", "model": "Schools can be made attractive to students in several ways. Firstly, having modern, well-equipped classrooms with interactive whiteboards and comfortable seating makes learning more enjoyable. Secondly, offering a variety of extracurricular activities, such as sports, art, and music clubs, helps students discover their talents and interests beyond academics. Thirdly, friendly and supportive teachers who encourage students and make lessons interesting play a huge role in creating a positive atmosphere. Finally, green spaces and gardens within the school give students a pleasant environment to relax during breaks. When these four elements come together, students feel motivated and excited to attend school every day.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. …….... refers to something that exists and can be experienced through the senses, especially when it is unusual, interesting, or not easily explained.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Coordination</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Migration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Phenomenon</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Entertainment</span>"], "c": 2, "e": "Phenomenon تعني “ظاهرة”: أمر موجود يمكن إدراكه بالحواس، خصوصًا إن كان غريبًا أو يصعب تفسيره."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. Now that English has taken over as the main language, the country&rsquo;s native language has been marginalized. The antonym of the underlined word &ldquo;marginalized&rdquo; is…………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disregarded</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">focused</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">demoted</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">automated</span>"], "c": 1, "e": "marginalized تعني “مُهمَّشة”، وعكسها focused (تعني “مُركَّز عليها/مهتم بها”)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. Violent thunderstorms and rain caused chaos on the region&rsquo;s roads and railways last night. The synonym of the underlined word &ldquo;chaos&rdquo; is…….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">settlement</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">clumsiness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dedication</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disruption</span>"], "c": 3, "e": "chaos تعني “فوضى/اضطراب”، ومرادفها هنا disruption (تعطل/اضطراب في النظام)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. It&rsquo;s a good idea to …… the flight departure time before you leave for the airport.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">maintain</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">check</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">socialize</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">strengthen</span>"], "c": 1, "e": "check تعني “يتأكد من/يراجع”، وهي المناسبة مع التحقق من موعد رحلة الطيران."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. She left the job because the work was too ………; she used to do the same tasks every day.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">repetitive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">haunting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">heartbreaking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sophisticated</span>"], "c": 0, "e": "repetitive تعني “متكرر/رتيب”، وهذا واضح من تكرار نفس المهام كل يوم."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. The visitors were surrounded on all sides by ………children.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">amphibious</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">scorching</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">artificial</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">curious</span>"], "c": 3, "e": "curious تعني “فضوليين”، وهي الوحيدة المنطقية لوصف الأطفال المحيطين بالزوار."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. After skipping work for days, Hatem had to …… when his boss found out.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">think outside the box</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">turn a blind eye</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">face the music</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">climb the career ladder</span>"], "c": 2, "e": "“face the music” تعبير اصطلاحي يعني “يواجه عواقب تصرفاته”، وهذا يناسب موقف حاتم مع مديره."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. The restaurant is less crowded on a …………than on a weekend.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">holiday</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">festival</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">celebration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">weeknight</span>"], "c": 3, "e": "weeknight (ليلة من ليالي أيام الأسبوع العادية) هي المقابل المنطقي لـ“weekend” في المقارنة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. We ………….. for the bus for over an hour, and it still hasn&rsquo;t arrived.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wait</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have waited</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have been waiting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are waiting</span>"], "c": 2, "e": "فعل مستمر منذ الماضي حتى الآن مع مدة (for over an hour) = Present Perfect Continuous: have been waiting."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. The project was so complex that the engineers decided to test the new system by …………. before allowing anyone else to use it.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">themselves</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">oneself</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">himself</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">itself</span>"], "c": 0, "e": "الضمير المنعكس يطابق الفاعل الجمع (the engineers): themselves."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. You should back up your files regularly ...… you don&rsquo;t lose important data.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">unless</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">although</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">so that</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">because</span>"], "c": 2, "e": "so that (لكي) تربط فعلًا (النسخ الاحتياطي) بغرضه (عدم فقدان البيانات)."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The suitable title for the passage is &ldquo;…………………...&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Balancing Progress with Preservation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Tourism and Global Heritage</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Rise of Modern Architecture</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Ancient Civilizations and Their Defeat</span>"], "c": 0, "e": "النص يتحدث عن كيفية موازنة الدول بين الحفاظ على التراث والتطوير الحديث، وهذا هو جوهر العنوان المناسب.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Heritage preservation is a critical aspect of preserving cultural and historical landmarks for future generations. The relationship between existing heritage and newly-built constructions is a complex one, as seen in the case of the Fortress Medicea in Siena, Italy. Built in 1561, the fortress symbolizes a historical defeat and holds significant meaning for local residents. Modern approaches to heritage preservation involve balancing the old with the new, ensuring that the identity of such landmarks is maintained while adapting them for contemporary use.</p><p>In Canada, the protection of heritage sites on Indian reserve lands has been a controversial issue. The summer of 1990 witnessed significant activism from Indian communities, particularly the Peigan, who protested against the construction of a dam that would flood sacred archaeological sites. The absence of federal legislation for heritage protection on Indian lands has created a legal vacuum, making it challenging to safeguard these sites under existing laws like the Indian Act.</p><p>In China, the conservation of urban cultural heritage is influenced by post-modernism, which emphasizes the cultural, historical, and social values of historical legacies. The challenge lies in finding methods that preserve these values while avoiding the dangers of commercial exploitation and negativism.</p><p>In Egypt, the preservation of ancient heritage reached a remarkable level during the construction of the Aswan High Dam in 1954. This meant that the Nile Valley would be flooded and that Abu Simbel would be submerged under water, so plans were made to rescue it. The massive statues were cut into pieces and raised over 60 metres up the cliff, where they were attached to a concrete base. Today, the temples, which were re-opened in 1968, are an amazing combination of ancient and modern engineering.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. The absence of ………. has created a legal vacuum for protecting heritage on Indian lands.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the Indian Act</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">federal legislation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">community protests</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">cultural organizations</span>"], "c": 1, "e": "ذكر النص حرفيًا: “The absence of federal legislation... has created a legal vacuum”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the second paragraph is &lsquo;…….&rsquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Canada&rsquo;s government successfully protected all heritage sites through strict national regulations</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Indigenous communities protested to protect sacred lands threatened by dam construction and lack of legal protection</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Peigan built a dam to safeguard archaeological discoveries</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Federal laws under the Indian Act fully safeguarded Indian lands</span>"], "c": 1, "e": "الفقرة الثانية تتحدث عن احتجاجات السكان الأصليين (الپيگان) ضد بناء سد يهدد مواقع أثرية مقدسة، في ظل غياب حماية قانونية."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. In Canada, the main issue with heritage protection is ………….... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">weak community involvement</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">destruction of urban centers</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">over-commercialization of landmarks</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sacred sites being threatened by development</span>"], "c": 3, "e": "احتج الپيگان ضد بناء سد كان سيغرق مواقع أثرية مقدسة، وهذا هو جوهر المشكلة في كندا."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. If federal legislation were introduced in Canada, it would most likely .....</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">increase the destruction of sacred lands</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">make heritage preservation clearer and stronger</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">remove community activism</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">limit archaeological research</span>"], "c": 1, "e": "لو وُجد تشريع فيدرالي، لأصبحت عملية حماية التراث أوضح وأقوى قانونيًا (عكس الفراغ
