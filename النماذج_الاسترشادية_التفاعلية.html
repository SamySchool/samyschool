: 1, "e": "“bear the brunt of” تعبير يعني “يتحمل العبء الأكبر من”، وهو مناسب مع الشكاوى الغاضبة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. Before choosing a major, Mariam took time to ............. on what truly interests her.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">draw</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reflect</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">debate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">argue</span>"], "c": 1, "e": "reflect on تعبير ثابت يعني “يتأمل/يفكر مليًا في”، وهو المناسب قبل اتخاذ قرار مهم."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. Both sides met again and finally agreed to ………………… a compromise.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reach</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">get</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">find</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">take</span>"], "c": 0, "e": "“reach a compromise” تعبير ثابت يعني “يتوصل إلى حل وسط”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. The teacher said that the experiment must ..................... carefully.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to do</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">be done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doing</span>"], "c": 2, "e": "must + مصدر بدون to والتجربة تتلقى الفعل (مبني للمجهول): must be done."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. The museum launched a new app that gives visitors a/an ........... tour experience.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">creatively</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">creative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">create</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">creativity</span>"], "c": 1, "e": "الفراغ يحتاج صفة تصف “tour experience”: creative."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. ....................... the heavy rain, the roads became dangerously slippery.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Because of</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Because</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Though</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">While</span>"], "c": 0, "e": "Because of + اسم (the heavy rain)، بينما Because تحتاج جملة كاملة بفعل."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. What is the main idea of the passage?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Excessive use of Facebook led the writer to neglect real friendships and return to simpler ways of socializing.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer understood that spending too much time online made them ignore school or work responsibilities.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Excessive use of Facebook caused the writer to lose interest in hobbies and avoid meeting family members.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Spending too much time on Facebook resulted in the writer focusing on online games and forgetting daily routines.</span>"], "c": 0, "e": "النص يدور حول كيف أدى الإفراط في استخدام فيسبوك لإهمال صداقات حقيقية، ثم عودة الكاتب لأسلوب حياة أبسط.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>My early visits to Facebook were limited and careful. It felt like a guilty pleasure, a small escape from reality. But within two years, I became completely absorbed &mdash; uploading dozens of photo albums every week, writing endless silly status updates, and collecting hundreds of meaningless online &ldquo;friends.&rdquo; People shared everything imaginable, giving up their privacy and exposing their friends&rsquo; lives as well. I felt a kind of separation anxiety whenever I was offline for more than a few hours.</p><p>The real wake-up call happened when I totally forgot a long-planned reunion with a friend because I was busy with pointless Facebook chatting. &ldquo;This is ridiculous,&rdquo; I told myself. Social networking was meant to improve my social life, not destroy it. I should have realized earlier that I had lived perfectly well before Facebook, so I decided to return to a simpler routine. I could still contact the people I cared about. I had a phone, and I could send emails or even write letters. So, I made the decision to deactivate. It took only a few attempts and was surprisingly easy.</p><p>Facebook asked why I had left, but my decision was firm. I wanted to know whether I could manage without it for at least a week. The platform told me I could come back anytime and reactivate, but I felt free. Naturally, not everyone was concerned about my disappearance &mdash; many didn&rsquo;t even notice. One friend only realized something had changed when his friend count dropped by one, yet he never bothered to find out who had gone.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. The writer&rsquo;s turning point occurred when they ......................</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lost access to her Facebook account</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">missed an important meeting because of Facebook</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">deleted all her photos albums</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had an argument with her friends online</span>"], "c": 1, "e": "كانت اللحظة الفاصلة عندما نسيت الكاتبة لقاءً مهمًا بسبب انشغالها بفيسبوك."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the second paragraph is that the writer……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decided to create a new Facebook account</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decided to reduce Facebook until problems were solved</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">chose to deactivate Facebook and return to offline communication</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">asked Facebook to change the privacy settings</span>"], "c": 2, "e": "قررت الكاتبة إلغاء تفعيل حسابها والعودة للتواصل بطرق أخرى كالهاتف والبريد."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. The writer develops the idea that Facebook became harmful by………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">describing a list of Facebook rules</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">explaining how their usage increased and disrupted their real life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">comparing Facebook to other apps that they always use</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">quoting psychological studies about social media</span>"], "c": 1, "e": "طوّرت الكاتبة فكرتها بشرح كيف زاد استخدامها لفيسبوك تدريجيًا حتى أثّر سلبًا على حياتها الواقعية."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. We can infer that the writer felt relief after deactivating because they ……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reactivated their account and communicated with their old friends</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">complained about their friends&rsquo; reaction and comments</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">felt unburdened and more in control of their life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mentioned Facebook demanded an explanation for not using it</span>"], "c": 2, "e": "شعرت الكاتبة بالتحرر والسيطرة على حياتها بعد إلغاء تفعيل حسابها."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. The writer most likely experienced separation anxiety because they ............</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disliked using technology</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stayed offline for long periods</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">relied too heavily on Facebook</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had few online friends</span>"], "c": 2, "e": "اعتماد الكاتبة الشديد على فيسبوك جعلها تشعر بقلق الانفصال عند عدم استخدامه."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. What contrast does the writer make about social networking?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is meant to improve social life but can actually spoil it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It should entertain people but instead teaches them new skills.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It always increases confidence.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It creates privacy but reduces communication.</span>"], "c": 0, "e": "أوضحت الكاتبة أن الهدف من الشبكات الاجتماعية تحسين الحياة الاجتماعية، لكنها قد تفسدها فعليًا."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. What does the writer&rsquo;s choice to deactivate reveal about their intentions?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They aimed to test their ability to live without Facebook.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They wanted to take a break from online interaction for a while.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They planned to create a second account later.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They aimed to break all communication permanently.</span>"], "c": 0, "e": "أرادت الكاتبة اختبار قدرتها على العيش بدون فيسبوك لفترة على الأقل أسبوع."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. What is the main idea of the passage?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica is considered a desert mainly because it receives the most snowfall each year compared to other regions.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Although Antarctica is extremely cold, it is Earth&rsquo;s largest desert because it gets very little precipitation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Most people think all deserts are always hot and sandy.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica experiences the strongest winds in the world.</span>"], "c": 1, "e": "الفكرة الرئيسية أن القارة القطبية الجنوبية تُصنَّف كأكبر صحراء بسبب قلة هطول الأمطار رغم برودتها الشديدة.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>When you picture a desert, you probably imagine a very hot area covered with sand. While this image suits many deserts, Earth&rsquo;s biggest desert is actually extremely cold and covered in ice: Antarctica.</p><p>For any region to be classified as a desert, it must receive very little precipitation. More precisely, it must get an annual average of less than ten inches of moisture &mdash; whether rain, sleet, hail, or snow. Antarctica, the coldest place on the planet, has temperatures that usually stay below freezing. Because cold air holds far less moisture than warm air, the atmosphere over Antarctica contains almost no water vapor. This is reflected in the very small amounts of precipitation the continent receives. For instance, the central part of Antarctica gets fewer than two inches of snow a year, while the coastline receives between seven and eight inches. Since the total amount is so low, Antarctica is considered a desert.</p><p>In hot deserts, rainfall evaporates quickly. In Antarctica, however, the air is too cold to hold water vapor, so very little evaporation occurs. Because almost none of the fallen snow evaporates, it remains on the ground and eventually builds into massive ice sheets. Any loose snow that does not freeze into ice is swept up by the strong, constant winds across the continent. These snow-filled winds can make it appear as if it is snowing. Although real snowfall is rare, blizzards are surprisingly common in Antarctica.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. How much snow does the central part of Antarctica annually receive?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">More than ten inches of snow.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Between seven and eight inches of snow.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Less than two inches of snow.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No precipitation at all.</span>"], "c": 2, "e": "ذكر النص أن وسط القارة يتلقى أقل من بوصتين من الثلج سنويًا."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. Which of the following sentences summarizes the second paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica meets the definition of a desert as it receives very little precipitation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica has cold temperature with heavy snow, and a lot of precipitation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica is always wet and humid as it gets rain, snow, sleet and hail.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Antarctica is cold and air holds water vapor, so a high rate of evaporation occurs.</span>"], "c": 0, "e": "توضح الفقرة الثانية أن أنتاركتيكا تستوفي شروط تصنيف الصحراء بسبب قلة الهطول المطري الشديدة."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. The writer explains why Antarctica is a desert by…………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">describing its high humidity and having a lot of snow in all seasons</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">explaining the low precipitation and cold air that holds little moisture</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">comparing it with tropical rainforests</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">showing how much snow melts</span>"], "c": 1, "e": "فسّر الكاتب سبب تصنيفها كصحراء من خلال شرح قلة الهطول وقدرة الهواء البارد المحدودة على حمل الرطوبة."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. We can infer that most snow in Antarctica remains on the ground because ..........</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">strong sunlight melts it</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the air is too cold for evaporation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the continent receives heavy rainfall</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">winds blow loose snow across the ground</span>"], "c": 1, "e": "الهواء شديد البرودة لدرجة تمنع تبخر الثلج المتساقط، فيبقى متراكمًا على الأرض."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Although snowfall is rare in Antarctica, blizzards are common because ................</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the winds carry loose snow across the surface</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">warm air builds clouds quickly</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">there is frequent rain in some regions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">storms occur often during summer months</span>"], "c": 0, "e": "الرياح القوية المستمرة تحمل الثلج غير المتجمد عبر السطح، مما يخلق مظهر العواصف الثلجية."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. Antarctica is different from a typical hot desert as it………………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">receives more rainfall</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has more vegetation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has no wind</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is cold but still extremely dry</span>"], "c": 3, "e": "تختلف أنتاركتيكا عن الصحراء الحارة التقليدية كونها باردة جدًا لكنها جافة للغاية أيضًا."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. What does the writer&rsquo;s explanation suggest about Antarctica&rsquo;s climate?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is warm enough for rapid evaporation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It has the same climate as sandy deserts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It receives heavy snowfall yearly, covering most parts of the continent.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is too cold to hold moisture, which limits precipitation.</span>"], "c": 3, "e": "يوضح الشرح أن برودة الهواء الشديدة تحد من قدرته على حمل الرطوبة، ما يفسر قلة الهطول."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. The presentation looked too ......................., so the professor decided ....................... it redesigned.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">simple / to get</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">simplicity / to have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">simply / get</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">simplistic / make</span>"], "c": 0, "e": "Too + صفة (simple)، وdecided + to + مصدر (to get) + مفعول به + تصريف ثالث (redesigned): to get it redesigned."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. The researcher said that the results were ....................... and needed to be reviewed because the data ....................... incomplete.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">strong / was</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">certain / are</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">clear / were</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">unclear / was</span>"], "c": 3, "e": "نتائج غير واضحة تحتاج مراجعة (unclear)، وdata تُعامل كمفرد غالبًا في الاستخدام الحديث: was."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Which sentence is correctly punctuated?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The team tested temperature pressure and density.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The team tested temperature, pressure, and density.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The team tested, temperature pressure and density.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The team tested temperature, pressure and, density</span>"], "c": 1, "e": "قائمة من ثلاثة عناصر تحتاج فواصل تفصل بينها بما في ذلك قبل “and” (Oxford comma): temperature, pressure, and density."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A new set of environmental regulations implements to reduce industrial waste.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A new set of environmental regulations implemented to reduce industrial waste.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A new set of environmental regulations are implemented to reduce industrial waste.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A new set of environmental regulations is implemented to reduce industrial waste.</span>"], "c": 3, "e": "الفاعل الحقيقي هو “A new set” (مفرد)، والقوانين تتلقى الفعل (مبني للمجهول): is implemented."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. &ldquo;The students was finishing their project when the bell rings.&rdquo;<br>Which of the following forms corrects the two mistakes in this sentence?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was → were / rings → rang</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">finishing → finish / rings → ring</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">students → student / their → his</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">finishing → finished / when → while</span>"], "c": 0, "e": "الفاعل جمع (students) يحتاج were، والحدث القاطع في الماضي يحتاج rang (Past Simple)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. In a/an ………………. essay, the writer should use strong evidence to convince the reader of a point.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">persuasive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">descriptive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">expository</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">narrative</span>"], "c": 0, "e": "المقال الإقناعي (persuasive) هو الذي يستخدم أدلة قوية لإقناع القارئ بوجهة نظر معينة."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. …………………. the publication deadline, the editor will have the final draft professionally proofread this evening.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Meeting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Meet</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To meet</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Having met</span>"], "c": 2, "e": "To + مصدر في بداية الجملة يعبر عن الغرض (لكي يفي بالموعد النهائي): To meet."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. I was …………. by Heba&rsquo;s ………the initiative to support her community.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">inspire / take</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">inspired / taking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">inspired / took</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">inspiring/ takes</span>"], "c": 1, "e": "was + مبني للمجهول (inspired)، وHeba's + Gerund (الملكية تحتاج اسمًا/مصدرًا مؤولاً): taking."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Good values guide our decisions, shape our character, and help us build strong, trusting relationships with the people around us, creating a positive environment where everyone can grow and succeed.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">توجّه القيم الجديدة قراراتنا، وتشكل شخصيتنا، وتساعدنا على إقامة علاقات قوية ومبينه على الثقة مع من حولنا، مما يخلق بيئة إيجابية يستطيع فيها الجميع أن ينموا ويحققوا النجاح.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">توجّه قراراتنا القيم الجيدة، وتتشكل شخصيتنا، وتساعدنا على بناء علاقات قوية ومبينه على الثقة مع من حولنا، مما يخلق بيئة إيجابية يستطيع فيها الجميع أن ينموا ويحققوا النجاح.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">توجّه قراراتنا القيم الجيدة، وتشكل شخصيتنا، وتساعدنا على إقامة علاقات قوية ومبنية على الثقة مع من حولنا، مما يخلق بيئة إيجابية يستطيع فيها الجميع أن ينموا ويحققوا النجاح.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">توجّه القيم الجيدة قراراتنا، وتشكل شخصيتنا، وتساعدنا على بناء علاقات قوية ومبنية على الثقة مع من حولنا، مما يخلق بيئة إيجابية يستطيع فيها الجميع أن ينموا ويحققوا النجاح.</span>"], "c": 3, "e": "الخيار (d) هو الوحيد الخالي من الأخطاء: ترتيب طبيعي (القيم الجيدة توجّه قراراتنا)، فعل نشط صحيح (تشكل)، وإملاء سليم (مبنية)؛ باقي الخيارات بها كلمة خاطئة (الجديدة) أو صياغة مبنية للمجهول أو خطأ إملائي (مبينه)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Ambition inspires us to set higher goals, overcome obstacles, and work continually toward a better future, turning our dreams into real achievements through effort and determination.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يلهمنا الطموح أن نصنع أهدافًا عليا، ونتغلب على العقبات، ونعمل معًا من أجل مستقبل أفضل، محولين طموحنا إلى إنجازات حقيقية من خلال الجهد والإصرار.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يلهمنا الطموح أن نصنع أهدافًا عليا، ونتجنب العقبات، ونعمل باستمرار من أجل مستقبل أفضل، محولين أحلامنا إلى إنجازات حقيقية من خلال الجهد والإصرار.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يلهمنا الطموح أن نضع أهدافًا عليا، ونواجه العقبات، ونعمل معًا من أجل مستقبل أفضل، محولين طموحنا إلى إجازات حقيقية من خلال الجهد والإصرار.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يلهمنا الطموح أن نضع أهدافًا عليا، ونتغلب على العقبات، ونعمل باستمرار من أجل مستقبل أفضل، محولين أحلامنا إلى إنجازات حقيقية من خلال الجهد والإصرار.</span>"], "c": 3, "e": "الخيار (d) هو الترجمة الدقيقة الوحيدة الخالية من الأخطاء (نضع/نتغلب على/باستمرار/إنجازات)؛ باقي الخيارات بها كلمات خاطئة (نتجنب العقبات تعكس المعنى، إجازات بدل إنجازات، معًا بدل باستمرار)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>إن التعاون الدولي بين مصر ومعظم الدول الأفريقية في جميع المجالات دخل مرحلة جديدة من الاهتمام. حيث تقوم مصر بالعديد من المشروعات التنموية في هذه الدول والذي سيعود بالنفع علي الجميع.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">International cooperation between Egypt and most African countries in all fields has entered a new stage of attention and importance. Egypt is carrying out many development projects in these countries, which will bring benefits to everyone.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">International cooperation between Egypt and many African countries in all fields has interred a new stage of intention and importance. Egypt is carrying out many development projects in those countries, which will bring benefits to everyone.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">International operation among Egypt and most African countries in all fields has interred a new stage of attention and importance. Egypt is carrying out many development projects in these countries, which will bring benefits to everyone.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">National operation among Egypt and most African countries in all fields has entered a new stage of attention and importance. Egypt is carrying out many development projects in these countries, which will bring benefits to everyone.</span>"], "c": 0, "e": "الخيار (a) وحده سليم تمامًا (cooperation وليس operation، entered وليس interred، International وليس National)؛ باقي الخيارات بها أخطاء إملائية أو مفردات خاطئة."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>لا يوجد أي إنسان خالٍ تمامًا من العيوب، فهذه طبيعة بشرية. لذلك، من الأفضل بكثير لكل واحد منا أن يركّز على فهم نقاط ضعفه والسعي لإصلاحها بدلاً من الانشغال الدائم بالبحث عن عيوب الآخرين.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No one is entirely free from flows, and this is simply part of being human. Therefore, it is fur better for each of us to concentrate in understanding and improving our own weaknesses instead of constantly searching for the faults of others.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No one is entirely free from flows, and this is simply part of being human. Consequently, it is far better for every of us to focus in understanding and improving our own weaknesses instead of constantly searching for the faults of others.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No one are entirely free from flaws, and this is simply part of being human. Consequently, it is fur better for every of us to concentrate in understanding and improving our own weaknesses instead of constantly searching for the faults of others.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">No one is entirely free from flaws, and this is simply part of being human. Therefore, it is far better for each of us to focus on understanding and improving our own weaknesses instead of constantly searching for the faults of others.</span>"], "c": 3, "e": "الخيار (d) سليم تمامًا نحويًا وإملائيًا (flaws وليس flows، is وليس are، far وليس fur، focus on وليس concentrate in)؛ باقي الخيارات بها أخطاء إملائية أو نحوية متعددة."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. What does the Count&rsquo;s final decision to forgive symbolize? Explain briefly.</span>", "model": "The Count's final decision to forgive symbolizes personal growth and the limits of revenge as a source of true happiness. After spending years meticulously punishing those who wronged him, he ultimately realizes that revenge, however satisfying, cannot heal his deepest wounds or bring back what he lost. His choice to forgive, especially those less directly responsible for his suffering, represents moral maturity and the understanding that mercy and moving forward offer more peace than endless vengeance.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. How did Dant&egrave;s' relationship with Abb&eacute; Faria shape his future? Give two examples from the novel to support your answer.</span>", "model": "Abbé Faria's mentorship completely transformed Edmond Dantès' future in two major ways. First, Faria educated him extensively during their years in prison, teaching him languages, history, science, and philosophy, turning a simple sailor into a highly cultured and intelligent man capable of moving through high society later as the Count. Second, Faria revealed to him the location of a hidden treasure on the island of Monte Cristo, which gave Edmond the enormous wealth he needed to reinvent himself, carry out his elaborate plans, and pursue justice against his enemies.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of Six lines about &ldquo;The importance of time management.&rdquo;<br>Include three specific reasons why managing time effectively is important, and support each reason with a brief example.</span>", "model": "Effective time management is essential for success in both personal and academic life. First, it reduces stress, since a student who plans their study schedule in advance avoids the panic of last-minute cramming before exams. Second, it increases productivity; for example, someone who allocates specific time blocks for tasks accomplishes far more than someone who works without a plan. Third, good time management creates balance, allowing a person to dedicate time to work, family, and rest without neglecting any area of their life. In conclusion, mastering time management leads to reduced stress, greater productivity, and a healthier, more balanced life.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. The belief that your ideas are entirely ………… may foster an attitude of arrogance.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">flawless</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">imitative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">customary</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">clumsy</span>"], "c": 0, "e": "flawless تعني “خالٍ من العيوب/كامل”، واعتقاد المرء بكمال أفكاره يغذي الغرور."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. A/An ……………. refers to an agreement where each side abandons part of their demands to reach a middle ground.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compliment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">protocol</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compromise</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">interaction</span>"], "c": 2, "e": "compromise تعني “حل وسط/تنازل متبادل”، وهذا هو التعريف المذكور بالضبط."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. I had to leave the meeting hall which was packed with members of the syndicate. The underlined word &ldquo;packed&rdquo; is synonymous with………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wrapped</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">framed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">vacant</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">congested</span>"], "c": 3, "e": "packed تعني “مزدحم”، ومرادفها congested."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. To raise competition in the job market we must boost digital……………...among new graduates.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">intention</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">literacy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">transport</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">animation</span>"], "c": 1, "e": "digital literacy تعني “الإلمام الرقمي/مهارات التعامل مع التكنولوجيا”، وهي أساسية لسوق العمل."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. You can&rsquo;t describe her reaction as being indifferent as she is somehow shy and hesitant. In this sentence, the underlined word &ldquo;indifferent&rdquo; means……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">distinguished</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">irrelevant</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">neglectful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mindful</span>"], "c": 2, "e": "indifferent تعني “غير مبالٍ/لا يهتم”، وأقرب الكلمات لها هنا neglectful (مهمل/غير مكترث)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. The old car he inherited is quite old-fashioned but it is still …………… a fortune.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">worth</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">meaningful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">useful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">favoured</span>"], "c": 0, "e": "“worth a fortune” تعبير ثابت يعني “يساوي ثروة”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. To build a happy and enduring family, a husband and a wife should be prepared to ………together.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hit the town</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">go through thick and thin</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stay ahead of the curve</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">take the heat</span>"], "c": 1, "e": "“go through thick and thin” تعبير اصطلاحي يعني “يمران معًا بالسراء والضراء”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. Effective collaboration is essential; otherwise, we may……………the project at risk and endanger all our efforts.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">show</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">put</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">drive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">expose</span>"], "c": 1, "e": "“put something at risk” تعبير ثابت يعني “يعرّض شيئًا للخطر”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. The team prepared a……………. schedule designed to complete the project efficiently and effectively.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">time-save</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">saving-time</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">time-saved</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">time-saving</span>"], "c": 3, "e": "الصفة المركبة الصحيحة لوصف جدول موفّر للوقت: time-saving."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. To remain employed I wish you……………everything you are asked to, willingly and responsibly.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would do</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had done</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could do</span>"], "c": 1, "e": "wish + would تُستخدم للتعبير عن رغبة في تغيير سلوك شخص آخر في الحاضر/المستقبل."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. I&rsquo;d rather he……………for such a trivial matter. It was a big mistake.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fought</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hadn&rsquo;t fought</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">didn&rsquo;t fight</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had fought</span>"], "c": 1, "e": "I'd rather + فاعل آخر + Past Perfect للتعبير عن ندم على فعل حدث بالفعل في الماضي (تمنيت لو لم يحدث): hadn't fought."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The main idea of the passage is……………………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">people have seen objects from other planets which they know much about</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">scientists are concerned about discovering objects from other planets</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">some people have seen flying objects and they are still a mystery</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a fisherman has made a big discovery when seeing a UFO by accident</span>"], "c": 2, "e": "يدور النص حول تقارير مشاهدة أجسام طائرة غامضة لا يزال جزء منها غير مفسَّر علميًا.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Many people in different parts of the world have reported seeing strange objects moving in the sky. From their descriptions, it seems that most of the objects had bright, multi-colored lights but with different shapes. Some produced a humming noise; others were completely silent. They moved very quickly, very slowly, hovered in the sky or sank into the sea. All were objects people had never seen before and, therefore, could not identify. That&rsquo;s why they are called unidentified flying objects or UFOs.</p><p>A local fisherman of one country has an interesting story to tell. He said he was fishing about four kilometers off the coast when a large saucer-shaped object suddenly appeared. The bottom two-thirds of the object was reddish in color, the top one-third was silver. He watched it for two or three minutes as it hovered over the sea at a height of about 200 meters. Suddenly, ten or twelve small bright objects shot out of the &lsquo;mother ship&rsquo;. They circled three or four times then they dropped down and disappeared into the sea. The UFO, then rose in the sky and vanished.</p><p>Scientists say that they can explain 90 percent of the UFOs that have been reported. They say people have really seen clouds of gas, electricity reflected from clouds, swarms of insects and balloons, aircraft and other man-made objects. But, what about the other 10 percent that scientists cannot explain?</p><p>Is it possible that there is intelligent life on other planets? Is it possible that creatures from other planets are more advanced than us? Is it possible that UFOs are their spaceships and that they are studying us? We do not know the answers to these questions. Until we do, these objects will remain unidentified.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. The UFO that the fisherman saw was mostly…………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">green</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">red</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">grey</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">blue</span>"], "c": 1, "e": "ذكر النص أن ثلثي الجسم السفلي كانا باللون الأحمر (reddish)، وهو اللون الغالب عليه."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the third paragraph is that scientists …….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were not able to discover or explain the fact of UFOs but they have control over them</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can explain only a little about the UFOs that they describe as mere clouds of gas and reflections of electricity</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were able to analyze most of the story of people watching UFOs and say they are clouds of gas, electricity reflections and other man-made objects</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are not sure of the reality of UFOs which people describe as clouds of gas and reflections of electricity</span>"], "c": 2, "e": "استطاع العلماء تفسير 90% من حالات مشاهدة الأجسام الغريبة بأنها سحب غاز أو انعكاسات كهربائية أو أجسام من صنع الإنسان."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. The image of a UFO finally led us to………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">conclude that there are other advanced creatures watching us</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">question if whether there are more developed living things in the outer space</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wonder if humans can live a more advanced life on other planets one day</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reject the existence of a more developed species on other planets</span>"], "c": 1, "e": "أثارت ظاهرة الأطباق الطائرة تساؤلات حول احتمال وجود كائنات أكثر تطورًا في الفضاء الخارجي."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. Unless people had reported seeing UFOs, we……………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would have assumed they existed in our planet</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wouldn&rsquo;t have travelled through space</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would have requested saucer-shaped spaceships like them</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wouldn&rsquo;t have asked for scientists&rsquo; interpretation about them</span>"], "c": 3, "e": "لولا تقارير الناس عن مشاهدة الأطباق الطائرة، لما طلبنا تفسيرًا علميًا لها من الأساس."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. The text inspires us that we can………………in the future.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have multi-shaped spaceships</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">support scientists discover more UFOs</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">use UFOs for space exploration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">continue monitoring the horizon for long</span>"], "c": 1, "e": "يشجعنا النص على دعم جهود العلماء في اكتشاف وتفسير المزيد من الأجسام الغامضة مستقبلاً."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. Unlike real spaceships, UFOs…………... as being described in the text.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can bear other smaller identical objects</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have multi colored lights and humming noise</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can move quickly, slowly and hover in circles</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are multi-shaped man-made vehicles</span>"], "c": 1, "e": "وصف النص الأطباق الطائرة بأن لها أضواء متعددة الألوان وأحيانًا صوت طنين، بخلاف المركبات الفضائية الحقيقية."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. This text can be classified as a……………... piece of writing.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">factual</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">persuasive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">narrative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fictional</span>"], "c": 0, "e": "يعرض النص تقارير ومعلومات علمية واقعية عن ظاهرة الأطباق الطائرة، فهو نص معلوماتي واقعي (factual)."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the passage is that…………………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hady had an operation after he suffered some pain in his stomach</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doctors are helpful at hospitals when emergencies arise</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Fareed found himself alone and helpless with his ill brother but a doctor came for help</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">you never find out about other&rsquo;s roles until you go through their world</span>"], "c": 2, "e": "يروي النص تجربة فريد الشخصية وهو وحيد مع أخيه المريض حتى وصل الطبيب لمساعدته.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>&ldquo;Doctor! It&rsquo;s my brother. I think he&rsquo;s very ill. Can you come quickly? My name is Fareed Magdi, Tahrir street number 47, just ahead of Tyba Hotel.&rdquo; This urgent dawn call was the most difficult and toughest situation I&rsquo;ve ever had. The ten minutes I spent waiting for the doctor seemed like years. By now, I was very worried. I tried to think of how to reach my parents. But it was no good. I didn&rsquo;t know which hotel they were staying in.</p><p>Then the doctor arrived and that helped. He wasn&rsquo;t long in Hady&rsquo;s room and he looked very worried when he came out. He asked if Hady suffered any symptoms like vomiting, fever or any other signs. I explained that he just complained some stomach pain quite a lot recently. The doctor said Hady is very ill and he would have to go to hospital immediately. I nearly died. The doctor explained that he had appendicitis; his appendix is badly swollen and could burst at any moment and that Hady would have to have an instant operation.</p><p>Then the doctor rang the hospital. They were quick; the ambulance was outside the house in less than a quarter of an hour and they carried Hady to hospital. I never imagined how fast everyone would jump to action and how much a medical staff would cooperate to save a life. It was just then that I felt comforted that my brother was in safe hands who are greatly dedicated to their work. Hady came out safe from the operation and he was much obliged to what we really recognized as &lsquo;The World of Care&rsquo;.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. The doctor asked if Hady had experienced any…………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">injections</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Symptoms</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Medication</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mental disorder</span>"], "c": 1, "e": "سأل الطبيب عن أعراض (symptoms) مثل القيء أو الحمى."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. The sentence that summarizes the second paragraph is &ldquo;……..............&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hady went to hospital to have an operation after the doctor determined his appendix was swollen</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Fareed called a doctor because his brother suffered a severe stomach pain and required surgery</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A doctor arrived, assessed Hady&rsquo;s symptoms and decided he needed urgent hospital surgery</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Fareed was worried when he found out his brother suffered vomiting and fever and needed to go to hospital</span>"], "c": 2, "e": "وصل الطبيب، فحص أعراض هادي، وقرر أنه بحاجة لعملية جراحية عاجلة في المستشفى."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. Fareed&rsquo;s feelings changed through this experience from……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">worried and lonely to relieved and comforted</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sad and abandoned to happy and lonesome</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">terrified and lonesome to proud and social</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">depressed and lonely to inspired and motivated</span>"], "c": 0, "e": "انتقلت مشاعر فريد من القلق والوحدة في البداية إلى الارتياح والطمأنينة بعد تدخل الطاقم الطبي."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. Unless doctors had worked fast, ……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hady&rsquo;s condition could have become life-threatening</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the ambulance would have taken Hady back home</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hady would have enjoyed a longer wait</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hady's appendix could have healed on its own</span>"], "c": 0, "e": "لولا سرعة تحرك الأطباء، لكانت حالة هادي (الزائدة الدودية المنفجرة المحتملة) أصبحت خطيرة على حياته."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. The clearer the symptoms are, the……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">harder the pain the patient feels</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">easier the doctors detect the disease</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">longer the time the patient suffers</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">less effective the medicine the doctor prescribes</span>"], "c": 1, "e": "كلما كانت الأعراض أوضح، كلما سهُل على الأطباء تشخيص المرض بدقة أكبر."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. Fareed was alone, so he……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">took his brother to hospital fast</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could help treat his brother&rsquo;s condition</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">tried to think of how to reach his parents</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">recognized the doctors in the hospital</span>"], "c": 2, "e": "بسبب وحدته، حاول فريد التفكير في كيفية الوصول لوالديه لكنه لم يعرف أين يقيمان."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. The behavior of the medical staff can be described as ……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">devoted and collaborative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">tense but competitive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">temporary and limited</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">efficient but individualistic</span>"], "c": 0, "e": "أظهر الطاقم الطبي تفانيًا وتعاونًا سريعًا لإنقاذ حياة هادي."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. ……………. can you keep your valuables safe and secure?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">What is where</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Where</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Where is where</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">What</span>"], "c": 1, "e": "السؤال عن مكان الحفظ الآمن يحتاج أداة استفهام مكانية: Where."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Once………………., the city turned to be a town of ghosts.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">evacuated</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">being evacuation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">evacuating</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">been evacuated</span>"], "c": 0, "e": "Once + Past Participle صيغة مختصرة تعني “بمجرد أن أُخليت” (مبني للمجهول المختصر): evacuated."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Can you tell me what your gloves is like?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Can you tell me what is your gloves like?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Can you tell me what your gloves are like?</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Can you tell me what are your gloves like?</span>"], "c": 2, "e": "سؤال غير مباشر (Embedded question) يحافظ على ترتيب الجملة الخبرية (فاعل ثم فعل)، وgloves جمع فتحتاج are."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. Unless you……………your car engine fixed, you wouldn&rsquo;t have been able to drive to work that day.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">didn&rsquo;t have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had had</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hadn&rsquo;t had</span>"], "c": 2, "e": "Unless (= if not) + شرط ثالث بالسببية (have something done): had had (fixed)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. The narrower the space in the balcony is, the……... the furniture it can accommodate.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fewer</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">less</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">little</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">more</span>"], "c": 1, "e": "furniture اسم غير معدود، فتُستخدم less وليس fewer (المستخدمة مع الأسماء المعدودة)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. After completing his first draft, he went on ………………… his essay.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">editing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">edit</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">being edited</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to be edited</span>"], "c": 0, "e": "go on + Gerund تعني “يستمر في نفس النشاط”: editing."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. How long …………………her before you got married?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had you known</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have you known</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had you been knowing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have you been knowing</span>"], "c": 0, "e": "حدث استمر حتى نقطة محددة في الماضي (before you got married) = Past Perfect: had you known."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. She had never felt lonely before her mother passed…………. a year ago.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">out</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">away</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">down</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">by</span>"], "c": 1, "e": "“pass away” تعبير مهذب يعني “يتوفى/يموت”."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Nothing is worth teaching to our children than patriotism. We should instill love of their country since they are young so that they feel they are responsible for its prosperity and security.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">شيءٌ جدير أن نعلمه لأبنائنا أكثر من الوطنية، فيجب أن نغرس حب الوطن بداخلهم منذ الصغر حتى يشعروا بأنهم مسؤولين عن رخائه وأمنه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يجب ان نغرس المواطنة داخل أبنائنا حتى يتعلموا حب الوطن ولا شك أن هذا يستحق التعلم ليشعروا بالمسؤولية عن رخائه وأمنه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">شيء جدير أن نتعلمه من أبنائنا أكثر من الوطنية. فيجب أن ندرس حب الوطن منذ الصغر حتى نشعر المسؤولية تجاه رخائه وأمنه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يجب أن نعلم أبناءنا المواطنة، فشيء جديد أن يتعلموه منذ الصغر أكبر من حب الوطن لأنهم يشعروا المسؤولية عن رخائه وأمنه.</span>"], "c": 0, "e": "الخيار (a) هو الأقرب في المعنى والبنية للنص الأصلي رغم صياغته غير المعتادة؛ باقي الخيارات تعكس اتجاه الفعل (نتعلم من أبنائنا بدلاً من نعلمهم) أو تأتي مفككة المعنى."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>The way we use our body language conveys more about our feeling than the things we say. For example, direct eye contact, upright posture and a lively tone of your voice are signs of assertiveness.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطريقة التي نستخدم بها لغة الجسد تبلغ أكثر عن أفكارنا من الكلام الذي نقوله. بالإضافة إلى الاتصال المباشر بالعين والوقوف المستقيم تكون نغمة الصوت الرقيقة هي علامات على الثقة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الاتصال المباشر بالعين والموقف المستقيم ونبرة الصوت الحادة هي علامات ثقة نؤديها بأجسادنا لتعبر عن مشاعرنا بدلاً من الكلام الذي نقوله.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطريقة التي نستخدم بها لغة الجسد تعبر أكثر عن مشاعرنا من الكلام الذي نقوله. فمثلاً التواصل البصري المباشر والوقوف باستقامة ونبرة الصوت الحيوية هي علامات إصرار.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطريقة التي نستخدم بها لغة الجسد توصل أهدافنا خير من كلامنا. فمثلاً البصر الحاد والقوام المستقيم ونغمة الصوت اليقظة هي دلالات على التردد.</span>"], "c": 2, "e": "الخيار (c) هو الترجمة الدقيقة الكاملة (مشاعرنا وليس أفكارنا، نبرة حيوية وليس رقيقة/حادة، علامات إصرار وليس ثقة/تردد)؛ باقي الخيارات تستبدل كلمات رئيسية بمعانٍ مختلفة أو معاكسة."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>المعايير التي يحدد بها الإنسان طريقة تعامله مع أي مشكلة تمثل جزءًا كبيرًا من مدى تمكنه من حلها ودرجة صموده أمام أي تحديات قد تؤخر تقدمه في التغلب عليها.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The criteria one adopts to decides on the way any problem is solved show a big deal of his ability to solve it and his resistance to any challenges that may hinder his progress from overcoming it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The criteria one adapts to decide on the way he tackles any problem show his capability of solving it and his resilience against any challenges that could hinder overcoming his progress to solve it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The criteria one adopts to decide on the way he is going to tackle any problem show a great deal of his ability to solve it and his resilience against any challenges that may hinder his progress in overcoming it.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The criteria one uses to decide on the way he tackle any problems show a big deal of his capability to solve it and his resistance to any challenges that could hinder his progress in overcoming it.</span>"], "c": 2, "e": "الخيار (c) هو السليم تمامًا نحويًا وتعبيريًا؛ باقي الخيارات بها أخطاء نحوية (adopts to decideS، he tackle بدون s) أو كلمات أقل دقة (resistance بدل resilience، adapts بدل adopts)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>تنشر برامج تنمية المهارات وتشجيع الموهوبين روح الإيجابية والأمل في نفوس الشباب وتفتح الطريق أمام جيل جديد من رواد الأعمال في مختلف المجالات.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Programs about developing skills and motivating the talents of young people open the way to positivity and hope and spreads a new generation of entrepreneurs in different fields.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Programs about developing skills and motivating the talents of young men spreads the way to positivity and hope and open a new generation of entrepreneurs in different fields.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Developing skills and motivating the talent spread the spirit of positivity and hope among the young and a new way open to a generation of entrepreneurs in different fields.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Programs that develop skills and enhance talent inspire positivity and hope in young people and open the way to a new generation of entrepreneurs in different fields.</span>"], "c": 3, "e": "الخيار (d) هو الأسلم نحويًا والأدق في نقل المعنى (spread/open مع فاعل جمع متطابق نحويًا)؛ باقي الخيارات بها أخطاء في تطابق الفعل مع الفاعل أو ترتيب غير سليم للجملة."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. The Chateau d&rsquo;If represented a major turning point in the life of Edmund Dantes. Explain this statement giving two examples from the novel.</span>", "model": "The Chateau d'If prison was indeed a major turning point in Edmond's life in two key ways. First, it was there that he met Abbé Faria, who educated him and revealed the secret of the treasure, transforming him from a simple, uneducated sailor into a knowledgeable and wealthy man capable of reinventing himself completely. Second, the years of suffering and isolation in the prison hardened Edmond's heart and filled him with an unshakable determination for justice and revenge, turning the once trusting and innocent young man into the calculating Count of Monte Cristo.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. Do you think Edmund should have abandoned the idea of taking revenge and started a new life somewhere else? Give two reasons to support your opinion.</span>", "model": "In my opinion, Edmond would have been better off abandoning his plan for revenge and starting a new life instead. First, his obsessive pursuit of revenge consumed years of his life and prevented him from fully enjoying his immense wealth and freedom, meaning that even his success felt hollow and incomplete. Second, his actions, though aimed at guilty men, also caused suffering to innocent people connected to them, showing that revenge often creates new victims rather than simply delivering pure justice. A fresh start focused on building a new, positive life could have brought him more genuine peace than his long campaign of vengeance.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of six (6) lines on the following topic: &ldquo;Three precautions you should take before starting an industry&rdquo;<br>Make sure your paragraph has a clear topic sentence, supporting details and a conclusion.</span>", "model": "Before starting an industry, there are several important precautions an entrepreneur should take. First, conducting thorough market research is essential to ensure there is real demand for the product and to understand potential competitors. Second, securing sufficient capital and creating a realistic financial plan helps the business survive its early, often unprofitable stages. Third, understanding and complying with all legal and safety regulations protects both the business owner and future employees from serious problems. In conclusion, careful research, solid financial planning, and legal compliance together greatly increase the chances of building a successful and sustainable industry.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. Our new manager consistently takes the………... to pro-actively solve any problems that arise.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">initiative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">primitive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">depreciation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">evacuation</span>"], "c": 0, "e": "“take the initiative” تعبير ثابت يعني “يبادر بالتصرف”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. Their lawyer needs………. evidence if he is going to take legal action.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">editable</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">tangible</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">replicable</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">predictable</span>"], "c": 1, "e": "tangible تعني “ملموس/محسوس”، وهي المطلوبة للأدلة القانونية المقنعة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. The vertebrates&rsquo;............system usually succeeds in recognizing foreign bodies, causing damage to their cells.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">digestive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">urinary</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">immune</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">nervous</span>"], "c": 2, "e": "immune system (الجهاز المناعي) هو المسؤول عن التعرف على الأجسام الغريبة ومهاجمتها."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. Despite the team efforts, it suffered another…………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">defeat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hard breaking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">heartbreaking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">debate</span>"], "c": 0, "e": "الفراغ يحتاج اسمًا بعد “suffered another”: defeat (هزيمة)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. The current social and political wrangling does not……well for the future.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">go</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bode</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hand</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">play</span>"], "c": 1, "e": "“bode well/ill for” تعبير ثابت يعني “يبشر بخير/شر بخصوص”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. We all condemn all forms of bullying. The antonym of the underlined word &ldquo;condemn&rdquo; is ………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">praise</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">blame</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">attack</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doom</span>"], "c": 0, "e": "condemn تعني “يدين/يستنكر”، وعكسها praise (يمدح)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. Leaving young children unattended on the streets these days is a/an………... experience.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">furious</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hazardous</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">overwhelming</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">autonomous</span>"], "c": 1, "e": "hazardous تعني “خطير”، وهي المناسبة لترك الأطفال دون رقابة في الشارع."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. It&rsquo;s better to act on time as a stitch in time saves ………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">line</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">nine</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fine</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mine</span>"], "c": 1, "e": "“A stitch in time saves nine” مثل إنجليزي شهير يعني “التصرف المبكر يوفر جهدًا أكبر لاحقًا”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. He ……………be Arabian as he asks for an English guidebook.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">might</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shouldn&rsquo;t</span>"], "c": 1, "e": "طلبه لدليل بالإنجليزية يوحي منطقيًا بأنه على الأرجح ليس عربيًا: can't be."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. Do you know why she ……... the company?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">left</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">leave</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was left</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is left</span>"], "c": 0, "e": "سؤال غير مباشر بصيغة الماضي البسيط (فعل إرادي: تركت الشركة بنفسها): left."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. It&rsquo;s an ancient building but it&rsquo;s still……………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lasting-long</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">long-lasting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">last- long</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">long- lasted</span>"], "c": 1, "e": "الصفة المركبة الصحيحة لوصف شيء يدوم طويلاً: long-lasting."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The main idea of this passage is …………….... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson Mandela&rsquo;s childhood as a herd boy shaped his character, teaching him self-reliance, respect, and dignity</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson Mandela&rsquo;s childhood as a herd boy taught him the value of learning and curiosity about the world</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson Mandela's childhood as a herd boy was mainly about learning dangerous survival skills in the wild</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson Mandela&rsquo;s childhood as a herd boy deepened his love for nature and simple living</span>"], "c": 0, "e": "يبرز النص كيف شكّلت طفولة مانديلا كراعي أغنام شخصيته، فعلّمته الاعتماد على النفس والاحترام والكرامة.", "passage": "<div class=\"rp\" dir=\"ltr\"><p><em>A Long Walk to Freedom, written by Nelson Mandela</em></p><p>I was no more than five when I became a herd-boy, looking after sheep in the fields. It was in the fields that I learned to knock birds out of the sky with a slingshot, to gather wild honey, fruits, edible roots, and many other things. I learned stick-fighting &mdash; essential knowledge for any African boy &mdash; and became adept at its various techniques, parrying blows, feinting in one direction and striking in another, breaking away from an opponent with quick footwork. These days are the ones that built my love of the veld, the simple beauty of nature, and the clean line of the horizon.</p><p>As boys, we were mostly left to our own devices. We made our own toys, nature was our playground, and the hills became our roller coasters. We sat on flat stones and slid down the rock faces, shouting with joy.</p><p>One day I learned a lesson from an unruly donkey. We had been taking turns riding it and when finally, my turn came, I jumped on. The donkey bolted into a thorn bush, bent its head and unseated me but not before the thorns pricked my face, embarrassing me before my friends. We had a strong sense of dignity, that day I lost face, as the Chinese like to call it, but I learned that to humiliate another person is to make him suffer an unnecessarily hard fate. But even as a boy, I defeated my opponents without dishonoring them.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. The sentence that summarizes the second paragraph is ………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson and his opponents were strictly watched</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson and his friends learned to create their own entertainment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson and his opponents enjoyed playing with their devices</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nelson&rsquo;s friends were feeling lonely</span>"], "c": 1, "e": "وصفت الفقرة الثانية كيف كان الأولاد يصنعون ألعابهم وترفيههم الخاص من الطبيعة المحيطة بهم."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. According to the passage, essential skills for young Africans were………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stick fighting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">crafting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">farming and planting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">playing traditional games</span>"], "c": 0, "e": "ذكر النص أن القتال بالعصا (stick-fighting) كان معرفة أساسية لأي صبي أفريقي."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. Nelson avoided his opponents by………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">using a slingshot</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">striking in different directions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">using quick footwork</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">parrying blows</span>"], "c": 2, "e": "ذكر النص أنه كان يتفادى خصومه بخفة حركة القدمين (quick footwork)."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. What is the closest meaning of the word &ldquo;unruly&rdquo; as used in the text?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Submissive and compliant</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Difficult to control and manage</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Restrained and orderly</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Calm and obedient</span>"], "c": 1, "e": "unruly تعني “صعب السيطرة عليه/متمرد”، وهذا يصف الحمار الذي هرب به."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. Nelson&rsquo;s earliest responsibilities as a child included……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">selling milk</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">herding sheep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">making toys</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fighting with friends</span>"], "c": 1, "e": "بدأت مسؤولياته المبكرة برعاية الأغنام (herd-boy) في سن الخامسة."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. According to the passage we can infer that losing a face is to ………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">physically get hurt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">be embarrassed or lose respect</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">become angry with friends</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to lose identity</span>"], "c": 1, "e": "“losing face” تعبير يعني “فقدان ماء الوجه/الشعور بالإحراج وفقدان الاحترام”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. From his childhood, Nelson developed love for ……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the beauty of nature</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the life near the sea</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">exploring Chinese culture</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">living in crowded cities</span>"], "c": 0, "e": "ذكر النص أن تلك الأيام بنت حبه لجمال الطبيعة البسيط وخط الأفق الصافي."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. What is the main idea of the text?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags are littering seas and harming animals.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags cause significant environmental damage.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags are used increasingly worldwide.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Plastic bags are partly banned in many countries.</span>"], "c": 1, "e": "يستعرض النص أضرارًا بيئية متعددة للأكياس البلاستيكية (تلوث، أضرار للحيوانات، بطء التحلل)، فالفكرة الرئيسية أوسع من مجرد التلوث البحري.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Every year, approximately 500 billion plastic bags are consumed worldwide. Over 1 million bags are used every minute and they're damaging our environment. In other words, every man, woman and child on our planet uses 83 plastic bags every year. Plastic bags are difficult and costly to recycle. If they are not recycled, they can take around 300 years to decompose. They break down into tiny particles that contaminate soil and waterways. When animals accidentally ingest them, these plastics enter the food chain.</p><p>Big black bin liners, plastic carrier bags and clear sandwich bags all contribute to environmental pollution. They're lightweight, handy and easy to discard carelessly. Plastic bags can be seen hanging from the branches of trees, flying in the air on windy days and floating on rivers. They block up ditches and drains causing water and human waste to overflow which creates breeding grounds of bacteria that cause diseases. Plastic bags are now amongst the top 12 items of litter found along coastlines.</p><p>Animals and sea creatures are hurt and killed every day by plastic bags because they mistake them for food. Plastic is trapped in their stomachs and leads to slow starvation. Other creatures get caught up in plastic bags and drown. Many bags that drift into the ocean end up killing turtles, suffocating seabirds and filling the stomachs of dolphins and whales with waste until they die of starvation. A dead turtle with a plastic bag hanging from its mouth presents a stark image of this environmental crisis.</p><p>Every year our oceans become &lsquo;home&rsquo; to more and more plastic bags which can persist for hundreds of years to break down. There are schemes to recycle and reduce the use of plastic bags all over the world. More than 40 countries have banned or partly banned single-use plastic bags
