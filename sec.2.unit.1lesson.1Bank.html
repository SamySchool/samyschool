const DATA=[{"num":"1","title":"Key Vocabulary","sub":"Exercise on Vocabulary — Choose the correct answer from a, b, c or d.","ar":"المفردات الرئيسية — موضع الامتحان","ref":"المعاصر · قسم I","type":"mcq","items":[{"q":"\"Do we really want a generation that measures its worth in likes?\" The writer expects no answer, so this is a ……… question.","o":["rhetorical","direct","personal","factual"],"a":0,"en":"A rhetorical question is asked for effect or reflection rather than to obtain an answer.","ar":"السؤال البلاغي يُطرح للتأثير أو التأمل، لا للحصول على إجابة."},{"q":"In \"The results were <em>incredibly</em> disappointing\", the underlined word is an ……… .","o":["intensifier","absolute word","connector","evaluative noun"],"a":0,"en":"An intensifier increases the strength or degree of an expression.","ar":"المُقوِّي كلمة تزيد من قوة التعبير أو درجته."},{"q":"\"This treatment <em>always</em> works.\" The underlined word is an ……… word.","o":["absolute","hedging","neutral","descriptive"],"a":0,"en":"An absolute word presents a claim without allowing any exception.","ar":"الكلمة المطلقة تقدّم ادعاءً لا يسمح بأي استثناء."},{"q":"A report that praises one candidate and attacks the other shows clear ……… .","o":["bias","neutrality","accuracy","evidence"],"a":0,"en":"Bias is a strong, unfair preference for one side over another.","ar":"التحيّز ميل قوي غير عادل لطرف على حساب آخر."},{"q":"\"Brilliant\", \"poor\" and \"outstanding\" are all ……… adjectives.","o":["evaluative","descriptive","technical","comparative"],"a":0,"en":"An evaluative adjective expresses a judgment about quality or value.","ar":"الصفة التقييمية تعبّر عن حكم على الجودة أو القيمة."},{"q":"Judging your own progress against other people’s posts is a form of social ……… .","o":["comparison","networking","pressure","awareness"],"a":0,"en":"Social comparison means evaluating yourself by comparing yourself with other people.","ar":"المقارنة الاجتماعية = تقييم نفسك بمقارنتها بالآخرين."},{"q":"Psychologists describe the habit of measuring yourself against others as ……… comparison.","o":["social","technical","numerical","historical"],"a":0,"en":"The comparison is between yourself and other people, which is what makes it social.","ar":"المقارنة هنا بينك وبين الآخرين، وهذا ما يجعلها اجتماعية."},{"q":"The commentator called one player \"world-class\" and the other \"useless\". His report was clearly ……… .","o":["biased","neutral","objective","balanced"],"a":0,"en":"Biased language shows a strong opinion that is not fair or neutral.","ar":"اللغة المتحيزة تُظهر رأيًا قويًا غير عادل ولا محايد."}]},{"num":"2","title":"Vocabulary in Context","sub":"Scenario-based Questions — Which situation best reflects the meaning of the word?","ar":"المفردات في سياق مواقف","ref":"المعاصر · قسم I","type":"mcq","items":[{"n":"9","q":"Which situation best illustrates <em>social comparison</em>?","o":["A teenager scrolls through friends’ holiday photos and starts to feel her own life is dull.","A student checks her exam paper against the official marking scheme.","A shopper compares the prices of two phones before buying one.","A teacher compares this term’s results with last term’s."],"a":0,"en":"Social comparison means measuring yourself against other people, not comparing objects, prices or data.","ar":"المقارنة الاجتماعية = مقارنة نفسك بالآخرين، لا مقارنة أشياء أو أسعار أو بيانات."},{"n":"10","q":"Which situation best demonstrates <em>bias</em>?","o":["A reviewer calls one restaurant “outstanding” and its rival “hopeless” without giving any evidence.","A match report gives the score and describes the key events without praising either side.","A researcher reports that the results varied between the two groups.","A journalist gives both managers the same amount of time to speak."],"a":0,"en":"Bias appears when strong evaluative words are used unequally and without supporting evidence.","ar":"يظهر التحيّز عند استخدام كلمات تقييمية قوية بشكل غير متكافئ وبلا دليل."},{"n":"11","q":"Which situation best demonstrates <em>hedging</em>?","o":["A health article states, “Walking may improve sleep quality for some people.”","A blogger writes, “This diet works for absolutely everyone.”","An advert claims, “Our product never fails.”","A coach announces, “We will definitely win on Friday.”"],"a":0,"en":"“May” and “for some people” limit the claim, which is exactly what hedging does.","ar":"“may” و“for some people” تحدّان من الادعاء، وهذا عمل لغة الحذر."},{"n":"12","q":"Which situation best illustrates the <em>highlight-reel effect</em>?","o":["A user posts only her best holiday moments and never shows her ordinary days.","A user posts an honest photo of a difficult day at work.","A user writes a fair review of a product she disliked.","A user deletes her account for one week to concentrate on exams."],"a":0,"en":"Selecting only the best moments creates a curated, unrealistic picture of life.","ar":"اختيار أفضل اللحظات فقط يخلق صورة مُنتقاة غير واقعية عن الحياة."}]},{"num":"3","title":"Important Vocabulary","sub":"Exercise on Vocabulary — Choose the correct answer from a, b, c or d.","ar":"المفردات المهمة","ref":"المعاصر · قسم I","type":"mcq","items":[{"n":"13","q":"An ……… is someone with a large online following who can shape what other people buy or believe.","o":["influencer","editor","operator","announcer"],"a":0,"en":"An influencer shapes the choices of a large online audience.","ar":"المؤثر يوجّه اختيارات جمهور كبير عبر الإنترنت."},{"n":"14","q":"Teenagers who constantly compare themselves with others often develop ……… .","o":["low self-esteem","high motivation","strong resilience","clear judgment"],"a":0,"en":"Low self-esteem is a poor opinion of your own worth.","ar":"تدني تقدير الذات = رأي ضعيف في قيمة النفس."},{"n":"15","q":"The survey measured ……… with body image among 15-year-olds.","o":["dissatisfaction","satisfaction","agreement","preparation"],"a":0,"en":"Dissatisfaction is the feeling that something is not good enough.","ar":"عدم الرضا هو الشعور بأن الشيء ليس جيدًا بما يكفي."},{"n":"16","q":"Young users often compare themselves not only with a distant ……… but also with classmates.","o":["celebrity","stranger","relative","colleague"],"a":0,"en":"A celebrity is a famous person known to the public.","ar":"المشهور هو الشخص المعروف لدى الجمهور."},{"n":"17","q":"Adolescence is a particularly ……… stage of identity formation.","o":["sensitive","permanent","technical","financial"],"a":0,"en":"Sensitive here means easily affected or influenced.","ar":"sensitive هنا تعني سريع التأثر."},{"n":"18","q":"Instagram and TikTok are ……… platforms, so appearance matters more on them.","o":["image-based","text-based","voice-based","print-based"],"a":0,"en":"Image-based platforms are built mainly around photographs and video.","ar":"المنصات القائمة على الصورة تعتمد أساسًا على الصور والفيديو."},{"n":"19","q":"A ……… photograph has been changed by software before it is posted.","o":["filtered","printed","framed","captioned"],"a":0,"en":"A filter alters skin, shape or lighting in an image.","ar":"الفلتر يغيّر البشرة أو الشكل أو الإضاءة في الصورة."},{"n":"20","q":"The study examined the ……… effects of social media on young people’s minds.","o":["psychological","physical","economic","political"],"a":0,"en":"Psychological relates to the mind, emotions and feelings.","ar":"نفسي = متعلق بالعقل والمشاعر والانفعالات."},{"n":"21","q":"Edited images can create ……… expectations about how people should look.","o":["unrealistic","accurate","measurable","reasonable"],"a":0,"en":"Unrealistic expectations cannot reasonably be met in real life.","ar":"التوقعات غير الواقعية لا يمكن تحقيقها في الحياة الحقيقية."},{"n":"22","q":"Newspapers, radio and television are usually described as ……… .","o":["traditional media","social media","digital platforms","online forums"],"a":0,"en":"Traditional media existed long before online platforms.","ar":"الإعلام التقليدي وُجد قبل المنصات الرقمية بزمن طويل."},{"n":"23","q":"Teenagers who sleep fewer than seven hours report more ……… of anxiety.","o":["symptoms","benefits","solutions","reasons"],"a":0,"en":"A symptom is a sign that shows a condition is present.","ar":"العَرَض علامة تدل على وجود حالة معينة."},{"n":"24","q":"Constantly ……… yourself with edited images can damage confidence.","o":["comparing","protecting","preparing","presenting"],"a":0,"en":"After “constantly” we need an -ing form; the meaning is measuring yourself against something.","ar":"بعد constantly نحتاج صيغة ing، والمعنى مقارنة النفس بشيء آخر."},{"n":"25","q":"Users post a ……… version of their lives, showing only what they want others to see.","o":["selective","complete","random","detailed"],"a":0,"en":"Selective means choosing only certain parts and leaving out the rest.","ar":"انتقائي = اختيار أجزاء معينة وترك الباقي."},{"n":"26","q":"Social comparison is a psychological ……… that helps people judge their own progress.","o":["mechanism","obstacle","punishment","celebration"],"a":0,"en":"A mechanism is a process by which something works.","ar":"الآلية هي العملية التي يعمل بها الشيء."},{"n":"27","q":"There is often a wide ……… between an edited photograph and everyday reality.","o":["gap","link","match","balance"],"a":0,"en":"A gap is a difference or space between two things.","ar":"الفجوة هي الفرق أو المسافة بين شيئين."}]},{"num":"4","title":"Definitions","sub":"Exercises on Definitions, Synonyms & Antonyms — Choose the correct answer.","ar":"التعريفات","ref":"المعاصر · قسم II","type":"mcq","items":[{"q":"What does <em>evaluative</em> mean?","o":["An adjective that expresses a judgment about quality or value","A word that makes a claim less certain","A word that connects two contrasting ideas","A word that adds factual detail to a description"],"a":0,"en":"Evaluative language judges; it does not simply describe.","ar":"اللغة التقييمية تُصدر حكمًا ولا تكتفي بالوصف."},{"q":"What does <em>hedging</em> mean?","o":["A word that makes a claim less certain or definite","A word that presents a claim without allowing exceptions","A word that increases the strength of an expression","A question asked for effect rather than for an answer"],"a":0,"en":"Hedging softens a claim so that it sounds cautious and reasonable.","ar":"لغة الحذر تُلطّف الادعاء ليبدو حذرًا ومعقولًا."},{"q":"What is the <em>highlight-reel effect</em>?","o":["The tendency to show only the best moments and create an unrealistic picture of life","The habit of deleting old posts in order to protect privacy","The practice of editing photographs with professional software","The tendency to follow only accounts that share your opinions"],"a":0,"en":"The term describes selective presentation, not editing or privacy.","ar":"المصطلح يصف العرض الانتقائي، لا تعديل الصور ولا الخصوصية."},{"q":"What is an <em>intensifier</em>?","o":["A word that increases the strength or degree of an expression","A word that reduces the force of a statement","A word that introduces an opposing point of view","A word that signals the writer’s final conclusion"],"a":0,"en":"Examples: extremely, highly, incredibly, absolutely.","ar":"أمثلة: extremely – highly – incredibly – absolutely."},{"q":"What does <em>neutral</em> mean?","o":["Balanced, objective language that is free from bias","Language that strongly supports one side of an argument","Language that exaggerates the importance of a fact","Language that avoids giving any information at all"],"a":0,"en":"Neutral gives information without judging; it is not the same as empty.","ar":"المحايد يقدّم المعلومة دون حكم، وليس معناه الخلو من المعلومات."},{"q":"What is a <em>rhetorical question</em>?","o":["A question used for effect or reflection rather than to obtain an answer","A question that can only be answered with yes or no","A question a researcher writes at the start of a study","A question that asks the reader for personal information"],"a":0,"en":"The writer already assumes the answer and uses the question to persuade.","ar":"الكاتب يفترض الإجابة مسبقًا ويستخدم السؤال للإقناع."},{"q":"What does <em>social comparison</em> mean?","o":["Evaluating yourself by comparing yourself with other people","Comparing two social media platforms before choosing one","Comparing the same person’s behaviour at different ages","Comparing the opinions of two groups in a survey"],"a":0,"en":"The comparison is between yourself and others — that is what makes it social.","ar":"المقارنة بينك وبين الآخرين، وهذا ما يجعلها اجتماعية."}]},{"num":"5","title":"Synonyms & Antonyms","sub":"Exercises on Definitions, Synonyms & Antonyms — Choose the correct answer.","ar":"المرادفات والأضداد","ref":"المعاصر · قسم II","type":"mcq","items":[{"q":"<em>Synonym</em> — \"hedging\" is closest in meaning to ……… .","o":["cautious language","emphasis word","curated reality","direct question"],"a":0,"en":"Hedging = cautious language.","ar":"Hedging = لغة حذرة."},{"q":"<em>Synonym</em> — \"bias\" is closest in meaning to ……… .","o":["prejudice","neutrality","evidence","comparison"],"a":0,"en":"Bias = prejudice.","ar":"Bias = تحيّز أو حكم مسبق."},{"q":"<em>Synonym</em> — \"intensifier\" is closest in meaning to ……… .","o":["emphasis word","softener","connector","time marker"],"a":0,"en":"Intensifier = emphasis word.","ar":"Intensifier = كلمة توكيد وتقوية."},{"q":"<em>Synonym</em> — \"neutral\" is closest in meaning to ……… .","o":["objective","emotional","persuasive","absolute"],"a":0,"en":"Neutral = objective.","ar":"Neutral = موضوعي."},{"q":"<em>Synonym</em> — \"highlight-reel effect\" is closest in meaning to ……… .","o":["curated reality","complete picture","direct question","social pressure"],"a":0,"en":"Highlight-reel effect = curated reality.","ar":"Highlight-reel effect = واقع مُنتقى ومُجمَّل."},{"q":"<em>Antonym</em> — the opposite of \"bias\" is ……… .","o":["neutrality","prejudice","one-sidedness","judgment"],"a":0,"en":"Bias ↔ neutrality.","ar":"عكس التحيّز هو الحياد."},{"q":"<em>Antonym</em> — the opposite of \"intensifier\" is ……… .","o":["softener","amplifier","emphasis word","absolute word"],"a":0,"en":"Intensifier ↔ softener.","ar":"عكس المُقوِّي هو المُخفِّف."},{"q":"<em>Antonym</em> — the opposite of \"highlight-reel effect\" is ……… .","o":["complete picture","curated reality","selective posting","filtered image"],"a":0,"en":"Highlight-reel effect ↔ complete picture.","ar":"عكس “أفضل اللقطات” هو الصورة الكاملة."},{"q":"<em>Antonym</em> — the opposite of \"rhetorical question\" is ……… .","o":["direct question","open question","difficult question","repeated question"],"a":0,"en":"A rhetorical question expects no answer; a direct question does.","ar":"السؤال البلاغي لا ينتظر إجابة، أما المباشر فينتظرها."}]},{"num":"6","title":"Find the Antonyms","sub":"Find the words or phrases in the text that are antonyms of the words below.","ar":"استخرج الأضداد من النص","ref":"المعاصر · قسم II","type":"fill","passage":"<p>Good reporting depends on <b>neutrality</b>. A fair writer describes what happened, gives the numbers and lets readers judge for themselves. A careful writer also prefers a <b>softener</b> such as “may” or “tends to”, because a claim that allows no exception is rarely true.</p><p>Social media works differently. Most users share a <b>curated reality</b> rather than an ordinary day, and readers who forget this begin to compare their own lives with something that was never real. Honest accounts do the opposite: they show the <b>complete picture</b>, including the parts that are dull or difficult. When such an account asks a <b>direct question</b>, it genuinely wants an answer, not agreement.</p>","items":[{"q":"Find the antonym of <em>bias</em> in the text.","h":"paragraph 1","a":["neutrality"],"en":"Bias ↔ neutrality.","ar":"عكس التحيّز هو الحياد، وهي أول كلمة في النص."},{"q":"Find the antonym of <em>intensifier</em> in the text.","h":"paragraph 1","a":["softener"],"en":"An intensifier strengthens a claim; a softener weakens it.","ar":"المُقوِّي يشدّد الادعاء، والمُخفِّف يُضعفه."},{"q":"Find the antonym of <em>complete picture</em> in the text.","h":"paragraph 2","a":["curated reality","a curated reality"],"en":"A curated reality is selected and edited, so it is the opposite of a complete picture.","ar":"الواقع المُنتقى مُختار ومُعدّل، فهو عكس الصورة الكاملة."},{"q":"Find the antonym of <em>highlight-reel effect</em> in the text.","h":"paragraph 2","a":["complete picture","the complete picture"],"en":"The highlight-reel effect shows only the best parts; the complete picture shows everything.","ar":"تأثير أفضل اللقطات يعرض الأجزاء الأفضل فقط، والصورة الكاملة تعرض كل شيء."},{"q":"Find the antonym of <em>rhetorical question</em> in the text.","h":"paragraph 2","a":["direct question","a direct question"],"en":"A direct question really wants an answer.","ar":"السؤال المباشر يريد إجابة فعلًا."}]},{"num":"7","title":"Collocations & Prepositions","sub":"Exercises on Vocabulary Study — Choose the correct answer from a, b, c or d.","ar":"المتلازمات والتعبيرات وحروف الجر","ref":"المعاصر · قسم III","type":"mcq","items":[{"q":"He grew ……… in a small village near Tanta before moving to Cairo.","o":["up","on","in","over"],"a":0,"en":"grow up = spend your childhood somewhere.","ar":"grow up = ينشأ ويكبر."},{"q":"A large number of teenagers suffer ……… low self-esteem.","o":["from","of","with","by"],"a":0,"en":"suffer from + a problem or illness.","ar":"suffer from = يعاني من."},{"q":"Endless scrolling can lead ……… dissatisfaction with your own appearance.","o":["to","into","for","at"],"a":0,"en":"lead to + noun = cause a result.","ar":"lead to + اسم = يؤدي إلى."},{"q":"It is unhealthy to compare yourself ……… people you have never met.","o":["to","for","against","on"],"a":0,"en":"compare yourself to / with someone; “for” and “against” are not used here.","ar":"compare yourself to / with someone، ولا تُستخدم for أو against."},{"q":"Influencers are often seen ……… role models by younger users.","o":["as","like","for","to"],"a":0,"en":"be seen as = be regarded as.","ar":"be seen as = يُنظر إليه على أنه."},{"q":"Nearly half of the students said they were dissatisfied ……… their appearance.","o":["with","from","about","of"],"a":0,"en":"be dissatisfied with something.","ar":"be dissatisfied with = غير راضٍ عن."},{"q":"A harmless daily habit can slowly turn ……… an addiction.","o":["into","to","on","over"],"a":0,"en":"turn into = change and become something else.","ar":"turn into = يتحول إلى."},{"q":"The article is divided ……… three short sections.","o":["into","in","between","onto"],"a":0,"en":"be divided into + parts.","ar":"be divided into = مقسّم إلى."},{"q":"Filters ……… a major role in creating unrealistic images.","o":["play","make","take","do"],"a":0,"en":"play a role in something.","ar":"play a role in = يلعب دورًا في."},{"q":"Honest, balanced content ……… confidence in young readers.","o":["inspires","informs","insists","invites"],"a":0,"en":"inspire confidence = make people feel confident.","ar":"inspire confidence = يبعث الثقة."},{"q":"The edited photograph matched the magazine cover ……… .","o":["perfectly","perfect","perfection","perfecting"],"a":0,"en":"An adverb is needed to describe how it matched.","ar":"المطلوب ظرف يصف كيفية التطابق."}]},{"num":"8","title":"Word Family","sub":"Complete the sentences using the correct form of the word in brackets.","ar":"عائلة الكلمة","ref":"المعاصر · قسم III","type":"fill","items":[{"q":"The report showed a clear ……… against younger players.","h":"bias","a":["bias"],"en":"A noun is needed after the adjective “clear”.","ar":"المطلوب اسم بعد الصفة clear."},{"q":"When she ……… her own photos with the edited versions, she felt disappointed.","h":"comparison","a":["compared"],"en":"A past-simple verb is needed after the subject “she”.","ar":"المطلوب فعل في الماضي البسيط بعد الفاعل."},{"q":"\"Excellent\" and \"poor\" are ……… adjectives.","h":"evaluate","a":["evaluative"],"en":"An adjective is needed before the noun “adjectives”.","ar":"المطلوب صفة قبل الاسم adjectives."},{"q":"The scientist ……… his claim by saying the results \"may\" be significant.","h":"hedge","a":["hedged"],"en":"A past-simple verb is needed after the subject.","ar":"المطلوب فعل في الماضي بعد الفاعل."},{"q":"Constant online comparison can ……… the pressure teenagers already feel.","h":"intense","a":["intensify"],"en":"After the modal “can” we need a bare infinitive.","ar":"بعد can نضع الفعل في المصدر."},{"q":"The presenter described both sides of the argument ……… .","h":"neutral","a":["neutrally"],"en":"An adverb is needed to describe how she described them.","ar":"المطلوب ظرف يصف كيفية الوصف."},{"q":"He asked the question ……… and immediately continued his talk.","h":"rhetoric","a":["rhetorically"],"en":"An adverb is needed after the verb and its object.","ar":"المطلوب ظرف بعد الفعل ومفعوله."},{"q":"The instructions printed on the label were ……… clear.","h":"absolute","a":["absolutely"],"en":"An adverb is needed before the adjective “clear”.","ar":"المطلوب ظرف قبل الصفة clear."},{"q":"Good journalism depends on ……… and accuracy.","h":"neutral","a":["neutrality"],"en":"A noun is needed after the preposition “on”.","ar":"المطلوب اسم بعد حرف الجر on."},{"q":"Constant ……… with other people can damage self-esteem.","h":"compare","a":["comparison"],"en":"A noun is needed after the adjective “constant”.","ar":"المطلوب اسم بعد الصفة constant."},{"q":"The teacher’s ……… of the essay was fair and detailed.","h":"evaluate","a":["evaluation"],"en":"A noun is needed after the possessive form.","ar":"المطلوب اسم بعد صيغة الملكية."}]},{"num":"9","title":"Relative Clauses — Getting Started","sub":"Grammar Focus — Choose the correct answer from a, b, c or d.","ar":"جمل الوصل — البداية","ref":"المعاصر · قسم IV","type":"mcq","items":[{"q":"The doctor ……… treated my brother was very kind.","o":["who","which","whose","where"],"a":0,"en":"“Who” refers to a person and is the subject of “treated”.","ar":"who للعاقل وهي فاعل الفعل treated."},{"q":"The factory ……… produces a lot of pollution has been closed.","o":["which","who","whom","whose"],"a":0,"en":"“Which” refers to a thing.","ar":"which لغير العاقل."},{"q":"The student ……… phone rang during the lesson left the room.","o":["whose","who","which","whom"],"a":0,"en":"“Whose” shows possession: the phone belongs to the student.","ar":"whose تدل على الملكية."},{"q":"I will never forget the day ……… I received my results.","o":["when","which","where","whose"],"a":0,"en":"“When” follows a time word and is followed by a complete clause.","ar":"when بعد كلمة زمن ويتبعها جملة كاملة."},{"q":"This is the school ……… I studied for six years.","o":["where","which","that","whose"],"a":0,"en":"“Where” follows a place word and is followed by a complete clause (= in which).","ar":"where بعد كلمة مكان ويتبعها جملة كاملة (= in which)."},{"q":"Tell me the reason ……… you were late this morning.","o":["why","how","when","which"],"a":0,"en":"“Why” is used only after the word “reason” (= for which).","ar":"why تُستخدم بعد كلمة reason فقط."},{"q":"The people ……… we met at the conference were from Aswan.","o":["whom","which","whose","where"],"a":0,"en":"“Whom” refers to people and works as the object of “met”.","ar":"whom للعاقل وتقع مفعولًا للفعل met."},{"q":"The book ……… I borrowed from the library was very useful.","o":["which","who","whose","where"],"a":0,"en":"“Which” refers to a thing and is the object of “borrowed”.","ar":"which لغير العاقل وتقع مفعولًا للفعل borrowed."},{"q":"The film ……… we watched last night won three awards.","o":["that","who","whose","when"],"a":0,"en":"“That” can replace which in a defining clause.","ar":"that تحل محل which في الجملة المحدِّدة."},{"q":"This is the café ……… my parents first met.","o":["where","which","that","whom"],"a":0,"en":"A complete clause follows, and the noun is a place, so “where” is correct.","ar":"يتبعها جملة كاملة والاسم مكان، لذا where هي الصحيحة."},{"q":"I still remember the summer ……… we travelled to Siwa.","o":["when","which","where","whose"],"a":0,"en":"“Summer” is a time word followed by a complete clause.","ar":"summer كلمة زمن يتبعها جملة كاملة."},{"q":"Do you know the girl ……… won the science competition?","o":["who","which","whose","whom"],"a":0,"en":"A person acting as the subject of “won” takes “who”.","ar":"عاقل وفاعل للفعل won فتأخذ who."},{"q":"The house ……… roof was damaged in the storm has been repaired.","o":["whose","which","that","where"],"a":0,"en":"“Whose” also works for things when showing possession.","ar":"whose تُستخدم أيضًا لغير العاقل عند الملكية."},{"q":"The article ……… explains the highlight-reel effect was published last week.","o":["which","who","whom","when"],"a":0,"en":"“Which” refers to a thing and is the subject of “explains”.","ar":"which لغير العاقل وهي فاعل الفعل explains."},{"q":"The teacher ……… helped me with my essay has just retired.","o":["who","which","whose","where"],"a":0,"en":"A person acting as the subject takes “who”.","ar":"عاقل وفاعل فتأخذ who."}]},{"num":"10","title":"Relative Clauses — Special Cases","sub":"Grammar Focus — Choose the correct answer from a, b, c or d.","ar":"جمل الوصل — الحالات الخاصة","ref":"المعاصر · قسم IV","type":"mcq","items":[{"n":"16","q":"The manager to ……… I spoke was extremely helpful.","o":["whom","who","which","that"],"a":0,"en":"After a preposition, people take “whom” — never who or that.","ar":"بعد حرف الجر نستخدم whom للعاقل فقط."},{"n":"17","q":"The village in ……… my grandfather was born is near Mansoura.","o":["which","that","where","who"],"a":0,"en":"After a preposition, things take “which” — never that or where.","ar":"بعد حرف الجر نستخدم which لغير العاقل."},{"n":"18","q":"Cairo, ……… is the capital of Egypt, is the largest city in Africa.","o":["which","that","where","who"],"a":0,"en":"This is a non-defining clause between commas, so “that” is impossible.","ar":"جملة غير محدِّدة بين فاصلتين، ولا يجوز فيها that."},{"n":"19","q":"My uncle, ……… lives in Alexandria, visits us every Ramadan.","o":["who","that","which","whom"],"a":0,"en":"Non-defining clause about a person: “who” only.","ar":"جملة غير محدِّدة عن شخص: who فقط."},{"n":"20","q":"This is the room ……… I sleep in.","o":["which","where","when","whose"],"a":0,"en":"The preposition “in” is already at the end, so we need which/that, not where.","ar":"حرف الجر in موجود في النهاية، لذا نحتاج which/that لا where."},{"n":"21","q":"We met four volunteers, two of ……… had travelled from Aswan.","o":["whom","who","which","them"],"a":0,"en":"After “two of” we use whom for people; “them” would need a full stop or “and”.","ar":"بعد two of نستخدم whom للعاقل، وthem تحتاج جملة منفصلة."},{"n":"22","q":"She showed me several photographs, some of ……… were taken in Luxor.","o":["which","that","them","whose"],"a":0,"en":"After “some of” we use which for things.","ar":"بعد some of نستخدم which لغير العاقل."},{"n":"23","q":"The reason ……… he resigned was never explained.","o":["why","which","when","where"],"a":0,"en":"“Why” follows “reason” and is followed by a complete clause.","ar":"why بعد reason ويتبعها جملة كاملة."},{"n":"24","q":"The school ……… won the science prize is in our district.","o":["which","who","where","whom"],"a":0,"en":"“School” is a thing and is the subject of “won”, so “which” is required.","ar":"school شيء وهي فاعل الفعل won، لذا which."},{"n":"25","q":"……… you said in the meeting was completely fair.","o":["What","Which","That","Whom"],"a":0,"en":"“What” = the thing which; there is no noun before it to describe.","ar":"what = الشيء الذي، ولا يوجد اسم قبلها لتصفه."},{"n":"26","q":"The moment ……… the results appeared, everyone started shouting.","o":["when","which","where","whose"],"a":0,"en":"“Moment” is a time word followed by a complete clause.","ar":"moment كلمة زمن يتبعها جملة كاملة."},{"n":"27","q":"The writer ……… work I admire most is Naguib Mahfouz.","o":["whose","who","whom","which"],"a":0,"en":"The work belongs to the writer, so the possessive “whose” is needed.","ar":"العمل يخص الكاتب، لذا نحتاج whose."},{"n":"28","q":"The website on ……… she found the data is run by the ministry.","o":["which","that","where","what"],"a":0,"en":"After the preposition “on”, things take “which”.","ar":"بعد حرف الجر on نستخدم which."},{"n":"29","q":"The stadium, ……… holds sixty thousand people, was completely full.","o":["which","that","where","who"],"a":0,"en":"A non-defining clause about a thing takes “which”, never “that”.","ar":"جملة غير محدِّدة عن شيء تأخذ which ولا تأخذ that أبدًا."}]},{"num":"11","title":"Relative Clauses — Check Your Understanding","sub":"Grammar Focus — Choose the correct answer from a, b, c or d.","ar":"جمل الوصل — تأكد من فهمك","ref":"المعاصر · قسم IV","type":"mcq","items":[{"n":"30","q":"The students ……… hard usually get high marks.","o":["studying","studied","who studying","study"],"a":0,"en":"A reduced relative clause: “who study hard” becomes “studying hard” (active).","ar":"اختصار جملة الوصل: who study hard تصبح studying hard."},{"n":"31","q":"The advice ……… by the nutritionist was very useful.","o":["given","giving","gives","gave"],"a":0,"en":"A reduced relative clause: “which was given” becomes “given” (passive).","ar":"اختصار جملة الوصل: which was given تصبح given."},{"n":"32","q":"In \"The student’s visits to Luxor are regular\", the possessive form shows that the visits belong to ……… .","o":["the student","Luxor","the reader","the writer"],"a":0,"en":"An apostrophe + s marks the owner, which is the student.","ar":"صيغة الملكية تحدد المالك وهو الطالب."},{"n":"33","q":"In \"The money that he spent was his own\", the word \"that\" works as ……… .","o":["the object of the verb spent","the subject of the verb spent","a time adverb","a possessive form"],"a":0,"en":"“He” is the subject, so “that” must be the object of “spent”.","ar":"he هي الفاعل، لذا that تقع مفعولًا للفعل spent."},{"n":"34","q":"Choose the correct completion: \"This is the day ……… I graduated.\"","o":["on which","in which","at which","for which"],"a":0,"en":"Days take “on”, so “when” = “on which”.","ar":"الأيام تأخذ on، لذا when = on which."},{"n":"35","q":"Choose the correct completion: \"This is the hall ……… the ceremony was held.\"","o":["in which","on which","for which","of which"],"a":0,"en":"A hall is an enclosed place, so “where” = “in which”.","ar":"القاعة مكان مغلق، لذا where = in which."},{"n":"36","q":"In \"The team which won the match is from Tanta\", the word \"which\" works as ……… .","o":["the subject of the verb won","the object of the verb won","a possessive form","a place adverb"],"a":0,"en":"There is no other subject before “won”, so “which” is the subject.","ar":"لا يوجد فاعل آخر قبل won، لذا which هي الفاعل."},{"n":"37","q":"Which sentence has the same meaning as \"I admire the courage that she showed\"?","o":["I admire what she showed of courage.","I admire her who showed courage.","I admire which courage she showed.","I admire that courage showed her."],"a":0,"en":"“What” can replace “the thing which” in a rewritten sentence.","ar":"what تحل محل “the thing which” في إعادة الصياغة."},{"n":"38","q":"Which sentence correctly adds extra information about Egypt?","o":["Egypt, which has many historic sites, attracts tourists.","Egypt which has many historic sites attracts tourists.","Egypt, that has many historic sites, attracts tourists.","Egypt, which many historic sites, attracts tourists."],"a":0,"en":"Extra information needs two commas, “which”, and a complete verb.","ar":"المعلومة الإضافية تحتاج فاصلتين وwhich وفعلًا كاملًا."}]},{"num":"12","title":"Complete the Text — A","sub":"Complete the following text with the appropriate structure.","ar":"أكمل النص (أ)","ref":"المعاصر · قسم IV","type":"fill","passage":"<p>Sara is a student <b>(1)</b> ……… uses social media every evening. She follows an influencer <b>(2)</b> ……… posts are seen by millions of people. Last week she read an article <b>(3)</b> ……… explained the highlight-reel effect. The journalist to <b>(4)</b> ……… she wrote replied the next morning. Now she prefers accounts <b>(5)</b> ……… show ordinary days as well as perfect ones.</p>","items":[{"q":"(1) a student ……… uses social media every evening","h":"relative pronoun","a":["who","that"],"en":"A person acting as the subject of “uses” takes who (or that).","ar":"عاقل وفاعل للفعل uses فتأخذ who أو that."},{"q":"(2) an influencer ……… posts are seen by millions","h":"relative pronoun","a":["whose"],"en":"The posts belong to the influencer, so the possessive “whose” is needed.","ar":"المنشورات تخص المؤثر، لذا نحتاج whose."},{"q":"(3) an article ……… explained the highlight-reel effect","h":"relative pronoun","a":["which","that"],"en":"A thing acting as the subject of “explained” takes which (or that).","ar":"غير عاقل وفاعل للفعل explained فتأخذ which أو that."},{"q":"(4) the journalist to ……… she wrote","h":"after a preposition","a":["whom"],"en":"After a preposition, people take “whom” only.","ar":"بعد حرف الجر نستخدم whom للعاقل فقط."},{"q":"(5) accounts ……… show ordinary days as well as perfect ones","h":"relative pronoun","a":["which","that"],"en":"“Accounts” are things and act as the subject of “show”.","ar":"accounts غير عاقل وفاعل للفعل show."}]},{"num":"13","title":"Complete the Text — B","sub":"Complete the following text with the appropriate structure.","ar":"أكمل النص (ب)","ref":"المعاصر · قسم IV","type":"fill","passage":"<p>I will never forget the day <b>(1)</b> ……… our project was chosen. We had worked in a small room <b>(2)</b> ……… the light was poor and the desks were old. The reason <b>(3)</b> ……… we succeeded was simple: nobody gave up. Our teacher, <b>(4)</b> ……… had encouraged us from the start, could not stop smiling. The prize, <b>(5)</b> ……… was announced on national television, changed the whole school.</p>","items":[{"q":"(1) the day ……… our project was chosen","h":"relative adverb","a":["when"],"en":"“Day” is a time word followed by a complete clause.","ar":"day كلمة زمن يتبعها جملة كاملة."},{"q":"(2) a small room ……… the light was poor","h":"relative adverb","a":["where"],"en":"“Room” is a place followed by a complete clause.","ar":"room مكان يتبعه جملة كاملة."},{"q":"(3) the reason ……… we succeeded","h":"relative adverb","a":["why"],"en":"“Why” is used after the word “reason”.","ar":"why تُستخدم بعد كلمة reason."},{"q":"(4) our teacher, ……… had encouraged us from the start,","h":"non-defining","a":["who"],"en":"A non-defining clause about a person takes “who” — never “that”.","ar":"جملة غير محدِّدة عن شخص تأخذ who ولا تأخذ that."},{"q":"(5) the prize, ……… was announced on national television,","h":"non-defining","a":["which"],"en":"A non-defining clause about a thing takes “which” — never “that”.","ar":"جملة غير محدِّدة عن شيء تأخذ which ولا تأخذ that."}]},{"num":"14","title":"Complete the Text — C","sub":"Complete the following text with the appropriate structure.","ar":"أكمل النص (ج)","ref":"المعاصر · قسم IV","type":"fill","passage":"<p>The photographs <b>(1)</b> ……… on that platform are rarely ordinary. A picture <b>(2)</b> ……… by software can hide tiredness, change a shape and improve the light. The advice <b>(3)</b> ……… by psychologists is therefore simple. Teenagers <b>(4)</b> ……… their own lives with edited images may feel disappointed. Anyone <b>(5)</b> ……… this can protect their confidence.</p>","items":[{"q":"(1) The photographs ……… on that platform (post)","h":"reduced clause","a":["posted"],"en":"= which are posted. A passive reduced clause uses the past participle.","ar":"= which are posted، والاختصار في المبني للمجهول يكون بالتصريف الثالث."},{"q":"(2) A picture ……… by software (edit)","h":"reduced clause","a":["edited"],"en":"= which is edited. Passive reduced clause → past participle.","ar":"= which is edited، اختصار في المبني للمجهول."},{"q":"(3) The advice ……… by psychologists (give)","h":"reduced clause","a":["given"],"en":"= which is given. Passive reduced clause → past participle.","ar":"= which is given، اختصار في المبني للمجهول."},{"q":"(4) Teenagers ……… their own lives with edited images (compare)","h":"reduced clause","a":["comparing"],"en":"= who compare. An active reduced clause uses the -ing form.","ar":"= who compare، والاختصار في المبني للمعلوم يكون بصيغة ing."},{"q":"(5) Anyone ……… this (understand)","h":"reduced clause","a":["understanding"],"en":"= who understands. Active reduced clause → -ing form.","ar":"= who understands، اختصار في المبني للمعلوم."}]},{"num":"15","title":"Only One Is Correct","sub":"Only one sentence in each group is grammatically correct. Choose the correct answer.","ar":"جملة واحدة صحيحة نحويًا","ref":"المعاصر · قسم IV","type":"mcq","items":[{"q":"Choose the grammatically correct sentence.","o":["Cairo, which is the capital of Egypt, is the biggest city in Africa.","Cairo, that is the capital of Egypt, is the biggest city in Africa.","Cairo, which the capital of Egypt, is the biggest city in Africa.","Cairo which is the capital of Egypt is the biggest city in Africa."],"a":0,"en":"A proper noun takes a non-defining clause: two commas + “which” + a verb, and never “that”.","ar":"اسم العَلَم يتبعه جملة غير محدِّدة: فاصلتان + which + فعل، ولا يجوز that."},{"q":"Choose the grammatically correct sentence.","o":["This is the school which won the science prize.","This is the school who won the science prize.","This is the school whose won the science prize.","This is the school where won the science prize."],"a":0,"en":"“School” is a thing and is the subject of “won”, so “which” is required.","ar":"school شيء وفاعل للفعل won، لذا نستخدم which."},{"q":"Choose the grammatically correct sentence.","o":["The man to whom I talked was helpful.","The man which I talked to was helpful.","The man to who I talked was helpful.","The man to that I talked was helpful."],"a":0,"en":"After a preposition, people take “whom” only.","ar":"بعد حرف الجر نستخدم whom للعاقل فقط."},{"q":"Choose the grammatically correct sentence.","o":["A student studying hard will succeed.","A student studied hard will succeed.","A student who studying hard will succeed.","A student is studying hard will succeed."],"a":0,"en":"The active reduced clause is “studying”; “who” cannot be followed by a bare -ing form.","ar":"اختصار المبني للمعلوم يكون بـ studying، ولا يجوز who + studying."},{"q":"Choose the grammatically correct sentence.","o":["This is the room which I sleep in.","This is the room where I sleep in.","This is the room which I sleep.","This is the room in that I sleep."],"a":0,"en":"Either “where I sleep” or “which I sleep in” — never both together, and never “in that”.","ar":"إما where I sleep أو which I sleep in، ولا يجمع بينهما، ولا يجوز in that."},{"q":"Choose the grammatically correct sentence.","o":["I ate the sandwich made by my mother.","I ate the sandwich making by my mother.","I ate the sandwich which made by my mother.","I ate the sandwich was made by my mother."],"a":0,"en":"= which was made. The passive reduced clause keeps only the past participle.","ar":"= which was made، والاختصار يُبقي التصريف الثالث فقط."},{"q":"Choose the grammatically correct sentence.","o":["The house whose roof was damaged has been repaired.","The house which roof was damaged has been repaired.","The house that its roof was damaged has been repaired.","The house where roof was damaged has been repaired."],"a":0,"en":"Possession before a noun requires “whose”, for people and things alike.","ar":"الملكية قبل الاسم تتطلب whose للعاقل وغير العاقل."},{"q":"Choose the grammatically correct sentence.","o":["We met four volunteers, two of whom had come from Aswan.","We met four volunteers, two of who had come from Aswan.","We met four volunteers, two of them had come from Aswan.","We met four volunteers, two of which had come from Aswan."],"a":0,"en":"“Two of whom” joins the clauses correctly; “two of them” would need a full stop or “and”.","ar":"two of whom تربط الجملتين بشكل صحيح، أما two of them فتحتاج نقطة أو and."}]},{"num":"16","title":"Listening & Reading","sub":"General Exercises — Read the text, then answer the questions.","ar":"الاستماع والقراءة","ref":"المعاصر · قسم V","type":"mcq","passage":"<p><b>How Online Comparison Shapes Self-Image</b></p><p>A recent survey of eight hundred Egyptian teenagers found that those who spent more than three hours a day on image-based platforms were twice as likely to report symptoms of low self-esteem as those who used them for less than one hour. The researchers argue that the problem is not the screen itself but the constant comparison it invites.</p><p>Most users post a selective version of their lives. They share the holiday, not the delayed train; the finished project, not the four failed attempts. Psychologists call this the highlight-reel effect, and it matters because readers compare their own complete lives with somebody else’s edited summary.</p><p>What makes this comparison unusually powerful is closeness. Earlier generations compared themselves with distant celebrities whose lives seemed unreachable anyway. Today the comparison includes classmates, neighbours and acquaintances — people who seem ordinary, and therefore people whose apparent success feels like a fair measure of one’s own.</p><p>The researchers do not recommend leaving these platforms. They suggest instead that young people learn to read them critically: to notice filters, to remember what has been left out, and to judge their own progress by their own goals rather than by an edited image.</p>","items":[{"q":"What did the survey find about teenagers who used image-based platforms for more than three hours a day?","o":["They were twice as likely to report symptoms of low self-esteem.","They were twice as likely to delete their accounts.","They spent less time with classmates and neighbours.","They preferred traditional media to social media."],"a":0,"en":"Paragraph 1 gives this figure directly.","ar":"الفقرة الأولى تذكر هذا الرقم صراحة."},{"q":"According to the writer, why is today’s comparison more powerful than that of earlier generations?","o":["Because it includes ordinary people who seem close and comparable.","Because celebrities now post more often than before.","Because platforms are faster than traditional media.","Because teenagers spend more money on their appearance."],"a":0,"en":"Paragraph 3 explains that closeness makes the comparison feel like a fair measure.","ar":"الفقرة الثالثة توضح أن القرب يجعل المقارنة تبدو مقياسًا عادلًا."},{"q":"Which sentence best paraphrases the highlight-reel effect as it is used in the text?","o":["People compare their whole lives with someone else’s edited summary.","People post more photographs than they used to.","People follow accounts that share their opinions.","People stop using platforms when they feel tired."],"a":0,"en":"Paragraph 2 defines the effect as selective posting that invites unfair comparison.","ar":"الفقرة الثانية تعرّف التأثير بأنه نشر انتقائي يدعو لمقارنة غير عادلة."},{"q":"What is the best title for this text?","o":["How Online Comparison Shapes Self-Image","The History of Traditional Media in Egypt","Why Teenagers Should Delete Social Media","How to Take Better Photographs Online"],"a":0,"en":"The whole text is about comparison and self-image, and it rejects deleting the platforms.","ar":"النص كله عن المقارنة وصورة الذات، وهو يرفض فكرة حذف المنصات."}]},{"num":"17","title":"Evidence & Analysis","sub":"B. Find evidence from the text. C. Answer the following questions.","ar":"الدليل والتحليل","ref":"المعاصر · قسم V","type":"open","items":[{"n":"5","q":"<b>Find evidence from the text</b> that the writer does not want young people to stop using social media.","model":"In the final paragraph the researchers do not recommend leaving these platforms; they suggest instead that young people learn to read them critically — noticing filters, remembering what has been left out, and judging their own progress by their own goals.","ar":"الدليل في الفقرة الأخيرة: الباحثون لا يوصون بترك المنصات، بل بقراءتها بوعي نقدي."},{"n":"6","q":"<b>Explain</b> why comparing yourself with a classmate may be harder than comparing yourself with a celebrity. Use evidence from the text.","model":"A celebrity’s life seems unreachable, so the comparison is easily dismissed. The text states that today’s comparison includes classmates, neighbours and acquaintances — people who seem ordinary — and therefore their apparent success feels like a fair measure of one’s own. This shows that closeness, not fame, is what makes the comparison damaging.","ar":"حياة المشهور تبدو بعيدة المنال فتُستبعد المقارنة بسهولة، أما زميل الفصل فيبدو عاديًا، فيصبح نجاحه الظاهري مقياسًا يبدو عادلًا — والقرب هو ما يجعل المقارنة مؤذية."},{"n":"7","q":"<b>To what extent</b> do you agree that social media, rather than the user, is responsible for low self-esteem? Justify your position with evidence from the text.","model":"I agree only to a limited extent. The evidence is real: teenagers who spent over three hours a day on image-based platforms were twice as likely to report symptoms of low self-esteem. However, the text itself argues that the problem is not the screen but the constant comparison it invites, and it ends by placing responsibility on how users read what they see. This suggests that the platform creates the conditions while the user’s habits decide the outcome. A fair judgment, therefore, is that responsibility is shared.","ar":"أتفق جزئيًا فقط. الدليل حقيقي، لكن النص نفسه يقول إن المشكلة ليست الشاشة بل المقارنة المستمرة، وينتهي بتحميل المستخدم مسؤولية طريقة القراءة — فالمسؤولية مشتركة."},{"n":"8","q":"<b>Suggest</b> two practical steps a teenager could take to reduce the harm described in the text.","model":"First, they could set a daily limit for image-based platforms, since the survey linked more than three hours a day with reported symptoms of low self-esteem. Second, they could judge progress against their own written goals rather than against other people’s posts, which removes the comparison the text identifies as the real cause.","ar":"أولًا: تحديد وقت يومي للمنصات القائمة على الصورة. ثانيًا: قياس التقدم بأهدافه المكتوبة لا بمنشورات الآخرين، مما يزيل المقارنة التي حددها النص كسبب حقيقي."}]},{"num":"18","title":"True / False + Justify","sub":"Read the information, then decide whether the statement is True (T) or False (F). Justify your answer.","ar":"صح أو خطأ مع التبرير","ref":"المعاصر · قسم V","type":"mcq","passage":"<p><b>A.</b> Many Egyptian teenagers use platforms that allow filters to change skin tone, body shape or lighting. Comparing ordinary photographs with edited posts may therefore affect self-image.</p><p><b>B.</b> The researchers stress that the difficulty is not the screen itself but the constant comparison the screen invites. They advise critical reading rather than complete avoidance.</p>","items":[{"q":"<b>Statement A:</b> Filtered posts can make comparisons between online images and everyday appearance less straightforward. — Decide, then choose the correct justification.","o":["True — filters can change skin tone, body shape or lighting, so edited images may not represent everyday appearance.","True — the text says that teenagers should stop using filters completely.","False — the text says that filters have no effect on self-image.","False — the text says that filters are used only by professional photographers."],"a":0,"en":"The statement matches the text: filters alter the image, so the comparison is no longer straightforward.","ar":"العبارة تطابق النص: الفلاتر تغيّر الصورة، فتصبح المقارنة غير مباشرة."},{"q":"<b>Statement B:</b> The researchers advise teenagers to avoid social media completely. — Decide, then choose the correct justification.","o":["False — the researchers advise critical reading rather than complete avoidance.","False — the researchers advise using traditional media instead.","True — the researchers say the screen itself is the difficulty.","True — the researchers say comparison cannot be controlled."],"a":0,"en":"The text explicitly recommends critical reading, not avoidance, and says the screen itself is not the problem.","ar":"النص يوصي صراحة بالقراءة الواعية لا بالتجنب، ويقول إن الشاشة نفسها ليست المشكلة."}]},{"num":"19","title":"Read the Post","sub":"Read the social-media post, then answer the questions.","ar":"اقرأ المنشور ثم أجب","ref":"المعاصر · قسم V","type":"open","passage":"<p><b>@morning_discipline</b> — “Everyone who truly cares about their future is awake at 5 a.m. No excuses. While you were scrolling, I finished a workout, read forty pages and planned my whole week. Lazy mornings build lazy lives. Tag someone who needs to hear this.”</p>","items":[{"n":"1","q":"<b>Identify</b> two expressions in the post that use absolute or biased language, and explain the effect of one of them on the reader.","model":"Two expressions are “Everyone who truly cares about their future” and “Lazy mornings build lazy lives”. The phrase “lazy mornings” may make readers feel judged, because it suggests that anyone who does not wake at 5 a.m. is lazy or does not care about their future, and it allows no exception.","ar":"العبارتان: “Everyone who truly cares” و“Lazy mornings build lazy lives”. الثانية تجعل القارئ يشعر بالحكم عليه، لأنها توحي بأن من لا يستيقظ الخامسة كسول، ولا تسمح بأي استثناء."},{"n":"2","q":"<b>Evaluate</b> how this post might affect a student who works late or cares for a relative in the morning. Support your answer with details from the post.","model":"Such a student could feel guilty or excluded. The post claims that everyone who cares is awake at 5 a.m. and describes other mornings as “lazy”, so it ignores valid reasons for a different routine, such as working late, caring for a relative or managing a health condition. Because it presents one routine as the only proof of commitment, it may damage the confidence of a reader whose circumstances make that routine impossible.","ar":"قد يشعر الطالب بالذنب أو الإقصاء، لأن المنشور يقدّم روتينًا واحدًا كدليل وحيد على الجدية ويتجاهل أسبابًا مشروعة كالعمل المتأخر أو رعاية أحد الأقارب، مما قد يضر بثقته بنفسه."}]},{"num":"20","title":"Writing — Language of Persuasion","sub":"Exercises on Writing — Choose the correct answer from a, b, c or d.","ar":"لغة الإقناع والحياد","ref":"المعاصر · قسم VI","type":"mcq","items":[{"q":"\"Isn’t it time we protected our children from harmful content?\" This sentence is a ……… .","o":["rhetorical question","hedged claim","neutral statement","factual report"],"a":0,"en":"The writer expects agreement, not an answer.","ar":"الكاتب ينتظر الموافقة لا الإجابة."},{"q":"Which word is an <em>intensifier</em>?","o":["extremely","maybe","possibly","seldom"],"a":0,"en":"“Extremely” strengthens the adjective that follows it.","ar":"extremely تقوّي الصفة التي تليها."},{"q":"Which word makes a claim <em>less</em> certain?","o":["may","never","always","definitely"],"a":0,"en":"“May” is a hedge; the other three are absolute.","ar":"may أداة حذر، والباقي كلمات مطلقة."},{"q":"Which word is an <em>absolute</em> word?","o":["never","often","usually","sometimes"],"a":0,"en":"“Never” allows no exception at all.","ar":"never لا تسمح بأي استثناء."},{"q":"Which sentence uses hedging correctly?","o":["Some processed foods may contain high levels of sugar, salt or fat.","Sugar destroys the health of every single person.","Everyone knows that fast food is dangerous.","Fast food always causes obesity."],"a":0,"en":"“Some” and “may” limit the claim; the other three are absolute.","ar":"some وmay تحدّان الادعاء، والباقي مطلق."},{"q":"Why do writers use hedging?","o":["To make a claim more cautious and balanced","To sound more emotional and dramatic","To attack an opposing point of view","To exaggerate the strength of the evidence"],"a":0,"en":"Hedging protects the writer from overstating what the evidence shows.","ar":"لغة الحذر تحمي الكاتب من المبالغة فيما يثبته الدليل."},{"q":"Which sentence shows clear <em>bias</em>?","o":["The council’s ridiculous new bus lanes have ruined the city.","The new bus lanes were opened in March.","Two hundred residents attended the public meeting.","The report includes data from three districts."],"a":0,"en":"“Ridiculous” and “ruined” are strong evaluative words used against one side.","ar":"ridiculous وruined كلمتان تقييميتان قويتان ضد طرف واحد."},{"q":"Which sentence is written in <em>neutral</em> language?","o":["The referee awarded three penalties during the match.","The referee’s shocking decisions ruined the game.","The hopeless referee completely lost control.","The brilliant referee managed the game perfectly."],"a":0,"en":"Only this option reports a fact without praising or criticising.","ar":"هذا الاختيار وحده ينقل حقيقة دون مدح أو ذم."},{"q":"Which is the correctly <em>hedged</em> version of \"Social media destroys teenagers’ self-esteem\"?","o":["Social media may negatively affect teenagers’ self-esteem.","Social media completely destroys teenagers’ self-esteem.","Social media never affects teenagers’ self-esteem.","Social media always harms every teenager."],"a":0,"en":"“May” plus the softer verb “affect” removes the absolute claim.","ar":"may مع الفعل الأخف affect يزيلان الادعاء المطلق."},{"q":"Which sentence uses an intensifier to strengthen an <em>evaluative</em> adjective?","o":["The documentary was incredibly powerful.","The documentary lasted ninety minutes.","The documentary was released in March.","The documentary included three interviews."],"a":0,"en":"“Incredibly” strengthens the evaluative adjective “powerful”.","ar":"incredibly تقوّي الصفة التقييمية powerful."},{"q":"A writer wants to sound fair. Which opening is best?","o":["The evidence suggests that screen time may affect concentration.","Screen time obviously destroys concentration.","Only a fool would deny the danger of screens.","Everybody agrees that screens are harmful."],"a":0,"en":"“Suggests” and “may” present the claim cautiously and invite the reader to judge.","ar":"suggests وmay تقدّمان الادعاء بحذر وتتركان الحكم للقارئ."},{"q":"Which phrase would you use to introduce evidence in an analytical paragraph?","o":["According to the text, …","In any case, …","On the whole, I feel …","Everyone would agree that …"],"a":0,"en":"“According to the text” signals that evidence from the source follows.","ar":"“According to the text” تشير إلى أن ما يليها دليل من النص."},{"q":"Which phrase correctly links a piece of evidence to your idea?","o":["This suggests that …","For example, …","Firstly, …","In addition, …"],"a":0,"en":"“This suggests that” explains the value of the evidence just given.","ar":"“This suggests that” تفسّر قيمة الدليل الذي ذُكر للتو."},{"q":"Which sentence acknowledges an opposing view?","o":["Some readers argue that filters are simply a form of creativity.","Filters are clearly harmful to everyone.","Nobody could possibly defend filters.","Filters are the worst feature of any platform."],"a":0,"en":"Presenting the other side fairly is what acknowledging a counter-argument means.","ar":"عرض الرأي الآخر بإنصاف هو معنى الاعتراف بالحجة المضادة."},{"q":"Which sentence is a clear final <em>judgment</em>?","o":["Overall, social media affects self-image most when users compare themselves uncritically.","Social media is used by millions of people every day.","Filters can change skin tone and lighting.","Some teenagers use image-based platforms."],"a":0,"en":"A judgment states the writer’s overall position, not a fact.","ar":"الحكم النهائي يعلن موقف الكاتب العام، لا مجرد حقيقة."},{"q":"\"More than eighty per cent of the students surveyed reported daily use.\" This sentence provides ……… .","o":["factual evidence","a rhetorical question","a hedged opinion","biased language"],"a":0,"en":"A precise figure from a survey is factual evidence.","ar":"الرقم الدقيق من استطلاع دليل واقعي."},{"q":"Which sentence contains an absolute word that a careful writer would soften?","o":["Teenagers always believe what influencers say.","Teenagers may be influenced by what they see online.","Some teenagers follow influencers closely.","Many teenagers use more than one platform."],"a":0,"en":"“Always” allows no exception and would be softened to “often” or “may”.","ar":"always لا تسمح بأي استثناء ويُفضّل تخفيفها إلى often أو may."},{"q":"Which question is <em>not</em> rhetorical?","o":["How many hours a day do you spend online?","Do we really want a generation raised on filters?","Is it not time that we acted?","Who could possibly accept such a claim?"],"a":0,"en":"Only the first genuinely asks for information.","ar":"الأول وحده يطلب معلومة فعلًا."},{"q":"A paragraph ends: \"The evidence is therefore mixed, and firm conclusions would be premature.\" The writer is ……… .","o":["hedging the conclusion","showing clear bias","using an intensifier","asking a rhetorical question"],"a":0,"en":"“Mixed” and “premature” hold the conclusion back deliberately.","ar":"mixed وpremature تُبقيان الاستنتاج حذرًا عن قصد."},{"q":"Which order best fits an analytical paragraph?","o":["Claim → reason → evidence → explanation → other view → judgment","Evidence → judgment → claim → reason","Judgment → other view → claim → evidence","Other view → evidence → claim → reason"],"a":0,"en":"The claim comes first; the judgment closes the paragraph.","ar":"الادعاء أولًا، والحكم النهائي يغلق الفقرة."}]},{"num":"21","title":"Writing Task","sub":"Write an analytical paragraph of about 150–180 words.","ar":"مهمة الكتابة","ref":"المعاصر · قسم VI","type":"open","items":[{"n":"2","q":"<b>Write an analytical paragraph of about 150–180 words:</b> \"How does social media affect the way teenagers see themselves?\" Use evidence, explain it, acknowledge another view, and end with a clear judgment.","model":"Social media affects the way teenagers see themselves mainly because it invites constant comparison. Most users post a selective version of their lives, sharing the holiday rather than the delayed train, and readers then compare their own complete lives with somebody else’s edited summary. According to one survey, teenagers who spent more than three hours a day on image-based platforms were twice as likely to report symptoms of low self-esteem as those who used them for less than one hour. This suggests that the damage grows with exposure rather than appearing suddenly. The comparison is unusually powerful today because it includes classmates and neighbours, whose apparent success feels like a fair measure of one’s own. Some argue that these platforms also build confidence by giving young people a space to share their work and find encouragement. This may be true for users who read critically. Overall, however, social media shapes self-image most strongly when teenagers accept edited images as an honest record of ordinary life. <i>(178 words)</i>","ar":"نموذج إجابة كامل يطبّق ترتيب: ادعاء ← سبب ← دليل رقمي ← تفسير الدليل بـ This suggests that ← وجهة نظر أخرى ← حكم نهائي. لاحظ توظيف مفردات الدرس: selective, comparison, image-based, low self-esteem, edited."}]}];

/* shuffle MCQ options so the correct letter is never predictable */
DATA.forEach(p=>{if(p.type!=='mcq')return;p.items.forEach(it=>{
  const a=it.o.map((text,i)=>({text,ok:i===it.a}));
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  it.o=a.map(x=>x.text); it.a=a.findIndex(x=>x.ok);
});});

/* flatten to one slide per screen */
const DECK=[];
DATA.forEach((p,pi)=>{
  DECK.push({kind:'cover',pi});
  if(p.passage) DECK.push({kind:'psg',pi});
  p.items.forEach((_,qi)=>DECK.push({kind:'q',pi,qi}));
});

const deck=document.getElementById('deck');
let cur=0,score=0,total=0;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm=s=>s.toLowerCase().trim().replace(/[.,!?;:'"\u2018\u2019\u201c\u201d]/g,'').replace(/\s+/g,' ');
DATA.forEach(p=>{if(p.type!=='open')total+=p.items.length;});
document.getElementById('total').textContent=total;

/* index bar */
const pnav=document.getElementById('pnav');
DATA.forEach((p,pi)=>{
  const b=document.createElement('button');
  b.className='pnBtn'; b.textContent=p.num+'. '+p.title;
  b.onclick=()=>go(DECK.findIndex(s=>s.pi===pi));
  pnav.appendChild(b);
});
if(WA){
  const w=document.createElement('a');
  w.className='pnBtn pnWa'; w.href='https://wa.me/'+WA; w.target='_blank'; w.rel='noopener';
  w.textContent='\u0648\u0627\u062a\u0633\u0627\u0628 \u0645\u0633\u062a\u0631 \u0633\u0627\u0645\u064a';
  w.style.textAlign='center'; w.style.textDecoration='none'; w.style.lineHeight='1.9';
  pnav.appendChild(w);
}

/* slides */
DECK.forEach((s,si)=>{
  const p=DATA[s.pi];
  const el=document.createElement('section'); el.className='slide'; el.id='s'+si;
  let h='<div class="mc">';

  if(s.kind==='cover'){
    h+='<div class="qc"><div class="qb"><div class="cover">'
      +'<span class="pgb">'+esc(p.num)+' &middot; '+esc(p.ref)+'</span>'
      +'<h2>'+esc(p.title)+'</h2>'
      +'<div class="sub">'+esc(p.sub)+'</div>'
      +'<div class="arn">'+esc(p.ar)+'</div>'
      +'<div class="cnt">'+p.items.length+' questions</div>'
      +'</div></div></div>';
  }
  else if(s.kind==='psg'){
    h+='<div class="qc"><div class="qh"><span class="pgb">'+esc(p.num)+'</span>'
      +'<div class="qi">'+esc(p.title)+' &mdash; read the text, then move to the questions</div></div>'
      +'<div class="qb"><div class="psg">'+p.passage+'</div></div></div>';
  }
  else{
    const it=p.items[s.qi], essay=p.type==='open';
    h+='<div class="qc"><div class="qh'+(essay?' es':'')+'">'
      +'<span class="qn">'+esc(it.n||(s.qi+1))+'</span>'
      +'<div class="qi">'+esc(p.num+'. '+p.title)+' &mdash; '+esc(p.sub)+'</div>'
      +'<span class="pgb">'+esc(p.ref)+'</span></div><div class="qb">'
      +'<div class="qt">'+it.q+'</div>';
    if(p.passage) h+='<details class="src"><summary>Show the text</summary><div class="psg">'+p.passage+'</div></details>';

    if(p.type==='mcq'){
      const one=it.o.some(o=>o.length>58);
      h+='<div class="og'+(one?' one':'')+'" id="o'+si+'">';
      it.o.forEach((o,oi)=>{h+='<button class="op" data-s="'+si+'" data-o="'+oi+'">'
        +'<span class="ol">'+'abcd'[oi]+'</span><span>'+esc(o)+'</span></button>';});
      h+='</div>';
    }else if(p.type==='fill'){
      h+='<div class="ansbar"><input type="text" id="in'+si+'" autocomplete="off" spellcheck="false" '
        +'aria-label="Your answer" placeholder="type your answer">'
        +(it.h?'<span class="hint">('+esc(it.h)+')</span>':'')
        +'<button class="nb pri" data-go="'+si+'">Check</button></div>';
    }else{
      h+='<textarea id="ta'+si+'" placeholder="Write your answer here, then compare it with the model."></textarea>'
        +'<div class="ansbar"><button class="nb pri" data-go="'+si+'">Show model answer</button></div>';
    }
    h+='<div id="fb'+si+'"></div></div></div>';
  }
  el.innerHTML=h+'</div>'; deck.appendChild(el);
});

/* question map */
const npb=document.getElementById('npb');
DATA.forEach((p,pi)=>{
  const h5=document.createElement('h5'); h5.textContent=p.num+'. '+p.title; npb.appendChild(h5);
  const g=document.createElement('div'); g.className='ncg';
  p.items.forEach((it,qi)=>{
    const b=document.createElement('button');
    b.className='nc'; b.textContent=it.n||(qi+1);
    b.id='nc'+pi+'_'+qi;
    b.onclick=()=>{go(DECK.findIndex(s=>s.kind==='q'&&s.pi===pi&&s.qi===qi));closeMap();};
    g.appendChild(b);
  });
  npb.appendChild(g);
});

function feedback(si,ok,extra,count){
  const s=DECK[si],p=DATA[s.pi],it=p.items[s.qi],box=document.getElementById('fb'+si);
  if(box.children.length)return;
  const d=document.createElement('div');
  if(p.type==='open'){
    d.className='fb md';
    d.innerHTML='<h4>Model answer</h4><div class="en">'+it.model+'</div><div class="ar">'+it.ar+'</div>';
  }else{
    d.className='fb '+(ok?'ok':'no');
    d.innerHTML='<h4>'+(ok?'Correct':'Not correct')+(extra||'')+'</h4>'
      +'<div class="en">'+it.en+'</div><div class="ar">'+it.ar+'</div>';
  }
  box.appendChild(d);
  const cell=document.getElementById('nc'+s.pi+'_'+s.qi);
  if(cell&&p.type!=='open') cell.classList.add(ok?'ok':'no');
  if(ok&&count){score++;document.getElementById('score').textContent=score;}
  d.scrollIntoView({block:'nearest',behavior:'smooth'});
}

deck.addEventListener('click',e=>{
  const o=e.target.closest('.op');
  if(o&&!o.disabled){
    const si=+o.dataset.s,oi=+o.dataset.o,s=DECK[si],it=DATA[s.pi].items[s.qi];
    o.parentElement.querySelectorAll('.op').forEach((b,i)=>{
      b.disabled=true;b.classList.add(i===it.a?'ok':(i===oi?'no':'dim'));});
    feedback(si,oi===it.a,oi===it.a?'':' \u2014 the answer is ('+'abcd'[it.a]+')',true);
    return;
  }
  const g=e.target.closest('[data-go]');
  if(g&&!g.disabled){
    const si=+g.dataset.go,s=DECK[si];
    if(DATA[s.pi].type==='open'){g.disabled=true;g.textContent='Model shown';feedback(si,true,'',false);}
    else grade(si);
  }
});
deck.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();grade(+e.target.id.slice(2));}
});
function grade(si){
  const s=DECK[si],it=DATA[s.pi].items[s.qi],inp=document.getElementById('in'+si),v=norm(inp.value);
  if(!v){inp.focus();return;}
  const ok=it.a.some(x=>norm(x)===v);
  inp.classList.add(ok?'ok':'no');inp.disabled=true;
  const g=inp.parentElement.querySelector('[data-go]');
  g.disabled=true;g.textContent=ok?'Correct':'Answer shown';
  feedback(si,ok,ok?'':' \u2014 the answer is \u201c'+esc(it.a[0])+'\u201d',true);
}
function revealCurrent(){
  const s=DECK[cur]; if(s.kind!=='q')return;
  const p=DATA[s.pi],it=p.items[s.qi];
  if(document.getElementById('fb'+cur).children.length)return;
  if(p.type==='mcq'){
    document.querySelectorAll('#o'+cur+' .op').forEach((b,i)=>{
      b.disabled=true;b.classList.add(i===it.a?'ok':'dim');});
    feedback(cur,true,' \u2014 ('+'abcd'[it.a]+')',false);
  }else if(p.type==='fill'){
    const inp=document.getElementById('in'+cur);
    inp.value=it.a[0];inp.disabled=true;inp.classList.add('ok');
    const g=inp.parentElement.querySelector('[data-go]');g.disabled=true;g.textContent='Answer shown';
    feedback(cur,true,'',false);
  }else{
    const g=document.querySelector('#s'+cur+' [data-go]');g.disabled=true;g.textContent='Model shown';
    feedback(cur,true,'',false);
  }
}

function go(i){
  cur=Math.max(0,Math.min(DECK.length-1,i));
  [...deck.children].forEach((el,n)=>el.classList.toggle('on',n===cur));
  const s=DECK[cur],p=DATA[s.pi];
  document.getElementById('sbar').innerHTML='<span class="pgb">'+esc(p.num)+'</span>'
    +'<b>'+esc(p.title)+'</b><span>'+esc(p.sub)+'</span><span class="arn">'+esc(p.ar)+'</span>';
  document.getElementById('pos').textContent=(cur+1)+' / '+DECK.length;
  document.getElementById('progFill').style.width=((cur+1)/DECK.length*100)+'%';
  document.getElementById('answerBtn').style.visibility = s.kind==='q'?'visible':'hidden';
  [...pnav.querySelectorAll('.pnBtn:not(.pnWa)')].forEach((b,n)=>b.classList.toggle('act',n===s.pi));
  const act=pnav.querySelector('.pnBtn.act'); if(act) act.scrollIntoView({block:'nearest',inline:'center'});
  document.querySelectorAll('.nc.now').forEach(c=>c.classList.remove('now'));
  if(s.kind==='q'){const c=document.getElementById('nc'+s.pi+'_'+s.qi); if(c)c.classList.add('now');}
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===DECK.length-1;
  deck.children[cur].scrollTop=0;
}
const np=document.getElementById('np'),scrim=document.getElementById('scrim');
function closeMap(){np.classList.remove('open');scrim.classList.remove('on');}
document.getElementById('mapBtn').onclick=()=>{np.classList.add('open');scrim.classList.add('on');};
document.getElementById('npx').onclick=closeMap;
scrim.onclick=closeMap;
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('answerBtn').onclick=revealCurrent;
document.getElementById('sizeBtn').onclick=()=>document.body.classList.toggle('compact');
document.addEventListener('keydown',e=>{
  const typing=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA';
  if(e.key==='Escape'){closeMap();return;}
  if(typing)return;
  if(e.key==='ArrowRight'||e.key===' '){go(cur+1);if(e.key===' ')e.preventDefault();return;}
  if(e.key==='ArrowLeft'){go(cur-1);return;}
  const s=DECK[cur];
  if(s.kind==='q'&&DATA[s.pi].type==='mcq'){
    const k='abcd'.indexOf(e.key.toLowerCase()), n=parseInt(e.key,10);
    const idx=k>=0?k:(n>=1&&n<=4?n-1:-1);
    if(idx>=0){const b=document.querySelectorAll('#o'+cur+' .op')[idx]; if(b&&!b.disabled)b.click();}
  }
});
let x0=null;
deck.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{
  if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));
},{passive:true});
go(0);
</script>
