a اسم غير معدود يُعامل كمفرد في الاستخدام الحديث الشائع: was، والمعنى المنطقي unclear (يحتاج مراجعة)."}, {"pg": "78-80", "q": "........... my two brothers likes swimming.", "o": ["Every of", "Neither of", "None", "Either"], "c": 1, "e": "Neither of + اسم جمع محدد (my two brothers) للنفي بين اثنين فقط + فعل مفرد."}, {"pg": "78-80", "q": "The procession moved slowly down the street, with onlookers lining ........... sides.", "o": ["each", "all", "every", "both"], "c": 3, "e": "both sides تعبير ثابت يعني \"كلا الجانبين\" (اثنان فقط)."}, {"pg": "78-80", "q": "Heba didn't phone, and ........... Farah.", "o": ["too did", "so did", "either didn't", "neither did"], "c": 3, "e": "بعد جملة منفية، نتفق معها بصيغة: neither did + فاعل."}, {"pg": "78-80", "q": "There is no need to buy oil now, we still have ........... .", "o": ["a little", "few", "little", "a few"], "c": 0, "e": "oil اسم غير معدود، وa little (كمية إيجابية كافية) تناسب السياق (لا حاجة للشراء)."}, {"pg": "78-80", "q": "Not ........... birds can fly.", "o": ["every", "all", "each", "no"], "c": 1, "e": "Not all + اسم جمع للنفي الجزئي (ليست كل الطيور تطير)."}, {"pg": "78-80", "q": "........... of the two boys was happy at the funfair.", "o": ["Each", "No", "All", "Every"], "c": 0, "e": "Each of + اسم محدد (اثنان) + فعل مفرد: Each."}, {"pg": "78-80", "q": "........... of the boys were happy at the funfair.", "o": ["All", "No", "Each", "Every"], "c": 0, "e": "All of + اسم جمع + فعل جمع: All."}, {"pg": "78-80", "q": "The employees each ........... in the office when the manager arrived.", "o": ["were", "is", "was", "are"], "c": 0, "e": "each بعد فاعل جمع (The employees) لا تغيّر الفعل الجمعي: were."}, {"pg": "78-80", "q": "I always check if ........... student has grasped what I explained.", "o": ["all", "both", "every", "each"], "c": 3, "e": "each + اسم مفرد + فعل مفرد للتأكيد الفردي: each student."}, {"pg": "78-80", "q": "I can't remember her name ........... .", "o": ["too", "so", "neither", "either"], "c": 3, "e": "either في نهاية جملة منفية للاتفاق: I can't... either."}, {"pg": "78-80", "q": "........... of these telephones works.", "o": ["None", "All", "No", "Some"], "c": 0, "e": "None of + اسم جمع + فعل مفرد (لا أحد منها): None."}, {"pg": "78-80", "q": "There are too ........... mistakes in this essay for it to get a high score.", "o": ["little", "few", "much", "a few"], "c": 1, "e": "mistakes اسم معدود جمع، وtoo few (قليلة جدًا بمعنى سلبي غير كافٍ في السياق العكسي) تناسب الكثرة الفعلية المطلوبة هنا كأخطاء زائدة عن الحد."}, {"pg": "78-80", "q": "........... of my two brothers lives in Cairo; they both moved abroad.", "o": ["Either", "Every", "Both", "Neither"], "c": 3, "e": "Neither of + اسم محدد (اثنان) للنفي (لا أحد منهما): Neither."}, {"pg": "78-80", "q": "There are very ........... people who truly understand quantum physics.", "o": ["a little", "little", "few", "a few"], "c": 2, "e": "people اسم معدود جمع، وfew (قليل جدًا بمعنى سلبي/ندرة) تناسب المعنى: very few."}, {"pg": "78-80", "q": "........... of the players feels worried before the start of the match.", "o": ["Each", "Many", "All", "Every"], "c": 0, "e": "Each of + اسم جمع + فعل مفرد: Each."}, {"pg": "78-80", "q": "There isn't ........... time left to catch the train, so hurry up!", "o": ["much", "many", "few", "a few"], "c": 0, "e": "time اسم غير معدود: much."}, {"pg": "78-80", "q": "We have only ........... minutes to spare.", "o": ["few", "a little", "little", "a few"], "c": 3, "e": "minutes اسم معدود جمع، وa few (كمية إيجابية قليلة كافية) تناسب السياق: a few."}, {"pg": "78-80", "q": "I couldn't find a seat in the underground train. There were too ........... people in it.", "o": ["many", "a lot of", "little", "few"], "c": 0, "e": "people اسم معدود جمع، وtoo many (كثرة زائدة عن الحاجة) تناسب السياق: too many."}, {"pg": "78-80", "q": "The teacher gave us ........... advice about how to prepare for the exam.", "o": ["a few", "many", "some", "a lot"], "c": 2, "e": "advice اسم غير معدود، تُستخدم معه some."}, {"pg": "78-80", "q": "You will find ........... that you need on the top shelf.", "o": ["either", "all", "whole", "neither"], "c": 1, "e": "all + that (كل ما) تركيب شائع: all that you need."}, {"pg": "78-80", "q": "We can go to ........... restaurant. I don't mind.", "o": ["neither", "either", "both", "all"], "c": 1, "e": "either + اسم مفرد (اختيار حر بين اثنين): either restaurant."}, {"pg": "78-80", "q": "The two players did badly in the last match since ........... of them had trained well.", "o": ["neither", "all", "both", "either"], "c": 0, "e": "neither of them (النفي بين اثنين: لا أحد منهما): neither."}, {"pg": "78-80", "q": "I bought two books but I haven't read ........... of them yet.", "o": ["both", "neither", "either", "all"], "c": 2, "e": "في جملة منفية، either of them (أيٍّ منهما) تُستخدم للتعبير عن النفي بين اثنين."}, {"pg": "78-80", "q": "You can't say that 15 kilometres ........... a long way to walk.", "o": ["is", "be", "are", "were"], "c": 0, "e": "المسافات تُعامَل ككتلة واحدة (مفرد): is."}, {"pg": "78-80", "q": "5 litres of petrol ........... not enough for the trip from Cairo to Alex.", "o": ["is", "are", "were", "had"], "c": 0, "e": "الكميات (5 litres) تُعامَل ككتلة واحدة (مفرد): is."}, {"pg": "78-80", "q": "I have hardly ........... money left; I spent all of it on clothes.", "o": ["no", "some", "any", "many"], "c": 2, "e": "hardly (شبه نفي) تُستخدم معها any وليس no (تجنبًا لازدواج النفي)."}, {"pg": "78-80", "q": "My school is ........... a kilometer from my house.", "o": ["neither", "half", "half of", "either"], "c": 1, "e": "half + اسم مفرد بدون of عند القياس المباشر: half a kilometer."}, {"pg": "78-80", "q": "How ........... furniture shops are there in your city?", "o": ["How many", "How much", "How about", "How little"], "c": 0, "e": "shops اسم معدود جمع: How many."}, {"pg": "81-82", "q": "Which sentence is correctly punctuated?", "o": ["Many students who studied hard passed the exam.", "Many students who studied hard, passed the exam.", "Many students, who studied hard, passed the exam.", "Many students; who studied hard; passed the exam."], "c": 0, "e": "جملة الوصل هنا تعريفية/ضرورية (تحدد أي طلاب بالتحديد)، فلا توضع فواصل حولها."}, {"pg": "81-82", "q": "Which of the following sentences contains a relative clause?", "o": ["I don't know where she lives.", "He runs faster than me.", "The book that you gave me is interesting.", "She went home when she was tired."], "c": 2, "e": "that you gave me جملة وصل تصف الاسم (The book)، وهي الوحيدة التي تحتوي ضمير وصل يصف اسمًا سابقًا."}, {"pg": "81-82", "q": "Yesterday, I played the final with my mate, ........... made me very tired.", "o": ["who", "whom", "where", "which"], "c": 3, "e": "which تصف الجملة كلها (الحدث السابق: لعب النهائي)، وليس شخصًا أو مكانًا."}, {"pg": "81-82", "q": "Which sentence is correctly structured?", "o": ["Salah, who’s the happiness maker, score the winning goal.", "Salah, whose the happy maker, scored the winning goal.", "Salah, who is the happiness maker, score the winning goal.", "Salah, who’s the happiness maker, scored the winning goal."], "c": 3, "e": "who's = who is (جملة وصل غير تعريفية بين فواصل)، والفعل الرئيسي في الماضي: scored."}, {"pg": "81-82", "q": "I watched a lot of people at the opening of the grand museum, most of ........... were tourists.", "o": ["they", "which", "whom", "that"], "c": 2, "e": "most of + whom تُستخدم للأشخاص بعد حرف جر (of): whom."}, {"pg": "81-82", "q": "My father always donates, ........... is kind of him.", "o": ["which", "that", "who", "whom"], "c": 0, "e": "which تصف الجملة/الفعل السابق كله (التبرع)، وليس اسمًا محددًا."}, {"pg": "81-82", "q": "My mum admired the car ........... .", "o": ["I bought", "which I bought for", "that I bought it", "I bought it"], "c": 0, "e": "جملة وصل تعريفية بدون ضمير وصل (محذوف لأنه مفعول به) وبدون تكرار ضمير: I bought."}, {"pg": "81-82", "q": "We will apply efficient pesticides to get rid of the insects ........... our crops.", "o": ["attack", "attacked", "attacking", "to attack"], "c": 2, "e": "جملة وصل مختصرة (Reduced Relative Clause) في المبني للمعلوم والمضارع المستمر معنويًا = attacking."}, {"pg": "81-82", "q": "Hurghada, ........... lies on the Red Sea coast, is famous for diving.", "o": ["where", "which", "when", "whose"], "c": 1, "e": "which تصف مكانًا (اسم) كفاعل للجملة التالية (lies)، وليس ظرف مكان: which."}, {"pg": "81-82", "q": "My son was part of the team ........... did the famous heart surgery.", "o": ["that", "whom", "whose", "what"], "c": 0, "e": "that/who لفريق (جماعة من الأشخاص) كفاعل للفعل التالي: that."}, {"pg": "81-82", "q": "The girl, ........... red hair, rarely comes to school late.", "o": ["who", "whose", "with", "that"], "c": 2, "e": "with + صفة جسدية (red hair) تركيب وصفي مختصر بدون ضمير وصل كامل: with."}, {"pg": "81-82", "q": "The tourists ........... stay in Egypt was wonderful decided to come back again next summer.", "o": ["who", "whose", "where", "which"], "c": 1, "e": "whose + اسم (stay) يدل على الملكية (إقامتهم): whose stay."}, {"pg": "81-82", "q": "Sara made a suggestion ........... Nasr objected.", "o": ["which", "to which", "that", "on which"], "c": 1, "e": "object to something تركيب ثابت، فيحتاج حرف الجر to قبل ضمير الوصل: to which."}, {"pg": "81-82", "q": "Trees ........... in rainforests can reach a height more than 30 metres.", "o": ["grows", "grown / growing", "are grown", "grew"], "c": 1, "e": "جملة وصل مختصرة (مبنية للمعلوم أو المجهول حسب المعنى: الأشجار التي تنمو) = grown/growing."}, {"pg": "81-82", "q": "That is Mr Omar for ........... we bought that present.", "o": ["that", "which", "whom", "where"], "c": 2, "e": "for + whom للأشخاص بعد حرف جر: for whom."}, {"pg": "81-82", "q": "The house ........... yesterday is Khaled’s.", "o": ["robbing", "which robbed", "Where", "robbed"], "c": 3, "e": "جملة وصل مختصرة مبنية للمجهول (المنزل تعرّض للسرقة): robbed."}, {"pg": "81-82", "q": "The waiter ........... in this restaurant is so friendly.", "o": ["who working", "who work", "worked", "working"], "c": 3, "e": "جملة وصل مختصرة مبنية للمعلوم ومستمرة معنويًا (النادل الذي يعمل): working."}, {"pg": "81-82", "q": "It was an awful mistake ........... he should apologize.", "o": ["for which", "which", "by which", "to which"], "c": 0, "e": "apologize for something تركيب ثابت: for which."}, {"pg": "81-82", "q": "This is the reason ........... I refuse to work with him.", "o": ["which", "what", "that", "why"], "c": 3, "e": "why تُستخدم بعد reason للتعبير عن السبب."}, {"pg": "81-82", "q": "This is the only novel ........... truly made me emotional.", "o": ["that", "where", "whose", "which"], "c": 0, "e": "بعد صيغة التفضيل/الحصر (the only) يُفضَّل استخدام that."}, {"pg": "81-82", "q": "I like reading Shakespeare's plays. This means ........... .", "o": ["that Shakespeare writes", "which written about Shakespeare", "written by Shakespeare", "are written by Shakespeare"], "c": 2, "e": "جملة وصل مختصرة مبنية للمجهول تصف المسرحيات (كُتبت بواسطة شكسبير): written by Shakespeare."}, {"pg": "81-82", "q": "The factory in ........... I work is very big.", "o": ["that", "where", "which", "when"], "c": 2, "e": "حرف الجر (in) + which للأماكن بعد حرف جر: in which."}, {"pg": "81-82", "q": "The man ........... he was talking is my coach.", "o": ["to whom", "whom", "who", "whose"], "c": 0, "e": "talk to someone تركيب ثابت، فيحتاج حرف الجر to قبل whom: to whom."}, {"pg": "81-82", "q": "I have two watches, both of ........... are made of gold.", "o": ["them", "whom", "which", "who"], "c": 2, "e": "both of + which للأشياء بعد حرف جر: which."}, {"pg": "81-82", "q": "Before going shopping, we’d better decide ........... we need to buy.", "o": ["what", "that", "when", "which"], "c": 0, "e": "what تعني \"ما الذي\" (اسم موصول بمعنى الشيء الذي): what we need."}, {"pg": "81-82", "q": "To ........... does the book belong?", "o": ["whom", "who's", "who", "whose"], "c": 0, "e": "belong to someone تركيب ثابت، فيحتاج حرف الجر to + whom في السؤال الرسمي: To whom."}, {"pg": "84-85", "q": "The project was so complex that the engineers decided to test the new system by ........... before allowing anyone else to use it.", "o": ["themselves", "oneself", "himself", "itself"], "c": 0, "e": "الضمير المنعكس يطابق الفاعل الجمع (the engineers): themselves."}, {"pg": "84-85", "q": "The team all wanted coffee so I made ........... .", "o": ["it them", "it some", "them some", "some of them"], "c": 2, "e": "make + مفعول به (them) + مفعول به ثانٍ (some) لتوزيع الشيء عليهم: them some."}, {"pg": "84-85", "q": "At university, you have to be independent and work by ........... .", "o": ["your own", "yourself", "yours", "your hand"], "c": 1, "e": "by + ضمير منعكس تعبير ثابت يعني \"بمفردك\": by yourself."}, {"pg": "84-85", "q": "Boys, behave ........... or I'll complain to the teacher.", "o": ["themselves", "yourself", "oneself", "yourselves"], "c": 3, "e": "الضمير المنعكس يطابق الفاعل الجمع المخاطب (Boys): yourselves."}, {"pg": "84-85", "q": "We all can find ........... appropriate jobs.", "o": ["us", "themselves", "ours", "ourselves"], "c": 3, "e": "الضمير المنعكس يطابق الفاعل (We): ourselves."}, {"pg": "84-85", "q": "Mohamed scored an exciting goal, ........... he?", "o": ["didn't", "doesn't", "did", "won't"], "c": 0, "e": "الجملة الأصلية مثبتة في الماضي البسيط (scored)، فالسؤال المذيل منفٍ بنفس الزمن: didn't he."}, {"pg": "84-85", "q": "I think that the train never comes on time, ........... it?", "o": ["won't", "didn't", "doesn't", "does"], "c": 3, "e": "never تجعل الجملة في المعنى منفية، فالسؤال المذيل يكون مثبتًا: does it (والفعل الرئيسي المضارع comes)."}, {"pg": "84-85", "q": "She’d better study hard, ........... she?", "o": ["wouldn't", "didn't", "hadn't", "doesn't"], "c": 2, "e": "had better فعلها المساعد الحقيقي هو had (اختصار 'd)، فالسؤال المذيل: hadn't she."}, {"pg": "84-85", "q": "Let’s go the cinema, ........... we?", "o": ["shall", "will", "do", "did"], "c": 0, "e": "بعد Let's في الاقتراح، السؤال المذيل الثابت هو: shall we."}, {"pg": "84-85", "q": "He never goes to bed before 10 o'clock, ........... ?", "o": ["isn't he", "is he", "doesn't he", "does he"], "c": 3, "e": "never تجعل الجملة منفية معنويًا، فالسؤال المذيل مثبت مع فعل مساعد does (مضارع بسيط): does he."}, {"pg": "84-85", "q": "There are a lot of students in the garden, ........... ?", "o": ["aren't they", "aren't there", "don't they", "do there"], "c": 1, "e": "الفاعل الحقيقي هو there (تركيب there is/are)، فالسؤال المذيل يكرر there: aren't there."}, {"pg": "84-85", "q": "I am the tallest player in the team, ........... ?", "o": ["don't I", "amn't I", "aren't I", "am I"], "c": 2, "e": "الاستثناء الوحيد مع I am: aren't I."}, {"pg": "84-85", "q": "He rarely helps anyone, ........... ?", "o": ["doesn't he", "does he", "does", "he doesn't"], "c": 1, "e": "rarely شبه نفي، فالسؤال المذيل مثبت: does he."}, {"pg": "84-85", "q": "Nothing happened, ........... ?", "o": ["did it", "wasn't it", "didn't it", "was it"], "c": 0, "e": "Nothing ضمير نفي، فالسؤال المذيل مثبت بضمير it: did it."}, {"pg": "84-85", "q": "I think nobody lives here, ........... ?", "o": ["does he", "don't they", "do they", "don't I"], "c": 2, "e": "nobody ضمير نفي جمعي المعنى يُستبدل بـ they، والسؤال المذيل مثبت: do they."}, {"pg": "84-85", "q": "You'd better complain to the manager, ........... ?", "o": ["won't you", "didn't you", "hadn't you", "wouldn't you"], "c": 2, "e": "had better (اختصار 'd = had): hadn't you."}, {"pg": "84-85", "q": "She's lived in Moscow for three years, ........... ?", "o": ["hasn't she", "isn't it", "hasn't it", "isn't she"], "c": 0, "e": "الفعل المساعد الرئيسي هو has (Present Perfect: 's = has)، والفاعل she: hasn't she."}, {"pg": "84-85", "q": "Everyone is liable to err, ........... ?", "o": ["hasn't she", "aren't they", "is he", "are they"], "c": 1, "e": "Everyone ضمير مفرد لفظًا لكن يُستبدل بـ they في السؤال المذيل تقليديًا: aren't they."}, {"pg": "84-85", "q": "Ali cut down that tree, ........... ?", "o": ["didn't he", "hadn't he", "doesn't he", "don't he"], "c": 0, "e": "الفعل الرئيسي ماضٍ بسيط (cut): didn't he."}, {"pg": "84-85", "q": "She could hardly carry out the difficult task, ........... ?", "o": ["she couldn't", "couldn't she", "she could", "could she"], "c": 3, "e": "hardly شبه نفي، فالسؤال المذيل مثبت: could she."}, {"pg": "84-85", "q": "She is very punctual; she rarely comes late, ........... ?", "o": ["does she", "doesn't she", "she doesn't", "is she"], "c": 3, "e": "الفعل الرئيسي المقصود بالسؤال هنا هو is (very punctual)، فالسؤال المذيل: is she."}, {"pg": "84-85", "q": "I'm going to take back ........... shoes I bought last week.", "o": ["this", "those", "these", "than"], "c": 1, "e": "الإشارة لأشياء بعيدة زمنيًا (اشتريتها الأسبوع الماضي) وجمع: those."}, {"pg": "84-85", "q": "Everyone must care for ........... possessions.", "o": ["their", "hers", "its", "his"], "c": 0, "e": "Everyone في الاستخدام الحديث يُستبدل بـ their (محايد الجنس): their."}, {"pg": "84-85", "q": "One should care for ........... health.", "o": ["his", "her", "one's", "ones"], "c": 2, "e": "بعد الضمير العام One يُستخدم one's للملكية."}, {"pg": "84-85", "q": "This is my book. It isn't ........... .", "o": ["yours", "yours book", "yourself", "your"], "c": 0, "e": "ضمير الملكية المطلق (بدون اسم بعده) = yours."}, {"pg": "84-85", "q": "I admired the ring ........... not the setting.", "o": ["himself", "itself", "myself", "yours"], "c": 1, "e": "الضمير المنعكس يشير إلى الخاتم نفسه (شيء): itself، للتوكيد."}, {"pg": "84-85", "q": "My sister looked at ........... in the mirror and then combed her hair.", "o": ["herself", "myself", "themselves", "himself"], "c": 0, "e": "الضمير المنعكس يطابق الفاعل (My sister): herself."}, {"pg": "84-85", "q": "A friend of ........... is going to visit me tonight.", "o": ["mine", "myself", "my", "I"], "c": 0, "e": "a friend of + ضمير ملكية مطلق (double possessive): mine."}, {"pg": "87-89", "q": "........... the project on time, he would have been awarded.", "o": ["If he presented", "If he presents", "Were he to present", "Had he presented"], "c": 3, "e": "الجملة الرئيسية (would have been awarded) شرطي ثالث، وصيغة القلب المقابلة: Had he presented."}, {"pg": "87-89", "q": "What would you have done if you ........... asked to do the task several times?", "o": ["were being", "had", "were", "had been"], "c": 3, "e": "الجملة الرئيسية (would have done) شرط ثالث، فجملة if تحتاج Past Perfect (مبني للمجهول: تلقيت الطلب): had been."}, {"pg": "87-89", "q": "If he had worked harder, he ........... in a better position.", "o": ["will have been", "will be", "would have been", "could be"], "c": 2, "e": "if + Past Perfect (had worked) = شرط ثالث، فجواب الشرط: would have been."}, {"pg": "87-89", "q": "If I ........... the job, I would have taken it.", "o": ["had offered", "was offered", "had been offered", "would offer"], "c": 2, "e": "شرط ثالث، وأنا (I) أتلقى الفعل (مبني للمجهول: عُرضت عليّ الوظيفة): had been offered."}, {"pg": "87-89", "q": "........... , you could have your own decision.", "o": ["Suppose you are in charge", "Unless you had in charge", "When you had been in charge", "Were you in charge"], "c": 3, "e": "could (شرط ثانٍ) يقابله صيغة قلب: Were you in charge."}, {"pg": "87-89", "q": "........... well, he would have gone out for a walk.", "o": ["Were he", "Were he to feel", "Had he", "Had he been"], "c": 3, "e": "would have gone (شرط ثالث)، وfeel صفة/حالة (well) تحتاج فعل be: Had he been (well)."}, {"pg": "87-89", "q": "Unless you ........... your car engine fixed, you wouldn't have been able to drive to work that day.", "o": ["have", "didn't have", "had had", "hadn't had"], "c": 2, "e": "wouldn't have been able (شرط ثالث)، وUnless = if not، فتحتاج صيغة مثبتة: had had (تركيب سببية: لو لم تكن قد أصلحت)."}, {"pg": "87-89", "q": "........... for his sincere advice, we would have a lot of troubles.", "o": ["If it isn't", "Unless it isn't", "If it weren't", "If it hadn't been"], "c": 2, "e": "would have (شرط ثانٍ في النتيجة): If it weren't for (لولا)."}, {"pg": "87-89", "q": "........... get her certificate, she would be able to start her career.", "o": ["Was Amany", "Were Amany to", "Will Amany to", "Can Amany"], "c": 1, "e": "would be able (شرط ثانٍ)، وصيغة القلب: Were Amany to get."}, {"pg": "87-89", "q": "If you feel tired, ........... a rest for a few 10 minutes.", "o": ["will take", "take", "wouldn't take", "won't take"], "c": 1, "e": "شرط أول (نصيحة/حقيقة عامة)، وجواب الشرط أمر: take."}, {"pg": "87-89", "q": "........... hard, he would join the main team.", "o": ["If he trains", "Were he to train", "Unless he trained", "Had he trained"], "c": 1, "e": "would join (شرط ثانٍ)، وصيغة القلب: Were he to train."}, {"pg": "87-89", "q": "........... you lived on the moon, how would you feel?", "o": ["In case", "Supposing", "Provides", "Imagined"], "c": 1, "e": "Supposing (لنفترض) تُستخدم لطرح فرضية بديلة لـ if."}, {"pg": "87-89", "q": "........... reading enriches knowledge, you should read a lot.", "o": ["In case of", "If", "Without", "Unless"], "c": 1, "e": "If لجملة شرطية حقيقية بسيطة (حقيقة عامة تقود لنصيحة)."}, {"pg": "87-89", "q": "........... passing the driving test is a must, you have to train well for the test.", "o": ["In case of", "Unless", "As long as", "Should"], "c": 2, "e": "As long as (طالما) تربط شرطًا حقيقيًا بنتيجته المنطقية."}, {"pg": "87-89", "q": "If it ........... for the two men who rescued me, I’d probably have drowned.", "o": ["weren't", "hadn't been", "wasn't", "isn't"], "c": 1, "e": "I'd have drowned (شرط ثالث): If it hadn't been for (لولا)."}, {"pg": "87-89", "q": "........... it rain heavily, I'd stay indoors.", "o": ["If", "Unless", "Providing", "Should"], "c": 3, "e": "Should + فاعل + مصدر صيغة شرطية رسمية بديلة لـ If it should rain."}, {"pg": "87-89", "q": "........... your help, I would have lost my life.", "o": ["Without", "If it weren't for", "In case", "If it hadn't for"], "c": 0, "e": "would have lost (شرط ثالث)، وWithout (بدون/لولا) + اسم مباشرة: Without your help."}, {"pg": "87-89", "q": "Only use this device ........... danger.", "o": ["in case of", "as long as", "in case", "if"], "c": 0, "e": "in case of + اسم (حالة الخطر): in case of danger."}, {"pg": "87-89", "q": "You can go to the park ........... you are home at eight o'clock.", "o": ["as long", "imagine", "in case", "supposing"], "c": 0, "e": "as long as (طالما) شرط لتحقيق إذن: as long as."}, {"pg": "87-89", "q": "If I were a plumber, I’d replace that broken pipe. However, I ........... a plumber!", "o": ["am not", "wasn't", "am", "was"], "c": 0, "e": "الجملة الشرطية النوع الثاني افتراضية (غير حقيقية)، والحقيقة الفعلية في الحاضر منفية: I am not."}, {"pg": "87-89", "q": "........... he understand the lesson if he read the summary?", "o": ["Can", "Did", "Will", "Would"], "c": 3, "e": "if + Past Simple (read) في جملة الشرط = شرط ثانٍ، فالسؤال بصيغة would: Would."}, {"pg": "87-89", "q": "If metal is heated it ........... .", "o": ["expands", "would expand", "expand", "will expand"], "c": 0, "e": "الشرط الصفري (Zero Conditional) لحقيقة علمية ثابتة: if + مضارع بسيط + مضارع بسيط."}, {"pg": "87-89", "q": "You should back up your files regularly ........... you don't lose important data.", "o": ["unless", "although", "so that", "because"], "c": 2, "e": "so that (لكي) تربط فعلًا بغرضه."}, {"pg": "87-89", "q": "........... the heavy rain, the roads became dangerously slippery.", "o": ["Because of", "Because", "Though", "While"], "c": 0, "e": "Because of + اسم (the heavy rain) للسببية."}, {"pg": "87-89", "q": "The company was fined ........... it had breached safety regulations.", "o": ["owing to", "since", "so that", "as the result of"], "c": 1, "e": "since (بما أن) + جملة فعلية كاملة للسببية."}, {"pg": "87-89", "q": "Teachers endeavor to do their tasks properly ........... the challenges they have.", "o": ["although", "because", "due to", "despite"], "c": 3, "e": "despite + اسم/Gerund (the challenges) للتضاد رغم وجود صعوبات."}, {"pg": "87-89", "q": "I arrived at the meeting late ........... the traffic congestion.", "o": ["because", "so", "due to", "therefore"], "c": 2, "e": "due to + اسم (traffic congestion) للسببية."}, {"pg": "87-89", "q": "........... they had been waiting in line all night, I was sure they'd get tickets.", "o": ["As though", "Because of", "Since", "Until"], "c": 2, "e": "Since (بما أن) + جملة فعلية كاملة للسببية."}, {"pg": "87-89", "q": "........... doing extreme sports is dangerous, some people like it.", "o": ["Despite", "Whatever", "Although", "However"], "c": 2, "e": "Although + جملة فعلية كاملة للتضاد."}, {"pg": "87-89", "q": "She had studied hard, ........... she got full marks.", "o": ["Therefore", "Though", "However", "Likewise"], "c": 0, "e": "Therefore (لذلك) تربط سببًا بنتيجته المنطقية."}, {"pg": "87-89", "q": "He hid in a secret place ........... be seen by the police.", "o": ["Even though", "In order not to", "so that", "Though"], "c": 1, "e": "in order not to + مصدر للتعبير عن الغرض السلبي (لكي لا)."}, {"pg": "87-89", "q": "She trained hard for a month ........... she could win the race.", "o": ["so as to", "so that", "in order that", "both b and c"], "c": 3, "e": "so that / in order that كلاهما صحيح للتعبير عن الغرض قبل جملة فعلية كاملة (she could win): both b and c."}, {"pg": "87-89", "q": "Fast ........... he ran, he lost the race.", "o": ["as", "however", "though", "despite"], "c": 0, "e": "صفة/ظرف + as + جملة تركيب تنازلي يعني \"مهما...\": Fast as he ran (رغم سرعته)."}, {"pg": "87-89", "q": "She went to the market ........... she visited her sick aunt.", "o": ["In addition", "going to market", "As well as", "Beside"], "c": 0, "e": "In addition (بالإضافة إلى ذلك) للربط بين جملتين مستقلتين."}, {"pg": "87-89", "q": "........... going to the market, she visited her sick aunt.", "o": ["In addition to", "Beside", "As well", "Furthermore"], "c": 0, "e": "In addition to + Gerund (going) في بداية الجملة."}, {"pg": "92", "q": "He wants to study at ........... University of Oxford.", "o": ["a", "an", "the", "no article"], "c": 2, "e": "أسماء الجامعات ذات تركيب \"University of...\" تسبقها the."}, {"pg": "92", "q": "My friend sent me ........... SMS to invite me to the betrothal next Friday.", "o": ["the", "a", "an", "no article"], "c": 2, "e": "SMS تُنطق بحرف صوتي (إس)، فتسبقها an."}, {"pg": "92", "q": "My friend travelled to ........... Philippines to buy more products.", "o": ["a", "an", "the", "no article"], "c": 2, "e": "أسماء الدول الجمعية/التي تحتوي على مجموعة جزر تسبقها the: the Philippines."}, {"pg": "92", "q": "Excuse me sir. There's ........... Mr. James in the waiting area. He wants to meet you.", "o": ["a", "an", "the", "no article"], "c": 0, "e": "a + اسم علم تعني \"شخص يُدعى...\" (غير معروف من قبل): a Mr. James."}, {"pg": "92", "q": "Don't go far with your imagination. \"A bird in hand is better than ........... dozen on a tree\".", "o": ["the", "a", "few", "no article"], "c": 1, "e": "a dozen تركيب ثابت (عشرة اثنا عشر): a."}, {"pg": "92", "q": "Thank you for ........... advice you gave me.", "o": ["no article", "a", "an", "the"], "c": 3, "e": "the advice محددة بجملة الوصف التالية (you gave me): the."}, {"pg": "92", "q": "I think John is ........... European man.", "o": ["an", "a", "the", "no article"], "c": 1, "e": "European تبدأ بصوت ساكن (يُو)، فتسبقها a."}, {"pg": "92", "q": "In Egypt, students in primary school have to wear ........... uniform.", "o": ["the", "a", "an", "no article"], "c": 1, "e": "uniform اسم معدود مفرد غير محدد: a uniform."}, {"pg": "92", "q": "........... poem I read yesterday is really interesting.", "o": ["A", "An", "The", "no article"], "c": 2, "e": "القصيدة محددة بجملة الوصف التالية (I read yesterday): The."}, {"pg": "92", "q": "........... tiger is a meat eater.", "o": ["No article", "The", "An", "A"], "c": 1, "e": "The + اسم مفرد للحديث عن الفصيلة/النوع ككل (generic use): The tiger."}, {"pg": "92", "q": "The biggest continent is ........... Asia.", "o": ["the", "no article", "a", "an"], "c": 1, "e": "أسماء القارات لا تسبقها أداة تعريف: Asia (no article)."}, {"pg": "92", "q": "I’m reading ........... interesting book.", "o": ["the", "an", "no article", "a"], "c": 1, "e": "interesting تبدأ بصوت متحرك: an."}, {"pg": "92", "q": "You shouldn't mix with bad friends; ........... better alone than in ........... bad company.", "o": ["no article", "a", "the", "an"], "c": 0, "e": "تعبير مأثور شائع بدون أداة نكرة في هذا التركيب الاصطلاحي: no article (Better alone than in bad company)."}, {"pg": "92", "q": "I live in ........... Arab Republic of Egypt.", "o": ["the", "no article", "an", "a"], "c": 0, "e": "الأسماء الرسمية المركبة للدول (Republic of...) تسبقها the."}, {"pg": "92", "q": "She lost ........... hope and decided to give up.", "o": ["an", "a", "no article", "the"], "c": 2, "e": "hope هنا اسم غير معدود عام (لا أداة): no article (lost hope)."}, {"pg": "93-95", "q": "The teacher asked us ........... quiet.", "o": ["to be", "be", "being", "is"], "c": 0, "e": "ask someone + to + مصدر تركيب ثابت: to be."}, {"pg": "93-95", "q": "He must be the new teacher. The modal “must” shows ........... .", "o": ["obligation", "strong deduction", "permission", "advice"], "c": 1, "e": "must هنا للاستنتاج القوي (تخمين منطقي) وليس للإلزام: strong deduction."}, {"pg": "93-95", "q": "She might be at the library. Here “might” expresses ........... .", "o": ["possibility", "certainty", "permission", "obligation"], "c": 0, "e": "might تعبر عن احتمال ضعيف غير مؤكد: possibility."}, {"pg": "93-95", "q": "This machine ........... the clothes automatically.", "o": ["washes", "is washing", "washed", "wash"], "c": 0, "e": "حقيقة/وظيفة ثابتة للآلة = Present Simple: washes."}, {"pg": "93-95", "q": "The project ........... by engineers at the moment.", "o": ["is being designed", "designs", "was designed", "design"], "c": 0, "e": "at the moment + المشروع يتلقى الفعل = Present Continuous Passive: is being designed."}, {"pg": "93-95", "q": "Today, many companies ........... repetitive tasks done by machines.", "o": ["make", "do", "have", "allow"], "c": 2, "e": "have something done (تركيب سببية: المهام تُنجَز بواسطة الآلات): have."}, {"pg": "93-95", "q": "He told me ........... that button.", "o": ["not touch", "not to touch", "to not touch", "no touching"], "c": 1, "e": "tell someone + not + to + مصدر: not to touch."}, {"pg": "93-95", "q": "Compound adjectives are often joined by a ........... when they appear before the noun they modify.", "o": ["comma", "hyphen", "space", "dash"], "c": 1, "e": "الصفات المركبة تُوصل بشرطة (hyphen) قبل الاسم الذي تصفه."}, {"pg": "93-95", "q": "He is a scientist who is known all over the world. He is a ........... scientist.", "o": ["world-known", "known-world", "famous-world", "wide-famous"], "c": 0, "e": "صفة مركبة ثابتة تعني \"معروف عالميًا\": world-known."}, {"pg": "93-95", "q": "I took a photo of a turtle that moves slowly. I took a photo of a ........... turtle.", "o": ["slowly-moving", "slow-moving", "move-slowly", "slow-move"], "c": 1, "e": "صفة مركبة (صفة+اسم فاعل ing): slow-moving."}, {"pg": "93-95", "q": "A friend is designing our website. We are ........... .", "o": ["having our website designed", "getting our website designing", "having a friend designing our website", "get our website designed"], "c": 0, "e": "تركيب سببية صحيح (have something done): having our website designed."}, {"pg": "93-95", "q": "They asked if ........... meet earlier.", "o": ["they can", "could we", "we can", "they could"], "c": 3, "e": "سؤال غير مباشر يحافظ على ترتيب الجملة الخبرية، وcan تتحول إلى could في الكلام المنقول: they could."}, {"pg": "93-95", "q": "A technician is installing their internet. They are ........... .", "o": ["getting their internet installed", "having their internet installing", "getting a technician installing their internet", "have their internet installed"], "c": 0, "e": "تركيب سببية صحيح (get something done): getting their internet installed."}, {"pg": "93-95", "q": "A tailor will make her dress. She will ........... .", "o": ["get a tailor make her a dress", "get her dress made", "have her dress making", "have a tailor making her a dress"], "c": 1, "e": "تركيب سببية صحيح (get something done): get her dress made."}, {"pg": "93-95", "q": "A dentist checked his teeth. He ........... .", "o": ["got his teeth checked", "had his teeth checked", "had a dentist check his teeth", "all of these"], "c": 3, "e": "جميع الصيغ الثلاث صحيحة نحويًا للتعبير عن نفس المعنى (تركيب سببية بأشكاله المختلفة): all of these."}, {"pg": "93-95", "q": "He ........... he could swim fast.", "o": ["ordered", "asked", "told", "said"], "c": 3, "e": "said بدون مفعول به مباشر (بدون شخص محدد بعدها) هي الصحيحة نحويًا هنا: said."}, {"pg": "93-95", "q": "Employers now have staff ........... skills like communication and critical thinking.", "o": ["develop", "developing", "developed", "to develop"], "c": 0, "e": "have + شخص + مصدر بدون to (يقوم الموظفون بأنفسهم بتطوير المهارات): develop."}, {"pg": "93-95", "q": "He asked me where ........... to eat.", "o": ["I want", "did I want", "I wanted", "do you want"], "c": 2, "e": "سؤال غير مباشر بترتيب الجملة الخبرية، وتحول الزمن للماضي: I wanted."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["He admitted to break my favorite mug.", "He admitted that breaking my favorite mug.", "He admitted breaking my favorite mug.", "He admitted to have broken my favorite mug."], "c": 2, "e": "admit + Gerund تركيب ثابت للاعتراف بفعل ماضٍ: admitted breaking."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["She suggested going bowling.", "She suggested to go bowling.", "She suggested that we going bowling.", "She suggested us to go bowling."], "c": 0, "e": "suggest + Gerund تركيب ثابت: suggested going."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["He is a eight-year-old boy.", "He is an eight-years-old boy.", "He is an eight-year-old boy.", "He is a eight year old boy."], "c": 2, "e": "الصفة المركبة العددية تكون مفردة وموصولة بشرط، وeight تبدأ بصوت متحرك فتسبقها an: an eight-year-old boy."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["We stayed in a five-star hotel.", "We stayed in a five stars hotel.", "We stayed in a five-stars hotel.", "We stayed in a five star hotel."], "c": 0, "e": "الصفة المركبة العددية تكون مفردة وموصولة بشرطة: a five-star hotel."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["He is a self made man", "He is a self-made man.", "He is a self-making man.", "He is a self-make man."], "c": 1, "e": "صفة مركبة ثابتة (Past Participle): self-made."}, {"pg": "93-95", "q": "Which sentence is structurally correct?", "o": ["I will have my teeth check tomorrow.", "I will have checked my teeth tomorrow.", "I will have the dentist check my teeth tomorrow.", "I will have the dentist to check my teeth tomorrow."], "c": 2, "e": "have + شخص + مصدر بدون to (تركيب سببية بفاعل محدد): have the dentist check."}, {"pg": "93-95", "q": "A new product ........... by the company every year.", "o": ["launching", "launches", "is launched", "launch"], "c": 2, "e": "حقيقة/عادة متكررة (every year) والمنتج يتلقى الفعل = Present Simple Passive: is launched."}, {"pg": "93-95", "q": "They ........... the movie before we joined them at the cinema.", "o": ["had seen", "saw", "have seen", "were seeing"], "c": 0, "e": "before we joined: سبق حدثًا ماضيًا آخر = Past Perfect: had seen."}, {"pg": "93-95", "q": "When I called, he ........... for two hours.", "o": ["had been studying", "studied", "has studied", "studies"], "c": 0, "e": "الفعل الرئيسي ماضٍ (called)، والفعل الآخر مستمر لمدة قبله = Past Perfect Continuous."}, {"pg": "93-95", "q": "She looked exhausted because she ........... for hours.", "o": ["has run", "running", "had been running", "runs"], "c": 2, "e": "الفعل الرئيسي ماضٍ (looked)، والسبب استمر لمدة قبله = Past Perfect Continuous."}, {"pg": "93-95", "q": "She was tired because she ........... all night.", "o": ["worked", "has worked", "had been working", "works"], "c": 2, "e": "الفعل الرئيسي ماضٍ (was)، والسبب استمر لمدة قبله (all night) = Past Perfect Continuous."}, {"pg": "93-95", "q": "The police ........... the thief last night.", "o": ["was caught", "had caught", "caught", "is caught"], "c": 2, "e": "زمن ماضٍ محدد (last night) والشرطة فاعل حقيقي (مبني للمعلوم) = caught."}, {"pg": "93-95", "q": "The bridge ........... in 2010.", "o": ["built", "was built", "has built", "builds builds"], "c": 1, "e": "زمن ماضٍ محدد (in 2010) والجسر يتلقى الفعل = Past Simple Passive: was built."}, {"pg": "93-95", "q": "She enjoys ........... to music in her free time.", "o": ["listen", "listening", "to listen", "listened"], "c": 1, "e": "enjoy + Gerund تركيب ثابت: listening."}, {"pg": "93-95", "q": "He decided ........... abroad for further studies.", "o": ["going", "go", "to go", "gone"], "c": 2, "e": "decide + to + مصدر تركيب ثابت: to go."}, {"pg": "93-95", "q": "He can't stand ........... in long queues.", "o": ["wait", "waiting", "to wait", "waited"], "c": 1, "e": "can't stand + Gerund تركيب ثابت: waiting."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["She avoided being late by leaving early.", "She avoided to be late by leaving early.", "She avoided was late by leaving early.", "She avoided be late by leaving early."], "c": 0, "e": "avoid + Gerund تركيب ثابت: avoided being late."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["Someone stole my bag yesterday.", "Someone has stolen my bag yesterday.", "Someone was stolen my bag yesterday.", "Someone is stolen my bag yesterday."], "c": 0, "e": "ظرف زمني ماضٍ محدد (yesterday) لا يتوافق مع Present Perfect، والفاعل الحقيقي (Someone) مبني للمعلوم: stole."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["We were late. The meeting starts when we entered the hall.", "We were late. The meeting starting when we entered the hall.", "We were late. The meeting has started when we entered the hall.", "We were late. The meeting had started when we entered the hall."], "c": 3, "e": "الاجتماع بدأ قبل دخولهم (حدثان ماضيان، أحدهما سابق للآخر) = Past Perfect: had started."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["He had been studying English for three years before he moved to London.", "He was studying English for three years before he moved to London.", "He is studied English for three years before he moved to London.", "He has studied English for three years before he moved to London."], "c": 0, "e": "before he moved (ماضٍ) يسبقه فعل مستمر لمدة = Past Perfect Continuous: had been studying."}, {"pg": "93-95", "q": "Mount Everest is the ........... mountain in the world.", "o": ["high", "higher", "highest", "most high"], "c": 2, "e": "صيغة التفضيل العليا (the + صفة+est) بعد in the world: the highest."}, {"pg": "93-95", "q": "You're coming to the party, ........... you?", "o": ["are", "aren't", "don't", "won't"], "c": 1, "e": "الجملة الأصلية مثبتة (are coming)، فالسؤال المذيل منفٍ: aren't you."}, {"pg": "93-95", "q": "He speaks French, ........... he?", "o": ["does", "doesn't", "isn't", "won't"], "c": 1, "e": "الجملة الأصلية مثبتة في المضارع البسيط (speaks)، فالسؤال المذيل منفٍ: doesn't he."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["That's the movie where won an Oscar.", "That's the movie which won an Oscar.", "That's the movie whose won an Oscar.", "That's the movie who won an Oscar."], "c": 1, "e": "which تصف الأشياء (the movie) كفاعل للفعل التالي (won): which."}, {"pg": "93-95", "q": "You've met them before, ........... you?", "o": ["haven't", "have", "aren't", "didn't"], "c": 0, "e": "الجملة الأصلية مثبتة في Present Perfect ('ve met)، فالسؤال المذيل منفٍ: haven't you."}, {"pg": "93-95", "q": "There is some milk in the fridge, ........... ?", "o": ["is it", "isn't there", "does it", "wasn't there"], "c": 1, "e": "الفاعل الحقيقي there (تركيب there is)، فالسؤال المذيل منفٍ ويكرر there: isn't there."}, {"pg": "93-95", "q": "Which of the following sentences is structurally correct?", "o": ["This bag is more heavier than that one.", "This bag is the most heavy of all.", "This bag is much heavier than that one.", "This bag is heavy than that one."], "c": 2, "e": "صفة قصيرة مقطع واحد (heavy) تأخذ er في المقارنة، وmuch للتوكيد قبلها: much heavier than."}, {"pg": "93-95", "q": "My new phone is ........... than the old one.", "o": ["modern", "more modern", "most modern", "as modern"], "c": 1, "e": "صفة من مقطعين أو أكثر (modern) تأخذ more في المقارنة: more modern."}, {"pg": "93-95", "q": "The hotel ........... we stayed in was very expensive.", "o": ["where", "which", "who", "whose"], "c": 1, "e": "which للأشياء (hotel) كمفعول به لحرف الجر in في نهاية الجملة (in which/which...in): which."}]

let ci=0,ans={},po=false;
const $M=document.getElementById('MC'),$sC=document.getElementById('sC'),$sW=document.getElementById('sW'),$sT=document.getElementById('sT'),$pT=document.getElementById('pTx'),$pF=document.getElementById('pFl'),$bP=document.getElementById('bP'),$bN=document.getElementById('bN'),$ov=document.getElementById('ov'),$nP=document.getElementById('nP'),$nG=document.getElementById('nG'),$cO=document.getElementById('cO'),$sBg=document.getElementById('sBg'),$sNm=document.getElementById('sNm'),$pNav=document.getElementById('pNav');
function ld(){try{const s=localStorage.getItem('samy_grammar_v1');if(s){const d=JSON.parse(s);if(d&&d.a){ans=d.a;ci=d.i!=null&&d.i<Q.length?d.i:0;}}}catch(e){}}
function sv(){try{localStorage.setItem('samy_grammar_v1',JSON.stringify({a:ans,i:ci}));}catch(e){}}
function gs(){let c=0,w=0,t=0;Q.forEach((_,i)=>{const k='q'+i;if(k in ans){t++;if(ans[k]===Q[i].c)c++;else w++;}});return{c,w,t};}
const PICO=["⏳", "🔗", "⏱️", "🔄", "💬", "🎯", "➕", "🎨", "🔢", "🧩", "❓", "🔀", "📰", "📚"];
function bPN(){let h='';SECS.forEach((s,i)=>{const lbl=s.n.split(':')[0];const ic=PICO[i%PICO.length];h+=`<button class="pnBtn" data-i="${i}" title="${s.n}"><span class="pnIcon">${ic}</span><span class="pnLbl">${lbl}</span></button>`;});
 $pNav.innerHTML=h;$pNav.querySelectorAll('.pnBtn').forEach(el=>{el.addEventListener('click',()=>{const i=+el.dataset.i;goT(SECS[i].s);});});}
function ui(){const{c,w,t}=gs();$sC.textContent=c;$sW.textContent=w;$sT.textContent=t;$pT.textContent=t+' من '+Q.length;$pF.style.width=(Q.length?(t/Q.length)*100:0)+'%';$bP.disabled=ci<=0;$bN.disabled=ci>=Q.length-1;
let curI=0;for(let i=0;i<SECS.length;i++){const s=SECS[i];if(ci>=s.s&&ci<=s.e){$sBg.textContent=s.n.split(':')[0];$sNm.textContent=s.n;curI=i;break;}}
$pNav.querySelectorAll('.pnBtn').forEach(el=>{el.classList.toggle('act',+el.dataset.i===curI);});
rNG();}
function rQ(){const q=Q[ci],k='q'+ci,a=k in ans,si=a?ans[k]:-1,ok=a&&si===q.c;
let oh='';for(let i=0;i<q.o.length;i++){let cl='op',ic='';if(a){cl+=' lk';if(i===q.c){cl+=' ok';ic='<span class="oic">&#10003;</span>';}else if(i===si){cl+=' no';ic='<span class="oic">&#10007;</span>';}else cl+=' dm';}
oh+=`<div class="${cl}" data-i="${i}" role="button" tabindex="0"><div class="ol">${LT[i]}</div><div class="otx">${q.o[i]}</div>${ic}</div>`;}
let eh='';if(a){const ec=ok?'ec':'ew',bc=ok?'bc':'bw',bt=ok?'&#10003; إجابة صحيحة':'&#10007; إجابة خاطئة';let ca='';if(!ok)ca=`<div class="eca">الإجابة الصحيحة: ${LT[q.c]}) ${q.o[q.c]}</div>`;eh=`<div class="eb sh ${ec}"><div class="ebg ${bc}">${bt}</div><div class="etx">${q.e}</div>${ca}</div>`;}
let cp='';const{c,w,t}=gs();if(t===Q.length){const p=Math.round((c/Q.length)*100);cp=`<div class="cpb"><h3>&#127942; تمت الإجابة على جميع الأسئلة!</h3><p>نتيجتك النهائية: ${c} صحيح من ${Q.length} (${p}%) — ${w} إجابة خاطئة</p><p style="margin-top:8px;font-size:.85rem;color:var(--tl)">بالتوفيق في الامتحان إن شاء الله!</p></div>`;}
 $M.innerHTML=`<article class="qc"><div class="qh"><div class="qn">السؤال ${ci+1}</div><div class="pr">صفحة <span class="pgb">${q.pg}</span></div></div><div class="qb"><div class="qt">${q.q}</div><div class="og">${oh}</div></div>${eh}</article>${cp}`;
if(!a){$M.querySelectorAll('.op').forEach(el=>{el.addEventListener('click',()=>hA(+el.dataset.i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hA(+el.dataset.i);}});});}
ui();window.scrollTo({top:0,behavior:'smooth'});}
function hA(i){const k='q'+ci;if(k in ans)return;ans[k]=i;sv();rQ();}
function nav(d){const n=ci+d;if(n<0||n>=Q.length)return;ci=n;sv();rQ();}
function goT(i){if(i<0||i>=Q.length)return;ci=i;sv();rQ();if(po)tgP();}
function rNG(){let h='';for(let i=0;i<Q.length;i++){const k='q'+i;let cl='nc';if(i===ci)cl+=' cu';if(k in ans)cl+=(ans[k]===Q[i].c)?' cc':' cw';h+=`<div class="${cl}" data-i="${i}" role="button" tabindex="0">${i+1}</div>`;}
 $nG.innerHTML=h;$nG.querySelectorAll('.nc').forEach(el=>{el.addEventListener('click',()=>goT(+el.dataset.i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goT(+el.dataset.i);}});});}
function tgP(){po=!po;$nP.classList.toggle('op',po);$ov.classList.toggle('sh',po);if(po)rNG();}
 $cO.querySelector('.cby').addEventListener('click',()=>{ans={};ci=0;sv();$cO.classList.remove('sh');if(po)tgP();rQ();});
 $cO.querySelector('.cbn').addEventListener('click',()=>$cO.classList.remove('sh'));
 $bP.addEventListener('click',()=>nav(-1));$bN.addEventListener('click',()=>nav(1));document.getElementById('bG').addEventListener('click',tgP);$ov.addEventListener('click',tgP);document.getElementById('pCl').addEventListener('click',tgP);document.getElementById('bR').addEventListener('click',()=>$cO.classList.add('sh'));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
if(e.key==='ArrowLeft'){e.preventDefault();nav(1);}else if(e.key==='ArrowRight'){e.preventDefault();nav(-1);}else if(e.key==='g'||e.key==='G'){e.preventDefault();tgP();}else if(e.key==='Escape'){if($cO.classList.contains('sh'))$cO.classList.remove('sh');else if(po)tgP();}else if(['1','2','3','4'].includes(e.key)){const i=+e.key-1;const q=Q[ci];if(q&&i<q.o.length&&!('q'+ci in ans)){e.preventDefault();hA(i);}}});
bPN();ld();rQ();
</script>
</body>
</html>
