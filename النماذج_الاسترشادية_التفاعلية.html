ith my mate, …… made me very tired.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">who</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">whom</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">where</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">which</span>"], "c": 3, "e": "which تصف الجملة كلها (الحدث السابق: لعب النهائي)، وليس شخصًا أو مكانًا."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. We insisted………by the school principal to discuss our plans.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">on seeing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">on being seen</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to see</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">in being seen</span>"], "c": 1, "e": "insist on + Gerund، والفاعل يتلقى الفعل (مبني للمجهول: أن نُقابَل) = on being seen."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Salah, who&rsquo;s the happiness maker, score the winning goal.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Salah, whose the happy maker, scored the winning goal.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Salah, who is the happiness maker, score the winning goal.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Salah, who&rsquo;s the happiness maker, scored the winning goal.</span>"], "c": 3, "e": "who's = who is (جملة وصل غير تعريفية بين فواصل)، والفعل الرئيسي في الماضي: scored."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>It is said that accepting others is a polite and important quality everyone should have. You can share your own opinion while also respecting what others think.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يُقال إن قبول الآخرين صفة مهذبة وهامة يجب أن يتحلى بها الجميع. يمكنك مشاركة رأيك الخاص مع احترام أفكار الآخرين في الوقت نفسه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يُقال إن إحترام الآخر صفة مهذبة وهامة يجب أن يتحلى بها الجميع. فيمكنهم مشاركة رأيهم الخاص مع احترام أفكار الآخرين في الوقت نفسه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يُقال إن قبول الآخرين صفة مهذبة وهامة يجب أن يتخلى عنها الجميع. فيمكنك مشاركة رأيك الخاص مع احترام أفكار الآخرين في الوقت نفسه.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يُقال إن قبول واحترام الآخرين صفة مهذبة وهامة يجب أن يتحلى بها البعض. يمكنك مشاركة رأيك الخاص مع احترام أفكار الآخرين في الوقت نفسه.</span>"], "c": 0, "e": "الخيار (a) وحده يترجم المعنى والضمائر بدقة كاملة؛ الخيار (c) يعكس المعنى بـ“يتخلى عنها” بدلاً من “يتحلى بها”، و(b) و(d) يغيّران الضمائر أو نطاق الجملة (البعض بدل الجميع)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Global warming is not only a future danger to our health; it is already causing thousands of deaths every year, according to experts at the World Health Organization.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">ظاهرة الاحتباس الحراري ليس مجرد خطر مستقبلي على صحتنا؛ بل إنها قد تسببت بالفعل في آلاف الوفيات كل يوم، وفقًا للخبراء في مؤسسة الصحة العالمية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الاحتباس الحراري ليس مجرد خطر مستقبلي على صحتنا؛ بل إنه يتسبب بالفعل في آلاف الوفيات كل عام، وفقًا للخبراء في منظمة الصحة العالمية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">ظاهرة الاحتباس الحراري مجرد خطر مستقبلي على صحتنا؛ حيث إنه يتسبب بالفعل في آلاف الوفيات سنويًا، وفقًا للخبراء في مؤسسة الصحة العالمية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الاحتباس الحراري بالإضافة الى انه يؤمن مستقبلنا الصحي؛ فهو يتسبب بالفعل أيضًا في آلاف الوفيات سنويًا، وفقًا للخبراء في منظمة الصحة العالمية.</span>"], "c": 1, "e": "الخيار (b) هو الترجمة الدقيقة: “every year” = كل عام (وليس كل يوم)، و“World Health Organization” = منظمة الصحة العالمية (الاسم الرسمي الصحيح)؛ الخيار (c) يحذف “ليس” فيعكس المعنى تمامًا، و(d) يجعل الاحتباس الحراري أمرًا إيجابيًا خطأً."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>يعتقد الأطباء أن الأطفال يجب أن يمارسوا الرياضة. فممارسة الرياضة ممتعة. كما يمكن أن يكون لها آثار إيجابية على الأطفال مما يؤدي إلى تعديل السلوك العدواني لدى بعض منهم.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Doctors belief that children should practice sports. Practicing sports is enjoyable. However, it can also have positive effects on children, leading to the increasing of aggressive behavior in some children.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Doctors belief that children should practice sports. Practicing sports is enjoyable. It can also have positive affects on children, leading to the modification of some children&rsquo;s aggressive behavior.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Doctors believe that children should practice sports. Practicing sports is enjoyable. It can also have positive effects on children, leading to the modification of some children&rsquo;s aggressive behavior.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Doctors believe that children should practice sports. Practicing sports is enjoyable. It can also have passive effects on children, leading to the increasing of aggressive behavior in some children.</span>"], "c": 2, "e": "الخيار (c) هو السليم تمامًا: believe (فعل، وليس belief الاسم) وpositive effects (وليس affects) وmodification (تعديل، وليس increasing زيادة)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>أكدت الدراسات الحديثة أن الأجهزة المنزلية المتطورة لم تغير فقط طريقة إنجاز المهام اليومية، بل ساعدت أيضًا في تعزيز الكفاءة وتوفير الوقت وتقليل الاعتماد على العمل اليدوي.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Recent studies confirmed that sophisticated household appliances not only changed the way daily chores are completed, but also helped enhance efficiency, save time, and reduce reliance on manual labor.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Recent studies confirmed that sophisticated household appliances only changed the way daily chores are completed, but also helped enhance efficiency, waste time, and reduce reliance on manual labor.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Recent studies confirmed that sophisticated household appliances not only changed the way daily chores are completed, but also helped weaken efficiency, save time, and reduce reliance on manual labor.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Recent studies confirmed that sophisticated household appliances not only charged the way daily chores are completed, but also helped enhance efficiency, save money, and reduce reliance on manual labor.</span>"], "c": 0, "e": "الخيار (a) وحده يطابق المعنى تمامًا (not only...but also / enhance efficiency / save time)؛ باقي الخيارات تحذف “not” أو تستبدل كلمات بمعانٍ عكسية (waste/weaken/charged/money)."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. How do the reactions of Dantes&rsquo; friends and family to his arrest reveal their true personalities and feelings towards him?</span>", "model": "The reactions of those around Edmond Dantès at his arrest reveal their true characters. His father, Monsieur Dantès, is devastated and heartbroken, showing genuine and unconditional love for his son, and he eventually dies of grief and poverty in Edmond's absence. In contrast, Fernand and Danglars, who had pretended to be Edmond's friend and colleague, are revealed as false and treacherous, since it was their own jealousy and greed that caused his arrest in the first place. Mercédès, though she mourns Edmond, eventually shows a weaker, more practical side by marrying Fernand, revealing that her loyalty was not as strong as Edmond had believed. Through these different reactions, the novel exposes who truly cared for Edmond and who was only ever pretending.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. Friendship is something difficult to find in The Count of Monte Cristo. Explain giving two examples from the novel.</span>", "model": "The novel repeatedly shows how rare true friendship is. First, the men Edmond considered close friends and colleagues, Fernand and Danglars, betray him out of jealousy and greed, proving that their apparent friendship was never genuine. Second, even Mercédès, who was supposed to love Edmond faithfully, eventually marries his enemy Fernand instead of waiting for or searching for him, showing that even the people closest to him failed to remain loyal. These examples show that in the world of the novel, real, selfless friendship is extremely rare, while most relationships are driven by self-interest.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of about SIX (6) lines on the following topic: &ldquo;Actions speak louder than words&rdquo;</span>", "model": "The saying “actions speak louder than words” reminds us that what people actually do matters far more than what they say they will do. A person can make endless promises, but only real actions prove their sincerity and commitment. For example, a friend who says they care about you but never helps when you are in need shows far less loyalty than a quiet friend who always shows up to support you. Similarly, a leader who genuinely serves their community through real projects earns more trust than one who only makes grand speeches. In conclusion, true character and intentions are revealed not through words, but through consistent, meaningful actions.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. A balanced diet is very…………. for our health.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">beneficial</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">benefit</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">beneficence</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">benefitted</span>"], "c": 0, "e": "بعد “very” نحتاج صفة: beneficial (مفيد)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. Many ……… products, such as cleaning items, have become more expensive lately.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">outdoor</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">office</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">travel</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">household</span>"], "c": 3, "e": "household products تعني “منتجات منزلية”، وهذا يناسب “cleaning items”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. Falling in the street was the most………... situation I have faced.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lively</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mortifying</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">surprising</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">cheerful</span>"], "c": 1, "e": "mortifying تعني “مُخجل/محرج للغاية”، وهي الأنسب لموقف السقوط في الشارع."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. The previous ………. in Japan was famous for its beautiful art and strong rulers.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dynasty</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">country</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">state</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">continent</span>"], "c": 0, "e": "dynasty تعني “سلالة حاكمة”، وهي المناسبة مع الحديث عن حكام أقوياء وفن جميل."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. When I laughed too much, I got a stitch in my side. This means that I felt a……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">line of sewing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sudden pain</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">type of fabric</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">small scar</span>"], "c": 1, "e": "“a stitch in my side” تعبير يعني “ألمًا مفاجئًا” في الخاصرة نتيجة الضحك أو الجري الشديد."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. It's important to ……... friendships even when life gets busy.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">create</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">improve</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">maintain</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">protest</span>"], "c": 2, "e": "maintain تعني “يحافظ على”، وهي الأنسب مع الحفاظ على الصداقات رغم انشغال الحياة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. The marketing team had to …….…. of workload after two members resigned.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hand over</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bear the brunt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">take a break</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">make excuses</span>"], "c": 1, "e": "“bear the brunt of” تعبير اصطلاحي يعني “يتحمل العبء الأكبر من”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. You can always…………... on your friends in times of need.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rely</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">keep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">focus</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">go</span>"], "c": 0, "e": "rely on تعبير ثابت يعني “يعتمد على”، وهو المناسب مع الأصدقاء وقت الحاجة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9 - Five hundred pounds………………. too much for this pair of shoes.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is</span>"], "c": 3, "e": "المبالغ المالية تُعامَل ككتلة واحدة (مفرد): is."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. Lara got low marks; she ………. have joined the faculty she wanted.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shouldn&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">might</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">couldn&rsquo;t</span>"], "c": 3, "e": "نتيجة مؤكدة منطقيًا عن استحالة حدوث أمر في الماضي بسبب الدرجات المنخفضة = couldn't have."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. Students will have a break after they have finished ………………their test.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to do</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">to doing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">done</span>"], "c": 1, "e": "finish + Gerund تركيب ثابت: doing."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The main idea of the passage is that sleep………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is a simple rest period with minimal activity in the body and brain</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is an active and essential biological process vital for physical, mental, and emotional health</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is not necessary for overall health</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has no connection to brain activity</span>"], "c": 1, "e": "يوضح النص أن النوم عملية بيولوجية نشطة وضرورية للصحة الجسدية والعقلية والعاطفية.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Sleep is one of the body&rsquo;s most essential functions, yet it remains one of the least understood. For centuries, scientists believed that sleep was simply a passive state of rest. However, recent research has revealed that while the body may appear still, the brain is surprisingly active. During sleep, it processes memories, regulates hormones, and repairs tissues &mdash; all critical functions for mental and physical health.</p><p>The human sleep cycle is divided into several stages, including light sleep, deep sleep, and REM (Rapid Eye Movement) sleep. Each stage plays a unique role: deep sleep helps the body recover physically, while REM sleep supports learning and emotional balance. People who lack enough REM sleep often struggle with focus, mood swings, and poor memory.</p><p>During our lifetime, we probably spend 25 years or more sleeping. But why? What is the purpose of sleep? Some scientists think we sleep in order to replenish brain cells. Other scientists think that sleep helps the body to grow and to relieve stress.</p><p>Technology, stress, and modern lifestyles have significantly disrupted natural sleep patterns. Blue light from screens delays the release of melatonin &mdash; the hormone responsible for making us sleepy. Scientists recommend turning off electronic devices at least one hour before bed and maintaining a consistent bedtime routine. Sleep is not a luxury; it&rsquo;s a biological necessity. Understanding its complexity allows us to appreciate that a good night&rsquo;s sleep is as vital as proper nutrition or exercise.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. According to the passage, the writer mainly discusses………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dreams and their meanings</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the stages and importance of sleep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">modern technology</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the causes of stress and sleeplessness</span>"], "c": 1, "e": "يتناول النص مراحل النوم المختلفة وأهمية كل مرحلة للجسم والعقل."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. Which of the following summarizes the third paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Scientists suggest different reasons why people need sleep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Sleep is mainly important for dreaming and imagination</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Modern life makes it easy for people to get enough sleep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Scientists still know nothing about sleep</span>"], "c": 0, "e": "الفقرة الثالثة تعرض آراء علمية متعددة حول سبب حاجتنا للنوم."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. REM' sleep mainly supports……………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Physical recovery and tissue repair</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emotional and mental balance</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Improved blood circulation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Muscle strength and growth</span>"], "c": 1, "e": "ذكر النص أن REM sleep يدعم التعلم والتوازن العاطفي."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. According to the passage, we can infer that people who use screens before bed …</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">enjoy deeper and longer sleep</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are likely to fall asleep more easily</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">may experience sleep problems</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">produce higher levels of melatonin</span>"], "c": 2, "e": "الضوء الأزرق من الشاشات يؤخر إفراز الميلاتونين، مما قد يسبب مشاكل في النوم."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. If someone lacks sleep, they …………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have sharper memory</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">may suffer from stress and poor focus</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will become more energetic during the day</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">may completely stop dreaming</span>"], "c": 1, "e": "قلة النوم ترتبط بضعف التركيز وزيادة التوتر كما ذكر النص."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. In spite of the importance of having enough sleep, ………... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">being awake all the time is very healthy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">scientists think sleep only helps body grow</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dreams have great influence on our lifestyle</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stress and modern life styles have negative effect on it</span>"], "c": 3, "e": "رغم أهمية النوم، أشار النص إلى أن التكنولوجيا والتوتر ونمط الحياة الحديث تعطل أنماط النوم الطبيعية."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. How does the writer feel about sleep?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It&rsquo;s unimportant. It is just a part of peoples&rsquo; daily routine.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It is sometimes less important than work or study</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It&rsquo;s a vital and biological need.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">It&rsquo;s a temporary escape from daily stress and a waste of time.</span>"], "c": 2, "e": "أكد الكاتب أن النوم “ليس رفاهية بل ضرورة بيولوجية”."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the passage is that Maya …………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">learns to forgive herself and find peace through friendship and memory</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">feels lost after returning to her hometown and remembering her friends</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">regrets leaving her friend and feels sad all her life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">recalls her friendship and realizes that healing takes time</span>"], "c": 0, "e": "تدور القصة حول رحلة مايا نحو مسامحة نفسها وإيجاد السلام من خلال ذكرى صديقتها.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>It was a cold January morning when Maya stood at the edge of the old bridge, staring at the river below. She had returned to her hometown after ten long years. She was doing her post graduate studies in London. Everything looked smaller now &mdash; the trees, the houses, even the bridge where she and her best friend, Hana, used to spend hours talking about their dreams. But Hana was gone. The accident had taken her life a week after Maya left for college.</p><p>Maya had never forgiven herself for not being there. She had thrown herself into work, pretending that success could fill the empty space inside her. Yet, every achievement reminded her of the promise she&rsquo;d broken &mdash; to come back and visit Hana before winter.</p><p>As she walked across the bridge, she felt the wind brush against her face, carrying the faint scent of pine trees. For the first time in years, she didn&rsquo;t rush. She stopped in the middle, closed her eyes, and whispered, &ldquo;I&rsquo;m sorry.&rdquo;</p><p>Suddenly, a soft drizzle began to fall. Maya smiled through her tears. It was as if the town itself was forgiving her, washing away the guilt she had carried for so long. She realized she couldn&rsquo;t change the past, but she could honor Hana&rsquo;s memory by living fully again. When she finally turned to leave, the sun broke through the clouds, lighting the river with golden reflections. Maya felt more relaxed than she had in years &mdash; free at last.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. Where did the story mainly take place?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">In Maya&rsquo;s office in London.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">In a hospital after the accident.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">At the old bridge in Maya's hometown.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">In a classroom at a college.</span>"], "c": 2, "e": "دارت أحداث القصة الرئيسية عند الجسر القديم في مسقط رأس مايا."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. Which of the following sentences summarizes the third paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Maya returns home and finds a new job.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Maya visits her friend to ask for advice.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Maya plans to leave her town forever.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Maya faces her guilt and finds peace.</span>"], "c": 3, "e": "الفقرة الثالثة تصف لحظة اعتذار مايا الصامت ومواجهتها لشعورها بالذنب."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. In the story, the bridge symbolizes a/an……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">physical distance between two cities</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">connection between past and present</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dangerous place filled with memories</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">quiet spot Maya often visited</span>"], "c": 1, "e": "الجسر يمثل رمزيًا الصلة بين ذكريات مايا الماضية مع هانا وحاضرها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. Maya feels relaxed at the end of the story; this infers that Maya………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decided to move away</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">forgave herself and let go of guilt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">met someone who helped her to forget the past</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">returned to her hometown after many years</span>"], "c": 1, "e": "شعورها بالراحة في النهاية يدل على أنها سامحت نفسها وتخلصت من الشعور بالذنب."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. After this visit, Maya is likely to …………………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">forget her past completely</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stop working and stay home</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">live more meaningfully and appreciate life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">leave her hometown and return to London</span>"], "c": 2, "e": "بعد أن وجدت السلام الداخلي، من المرجح أن تعيش مايا حياتها بمعنى أعمق وتقدّر الحياة أكثر."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. In your opinion, there is a conflict in the story between Maya and ………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">herself</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">nature</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">her family</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Hana</span>"], "c": 0, "e": "الصراع الأساسي في القصة داخلي، بين مايا وشعورها بالذنب تجاه نفسها."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. According to the passage, how does Maya&rsquo;s emotional state evolve from the beginning to the end?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">from anger to calmness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">from pride to fear</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">from sadness to despair</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">from guilt to inner peace</span>"], "c": 3, "e": "انتقلت مايا من الشعور بالذنب في بداية القصة إلى السلام الداخلي في نهايتها."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. He asked me when I'd be ready for the journey to France.<br>Which of the following is the direct form for the above reported sentence?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said to me, \"When you'll be ready for the journey to France?\"</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said to me, \"When will you be ready for the journey to France?\"</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said to me, \"When have you been ready for the journey to France?\"</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said to me, \"When will he be ready for the journey to France?\"</span>"], "c": 1, "e": "في الكلام المباشر يعود ترتيب السؤال (فعل مساعد + فاعل)، وwould تعود will، وI تعود you."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Your mobile ………….by next Friday.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have fixed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is going to be fixed</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is going to fix</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have been fixed</span>"], "c": 3, "e": "by + نقطة زمنية مستقبلية + الهاتف يتلقى الفعل (مبني للمجهول) = Future Perfect Passive: will have been fixed."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30 – If he had worked harder, he ……………in a better position.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could be</span>"], "c": 2, "e": "if + Past Perfect (had worked) = شرط ثالث، فجواب الشرط: would have been."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31- Which sentence is grammatically correct to express a habit in the past?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I wouldn't work for ten hours a day.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I don't use to work hard in the past.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I get used to working for the company.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">I'm used to working for ten hours a day.</span>"], "c": 0, "e": "Would تُستخدم للعادات المتكررة في الماضي، وهي الصياغة الصحيحة الوحيدة نحويًا بين الخيارات."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32- ……... his homework, Adam went to the club.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Been finishing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Had finished</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Having finished</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Would finish</span>"], "c": 2, "e": "Having + P.P. تدل على إتمام فعل قبل فعل آخر في الماضي (Perfect Participle للتعبير عن السبق الزمني)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33- She …………. ………… to clean the house yesterday.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">got the maid</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has the maid</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">got</span>"], "c": 0, "e": "تركيب السببية get someone to do something (طلبت من الخادمة أن تنظف): got the maid (to clean)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34- I just wish I …………. harder this year. I really didn't work hard.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had worked</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">work</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">worked</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could work</span>"], "c": 0, "e": "Wish + Past Perfect للتعبير عن ندم على شيء لم يحدث في الماضي."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35- A good blog post should include………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">images without text</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a catchy title</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">biographies</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a list of laws</span>"], "c": 1, "e": "a catchy title (عنوان جذاب) من أهم عناصر كتابة مقال إلكتروني ناجح."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Coral reefs, which are often called the rainforests of the sea, support countless marine species. Their delicate ecosystems face severe threats from climate change and human activities.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تُعرف الشعاب المرجانية باسم \"غابات البحر المطيرة\"، إذ تدعم عددًا لا يحصى من الكائنات البحرية. فإن أنظمتها البيئية الهشة تواجه تهديدات خطيرة نتيجة التغيرات المناخية والنشاط البشري.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تُعرف الشعاب المرجانية باسم \"غابات البحر الجافة\"، إذ تدعم عددًا لا يحصى من الكائنات البحرية. الأنظمة البيئية الهشة تواجه تحديات خطيرة نتيجة التغيرات المناخية والنشاط البشري.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تُعرف الشعاب المرجانية باسم \"غابات البحر المطيرة\"، إذ تدعم عددًا ضئيلاً من الكائنات البحرية. الأنظمة البيئية الهشة تواجه تهديدات خطيرة نتيجة التغيرات المناخية والنشاط البري.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تُعرف الشعاب المرجانية باسم \"غابات البحر المطيرة\"، إذ تدعم عددًا لا يحصى من الكائنات البحرية. الأنظمة البيئية الحجرية تواجه تهديدات خطيرة نتيجة التغيرات المناخية والنشاط البحري.</span>"], "c": 0, "e": "الخيار (a) وحده يترجم كل التفاصيل بدقة (rainforests=غابات مطيرة، countless=لا يحصى، human=بشري)؛ باقي الخيارات بها كلمات خاطئة (الجافة/ضئيلاً/البري/الحجرية/البحري)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Countries try hard to preserve the environment. Man&rsquo;s activities have caused natural disasters as the global warming and the climate change, which threaten our lives.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تحاول الدول المحافظة على البيئة. فنشاط الرجل سبب الكوارث مثل الدفء العالمي وتغير المناخ الذي يهدد عالمنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تحاول الدول جاهدة المحافظة على البيئة. وقد تسبب أنشطة الإنسان الكوارث مثل الاحتباس الحراري وتغير المناخ الذي يهدد أن نعيش.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تحاول الدول جاهدة المحافظة على البيئة. وقد تسبب النشاط الإنساني في الكوارث الطبيعية مثل الاحتباس الحراري وتغير المناخ الذي يهدد حياتنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تحاول الدول بصعوبة المحافظة على البيئة. وقد تسبب النشاط الإنساني في الكوارث الطبيعية مثل الدفء العالمي وتغير المناخ الذي يهدد حياتنا.</span>"], "c": 2, "e": "الخيار (c) هو الأدق والأكمل: يترجم “try hard” بـ“جاهدة”، و“threaten our lives” بـ“يهدد حياتنا” بشكل سليم؛ باقي الخيارات تحذف “جاهدة” أو تترجم الجملة الأخيرة بشكل ركيك أو غير دقيق."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>لقد أصبحت التجارة الإلكترونية عملية سهلة حيث شجعت الكثير من الناس على الشراء والبيع إلكترونيًا مما يوفر الوقت والجهد بالإضافة إلى أنها تخلق مجالاً تنافسيًا يفيد المستهلك.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">E-commerce has become an easy process. It has encouraged people to buy and trade electronically. As a result, it saves time and effort, in addition to creating a competitive environment that benefits the consumer.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">E-commerce has became an easy process. It has encouraged people to buy and sell electronically. As a result, it saves time and effort, in addition to create a competitive field that benefits the consumer.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">E-commerce has become an easy process. It has encouraged people to buy and sell electronically. As a result, it saves time and effort, in addition to creating a competitive field that benefits the consumer.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">E-commerce has become an easy process. It has encouraged people trade and sell electronic. As a result, it saves time and effort, in addition to creating a competitive field that benefits the consumer.</span>"], "c": 2, "e": "الخيار (c) هو السليم تمامًا نحويًا (has become، buy and sell، creating)؛ باقي الخيارات بها أخطاء (became بدل become، to create بدل creating، حذف to قبل trade)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>أصبح المتحف المصري الكبير رمزًا للهوية الثقافية الحديثة، إذ يجمع بين العمارة المعاصرة والروح الفرعونية في تجربة فنية مبهرة. كما أنه يهدف إلى الحفاظ على الحضارة المصرية من خلال المعارض المبتكرة والتكنولوجيا المتقدمة.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Grand Egyptian Museum has become a symbol of modern cultural identity, combining contemporary architecture with Pharaonic spirit in an artistic experience. It also aims to preserve the Egyptian civilization through innovative exhibitions and advanced technology.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Grand Egyptian Museum has become a symbol of traditional culture identity, combining classical architecture with Roman spirit in an artistic experience. It also aims to preserve the Egyptian civilization through innovative exhibitions and advanced technology.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Grand Egyptian Museum has become a sign of modern cultural identity, combining traditional architecture with Pharaos spirit in an artistic experience. It also aims to preserve the Egyptian civilization through innovative exhibitions and new technology.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Grand Egyptian Museum have become a symbol of modern cultural identity, combining contemporary architecture with Pharaonic souls in an artistic experience. It also aims to preserve the Egyptian civilization through innovative exhibitions and advanced technology.</span>"], "c": 0, "e": "الخيار (a) هو الترجمة الدقيقة والسليمة نحويًا بالكامل؛ باقي الخيارات بها كلمات خاطئة (traditional/Roman، sign/Pharaos، have بدل has) لا تطابق المعنى الأصلي."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. Edmond&rsquo;s bright future, including forthcoming marriage and being a ship captain, slipped into darkness. Explain giving two examples.</span>", "model": "Edmond's promising future collapsed suddenly through the plots of jealous men. First, on the very day of his wedding celebration to Mercédès, he was arrested on a false charge of treason, arranged by Danglars and Fernand, instantly destroying his dream of marriage and happiness. Second, he had just been offered the position of ship captain by Monsieur Morrel, a huge career achievement, but this too was stolen from him the moment he was thrown into prison, cutting short a promising career before it could even begin.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. Why did Faria share the secret of the treasure with Edmond and how did the treasure change Edmond&rsquo;s life?</span>", "model": "Abbé Faria shared the secret of the treasure with Edmond because he had grown to trust and love him like a son after years of friendship and mentorship in prison, and he had no other way to make use of the treasure himself since he was dying. The treasure completely transformed Edmond's life: it gave him the fortune and freedom he needed to reinvent himself as the Count of Monte Cristo, allowing him to move through high society, carefully investigate his enemies, and carry out an elaborate plan of justice and revenge against those who had destroyed his early life.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of SIX (6) lines on the following topic:<br>&ldquo;Three practical tips on how to prevent bullying among students&rdquo;</span>", "model": "Bullying is a serious problem that schools must work hard to prevent. First, schools should establish clear anti-bullying policies and make sure every student understands the consequences of bullying behaviour. Second, teachers and staff should be trained to recognize the early signs of bullying and to intervene quickly and fairly whenever it occurs. Third, schools should encourage open communication, so that students feel safe reporting incidents without fear of punishment or embarrassment. By combining clear rules, active supervision, and a supportive environment, schools can significantly reduce bullying and help every student feel safe.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. There are still some ……………on importing and exporting goods across the borders of certain countries.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">prescriptions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">directions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">restrictions</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">distractions</span>"], "c": 2, "e": "restrictions تعني “قيود”، وهي المناسبة مع الحديث عن قيود الاستيراد والتصدير عبر الحدود."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. She offered a sincere ……………... to her friend on the impressive presentation.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">complement</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compliment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">commitment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">comment</span>"], "c": 1, "e": "compliment تعني “مجاملة/إطراء”، وهي المناسبة لتهنئة صديقتها على عرضها الرائع."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. To reach the hidden island, you must …… through dangerous reefs and unpredictable tides.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">navigate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mediate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">generate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">elevate</span>"], "c": 0, "e": "navigate تعني “يبحر بحذر عبر”، وهي المناسبة مع الشعاب المرجانية الخطرة والمد المتغير."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. The …………. of the Nile River with the Mediterranean Sea has created the fertile Nile Delta.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">conference</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">diligence</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">influence</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">confluence</span>"], "c": 3, "e": "confluence تعني “التقاء/مصب نهر ببحر”، وهي المناسبة مع تكوّن دلتا النيل."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. After hearing the good news, she began to……………..., overwhelmed by joy.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">weep with relief</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laugh with anger</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">run with fear</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">speak with doubt</span>"], "c": 0, "e": "“weep with relief” تعبير يعني “يبكي من الارتياح/الفرح الشديد”، وهو المناسب مع خبر سعيد."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. Our mission is to ……... forward research that benefits the entire community.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">look</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">pull</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">drive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">slow</span>"], "c": 2, "e": "“drive forward” تعبير ثابت يعني “يدفع بـ/يقود إلى الأمام”، وهو المناسب مع تطوير البحث العلمي."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. The scientists worked tirelessly to …………………. the experiment's accuracy, even though it was unpredictable.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">enhance</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">delay</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reduce</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">polish</span>"], "c": 0, "e": "enhance تعني “يحسّن/يعزز”، وهي المناسبة مع تحسين دقة التجربة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. My friend travelled to…………………Philippines to buy more products.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">no article</span>"], "c": 2, "e": "أسماء الدول الجمعية/التي تحتوي على مجموعة جزر تسبقها the: the Philippines."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. Don't phone me before 10 p.m., I……………………………. a meeting.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be attending</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be attended</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">am attending</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have attended</span>"], "c": 0, "e": "فعل مستمر في لحظة مستقبلية محددة (before 10 p.m.) = Future Continuous: will be attending."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. The new system ……………. regularly to prevent any technical failure.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is maintained</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was maintaining</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can maintain</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are maintained</span>"], "c": 0, "e": "حقيقة/عادة روتينية + النظام يتلقى الفعل (مفرد) = Present Simple Passive: is maintained."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. If I ............... the job, I would have taken it.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had offered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was offered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had been offered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would offer</span>"], "c": 2, "e": "شرط ثالث، وأنا (I) أتلقى الفعل (مبني للمجهول: عُرضت عليّ الوظيفة): had been offered."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The suitable title of this passage is &ldquo;……………….&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The secret communication network of trees</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Trees competition in forests</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The role of fungi in ecosystems</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">How scientists study forests</span>"], "c": 0, "e": "النص يتمحور حول اكتشاف شبكة تواصل سرية بين الأشجار عبر الفطريات تحت الأرض.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Deep within the heart of the Amazon rainforest, a team of biologists made a remarkable discovery. They found that trees communicate through underground networks of fungi called mycorrhizae. These fungi act as natural messengers, transferring nutrients and chemical signals between plants. When a tree is under attack by insects or disease, it releases distress signals through its roots. Nearby trees, sensing the warning, begin producing protective chemicals even before the danger reaches them. This incredible process, known as the &lsquo;Wood Wide Web,&rsquo; reveals that forests are not silent &mdash; they are full of quiet conversations beneath the soil.</p><p>Scientists discovered that stronger trees sometimes share nutrients with younger or shaded trees, ensuring their survival and maintaining balance. This natural cooperation challenges the traditional belief that plants compete for resources; instead, they form a vast, interdependent community. Through advanced sensors and data modeling, researchers confirmed that these exchanges happen continuously, especially in times of stress. The discovery has inspired innovations in environmental science and biotechnology, as engineers explore ways to mimic this system in sustainable farming and data networks.</p><p>It also deepens our understanding of how ecosystems sustain themselves and how fragile they become when disrupted. Every tree, leaf, and drop of rain contributes to a living orchestra that keeps the planet alive. The forest, therefore, is not merely a group of trees &mdash; it is a dynamic network of life built on cooperation, balance, and resilience. By protecting forests, humanity protects its own source of air, water, and inspiration, ensuring that this hidden symphony continues to play for generations to come.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. What detail best helps the reader understand how trees communicate?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Trees grow faster to compete for sunlight.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Trees send chemical alerts through their roots.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Trees release signals when they feel the cold weather</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Trees release signals when their leaves fall.</span>"], "c": 1, "e": "ذكر النص أن الشجرة المهاجَمة “releases distress signals through its roots”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the last paragraph is &ldquo;……………….&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Forests are complex ecosystems where trees share signals and resources</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Scientists study trees because they are beautiful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Amazon forest is larger than any other rainforest</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Mycorrhizae are dangerous to plant health</span>"], "c": 0, "e": "الفقرة الأخيرة تؤكد أن الغابة شبكة حياة معقدة قائمة على التعاون وتبادل الموارد والإشارات."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. Scientists use data to study the forest network as they………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">use satellites to count tree populations</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">apply sensors and modeling to confirm exchanges</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">record animal sounds in the forest</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">measure rainfall in different seasons</span>"], "c": 1, "e": "ذكر النص أن الباحثين أكدوا حدوث التبادلات باستخدام أجهزة استشعار متطورة ونماذج بيانات."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. We can infer about the relationship between trees that they…….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compete for nutrients and water only</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">live without depending on their roots</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">grow faster when isolated from others</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">cooperate to survive and protect each other</span>"], "c": 3, "e": "أظهر النص أن الأشجار تتعاون فيما بينها (مشاركة الموارد والإشارات) للبقاء والحماية المتبادلة."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. Trees&rsquo; underground network is similar to human communication systems as both……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">use signals to share information efficiently</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">need sunlight to function properly</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">transmit data mainly through sound and vibration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stop functioning when natural light disappears</span>"], "c": 0, "e": "كلاهما (شبكة الأشجار وأنظمة التواصل البشرية) يعتمد على إشارات لنقل المعلومات بكفاءة."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. The author suggests that the feelings or intentions behind the trees&rsquo; actions ……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compete for power and domination</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">act as a community focused on balance and care</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ignore the weaker members of their kind</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">survive by avoiding cooperation</span>"], "c": 1, "e": "يصوّر النص الغابة كمجتمع متعاون يهتم بالتوازن ورعاية الأشجار الأضعف."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. If people continue destroying forests, ………………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the balance of natural life will be severely damaged</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">new fungi will appear and restore the ecosystem</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">forests will regrow faster and stronger</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">humans will no longer depend on trees for air survival</span>"], "c": 0, "e": "استمرار تدمير الغابات سيؤدي منطقيًا إلى إضرار بالغ بتوازن الحياة الطبيعية التي وصفها النص."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the passage is &ldquo;……………………&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A neglected bridge is repaired by the community after years of decay</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A worker loses hope after his company closes and gives up entirely</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A designer starts a new career in another country to forget the past</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A man&rsquo;s personal loss inspires him to rebuild both a bridge and his life</span>"], "c": 3, "e": "تدور القصة حول كيف ألهمت خسارة إيثان الشخصية إعادة بناء الجسر وحياته معًا.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Ethan had always taken pride in his creative work at a design company. But when a major project unexpectedly failed, he lost his job and confidence. The sudden change left him anxious and uncertain about his future. Each day felt heavier than the one before, and he often questioned whether his life still had meaning. His world, once full of color and purpose, now seemed gray and empty.</p><p>One morning, during a quiet walk by the river, Ethan noticed the old iron bridge from his childhood. Once bright and strong, it now stood dull, cracked, and forgotten. Its broken boards seemed to reflect his own sense of loss and disappointment. This simple observation sparked an idea: if the bridge could be repaired, maybe his spirit could be restored as well.</p><p>He began cleaning it, removing graffiti, brushing off rust, and replacing worn planks. The work was slow but deeply healing. As the days passed, people from the neighborhood stopped to watch, then started helping. Together they painted the bridge in cheerful colors and added kind messages about hope and renewal.</p><p>The transformation became a story of cause and effect &mdash; Ethan&rsquo;s loss had created a new beginning. The bridge no longer connected only two sides of the river; it connected people. When the work was finally complete, Ethan looked across the bright rails and smiled. He realized that rebuilding the bridge had rebuilt him too. His journey from despair to gratitude showed that broken things, like broken hearts, can always be repaired through patience, teamwork, and faith in new beginnings.</p></div>"}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. Ethan was inspired to repair the bridge because of his………………....</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">desire to earn money and impress his old employer</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">memories of crossing the bridge as a child long ago</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">plan to design a modern bridge for the town mayor</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wish to destroy the old bridge and build a new one</span>"], "c": 1, "e": "لاحظ إيثان الجسر القديم من ذكريات طفولته، مما ألهمه لإصلاحه."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. The sentence that summarizes the second paragraph is that Ethan …………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">saw the broken bridge as a reflection of his own life and began restoring it</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hesitated at the bridge, unsure if he could restore it</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wondered if repairing the bridge could improve his mood</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">noticed the bridge&rsquo;s cracks and worn boards but considered leaving it as it was</span>"], "c": 0, "e": "رأى إيثان في الجسر المكسور انعكاسًا لحالته النفسية، فقرر إصلاحه بدلاً من تركه."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. The main event in the passage is developed through ……………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">official reports and documents about city planning</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">quick actions and unrelated events about other people</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">clear stages showing teamwork, hope, and personal growth</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">short notes without reasons, results, or connections</span>"], "c": 2, "e": "تطورت أحداث القصة عبر مراحل واضحة: الملاحظة، البدء بالعمل، انضمام الجيران، ثم النمو الشخصي."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. The reader can infer that Ethan will ………………………....</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">continue supporting projects that bring people together in his town</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">forget about the bridge once he finds another well-paid job</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">leave the neighborhood to start a company in a distant city</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stop working on community projects because of his past failure</span>"], "c": 0, "e": "بعد نجاح تجربته في توحيد الجيران حول إصلاح الجسر، من المرجح أن يستمر في دعم مشاريع مجتمعية مشابهة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. The tone of the passage is ………....</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">indifferent, describing events without emotion</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">angry, warning readers not to trust others</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">critical, focusing only on Ethan&rsquo;s personal failure</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">inspiring, showing that healing grows from kindness</span>"], "c": 3, "e": "نبرة النص ملهمة تُظهر أن الشفاء ينبع من اللطف والعمل الجماعي."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. Ethan's transformation during his crisis is………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lazy and bored but later lonely and silent</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rich and successful but later tired and forgotten</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hopeless and lost but later strong and connected</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">calm and free but later angry and impatient</span>"], "c": 2, "e": "بدأ إيثان يائسًا وضائعًا بعد فقدان وظيفته، ثم أصبح قويًا ومرتبطًا بمجتمعه بعد إصلاح الجسر."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. Ethan&rsquo;s feelings ……………………………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">changed from despair and doubt to hope and gratitude</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">remained fearful and hopeless throughout his experience</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">turned bitter toward others who tried to help him</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">became confused and uncertain even after rebuilding the bridge</span>"], "c": 0, "e": "انتقلت مشاعر إيثان من اليأس والشك إلى الأمل والامتنان بنهاية القصة."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. I'm not sure what caused her illness. She…………………. something bad.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">may eat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must have eaten</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could have eaten</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">might eat</span>"], "c": 2, "e": "احتمال ضعيف/تخمين غير مؤكد عن حدث ماضٍ = could have eaten."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. Choose the correct reported speech for the following sentence: He said, \"You can solve your problems. Will you follow my advice?\"</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said that I could solve my problems and asked if I would follow his advice.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said that he could solve his problems and added if I would follow his advice.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said that I could solve his problems and asked if he would follow my advice.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He said that he could solve my problems and warned if I would follow his advice.</span>"], "c": 0, "e": "you تتحول إلى I (المخاطَب الأصلي)، can إلى could، my إلى his، وسؤال will يُنقل بـ asked if... would."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. I had …………...the room again as it was messy.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">him tidied</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">him tidy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he to tidy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">his tidying</span>"], "c": 1, "e": "have + شخص + مصدر بدون to (يقوم الشخص بنفسه بالفعل): have him tidy."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. She ………………. the table before the guests' arrival.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has laid</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was laid</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had laid</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is lied</span>"], "c": 2, "e": "before the guests' arrival: حدث سبق حدثًا آخر في الماضي = Past Perfect: had laid."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. He should keep in mind that his final report……………………by next week.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have been delivered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">would be delivered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have delivered</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is going to deliver</span>"], "c": 0, "e": "by next week + التقرير يتلقى الفعل = Future Perfect Passive: will have been delivered."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. The manager demanded that every e-mail……………. double-checked before submission.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">be</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be</span>"], "c": 2, "e": "demand that + مصدر بدون to (Subjunctive): be."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. They spent a………………. trip in Spain. They enjoyed it very much.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">five - day</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">five days</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">five - days</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">five day</span>"], "c": 0, "e": "الصفة المركبة من رقم قبل الاسم تكون مفردة وموصولة بشرطة: five-day."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. &ldquo;On the contrary, technology has transformed every aspect of our lives. From smartphones to artificial intelligence, it shapes how we communicate, learn and even think.&rdquo;<br>This part is extracted from a / an………………essay.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">expository</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">narrative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">descriptive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">argumentative</span>"], "c": 3, "e": "العبارة تعرض وجهة نظر وتدافع عنها (“On the contrary”)، وهذا أسلوب المقال الجدلي (argumentative)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Many people believe that reading books every day can greatly improve their knowledge, enhance creativity, develop critical thinking skills, and prepare them for challenges in life.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يرى بعض الأفراد أن قراءة الكتب يوميًا تؤثر على المعرفة وتحد من الإبداع، وتعطي فرصة لتطوير مهارات التفكير النقدي وتساعدهم في مواجهة تحديات الحياة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يظن بعض الأشخاص أن قراءة الكتب يوميًا تساعد على تحسين المعرفة والإبداع وتطوير التفكير النقدي أو تساعد على الاستعداد لتحديات الحياة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يعتقد الكثيرون أن قراءة الكتب بشكل يومي يمكن أن تشكك في معرفتهم وتعزز إبداعهم وتساعد على تقليل مهارات التفكير النقدي والتعامل مع تحديات الحياة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يعتقد الكثير من الناس أن قراءة الكتب يوميًا يمكن أن تحسن معرفتهم، وتعزز الإبداع، وتطوير مهارات التفكير النقدي، وتعدهم لمواجهة تحديات الحياة بشكل أفضل.</span>"], "c": 3, "e": "الخيار (d) هو الوحيد الذي يترجم العناصر الأربعة كلها بدقة (تحسين المعرفة، تعزيز الإبداع، تطوير التفكير النقدي، الإعداد للتحديات)؛ باقي الخيارات تعكس المعنى (تحد من/تقلل) أو تستخدم “أو” بدلاً من الربط الصحيح."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Governments worldwide are implementing strict environmental regulations to reduce pollution, protect natural resources, preserve biodiversity, and ensure a sustainable future for the coming generations.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تنفذ الحكومات حول العالم قوانين بيئية صارمة للحد من التلوث، وحماية الموارد الطبيعية، والحفاظ على التنوع البيولوجي، وضمان مستقبل مستدام للأجيال القادمة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تعمل الحكومات الدولية على وضع قوانين صارمة لحماية البيئة والموارد الطبيعية، والحفاظ على التنوع المناخي، والحد من التلوث لضمان حياة مستدامة للأجيال المقبلة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تقوم جميع الحكومات حول العالم بسن لوائح بيئية صارمة لتقليل التلوث، وحماية الموارد الطبيعية، والحفاظ على التنوع المناخي، وضمان مستقبل مستدام للأجيال القادمة.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تركز بعض الحكومات على حماية البيئة من التلوث، والمحافظة على الموارد الطبيعية، ودعم التنوع البيولوجي، ووضع سياسات لضمان مستقبل مستدام للأجيال القادمة.</span>"], "c": 0, "e": "الخيار (a) هو الأدق: يستخدم “التنوع البيولوجي” الصحيح (وليس “المناخي” كما في b وc)، ويحافظ على “worldwide” بمعناها الصحيح دون مبالغة (“جميع”) أو تقليل (“بعض”)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>تساعد الفنون مثل الرسم والموسيقى الأطفال والشباب على التعبير عن مشاعرهم الداخلية، وتطوير الإبداع، وزيادة الثقة بالنفس، وتحفيز التفكير الخلاق بطرق ممتعة ومفيدة.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Engaging in arts such as music and painting allows children and teenagers to communicate emotions, enhance creativity, build confidence, and strengthen innovative thinking in positive and enjoyable ways.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Artistic activities like painting and music support young people in expressing emotions, improving creativity, increasing self-confidence, and encouraging critical thinking through funny and constructive methods.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Arts such as painting and music help children and youth express inner feelings, develop creativity, boost confidence, and stimulate creative thinking in enjoyable and beneficial ways.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Painting and music as art forms help young individuals express inner feelings, grow creativity, boost self-esteem, and enhance imaginative thinking in ways that are fun and useful.</span>"], "c": 2, "e": "الخيار (c) هو الأقرب لفظًا ومعنى للنص الأصلي (arts، children and youth، inner feelings، creative thinking، enjoyable and beneficial)؛ باقي الخيارات تستبدل كلمات دقيقة بأخرى أقل دقة (critical بدل creative، funny بدل enjoyable)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>تسعى مصر جاهدة لتحقيق التنمية المستدامة من خلال مشروعات قومية ضخمة تهدف إلى تطوير البنية التحتية وتحسين مستوى المعيشة وتوفير فرص عمل للشباب في جميع المحافظات.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Egypt strives hard to achieve sustainable development through national projects aiming to develop infrastructure, improve living standards, and provide job opportunities for youth in all governorates.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Egypt works strongly to achieve national progress through huge projects designed to support the economy, improve life quality, and create jobs for young people in all regions.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Egypt is making great efforts to reach sustainable growth by launching major projects that raise living conditions and offer employment chances for youth across the country.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Egypt continues its determined plan to achieve full development through massive national projects to enhance people&rsquo;s lives and secure work opportunities for youth everywhere.</span>"], "c": 0, "e": "الخيار (a) هو الأدق بالمصطلحات التقنية الصحيحة: “sustainable development” (وليس national progress)، “infrastructure” (مذكورة صراحة)، و“governorates” (المحافظات تحديدًا، وليس “regions/country/everywhere” الغامضة)."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. If you were in Ville Fort's place, what actions you would take? Mention two points.</span>", "model": "If I were in Villefort's place, I would have acted very differently from how he did. First, I would have properly investigated the letter Edmond was accused of carrying instead of immediately condemning an innocent man just to protect my own family's reputation. Second, once I discovered the truth about Edmond's innocence, I would have found the courage to correct my mistake and free him, rather than choosing to imprison him for years purely out of fear and self-interest.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. How does Edmond Dant&egrave;s' transformation into the Count of Monte Cristo symbolize both justice and vengeance?</span>", "model": "Edmond's transformation represents both justice and vengeance intertwined. As the wealthy, mysterious Count, he is finally able to expose the truth about the men who conspired against him, which represents a form of justice long denied to him by a corrupt system. At the same time, his elaborate, carefully engineered plans to ruin Danglars, Fernand, and Villefort go far beyond simple justice, reflecting his personal desire for revenge and the deep pain he suffered. His new identity therefore symbolizes the thin, complicated line between rightful justice and personal vengeance.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of SIX lines on the following topic: &ldquo;Qualities and Habits of a Respected Person&rdquo;<br>Explain specific qualities or habits that make a person respected. Give at least two examples to support your ideas.</span>", "model": "A respected person usually possesses certain key qualities and habits that earn the admiration of others. One essential quality is honesty; a person who consistently tells the truth, even when it is difficult, gains the trust and respect of everyone around them. Another important habit is treating others with kindness and fairness, regardless of their status, as this shows genuine good character rather than superficial politeness. For example, a teacher who patiently helps struggling students without judgment earns deep respect from both students and colleagues. In conclusion, true respect is built through consistent honesty, kindness, and fairness, not through wealth or power alone.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. During the exhibition, they displayed an amphibious vehicle to demonstrate new technology. The underlined word &ldquo;amphibious&rdquo; functions in the sentence as a/an ……</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">proper noun</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">main verb</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">adjective</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">adverb</span>"], "c": 2, "e": "amphibious تصف الاسم “vehicle”، أي أنها صفة (adjective)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. In the food-chain chart, lions are classified as ..................... because they hunt other animals for food.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">herbivorous</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">predators</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">insects</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">prey</span>"], "c": 1, "e": "predators تعني “حيوانات مفترسة”، وهي الأنسب لوصف الأسود التي تصطاد حيوانات أخرى."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. The farmers explained that after the drought, they no longer had a/ an ................. of crops but a shortage instead.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">surplus</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">limitation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">scarcity</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">abundance</span>"], "c": 0, "e": "surplus تعني “فائض”، وهي تتناقض منطقيًا مع “shortage” (نقص) في الجملة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. When Fatma tripped during her speech, she described the moment as ................... because it was so embarrassing.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">mortifying</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">enjoyable</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">relaxing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">amusing</span>"], "c": 0, "e": "mortifying تعني “مُخجل جدًا”، وهذا يناسب موقف التعثر أثناء إلقاء خطاب."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. Camels have special ..................... that allow them to survive without water for long periods.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">foods</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">habitats</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">adaptations</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shelters</span>"], "c": 2, "e": "adaptations تعني “تكيّفات”، وهي السمات الجسدية التي تمكّن الجمال من العيش بلا ماء طويلاً."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. When the system failed, the customer service team had to ..................... of the irate complaints.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ignore the calls</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bear the brunt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">cause the problem</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fix everything</span>"], "c"
