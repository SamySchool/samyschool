<style>
  :root {
    --burgundy: #6E1F32;
    --burgundy-deep: #4c1524;
    --navy: #0F1D2D;
    --ivory: #F4E8D0;
    --sand: #C9A978;
    --chocolate: #4A2C22;
    --gold: #D4AF37;
    --gold-soft: #e7cc86;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: 'Tajawal', sans-serif;
    color: var(--chocolate);
    background:
      radial-gradient(130% 55% at 50% -6%, rgba(110,31,50,0.20), transparent 62%),
      linear-gradient(180deg, #F8EFDD 0%, #F1E0BE 55%, #E7D2A6 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    position: relative;
    overflow-x: hidden;
    touch-action: pan-y;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 10px;
    border: 1px solid rgba(110,31,50,0.22);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: rise .8s ease forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge-wrap {
    margin-top: 18px;
    width: 168px;
    height: 168px;
    position: relative;
  }

  .badge-glow {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110,31,50,0.22), transparent 70%);
    filter: blur(2px);
  }

  .badge-wrap img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 18px rgba(74,44,34,0.28));
  }

  h1.brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 34px;
    letter-spacing: 0.5px;
    margin: 20px 0 2px;
    color: var(--burgundy);
    direction: ltr;
    text-shadow: 0 1px 0 rgba(212,175,55,0.35);
  }

  .est {
    font-family: 'Tajawal', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(74,44,34,0.55);
    margin-bottom: 18px;
    direction: ltr;
  }

  .slogan-en {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    color: var(--burgundy);
    direction: ltr;
    margin: 0;
  }

  .slogan-ar {
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--chocolate);
    margin: 6px 0 0;
  }

  .slogan-with {
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: rgba(74,44,34,0.7);
    margin: 4px 0 0;
  }

  .knot {
    width: 100%;
    max-width: 300px;
    height: 30px;
    margin: 26px 0 22px;
    color: var(--burgundy);
    opacity: 0.85;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    direction: ltr;
  }

  .linkrow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    min-height: 52px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(110,31,50,0.22);
    border-radius: 14px;
    text-decoration: none;
    color: var(--chocolate);
    backdrop-filter: blur(2px);
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
    touch-action: manipulation;
  }

  .linkrow:hover, .linkrow:focus-visible {
    background: rgba(255,255,255,0.85);
    border-color: var(--burgundy);
    transform: translateY(-1px);
  }

  .linkrow:active {
    background: rgba(255,255,255,0.95);
    border-color: var(--burgundy);
    transform: scale(0.98);
  }

  .linkrow:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }

  .appicon {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(74,44,34,0.22), inset 0 0 0 1px rgba(255,255,255,0.3);
  }

  .appicon svg { width: 26px; height: 26px; }

  .linkrow-text {
    flex: 1 1 auto;
    text-align: left;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.35;
    color: var(--chocolate);
  }

  .linkrow-go {
    flex: 0 0 auto;
    color: var(--burgundy);
    opacity: 0.75;
  }

  .linkrow-go svg { width: 16px; height: 16px; }

  footer {
    margin-top: 34px;
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(74,44,34,0.55);
    direction: ltr;
  }

  footer span.dot { color: var(--burgundy); margin: 0 8px; }

  @media (prefers-reduced-motion: reduce) {
    .page { animation: none !important; opacity: 1 !important; transform: none !important; }
    .linkrow:hover, .linkrow:focus-visible, .linkrow:active { transform: none; }
  }

  @media (max-width: 360px) {
    .badge-wrap { width: 140px; height: 140px; margin-top: 12px; }
    h1.brand { font-size: 28px; }
    .slogan-en { font-size: 16px; }
    .knot { margin: 20px 0 18px; }
  }

  @media (max-height: 700px) and (orientation: landscape) {
    .badge-wrap { width: 110px; height: 110px; margin-top: 8px; }
    h1.brand { font-size: 26px; margin: 12px 0 2px; }
    .est { margin-bottom: 10px; }
    .knot { margin: 16px 0 14px; }
  }
</style>
</head>
<body>
  <main class="page">
