<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Unit 1 Vocabulary Bank | SamySchool</title>
<style>
:root{
  --p:#14213D; --pd:#0A1226; --pdd:#050912; --pl:#2B3F66; --pb:#E8EAF0; --pbl:#F3F5F9;
  --s:#2E7D32; --sl:#66BB6A; --sb:#E8F5E9;
  --e:#C62828; --el:#EF5350; --eb:#FFEBEE;
  --m:#4A2C17; --ml:#7A5033; --mb:#F1E6D8;
  --t:#241A0F; --ts:#5B4636; --tl:#8C7A66;
  --c:#FFFDF8; --bd:#D9C9A8; --bl:#F1E6D0; --bg:#F5EEDD;
  --mr:#7A1F3D; --mrl:#A63A5C; --mrb:#F7E8ED;
  --g:#C9A227; --gl:#E0C05C; --gb:#FBF3DC;
  --r:14px; --rs:10px; --rl:20px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
.nameGateOverlay{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,var(--pdd),var(--pd) 60%,var(--p));
    display:none;align-items:center;justify-content:center;padding:20px}
.nameGateBox{background:var(--c);border-radius:var(--rl);padding:32px 28px;max-width:420px;width:100%;text-align:center;
    box-shadow:0 12px 40px #0006;border:2px solid var(--g)}
.nameGateLogo{width:76px;height:76px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid var(--g);
    box-shadow:0 2px 10px #0003;margin-bottom:14px}
.nameGateBox h2{color:var(--p);font-size:1.15rem;margin:0 0 8px}
.nameGateBox p{color:var(--ts);font-size:.9rem;line-height:1.6;margin:0 0 18px}
.nameGateBox input{width:100%;padding:13px 16px;border:2px solid var(--bd);border-radius:12px;font-size:1rem;
    font-family:inherit;text-align:center;margin-bottom:14px}
.nameGateBox button{width:100%;background:linear-gradient(120deg,var(--gl),var(--g));color:#3a2b06;border:none;
    font-weight:800;font-size:1rem;padding:13px;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px #c9a22744}
.tb{position:sticky;top:0;z-index:50;padding:10px 24px;background:linear-gradient(120deg,var(--pdd),var(--pd) 55%,var(--p));
    display:flex;align-items:center;gap:14px;color:#fff;flex-wrap:wrap}
.tb .logo{width:46px;height:46px;border-radius:50%;object-fit:contain;background:#fff;
    border:2.5px solid #ffffff66;box-shadow:0 1px 6px #0004;flex:0 0 46px}

/* transparent SamySchool watermark, refined/decorated edges, fixed behind all page content */
.wm-fixed{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
.wm-fixed .ring{position:absolute;border-radius:50%;border:2.5px solid var(--g);opacity:.22}
.wm-fixed .ring.r1{width:30vw;height:30vw;max-width:420px;max-height:420px;min-width:220px;min-height:220px}
.wm-fixed .ring.r2{width:36vw;height:36vw;max-width:500px;max-height:500px;min-width:260px;min-height:260px;
    border-color:var(--mr);opacity:.15}
.wm-fixed .ring.r3{width:24vw;height:24vw;max-width:340px;max-height:340px;min-width:180px;min-height:180px;
    border:1.5px dashed var(--g);opacity:.28}
.wm-fixed img{width:20vw;max-width:280px;min-width:150px;opacity:.14;filter:grayscale(.12)}
.tb,.tabs,.lessonbar,.mc,footer{position:relative;z-index:1}
.tb h1{font-size:1.05rem;margin:0}
.tb .sub{font-size:.78rem;opacity:.8;margin:0}
.tb .phone{margin-inline-start:auto;font-size:.85rem;background:#25D36633;border:1px solid #25D36688;
    color:#fff;padding:6px 12px;border-radius:var(--rs);text-decoration:none;cursor:pointer;transition:.15s}
.tb .phone:hover{background:#25D36655}
.tabs{position:sticky;top:64px;z-index:49;display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:var(--bl);
      border-bottom:2px solid var(--bd)}
.tabs button{flex:0 0 auto;padding:8px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--c);
      color:var(--ts);font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap;transition:.15s}
.tabs button.act{background:linear-gradient(120deg,var(--gl),var(--g));color:#3a2b06;border-color:var(--g);
      box-shadow:0 0 0 3px #c9a22733}
.lessonbar{display:flex;gap:8px;padding:10px 16px;background:var(--pbl);overflow-x:auto;border-bottom:1px solid var(--pb)}
.lessonbar button{flex:0 0 auto;padding:7px 14px;border-radius:10px;border:2px solid var(--pb);background:#fff;
      color:var(--p);font-weight:700;font-size:.82rem;cursor:pointer}
.lessonbar button.act{background:var(--p);color:#fff;border-color:var(--p)}
.mc{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.panel{display:none}
.panel.act{display:block}
h2.sec{font-size:1.15rem;color:var(--m);border-bottom:3px solid var(--bd);padding-bottom:8px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.wcard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:16px;box-shadow:0 2px 8px #0001}
.wcard .top{display:flex;align-items:center;gap:12px}
.wcard .icon{font-size:2.4rem;width:58px;height:58px;border-radius:14px;background:var(--gb);display:flex;
      align-items:center;justify-content:center;flex:0 0 58px}
.wcard .word{font-size:1.3rem;font-weight:800;color:var(--p);line-height:1.15}
.wcard .pos{font-size:.72rem;color:var(--tl);font-style:italic}
.wcard .ar{font-size:1rem;color:var(--mr);font-weight:700;direction:rtl}
.wcard .pgb{margin-inline-start:auto;background:var(--mr);color:#fff;font-size:.7rem;font-weight:700;
      padding:3px 9px;border-radius:8px;white-space:nowrap;align-self:flex-start}
.spk{border:none;background:var(--p);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;
     flex:0 0 34px}
.spk:active{transform:scale(.92)}
.wcard .def{margin-top:10px;font-size:.92rem;color:var(--ts);line-height:1.5}
.wcard .ex{margin-top:6px;font-size:.86rem;color:var(--t);line-height:1.5;padding-inline-start:10px;
     border-inline-start:3px solid var(--gl)}
.miniTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:.86rem}
.miniTable td,.miniTable th{border:1px solid var(--bd);padding:6px 10px;text-align:left}
.miniTable th{background:var(--pbl);color:var(--p)}
.miniGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mini{background:rgba(255,253,248,.93);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;display:flex;
      align-items:center;gap:8px}
.mini b{color:var(--p)}
.mini .a{color:var(--mr);direction:rtl;margin-inline-start:auto;font-size:.85rem}
.mini .pg{font-size:.68rem;background:var(--mrb);color:var(--mr);padding:2px 7px;border-radius:6px}
.readingCard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:20px;margin-bottom:20px}
.readingCard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.readingCard h3{margin:0;color:var(--p);font-size:1.05rem}
.readingCard p{line-height:1.9;font-size:.98rem;white-space:pre-line}
.idiomBox{background:rgba(255,253,248,.93);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px;
     font-size:.9rem;line-height:1.7}
.idiomBox b{color:var(--m)}
.exNav{position:sticky;top:112px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--bl);border:1.5px solid var(--bd);border-radius:var(--rl);padding:10px 16px;margin-bottom:16px;
    box-shadow:0 2px 8px #0001}
.exNav button{border:2px solid var(--p);background:var(--p);color:#fff;font-weight:700;font-size:.9rem;
    padding:9px 18px;border-radius:12px;cursor:pointer;white-space:nowrap}
.exNav button:disabled{opacity:.35;cursor:default}
.exCounter{font-weight:800;color:var(--m);font-size:.95rem}
#exSlide{min-height:56vh}
.exBox{position:relative;background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:24px 26px;
    margin-bottom:18px;min-height:52vh;display:flex;flex-direction:column;justify-content:flex-start}
.examTimer{position:absolute;top:14px;right:14px;background:var(--p);color:#fff;font-weight:800;font-size:.85rem;
    padding:6px 14px;border-radius:20px;box-shadow:0 2px 8px #0003;z-index:2}
.examTimer.low{background:var(--e);animation:examPulse 1s infinite}
@keyframes examPulse{0%{opacity:1}50%{opacity:.55}100%{opacity:1}}
@keyframes shakeX{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-9px)}
  40%,60%{transform:translateX(9px)}
}
.exBox.shake{animation:shakeX .5s}
@keyframes flashGreen{0%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}100%{box-shadow:0 0 0 46px rgba(46,125,50,0)}}
@keyframes flashRed{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}100%{box-shadow:0 0 0 46px rgba(198,40,40,0)}}
@keyframes flashAmber{0%{box-shadow:0 0 0 0 rgba(224,150,15,.6)}100%{box-shadow:0 0 0 46px rgba(224,150,15,0)}}
.exBox.flash-correct{animation:flashGreen .7s ease-out}
.exBox.flash-wrong{animation:flashRed .7s ease-out}
.exBox.flash-timeout{animation:flashAmber .9s ease-out}
.resultPop{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) scale(.3);font-size:5.5rem;
    opacity:0;pointer-events:none;z-index:6;animation:popIn .8s ease-out forwards;filter:drop-shadow(0 4px 10px #0004)}
@keyframes popIn{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  28%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  55%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:5;
    animation:confettiFly .9s ease-out forwards}
@keyframes confettiFly{
  0%{transform:translate(0,0) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}
}
.exBox .qh{font-size:1.05rem}
.exBox .opts{font-size:1rem}
.exBox .opt{padding:12px 16px;font-size:.98rem}
.exBox .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:8px;margin-bottom:8px}
.tag.madh{background:var(--pb);color:var(--p)}
.tag.taq{background:var(--mrb);color:var(--mr)}
.qh{font-weight:700;color:var(--t);margin:12px 0 6px}
.opts{display:grid;gap:6px;margin-inline-start:4px}
.opt{border:2px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fffefb;font-size:.9rem}
.opt.correct{background:var(--sb);border-color:var(--s)}
.opt.wrong{background:var(--eb);border-color:var(--e)}
.why{margin-top:6px;font-size:.85rem;color:var(--ts);background:var(--gb);padding:8px 12px;border-radius:8px}
.why-en{}
.why-ar{margin-top:6px;direction:rtl;text-align:right;color:var(--m);font-weight:700}
.filterBadge{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filterBadge span{background:var(--gb);color:var(--m);font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:20px;border:1.5px solid var(--g)}
.filterBadge button{border:1.5px solid var(--p);background:#fff;color:var(--p);font-weight:700;font-size:.8rem;
    padding:5px 12px;border-radius:16px;cursor:pointer}
.statRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.statCard{background:rgba(255,253,248,.93);border:1.5px solid var(--bd);border-radius:var(--rl);padding:16px;text-align:center}
.statCard .n{font-size:1.6rem;font-weight:800;color:var(--p)}
.statCard .l{font-size:.8rem;color:var(--ts);margin-top:4px}
.nameBox{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.nameBox input{flex:1 1 220px;padding:9px 14px;border:2px solid var(--bd);border-radius:10px;font-size:.95rem;
    font-family:inherit;background:#fff}
.waBtn{background:linear-gradient(120deg,#1EBE57,#25D366);color:#fff;border:none;font-weight:800;font-size:.95rem;
    padding:13px 26px;border-radius:30px;cursor:pointer;box-shadow:0 4px 14px #25d36655;display:inline-flex;
    align-items:center;gap:8px;transition:.15s}
.waBtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #25d36677}
.mistakeCard{background:rgba(255,253,248,.93);border:1.5px solid var(--eb);border-inline-start:5px solid var(--e);
    border-radius:12px;padding:14px 18px;margin-bottom:12px}
.mistakeCard .ans{font-size:.9rem;margin:4px 0}
.mistakeCard .ans.bad{color:var(--e)}
.mistakeCard .ans.good{color:var(--s)}
.matchRow{display:flex;justify-content:space-between;gap:10px;border:1px dashed var(--bd);border-radius:8px;
    padding:6px 10px;margin-bottom:6px;font-size:.9rem;align-items:center}
.matchRow .a{direction:rtl;color:var(--mr)}
.openQ{margin-bottom:10px}
.openQ .a{display:none;background:var(--sb);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.88rem}
.revealBtn{font-size:.78rem;border:1px solid var(--p);color:var(--p);background:#fff;border-radius:8px;
    padding:4px 10px;cursor:pointer}
.jumpBar{display:flex;justify-content:center;margin:16px 0}
.jumpBar button{background:linear-gradient(120deg,var(--mrl),var(--mr));color:#fff;border:none;font-weight:800;
    font-size:.92rem;padding:12px 24px;border-radius:30px;cursor:pointer;box-shadow:0 4px 14px #7a1f3d33;
    display:inline-flex;align-items:center;gap:8px;transition:.15s}
.jumpBar button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #7a1f3d44}
.jumpBar .arrow{font-size:1.05rem}
footer{text-align:center;padding:20px;color:var(--tl);font-size:.8rem}
@media (max-width:768px){
  .tb h1{font-size:.92rem}
  .wcard .word{font-size:1.1rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

eenagers.", "icon": "🧩"}, {"w": "social comparison", "pos": "phr.", "ar": "المقارنة الاجتماعية", "page": 4, "d": "evaluating yourself by comparing yourself to others", "e1": "Social comparison on Instagram often leaves users feeling inadequate.", "e2": "Hind judged her ordinary school day through social comparison with influencers.", "icon": "📊"}], "L2": [{"w": "mindfulness", "pos": "n.", "ar": "يقظة ذهنية", "page": 22, "d": "paying careful attention to the present moment", "e1": "Ten minutes of daily mindfulness can measurably reduce stress.", "e2": "She practises mindfulness through slow breathing exercises.", "icon": "🧘"}, {"w": "sedentary", "pos": "adj.", "ar": "خامل / قليل الحركة", "page": 22, "d": "involving little or no physical movement", "e1": "A sedentary lifestyle increases the risk of health problems.", "e2": "Doctors recommend regular exercise to counter a sedentary routine.", "icon": "🛋️"}, {"w": "nutritionist", "pos": "n.", "ar": "خبير تغذية", "page": 22, "d": "a health expert who gives advice on what to eat to stay healthy", "e1": "A nutritionist can help you build a balanced diet.", "e2": "You should consult a nutritionist before starting a new diet plan.", "icon": "🥗"}, {"w": "wellbeing", "pos": "n.", "ar": "الرفاهية / الصحة", "page": 22, "d": "a state of being comfortable, healthy, and happy", "e1": "Exercise is essential for physical and mental wellbeing.", "e2": "The programme aims to improve student wellbeing across the school.", "icon": "🌿"}, {"w": "processed food", "pos": "n.", "ar": "طعام مُصنع", "page": 22, "d": "food changed from its natural state by adding sugar, salt, or chemicals", "e1": "Eating too much processed food can lead to poor nutrition.", "e2": "Nutritionists advise limiting processed food and high-caffeine drinks.", "icon": "🥫"}, {"w": "measurable", "pos": "adj.", "ar": "ملموس / قابل للقياس", "page": 22, "d": "able to be tracked, counted, or seen clearly", "e1": "The study found a measurable reduction in stress after meditati  المرجح أن"], ["conscious of", "مدرك لـ"], ["due to", "بسبب"], ["face to face", "وجهاً لوجه"], ["lead to", "يؤدي إلى"], ["linked to", "مرتبط بـ"], ["reduction in", "انخفاض في"], ["set up", "يؤسس"], ["tend to", "يميل إلى"]], "L3": [["attribute to", "ينسب إلى"], ["by contrast", "على النقيض من ذلك"], ["central to", "أساسي في"], ["invest in", "يستثمر في"], ["over time", "بمرور الوقت"], ["regardless of", "بغض النظر عن"], ["restrictions on", "قيود على"], ["lie at the heart of", "يكمن في أساس"], ["either-or choice", "خيار بين أمرين: إما...أو"]], "L4": [["access to", "الوصول إلى"], ["on average", "في المتوسط"], ["exposure to", "التعرض لـ"], ["tend to", "يميل إلى"], ["draw from", "يستمد من"], ["under pressure", "تحت الضغط"]]}, "idioms": {"L1": [["especially vs specially", "بشكل خاص (للتمييز أو التأكيد) — \"The creative arts offer something especially valuable for teenagers.\"  |  خصيصاً (لغرض محدد) — \"This gallery was specially built to showcase Egyptian designs.\""], ["sensitive vs sensible", "حساس (يتأثر بسهولة) — \"Adolescence is a particularly sensitive stage.\"  |  حكيم/عاقل — \"It is sensible to set digital boundaries on screen time.\""], ["publish vs spread vs come out", "ينشر رسمياً — \"The survey results were published in 2023.\"  |  ينتشر — \"Viral speeches can spread rapidly.\"  |  يصدر للعلن — \"When does the documentary come out?\""], ["tool vs instrument", "أداة بسيطة/رقمية — \"Social media platforms are powerful communication tools.\"  |  آلة دقيقة (موسيقى/قياس) — \"He practices a musical instrument.\""], ["celebrity vs famous", "شخص مشهور (اسم) — \"Many celebrities use their influence.\"  |  مشهور (صفة) — \"He dreamed of becoming a famous footballer.\""]], "L2": [["process vs operation", "عملية/سلسلة خطوات — \"Learning a language is a long process.\"  |  عملية تشغيل/طبية — \"The rescue operation saved many people.\""], ["processed (adj.)", "مُعالَج/مُصنّع — \"You should avoid eating too much processed meat.\""], ["affect vs effect", "يؤثر (فعل) — \"Poor nutrition can affect performance.\"  |  أثر (اسم) — \"Exercise has a powerful effect on the brain.\""], ["well-being vs wellness", "الرفاهية العامة — \"Exercise is essential for physical and mental well-being.\"  |  ممارسات الصحة الواعية — \"The gym offers a wellness program.\""], ["nutritious vs nutritional vs diet", "مُغذٍّ (صفة الطعام) — \"Oatmeal is a nutritious breakfast.\"  |  غذائي (متعلق بالتغذية) — \"Check the nutritional information.\"  |  نظام غذائي — \"A balanced diet includes fruit.\""], ["sedentary vs stationary", "خامل/كثير الجلوس — \"A sedentary lifestyle lacks movement.\"  |  ثابت — \"I prefer a stationary bike.\""], ["moderate vs modest", "معتدل — \"Experts recommend moderate activity.\"  |  متواضع — \"He is a modest innovator.\""], ["loneliness vs solitude", "الوحدة (سلبي) — \"Quality time reduces loneliness.\"  |  الانفراد بالاختيار (إيجابي) — \"I enjoy the solitude of reading.\""]], "L3": [["agency", "الفاعلية/القدرة على الاختيار — \"Every individual possesses the agency to choose their diet.\""], ["efficiency vs self-efficacy", "الكفاءة/الفعالية — \"The machine increased production efficiency.\"  |  الثقة بالقدرة الذاتية — \"His high self-efficacy helped him stay calm.\""], ["advertise vs announce", "يُعلن تجارياً — \"Companies advertise products on social media.\"  |  يُصرح رسمياً — \"The government will announce new dates.\""], ["society vs community", "المجتمع عموماً — \"Technology impacts modern society.\"  |  مجتمع محلي/جماعة — \"The local community built a playground.\""], ["internal vs external locus of control", "مركز تحكم داخلي — \"An internal locus leads to personal ownership.\"  |  مركز تحكم خارجي — \"People with an external locus feel passive.\""], ["nudge vs force", "دفع خفيف بلطف — \"I gave him a little nudge to start his homework.\"  |  إجبار — \"You cannot force someone to change their mind.\""], ["proponent vs opponent", "مؤيد — \"He is a leading proponent of renewable energy.\"  |  معارض — \"The opponent argued the law was too expensive.\""]], "L4": [["experience vs experiment", "خبرة/تجربة حياتية — \"She has years of experience in teaching.\"  |  تجربة علمية — \"The scientist conducted an experiment.\""], ["adopt vs adapt", "يتبنّى — \"The company decided to adopt a new strategy.\"  |  يتكيف — \"It takes time to adapt to a new country.\""], ["counsel vs council", "نصيحة/مستشار — \"He sought legal counsel.\"  |  مجلس — \"The city council met to discuss the project.\""]]}, "readings": {"L1": {"title": "The Impossible Standard: How social media is reshaping the way teenagers see themselves", "page": 11, "text": "In today's fast-changing world, social media plays a major role in shaping how teenagers think, feel, and see themselves. While it can inspire healthy habits and positive change, it can also create unrealistic expectations and pressure.\n\nOver the past decade, social media platforms have transformed from simple communication tools into highly curated stages where individuals perform carefully constructed versions of their lives. For teenagers, who are at a particularly sensitive stage of identity formation, this change carries significant psychological results.\n\nResearch published by the American Psychological Association in 2023 found that teenagers who spent more than three hours daily on image-based platforms such as Instagram and TikTok were twice as likely to report symptoms of low self-esteem and body dissatisfaction compared to those who used social media for less than one hour per day.\n\nWhat makes social media especially powerful, and specially dangerous, is the mechanism of social comparison. Unlike traditional media, where the gap between ordinary people and celebrities is obvious, social media has hidden this gap completely. Teenagers are now comparing themselves not only to distant celebrities, but to classmates, acquaintances, and influencers who present their lives as easily perfect.\n\nPsychologists use the term \"highlight reel effect\" to describe this phenomenon: what appears online is a selective, filtered, and strategically timed part of reality, yet viewers instinctively treat it as a complete and accurate picture."}, "L2": {"title": "What it means to be part of modern life", "page": 29, "text": "Modern life moves faster than ever. Technology saves us time, yet we fill that time with more tasks, more screens, and more pressure. How we choose to live, our daily habits, our diet, our sleep, shapes not only physical health, but also our identity and sense of self.\n\n1. Exercise and Physical Activity\nHealth experts regularly recommend that teenagers do at least 60 minutes of moderate to hard physical activity every day. This means competitive sport, cycling to school, swimming, or even a brisk walk all count towards the daily target. What makes exercise particularly powerful is its effect on the brain: physical activity causes the release of endorphins, chemicals that reduce feelings of stress and anxiety at the same time as boosting mood and self-confidence. Despite these well-documented benefits, a landmark WHO-led study found that more than 80% of teenagers worldwide fail to meet the recommended daily activity levels, largely due to sedentary screen-based habits.\n\n2. Nutrition, Sleep, and Recovery\nA balanced diet is widely seen as the foundation of physical and mental wellbeing. Nutritionists advise that teenagers consume a varied range of fruits, vegetables, whole grains, lean proteins, and healthy fats, while limiting their intake of processed foods, too much sugar, and high-caffeine drinks. Poor nutrition has been directly linked to fatigue, difficulty concentrating, and mood changes. Equally important, though often underestimated, is sleep. Teenagers require between eight and ten hours of sleep per night to support brain development, emotional control, and physical recovery.\n\n3. Mindfulness, Social Connection, and Mindful Consumption\nIn recent years, mindfulness has moved from specialist wellness programmes into common education. Mindfulness involves paying deliberate, non-judgemental attention to the present moment, and can take many forms: meditation, slow breathing exercises, yoga, or simply sitting quietly without a device. Studies suggest that even ten minutes of daily mindfulness practice leads to measurable reductions in stress hormones over four to six weeks. Spending quality time with friends and family, face to face rather than through screens, has been shown to reduce loneliness and build the emotional resilience needed to cope with life's pressures."}, "L3": {"title": "Modern health review: Perspectives on Responsibility and Wellbeing", "page": 78, "text": "Who is responsible for the way we live our lives? People have different opinions about who is responsible for living a healthy life. Some believe that individuals should make their own healthy choices and take control of their habits. Others argue that society, money, and social media strongly influence people's decisions.\n\n1. The Case for Personal Responsibility\nMany health professionals and philosophers argue that personal responsibility lies at the heart of a well-lived life. From this perspective, every individual possesses the agency, the capacity to choose and act, and it is through the exercise of this agency that identity is formed. Psychologists refer to this as having an \"internal locus of control\" - a belief that one's own actions, rather than external forces, determine outcomes. A landmark study found that individuals who scored highly on self-efficacy measures were significantly more likely to maintain healthy behaviours over time, regardless of their socioeconomic background. Framing health as someone else's problem can be disempowering: when individuals attribute their choices entirely to outside forces, they risk becoming passive.\n\n2. Social and Environmental Influences\nHowever, the idea that individuals are entirely responsible for their own health is increasingly challenged by social scientists. Research in sociology demonstrates that where we grow up, how much money our family has, and the cultural rules we are raised with profoundly shape the choices available to us. A teenager growing up in a neighbourhood with no safe parks or affordable sports facilities cannot simply \"choose\" to exercise more easily. These are not failures of willpower; they are structural barriers, obstacles built into the environment that restrict genuine choice.\n\n3. The Role of Government and Shared Responsibility\nA third perspective argues that responsibility is not an either-or choice; it is shared between individuals and society. Governments, schools, families, and communities all have a role in creating the conditions that make healthy living possible and accessible. Psychologist Richard Thaler's concept of the \"nudge\" captures this idea precisely: small, well-designed changes to the context in which decisions are made can shift behaviour without restricting freedom."}, "L4": {"title": "Under Pressure: Understanding Stress and Mental Health in Egyptian Teenagers", "page": 103, "text": "Modern teenagers face increasing pressure from many aspects of daily life. Academic demands, social expectations, and consistent exposure to digital media can affect how they think, feel, and behave.\n\nA nationwide school health survey done in Egypt in 2023 gathered data from 450 teenagers aged between 14 and 17, drawn from both urban and rural schools across five governorates. The study aimed to identify the primary sources of stress among teenagers and to examine the coping strategies they most commonly adopted. Its findings show a complex picture of modern teenager life in which academic pressure, digital habits, and social expectations interact in ways that are often difficult to separate.\n\nThe most significant finding was that 68% of participants reported experiencing moderate to high levels of stress during examination periods. When asked to identify the main causes, students ranked academic pressure first, cited by 82% of respondents, followed by social media comparison (61%), insufficient sleep (57%), and family expectations (49%). The study found that teenagers who did regular physical activity, defined as at least 30 minutes of exercise four or more times per week, reported stress levels that were on average 34% lower than those of their sedentary peers, even after controlling for academic performance variables.\n\nCultural background was also a significant factor in how teenagers manage stress. Students from families with strong collectivist values were considerably more likely to seek emotional support from parents or siblings when facing difficulties. In contrast, students from more individualistic household environments tended to rely on individual coping strategies such as listening to music, exercising alone, or spending time in nature. The study suggested that the availability and quality of support networks were the decisive variables.\n\nThe researchers also noted a significant gap in access to school counseling services between urban and rural institutions. While 74% of urban schools offered some form of counseling, the figure dropped to 31% in rural schools. The study concluded that targeted mental health support programs in schools could meaningfully reduce stress levels among teenagers."}}, "exercises": {"L1": [{"src": "مذكرة", "page": 13, "q": "Key Vocabulary Exercises Q1-2", "type": "mcq", "items": [{"q": "Social media can sometimes affect teenagers' self-esteem, especially when they compare themselves with others online. What does self-esteem mean in this context?", "options": ["The way a person values and feels about themselves.", "The way a person communicates with other people.", "The ability to make decisions quickly.", "The desire to become popular online."], "answer": 0, "why": "Self-esteem = the way a person values and feels about themselves.", "why_ar": "تقدير الذات = طريقة تقييم الشخص لنفسه وشعوره تجاه ذاته."}, {"q": "Over the past decade, social media platforms have transformed from simple communication tools into carefully designed stages for presenting people's lives. What does transformed mean in this context?", "options": ["Become less useful than before.", "Disappeared gradually from people's lives.", "Changed completely in form or character.", "Been moved from one place to another."], "answer": 2, "why": "Transformed = changed completely in form or character.", "why_ar": "تحوّل = تغيّر بالكامل في الشكل أو الطبيعة."}]}, {"src": "مذكرة", "page": 14, "q": "Key Vocabulary Exercises Q3-5, 7-10", "type": "mcq", "items": [{"q": "Some social media posts may show bias by presenting only one side of an issue. What does bias mean in this context?", "options": ["A careful attempt to present all sides equally.", "An unfair preference for one side or point of view.", "A strong desire to avoid social media.", "A method of checking information carefully."], "answer": 1, "why": "Bias = an unfair preference for one side or point of view.", "why_ar": "التحيز = تفضيل غير عادل لجانب أو رأي واحد."}, {"q": "Constant comparison with others online may lead to dissatisfaction with one's own life or appearance. What does dissatisfaction mean in this context?", "options": ["A complete acceptance of a difficult situation.", "A strong feeling of confidence in one's abilities.", "A feeling of excitement about future opportunities.", "A feeling of being unhappy because something is not as good as expected."], "answer": 3, "why": "Dissatisfaction = a feeling of being unhappy because something is not as good as expected.", "why_ar": "عدم الرضا = شعور بعدم السعادة لأن شيئًا ما ليس بالجودة المتوقعة."}, {"q": "The article explained that social media users often present only carefully chosen moments from their lives. Which situation is the clearest example of being selective?", "options": ["A journalist presents both sides of a controversial issue.", "A student describes everything that happened during the school day in complete detail.", "A teenager shares only positive moments while hiding difficult experiences.", "A photographer saves every picture taken during a family trip."], "answer": 2, "why": "Selective = choosing only the best/most suitable parts — sharing only positive moments while hiding the rest.", "why_ar": "الانتقائية = اختيار الأفضل فقط — مشاركة اللحظات الإيجابية وإخفاء الباقي."}, {"q": "Studies show that a lack of authentic connection online often results in deep .......... with one's own life.", "options": ["mechanism", "dissatisfaction", "perception", "association"], "answer": 1, "why": "Lack of real connection leads to dissatisfaction with one's own life.", "why_ar": "غياب التواصل الحقيقي يؤدي لعدم الرضا عن حياة الشخص نفسه."}, {"q": "It is important to unfollow .......... accounts that make you feel poorly about your body or achievements.", "options": ["obvious", "physical", "sensitive", "toxic"], "answer": 3, "why": "\"Toxic\" accounts are harmful ones that make you feel bad about yourself.", "why_ar": "الحسابات \"السامة\" هي التي تشعرك بالسوء تجاه نفسك."}, {"q": "New digital tools allow artists to .......... simple sketches into complex, high-resolution masterpieces.", "options": ["transform", "perform", "maintain", "publish"], "answer": 0, "why": "\"Transform\" = to change completely — turning simple sketches into complex artwork.", "why_ar": "\"يُحوّل\" = يغيّر بالكامل — تحويل رسومات بسيطة لعمل فني معقد."}, {"q": "Algorithms are highly .......... showing users only the content that aligns with their previous interests.", "options": ["intense", "aggressive", "selective", "image-based"], "answer": 2, "why": "Algorithms choose (are selective about) content matching a user's past interests.", "why_ar": "الخوارزميات تنتقي المحتوى المطابق لاهتمامات المستخدم السابقة."}]}, {"src": "مذكرة", "page": 15, "q": "Important Vocabulary Q11-20", "type": "mcq", "items": [{"q": "The reporter was accused of .......... because he only interviewed people who agreed with his point of view.", "options": ["concept", "version", "gap", "bias"], "answer": 3, "why": "Only interviewing agreeing people shows bias.", "why_ar": "مقابلة الأشخاص المتفقين فقط يدل على التحيز."}, {"q": "Constant .......... with the \"perfect\" lives of others on social media can lead to feelings of inadequacy.", "options": ["evaluative adjective", "social comparison", "highlight reel effect", "identity formation"], "answer": 1, "why": "Comparing your life with others' online lives = social comparison.", "why_ar": "مقارنة حياتك بحياة الآخرين أونلاين = المقارنة الاجتماعية."}, {"q": "Young users often develop .......... expectations about beauty after viewing heavily edited images online.", "options": ["balanced", "traditional", "successful", "unrealistic"], "answer": 3, "why": "Edited images create unrealistic expectations.", "why_ar": "الصور المعدّلة تخلق توقعات غير واقعية."}, {"q": "Adolescence is a critical stage for .......... as young people begin to define their values and beliefs.", "options": ["identity formation", "lifestyle habits", "cultural context", "mental health"], "answer": 0, "why": "Defining one's values and beliefs is identity formation.", "why_ar": "تحديد القيم والمعتقدات الشخصية هو تكوين الهوية."}, {"q": "The teacher used a red marker to .......... the most common grammatical errors in the students' essays.", "options": ["acquaint", "highlight", "satisfy", "shape"], "answer": 1, "why": "Marking errors clearly = to highlight them.", "why_ar": "إبراز الأخطاء بوضوح = تسليط الضوء عليها."}, {"q": "The human brain is a .......... organ that scientists are still working to fully understand.", "options": ["complex", "accurate", "balanced", "obvious"], "answer": 0, "why": "Not fully understood = complex.", "why_ar": "غير مفهوم بالكامل = معقّد."}, {"q": "There has been a .......... increase in the number of people working from home since the pandemic.", "options": ["psychological", "traditional", "significant", "successful"], "answer": 2, "why": "A large, noteworthy increase = significant.", "why_ar": "زيادة كبيرة وملحوظة = ملحوظة/مهمة (significant)."}, {"q": "The Northern Lights are a natural .......... that attracts thousands of tourists to the Arctic every year.", "options": ["diagram", "inquiry", "mechanism", "phenomenon"], "answer": 3, "why": "A natural occurring event/wonder = a phenomenon.", "why_ar": "حدث طبيعي غريب = ظاهرة (phenomenon)."}, {"q": "To stay healthy, it is vital to .......... a diet that is rich in fruits, vegetables, and whole grains.", "options": ["report", "maintain", "treat", "create"], "answer": 1, "why": "Keeping up a healthy diet = to maintain it.", "why_ar": "الحفاظ على نظام غذائي صحي = المحافظة عليه (maintain)."}, {"q": "The .......... of \"fairness\" is central to the legal systems of many democratic nations.", "options": ["concept", "viewer", "platform", "version"], "answer": 0, "why": "An abstract idea like fairness is a concept.", "why_ar": "فكرة مجردة مثل العدالة هي مفهوم (concept)."}]}, {"src": "مذكرة", "page": 16, "q": "Important Vocabulary Q21-32", "type": "mcq", "items": [{"q": "GPS technology provides .......... data that helps drivers find the fastest route to their destination.", "options": ["basic", "major", "accurate", "positive"], "answer": 2, "why": "Data that correctly guides drivers is accurate.", "why_ar": "بيانات توجّه السائق بشكل صحيح = دقيقة (accurate)."}, {"q": "Some species of animals become very .......... when they feel their territory is being threatened.", "options": ["through", "basically", "overall", "aggressive"], "answer": 3, "why": "Defending territory with hostility = aggressive.", "why_ar": "الدفاع عن المنطقة بعدائية = عدواني (aggressive)."}, {"q": "Many .......... use their social media presence to promote charitable causes and raise awareness.", "options": ["psychologists", "influencers", "celebrities", "peers"], "answer": 1, "why": "People who use online presence/influence to promote causes are influencers.", "why_ar": "من يستخدمون تأثيرهم على السوشيال ميديا للترويج لقضايا هم المؤثرون (influencers)."}, {"q": "Effective .......... is the foundation of any healthy relationship, whether personal or professional.", "options": ["communication", "transformation", "satisfaction", "association"], "answer": 0, "why": "Healthy relationships are built on good communication.", "why_ar": "العلاقات الصحية تُبنى على تواصل جيد."}, {"q": "Genetic .......... play a major role in determining a person's height and eye color.", "options": ["stages", "versions", "factors", "terms"], "answer": 2, "why": "Genetics that determine traits are genetic factors.", "why_ar": "الچينات التي تحدد الصفات هي عوامل وراثية (factors)."}, {"q": "If we do not address climate change now, future generations will .......... to thrive on this planet.", "options": ["appear", "treat", "maintain", "fail"], "answer": 3, "why": "Not addressing the problem means future generations will fail to thrive.", "why_ar": "عدم معالجة المشكلة يعني فشل الأجيال القادمة في الازدهار."}, {"q": "Most modern cameras have a built-in .......... that helps improve the lighting in low-light conditions.", "options": ["crush", "filter", "shape", "publish"], "answer": 1, "why": "A camera feature that adjusts light is a filter.", "why_ar": "خاصية في الكاميرا تُحسّن الإضاءة = فلتر (filter)."}, {"q": "If you work hard and stay focused, you will likely meet every .......... your manager has set for you.", "options": ["expectation", "mechanism", "perception", "factor"], "answer": 0, "why": "Standards a manager sets are expectations.", "why_ar": "المعايير التي يضعها المدير هي التوقعات (expectations)."}, {"q": "Biography books about successful leaders can often .......... young people to pursue their own goals.", "options": ["present", "transform", "publish", "inspire"], "answer": 3, "why": "Motivating young people to act is to inspire them.", "why_ar": "تحفيز الشباب على السعي لأهدافهم = إلهامهم (inspire)."}, {"q": "The kitten .......... hid under the sofa when it heard the loud noise of the vacuum cleaner.", "options": ["basically", "instinctively", "particularly", "unlike"], "answer": 1, "why": "Acting on instinct without thinking = instinctively.", "why_ar": "التصرف بالغريزة دون تفكير = بشكل غريزي (instinctively)."}, {"q": "The athlete underwent .......... training for months to prepare for the Olympic games.", "options": ["intense", "obvious", "significant", "accurate"], "answer": 0, "why": "Very demanding training is intense training.", "why_ar": "تدريب شاق جدًا = تدريب مكثف (intense)."}, {"q": "A popular fashion .......... can reach millions of followers with a single post about a new clothing line.", "options": ["celebrity", "influencer", "psychologist", "viewer"], "answer": 1, "why": "Someone who reaches followers through posts is an influencer.", "why_ar": "من يصل لملايين المتابعين بمنشوراته هو المؤثر (influencer)."}]}, {"src": "مذكرة", "page": 17, "q": "Important Vocabulary Q33-35 + Synonyms/Antonyms/Prepositions Q36-43", "type": "mcq", "items": [{"q": "Adolescents often feel a strong desire to fit in and be accepted by their .......... at school.", "options": ["celebrities", "influencers", "peers", "viewers"], "answer": 2, "why": "People the same age at school are peers.", "why_ar": "من هم في نفس العمر بالمدرسة هم الأقران (peers)."}, {"q": "Our .......... of reality is often shaped by the stories we hear and the media we consume.", "options": ["inquiry", "expectation", "communication", "perception"], "answer": 3, "why": "How we see/understand reality is our perception.", "why_ar": "طريقة فهمنا للواقع هي إدراكنا (perception)."}, {"q": "While there were some minor issues, the .......... performance of the team was very impressive.", "options": ["physical", "overall", "positive", "image-based"], "answer": 1, "why": "Performance \"as a whole\" = overall performance.", "why_ar": "الأداء \"ككل\" = الأداء العام (overall)."}, {"q": "The protest turned aggressive as the crowds began to clash with the security forces. The synonym of \"aggressive\" is ..........", "options": ["peaceful", "gentle", "neutral", "violent"], "answer": 3, "why": "Aggressive ≈ violent.", "why_ar": "عدواني ≈ عنيف (violent)."}, {"q": "The human brain is a complex system that researchers are still trying to map. The synonym of \"complex\" is ..........", "options": ["intricate", "plain", "random", "obvious"], "answer": 0, "why": "Complex ≈ intricate.", "why_ar": "معقّد ≈ متشابك (intricate)."}, {"q": "The patient suffered from intense pain following the surgery, requiring strong medication. The synonym of \"intense\" is ..........", "options": ["mild", "gentle", "basic", "severe"], "answer": 3, "why": "Intense ≈ severe.", "why_ar": "شديد ≈ حاد/قاسٍ (severe)."}, {"q": "The judge was accused of being biased because he had a personal connection to the defendant. The antonym of \"biased\" is ..........", "options": ["prejudiced", "one-sided", "neutral", "selective"], "answer": 2, "why": "The opposite of biased is neutral.", "why_ar": "عكس متحيز هو محايد (neutral)."}, {"q": "The university uses a selective admissions process to find the most talented students for the program. The antonym of \"selective\" is ..........", "options": ["choosy", "specific", "balanced", "random"], "answer": 3, "why": "The opposite of selective (choosing carefully) is random.", "why_ar": "عكس انتقائي (يختار بعناية) هو عشوائي (random)."}, {"q": "Many people use meditation or exercise as a way to cope .......... stress during busy work weeks.", "options": ["treat", "with", "report", "sense"], "answer": 1, "why": "Correct preposition: \"cope with\" stress.", "why_ar": "حرف الجر الصحيح: \"cope with\" (يتأقلم مع)."}, {"q": "Most of the symptoms the patient described are directly related .......... a lack of sleep.", "options": ["with", "to", "for", "about"], "answer": 1, "why": "Correct preposition: \"related to\".", "why_ar": "حرف الجر الصحيح: \"related to\" (مرتبط بـ)."}]}, {"src": "مذكرة", "page": 18, "q": "Word-matching (Reflection 1)", "type": "match", "prompt": "ابحث عن الكلمة في الفقرة التي تقابل كل تعريف:\n\"Find the word or phrase in the text that could meaningfully replace the words below.\"", "items": [["transform", "يُحوِّل/يغيّر جذرياً"], ["unrealistic", "غير واقعي"], ["concept", "مفهوم"], ["selective", "انتقائي"], ["bias", "تحيز"], ["satisfy", "يُرضي"]]}, {"src": "مذكرة", "page": 18, "q": "Reflection 1 — True/False (Justify)", "type": "tf", "items": [{"passage": "Viewers often treat selective and filtered posts as a complete and accurate picture. This highlight reel effect hides the gap between ordinary people and celebrities, making online lives appear more perfect than they really are.", "statement": "The images people post online are usually an honest and total reflection of their daily reality.", "answer": false, "why": "False — the passage says posts are selective/filtered and viewers wrongly treat them as complete/accurate; online lives only appear more perfect, they aren't an honest full picture.", "why_ar": "خطأ — النص يقول إن المنشورات منتقاة/مُرشّحة والمشاهدون يعتقدون خطأً أنها كاملة وحقيقية؛ الحياة أونلاين تبدو أكمل فقط، وليست صورة صادقة كاملة."}]}, {"src": "مذكرة", "page": 18, "q": "Reading comprehension (Reflection 1, Task 5)", "type": "open", "items": [{"q": "Identify the relationship between time spent on social media and a teenager's self-image.", "a": "More time spent on image-based social media (e.g. more than 3 hours daily) is linked to a greater likelihood of low self-esteem and body dissatisfaction, because users compare their ordinary lives to others' curated, highlight-reel moments."}, {"q": "How do \"influencers\" affect the way teenagers perceive their own lives? Use evidence from the text.", "a": "Influencers present their lives as easily perfect through strategically timed and curated moments; because viewers instinctively treat this as a complete and accurate picture, teenagers compare their ordinary days to these polished moments and feel their own lives fall short."}]}, {"src": "تقييمات", "page": 3, "q": "Class Performance Q1-4", "type": "mcq", "items": [{"q": "A lifestyle account shows only carefully selected achievements and removes ordinary moments. The account is best described as ............", "options": ["balanced", "curated", "private", "unrelated"], "answer": 1, "why": "\"Curated\" means carefully selected and presented — exactly describing an account that removes ordinary moments and shows only achievements.", "why_ar": "\"منتقى بعناية\" تعني حسابًا مُختارًا بدقة يعرض فقط الإنجازات ويحذف اللحظات العادية."}, {"q": "Hind begins to judge her ordinary school day against influencers' holiday photographs. This is an example of ............", "options": ["social comparison", "mindful consumption", "structural support", "personal agency"], "answer": 0, "why": "Judging yourself against others' posts is the definition of social comparison.", "why_ar": "الحكم على نفسك مقارنة بمنشورات الآخرين هو تعريف المقارنة الاجتماعية."}, {"q": "Which sentence is the most neutral?", "options": ["Anyone who rests is lazy.", "This routine is absolutely perfect for everyone.", "Some students may find an early routine helpful.", "Only unsuccessful people miss a workout."], "answer": 2, "why": "It uses a hedging word (\"may\") and avoids absolute/biased language.", "why_ar": "تستخدم كلمة تلطيف (\"may\"/قد) وتتجنب اللغة المطلقة أو المتحيزة."}, {"q": "Which persuasive technique is used in \"Can any teenager realistically maintain this routine every day?\"", "options": ["An intensifier", "A rhetorical question", "An absolute word", "A relative clause"], "answer": 1, "why": "It's a question asked for effect, not to get a real answer — a rhetorical question.", "why_ar": "هو سؤال يُطرح للتأثير وليس للحصول على إجابة حقيقية — سؤال بلاغي."}]}, {"src": "تقييمات", "page": 3, "q": "Word/phrase replacement", "type": "match", "prompt": "Find the words or phrases that could meaningfully replace the words below (from the passage on curated social media posts).", "items": [["rhetorical question", "سؤال بلاغي (لا يُقصد به إجابة)"], ["bias", "تحيز/ميل لجانب واحد"], ["curated", "مُنتقى بعناية"], ["the highlight-reel effect", "تأثير اللحظات المميزة"], ["intensifier", "كلمة تكثيف/تقوية"]]}, {"src": "تقييمات", "page": 3, "q": "Home Assessment — True/False (Justify)", "type": "tf", "items": [{"passage": "In today's fast-changing world, social media plays a major role in shaping how teenagers think, feel, and see themselves, while creating unrealistic expectations and pressure.", "statement": "Social media platforms have no impact on how teenagers view themselves or handle daily pressures.", "answer": false, "why": "False — the passage states social media plays a major role in shaping how teenagers think, feel and see themselves, i.e. it clearly does have an impact.", "why_ar": "خطأ — النص يذكر أن السوشيال ميديا تلعب دورًا رئيسيًا في تشكيل تفكير ومشاعر ونظرة المراهقين لأنفسهم، أي أن لها تأثيرًا واضحًا."}, {"passage": "Excessive use of addictive social media applications often leads to passive scrolling, reduced attention spans, and increased feelings of social isolation among users.", "statement": "Addictive social media applications actively enhance user attention spans and eliminate feelings of isolation.", "answer": false, "why": "False — the passage says the opposite: such apps reduce attention spans and increase feelings of isolation.", "why_ar": "خطأ — النص يقول العكس: هذه التطبيقات تقلل الانتباه وتزيد الشعور بالعزلة."}]}, {"src": "تقييمات", "page": 6, "q": "Weekly Assessment — Group A/B/C vocabulary", "type": "mcq", "items": [{"q": "A post showing only perfect moments is ______.", "options": ["curated", "sedentary", "structural", "measurable"], "answer": 0, "why": "A post showing only perfect, selected moments is \"curated\".", "why_ar": "منشور يُظهر لحظات مثالية فقط = مُنتقى (curated)."}, {"q": "Comparing ordinary life with influencers' best moments is ______.", "options": ["social comparison", "mindfulness", "agency", "nutrition"], "answer": 0, "why": "Judging your own life against others' highlight moments is social comparison.", "why_ar": "مقارنة حياتك العادية بأفضل لحظات المؤثرين = المقارنة الاجتماعية."}, {"q": "Paying careful attention to the present moment is ______.", "options": ["mindfulness", "bias", "agency", "pressure"], "answer": 0, "why": "Mindfulness = careful attention to the present moment.", "why_ar": "اليقظة الذهنية = الانتباه الكامل للحظة الحالية."}, {"q": "A lifestyle with very little movement is ______.", "options": ["sedentary", "curated", "mindful", "balanced"], "answer": 0, "why": "Sedentary = involving very little physical movement.", "why_ar": "الخمول (sedentary) = نمط حياة بحركة قليلة جدًا."}, {"q": "Language that strongly favors one side shows ______.", "options": ["bias", "resilience", "mindfulness", "nutrition"], "answer": 0, "why": "Bias = language/attitude that strongly favors one side.", "why_ar": "التحيز = لغة/موقف يفضّل جانبًا واحدًا بقوة."}, {"q": "Food that provides the body with what it needs supports good ______.", "options": ["nutrition", "comparison", "advertising", "isolation"], "answer": 0, "why": "Nutrition = the food/nourishment the body needs.", "why_ar": "التغذية = الطعام الذي يحتاجه الجسم."}]}], "L2": [{"src": "مذكرة", "page": 32, "q": "Key Vocabulary Exercises Q1-2", "type": "mcq", "items": [{"q": "The importance of drinking enough water is often underestimated, although it is essential for good health. What does underestimated mean in this context?", "options": ["Given much more attention than necessary.", "Considered less important or valuable than it really is.", "Completely prevented from happening.", "Clearly explained to other people."], "answer": 1, "why": "Underestimated = considered less important/valuable than it really is.", "why_ar": "الاستهانة (underestimated) = اعتباره أقل أهمية أو قيمة مما هو عليه فعلاً."}, {"q": "In recent years, mindfulness has moved from specialist wellness programmes into common education. What does mindfulness mean in this context?", "options": ["Paying deliberate attention to the present moment.", "Avoiding all social contact with other people.", "Spending more time using electronic devices.", "Focusing only on future goals and achievements."], "answer": 0, "why": "Mindfulness = paying deliberate attention to the present moment.", "why_ar": "اليقظة الذهنية = الانتباه المتعمد للحظة الحالية."}]}, {"src": "مذكرة", "page": 33, "q": "Key Vocabulary Exercises Q3-5 + Q6-10", "type": "mcq", "items": [{"q": "Spending several hours sitting at a desk without moving can lead to a sedentary lifestyle. What does sedentary mean in this context?", "options": ["Involving difficult physical training every day.", "Characterized by regular exercise and physical movement.", "Characterized by spending a lot of time sitting or being inactive.", "Related to travelling long distances on foot."], "answer": 2, "why": "Sedentary = characterized by spending a lot of time sitting/being inactive.", "why_ar": "الخمول = قضاء وقت طويل في الجلوس أو عدم الحركة."}, {"q": "The article explained that wellbeing depends on maintaining healthy habits and taking care of both physical and mental health. Which situation is the clearest example of good wellbeing?", "options": ["A teenager spends most of the day sitting and using electronic devices.", "A student studies for many hours without taking any breaks.", "A teenager sleeps well, eats a balanced diet, and stays physically active.", "A student regularly skips meals because of a busy school schedule."], "answer": 2, "why": "Good wellbeing = sleeping well, eating a balanced diet, and staying active.", "why_ar": "الرفاهية الجيدة = نوم جيد، غذاء متوازن، ونشاط بدني."}, {"q": "Eating too many processed foods may be unhealthy because they often contain high amounts of sugar, salt, or fat. What does processed mean in this context?", "options": ["Changed or prepared industrially before being eaten.", "Grown naturally without any human involvement.", "Cooked immediately after being collected from a farm.", "Served without any preparation at all."], "answer": 0, "why": "Processed = changed/prepared industrially before being eaten.", "why_ar": "المُصنَّع (processed) = مُحضَّر صناعيًا قبل تناوله."}, {"q": "My doctor says I should play sport as my lifestyle is too ..........", "options": ["measurable", "sedentary", "underestimated", "deliberate"], "answer": 1, "why": "An inactive lifestyle is a sedentary lifestyle.", "why_ar": "نمط حياة بلا حركة هو نمط خامل (sedentary)."}, {"q": "Frequent consumption of .......... food can result in high sugar intake and a lack of essential nutrients.", "options": ["influential", "released", "involved", "processed"], "answer": 3, "why": "Industrially prepared food is processed food.", "why_ar": "طعام مُحضَّر صناعيًا هو طعام مُصنّع (processed)."}, {"q": "Practicing .......... allows individuals to remain present and manage daily stress more effectively.", "options": ["mindfulness", "recovery", "fatigue", "concentration"], "answer": 0, "why": "Staying present/aware to manage stress is mindfulness.", "why_ar": "البقاء واعيًا بالحاضر لإدارة التوتر هو اليقظة الذهنية."}, {"q": "Spiritual and physical health are both vital components of a person's overall ..........", "options": ["foundation", "wellbeing", "resilience", "intake"], "answer": 1, "why": "Overall health/happiness = wellbeing.", "why_ar": "الصحة والسعادة الشاملة = الرفاهية (wellbeing)."}, {"q": "The long-term impact of sleep deprivation is often .......... by students during exam seasons.", "options": ["released", "required", "reinforced", "underestimated"], "answer": 3, "why": "Its seriousness is often underestimated (not taken seriously enough).", "why_ar": "خطورته غالبًا يُستهان بها (لا تُؤخذ بجدية كافية)."}]}, {"src": "مذكرة", "page": 34, "q": "Key Vocabulary Q11-12 + Important Vocabulary Q13-23", "type": "mcq", "items": [{"q": "You should consult a qualified .......... to create a meal plan that meets your specific health goals.", "options": ["nutritionist", "nutritional", "teenager", "judge"], "answer": 0, "why": "A diet expert is a nutritionist.", "why_ar": "خبير النظام الغذائي هو أخصائي التغذية (nutritionist)."}, {"q": "Doctors need .......... data, such as blood pressure readings, to track a patient's progress.", "options": ["influential", "deliberate", "measurable", "screen-based"], "answer": 2, "why": "Data that can be tracked/quantified is measurable.", "why_ar": "بيانات يمكن تتبعها وقياسها = قابلة للقياس (measurable)."}, {"q": "After a long day of intense mental work, most people experience significant ..........", "options": ["loneliness", "anxiety", "depression", "fatigue"], "answer": 3, "why": "Tiredness after mental effort is fatigue.", "why_ar": "الإرهاق بعد مجهود ذهني هو التعب (fatigue)."}, {"q": "Building psychological .......... helps individuals bounce back from personal or professional failures.", "options": ["resilience", "self-confidence", "identity", "wellness"], "answer": 0, "why": "Bouncing back from failure = resilience.", "why_ar": "التعافي من الفشل = المرونة النفسية (resilience)."}, {"q": "Loud noises in the library can easily break a student's .......... during deep study sessions.", "options": ["attention", "concentration", "meditation", "annotation"], "answer": 1, "why": "Being unable to focus deeply = losing concentration.", "why_ar": "عدم القدرة على التركيز العميق = فقدان التركيز (concentration)."}, {"q": "Excessive .......... of high-caffeine drinks can lead to increased heart rates and jitteriness.", "options": ["production", "publication", "distribution", "consumption"], "answer": 3, "why": "Drinking (taking in) a lot of something = consumption.", "why_ar": "تناول كمية كبيرة من شيء ما = الاستهلاك (consumption)."}, {"q": "Achieving small goals early in life can greatly enhance a young person's ..........", "options": ["self-confidence", "identity", "loneliness", "stress"], "answer": 0, "why": "Small wins build self-confidence.", "why_ar": "الإنجازات الصغيرة تبني الثقة بالنفس."}, {"q": "Physical exercise is known to .......... natural chemicals that act as painkillers in the body.", "options": ["absorb", "improve", "release", "involve"], "answer": 2, "why": "The body releases natural painkilling chemicals (endorphins) during exercise.", "why_ar": "الجسم يفرز مواد كيميائية طبيعية مسكّنة للألم أثناء الرياضة."}, {"q": "Extensive .......... is still being conducted to find a permanent cure for certain chronic diseases.", "options": ["survey", "research", "task", "routine"], "answer": 1, "why": "Systematic scientific investigation is research.", "why_ar": "البحث العلمي المنظم هو الدراسة/الأبحاث (research)."}, {"q": "Clinical .......... is a serious medical condition that requires professional therapy and support.", "options": ["fatigue", "anxiety", "stress", "depression"], "answer": 3, "why": "A serious diagnosable condition here is depression.", "why_ar": "حالة طبية خطيرة تشخيصية هنا هي الاكتئاب (depression)."}, {"q": "Following the surgery, the athlete spent several months in .......... to regain her strength.", "options": ["recovery", "wellness", "foundation", "concentration"], "answer": 0, "why": "Regaining strength after surgery is the recovery period.", "why_ar": "استعادة القوة بعد الجراحة هي فترة التعافي (recovery)."}, {"q": "The company offers a .......... range of products to satisfy the needs of different customers.", "options": ["measurable", "sedentary", "varied", "moderate"], "answer": 2, "why": "A range with many different products is a varied range.", "why_ar": "مجموعة متنوعة من المنتجات = مجموعة متنوعة (varied)."}, {"q": "A strong education is the .......... upon which a successful professional career is built.", "options": ["product", "device", "survey", "foundation"], "answer": 3, "why": "The base that a career is built on is its foundation.", "why_ar": "الأساس الذي تُبنى عليه المسيرة المهنية هو القاعدة (foundation)."}]}, {"src": "مذكرة", "page": 35, "q": "Important Vocabulary Q24-35", "type": "mcq", "items": [{"q": "Reducing your daily salt .......... can significantly lower your risk of heart disease.", "options": ["intake", "consumption", "routine", "survey"], "answer": 0, "why": "The standard collocation is \"salt intake\".", "why_ar": "التعبير الشائع الصحيح هو \"salt intake\" (كمية الملح المتناولة)."}, {"q": "Many adolescents struggle to establish their own .......... while trying to fit in with peers.", "options": ["wellness", "identity", "depression", "resilience"], "answer": 1, "why": "One's sense of self is one's identity.", "why_ar": "إحساس الشخص بذاته هو هويته (identity)."}, {"q": "High levels of performance .......... can sometimes prevent students from doing their best in exams.", "options": ["stress", "pressure", "fatigue", "anxiety"], "answer": 1, "why": "Performance pressure is the standard collocation here.", "why_ar": "\"ضغط الأداء\" هو التعبير القياسي الصحيح هنا."}, {"q": "It is vital to .......... screen time before bed to ensure a better night's sleep.", "options": ["involve", "limit", "improve", "release"], "answer": 1, "why": "Reducing screen time is to limit it.", "why_ar": "تقليل وقت الشاشة = الحد منه (limit)."}, {"q": "Using a digital .......... late at night can interfere with the body's natural sleep cycle.", "options": ["product", "task", "foundation", "device"], "answer": 3, "why": "A phone/tablet used at night is a digital device.", "why_ar": "جهاز يُستخدم ليلًا هو جهاز رقمي (device)."}, {"q": "The skin can .......... harmful UV rays if you do not wear sunscreen while outdoors.", "options": ["release", "consume", "absorb", "limit"], "answer": 2, "why": "Skin takes in/absorbs UV rays without protection.", "why_ar": "الجلد يمتص الأشعة فوق البنفسجية بدون حماية."}, {"q": "Social media platforms can have a highly .......... effect on the self-image of young users.", "options": ["influential", "deliberate", "measurable", "screen-based"], "answer": 0, "why": "A strong, shaping effect is an influential effect.", "why_ar": "تأثير قوي ومؤثر = تأثير مؤثر (influential)."}, {"q": "To master a new language, you must practice .......... and speak with native speakers.", "options": ["notably", "regularly", "widely", "equally"], "answer": 1, "why": "Consistent, repeated practice is regular practice.", "why_ar": "الممارسة المستمرة والمتكررة هي ممارسة منتظمة (regularly)."}, {"q": "Parents are encouraged to spend .......... with their children to build strong family bonds.", "options": ["routine", "wellness", "task", "quality time"], "answer": 3, "why": "Meaningful time spent together is quality time.", "why_ar": "وقت ذو معنى يُقضى مع الآخرين هو وقت نوعي (quality time)."}, {"q": "The government needs to .......... the existing laws to protect the environment more effectively.", "options": ["reinforce", "release", "require", "involve"], "answer": 0, "why": "Strengthening/enforcing laws more is to reinforce them.", "why_ar": "تقوية/تفعيل القوانين أكثر = تعزيزها (reinforce)."}, {"q": "Some people .......... to feel more energetic in the morning, while others are more productive at night.", "options": ["avoid", "involve", "tend", "support"], "answer": 2, "why": "Having a general habit/inclination is to tend to do something.", "why_ar": "وجود ميل أو عادة عامة = النزوع لفعل شيء (tend)."}, {"q": "Children often require emotional .......... from their parents during times of significant change.", "options": ["pressure", "stress", "cause", "support"], "answer": 3, "why": "Emotional help/backing is emotional support.", "why_ar": "المساعدة والدعم العاطفي هو الدعم العاطفي (support)."}]}, {"src": "مذكرة", "page": 36, "q": "Synonyms/Antonyms/Prepositions Q36-45", "type": "mcq", "items": [{"q": "Community centers play a vital role in the wellbeing of residents. The synonym of \"wellbeing\" is ..........", "options": ["distress", "welfare", "misery", "fatigue"], "answer": 1, "why": "Wellbeing ≈ welfare.", "why_ar": "الرفاهية ≈ الرعاية/الرفاه (welfare)."}, {"q": "Athletes usually lead very sedentary lives during the off-season to rest. The antonym of \"sedentary\" is ..........", "options": ["desk-bound", "active", "inactive", "moderate"], "answer": 1, "why": "The opposite of sedentary (inactive) is active.", "why_ar": "عكس الخامل (غير نشط) هو النشيط (active)."}, {"q": "Scientists have yet to find a measurable difference between the two chemical compounds. The antonym of \"measurable\" is ..........", "options": ["quantifiable", "assessable", "immeasurable", "accurate"], "answer": 2, "why": "The opposite of measurable is immeasurable.", "why_ar": "عكس القابل للقياس هو غير قابل للقياس (immeasurable)."}, {"q": "Modern technology has led to a decrease in mindfulness as people are constantly distracted. The antonym of \"mindfulness\" is ..........", "options": ["inattention", "awareness", "attentiveness", "concentration"], "answer": 0, "why": "The opposite of mindfulness (awareness) is inattention.", "why_ar": "عكس اليقظة الذهنية (الوعي) هو الغفلة/عدم الانتباه (inattention)."}, {"q": "Recent medical studies suggest that heart disease is often closely linked .......... poor dietary habits.", "options": ["with", "at", "for", "to"], "answer": 0, "why": "Correct preposition: \"linked with\".", "why_ar": "حرف الجر الصحيح: \"linked with\" (مرتبط بـ)."}, {"q": "Switching from white bread to .......... is a simple way to increase your fiber intake.", "options": ["healthy fats", "lean proteins", "processed foods", "whole grains"], "answer": 3, "why": "Whole grains are the fiber-rich alternative to white bread.", "why_ar": "الحبوب الكاملة هي البديل الغني بالألياف عن الخبز الأبيض."}, {"q": "Excessive consumption of sugary snacks can eventually lead .......... serious dental problems.", "options": ["to", "for", "with", "at"], "answer": 0, "why": "Correct preposition: \"lead to\".", "why_ar": "حرف الجر الصحيح: \"lead to\" (يؤدي إلى)."}, {"q": "Parents should .......... attention to the types of games their children are playing online.", "options": ["play", "pay", "avoid", "make"], "answer": 1, "why": "Correct collocation: \"pay attention\".", "why_ar": "التعبير الصحيح: \"pay attention\" (يولي اهتمامًا)."}, {"q": "Taking a daily walk in the park is an excellent way to boost your .......... and reduce stress.", "options": ["mood", "anxiety", "depression", "fatigue"], "answer": 0, "why": "Exercise is known to boost mood.", "why_ar": "الرياضة معروف أنها تحسّن المزاج."}, {"q": "Most of the symptoms the patient described are directly related to a lack of sleep — this shows the preposition \"related\" pairs with ..........", "options": ["to", "with", "for", "about"], "answer": 0, "why": "Correct preposition: \"related to\".", "why_ar": "حرف الجر الصحيح: \"related to\" (مرتبط بـ)."}]}, {"src": "تقييمات", "page": 4, "q": "Class Performance Q1-4", "type": "mcq", "items": [{"q": "Doctors recommend regular exercise to counter the effects of a/an .......... routine.", "options": ["active", "energetic", "sedentary", "mindful"], "answer": 2, "why": "Exercise is recommended to counter a sedentary (inactive) routine.", "why_ar": "الرياضة يُنصح بها لمواجهة آثار نمط الحياة الخامل."}, {"q": "Health experts recommend combining a/an .......... lifestyle with physical activity to combat the risks of a sedentary routine.", "options": ["biased", "underestimated", "balanced", "mindless"], "answer": 2, "why": "A balanced lifestyle paired with activity reduces the risks of sitting too much.", "why_ar": "نمط حياة متوازن مع النشاط البدني يقلل مخاطر الجلوس الطويل."}, {"q": "Mindful consumption includes being aware of ............", "options": ["only the amount of food on a plate", "food, media, products, and information we take in", "only the number of hours spent studying", "competitive sports results"], "answer": 1, "why": "Mindful consumption is about conscious awareness of everything we take in, not just food.", "why_ar": "الاستهلاك الواعي يعني الانتباه لكل ما نستقبله، وليس فقط الطعام."}, {"q": "Maintaining physical health and mental balance is essential for achieving overall well-being. What does \"well-being\" mean here?", "options": ["The ability to succeed in difficult tasks", "A state of being healthy, comfortable, and happy", "The habit of following a strict daily routine", "A feeling of excitement caused by achievement"], "answer": 1, "why": "Well-being = a state of being healthy, comfortable, and happy.", "why_ar": "الرفاهية = حالة من الصحة والراحة والسعادة."}]}, {"src": "مذكرة", "page": 37, "q": "Word-matching (Reflection 2)", "type": "match", "prompt": "ابحث عن الكلمة في الفقرة التي تقابل كل تعريف:\n\"Find the word or phrase from the text below that could meaningfully replace each word.\"", "items": [["wellbeing", "الرفاهية"], ["nutritionist", "خبير تغذية"], ["processed food", "طعام مصنع"], ["sedentary", "خامل"], ["underestimated", "يستهان به"], ["measurable", "قابل للقياس"]]}, {"src": "مذكرة", "page": 37, "q": "Reflection 2 — True/False (Justify)", "type": "tf", "items": [{"passage": "Although often underestimated, sleep is essential for brain development and physical recovery. Research found that teenagers who slept fewer than seven hours per night were more likely to report symptoms of anxiety and depression.", "statement": "The amount of sleep a teenager gets has very little impact on their psychological state.", "answer": false, "why": "False — the text shows sleeping fewer than 7 hours is linked to more anxiety/depression symptoms, so sleep clearly does affect psychological state.", "why_ar": "خطأ — النص يوضح أن النوم أقل من 7 ساعات يرتبط بأعراض قلق واكتئاب أكثر، فالنوم بالتأكيد يؤثر على الحالة النفسية."}]}, {"src": "مذكرة", "page": 37, "q": "Reading comprehension (Reflection 2)", "type": "open", "items": [{"q": "Identify two specific lifestyle changes that can lead to a measurable reduction in a person's stress levels.", "a": "Regular physical activity (releasing endorphins) and practicing daily mindfulness (e.g. meditation or breathing exercises)."}, {"q": "Why does the text suggest moving away from 'screens' for social connection? Use evidence from the text.", "a": "Because spending quality time face-to-face, rather than through screens, has been shown to reduce loneliness and build the emotional resilience needed to cope with life's pressures."}]}, {"src": "تقييمات", "page": 6, "q": "Weekly Assessment — Group B/C vocabulary", "type": "mcq", "items": [{"q": "Teenagers who eat mostly ______ food may miss important nutrients found in fresh meals.", "options": ["processed", "balanced", "measurable", "curated"], "answer": 0, "why": "\"Processed food\" is food changed from its natural state with chemicals/additives.", "why_ar": "\"الطعام المُصنّع\" هو طعام تغيّر عن حالته الطبيعية بإضافة مواد كيميائية."}, {"q": "Belief in one's ability to succeed through effort is ______.", "options": ["self-efficacy", "social comparison", "sedentary behavior", "bias"], "answer": 0, "why": "Self-efficacy = belief in one's own ability to succeed.", "why_ar": "الكفاءة الذاتية = الإيمان بقدرة الشخص على النجاح."}, {"q": "The ability to recover after difficulty is ______.", "options": ["resilience", "curation", "nutrition", "pressure"], "answer": 0, "why": "Resilience = the ability to recover/adapt after difficulty.", "why_ar": "المرونة النفسية = القدرة على التعافي والتكيف بعد الصعوبات."}]}], "L3": [{"src": "مذكرة", "page": 82, "q": "Key Vocabulary Exercises Q1-5", "type": "mcq", "items": [{"q": "Building resilience can help teenagers deal with difficulties and continue working toward their goals. What does resilience mean in this context?", "options": ["The ability to make other people follow your decisions.", "The habit of avoiding difficult situations completely.", "The ability to recover from difficulties and adapt to challenges.", "The feeling of being unable to solve everyday problems."], "answer": 2, "why": "Resilience = the ability to recover from difficulties and adapt to challenges.", "why_ar": "المرونة النفسية = القدرة على التعافي من الصعوبات والتكيف مع التحديات."}, {"q": "Having personal agency means that people can make choices and take action to influence their own lives. What does agency mean in this context?", "options": ["The habit of avoiding responsibility for personal choices.", "The need to depend completely on other people's decisions.", "The ability and freedom to make choices and take action.", "The ability to predict what other people will do."], "answer": 2, "why": "Agency = the ability and freedom to make choices and take action.", "why_ar": "الفاعلية (agency) = القدرة والحرية على الاختيار واتخاذ الإجراء."}, {"q": "The school introduced a small nudge by placing healthy snacks near the entrance to encourage students to make better choices. What does nudge mean in this context?", "options": ["A punishment given to people who make unhealthy choices.", "A strict rule that completely prevents people from choosing freely.", "A detailed explanation of the dangers of unhealthy food.", "A gentle encouragement to influence someone's decision or behaviour."], "answer": 3, "why": "Nudge = a gentle encouragement to influence someone's decision or behaviour.", "why_ar": "الدفعة اللطيفة (nudge) = تشجيع لطيف للتأثير على قرار أو سلوك شخص ما."}, {"q": "Constantly telling teenagers that they cannot improve may be disempowering, as it can make them feel unable to control their own choices. What does disempowering mean in this context?", "options": ["Giving someone greater confidence to make independent decisions.", "Making someone feel less confident or less able to control their choices.", "Encouraging someone to take responsibility for their actions.", "Helping someone develop the skills needed to solve problems."], "answer": 1, "why": "Disempowering = making someone feel less confident or less able to control their choices.", "why_ar": "المُضعِف (disempowering) = يجعل الشخص يشعر بثقة أو قدرة أقل على التحكم في خياراته."}, {"q": "The ancient railway station has remained abandoned since the route was closed, with its platforms and waiting rooms slowly falling into disrepair. What does abandoned mean in this context?", "options": ["Left unused and without anyone taking care of it.", "Carefully restored to preserve its historical value.", "Temporarily closed while workers repair the building.", "Regularly maintained by the local transport authority."], "answer": 0, "why": "Abandoned = left unused and without anyone taking care of it.", "why_ar": "المهجور (abandoned) = متروك دون استخدام ودون أن يعتني به أحد."}]}, {"src": "مذكرة", "page": 83, "q": "Key Vocabulary Q6-12 + Important Vocabulary Q13-14", "type": "mcq", "items": [{"q": "As children grow older, they develop a greater sense of .......... and independence over their own lives.", "options": ["failure", "agency", "identity", "background"], "answer": 1, "why": "Having independent control over one's life is agency.", "why_ar": "التحكم المستقل في حياة الشخص هو الفاعلية (agency)."}, {"q": "The report emphasizes the importance of .......... in helping students bounce back from setbacks.", "options": ["failure", "landmark", "perspective", "resilience"], "answer": 3, "why": "Bouncing back from setbacks = resilience.", "why_ar": "التعافي من الانتكاسات = المرونة النفسية (resilience)."}, {"q": "Psychologists suggest that an internal .......... is associated with higher levels of self-esteem.", "options": ["locus of control", "structural barrier", "peer pressure", "health review"], "answer": 0, "why": "Believing you control outcomes yourself = an internal locus of control.", "why_ar": "الاعتقاد بأن الشخص يتحكم بنتائجه بنفسه هو مركز التحكم الداخلي."}, {"q": "A gentle .......... from a mentor can often be enough to help a student get back on the right track.", "options": ["risk", "force", "target", "nudge"], "answer": 3, "why": "A gentle push/encouragement is a nudge.", "why_ar": "الدفع اللطيف/التشجيع هو الدفعة اللطيفة (nudge)."}, {"q": "Teachers aim to boost a student's .......... so they believe in their ability to master difficult subjects.", "options": ["willpower", "income", "self-efficacy", "capacity"], "answer": 2, "why": "Belief in one's own ability to succeed is self-efficacy.", "why_ar": "الإيمان بقدرة الشخص على النجاح هو الكفاءة الذاتية (self-efficacy)."}, {"q": "Being told that you have no influence over your circumstances can be deeply .......... and lead to passivity.", "options": ["disempowering", "affordable", "external", "limited"], "answer": 0, "why": "Feeling you have no control is disempowering.", "why_ar": "الشعور بعدم التحكم هو الإضعاف (disempowering)."}, {"q": "Economists argue that structural .......... like poor infrastructure often prevent people from accessing better jobs.", "options": ["outcomes", "measures", "barriers", "facilities"], "answer": 2, "why": "Obstacles built into a system are structural barriers.", "why_ar": "العوائق المبنية داخل النظام هي عوائق هيكلية (structural barriers)."}, {"q": "As a leading .......... for human rights, she spent her life fighting for equality and justice in court.", "options": ["philosopher", "advocate", "opponent", "individual"], "answer": 1, "why": "Someone who publicly supports/fights for a cause is an advocate.", "why_ar": "من يدعم علنًا قضية ما هو المؤيد/الداعم (advocate)."}, {"q": "The stadium has a seating .......... of fifty thousand, making it the largest venue in the country.", "options": ["capacity", "context", "landmark", "identity"], "answer": 0, "why": "The maximum number a venue can hold is its capacity.", "why_ar": "أقصى عدد يستوعبه المكان هو سعته (capacity)."}]}, {"src": "مذكرة", "page": 84, "q": "Important Vocabulary Q15-26", "type": "mcq", "items": [{"q": "The teacher used a simple experiment to .......... how gravity affects different objects.", "options": ["restrict", "possess", "maintain", "demonstrate"], "answer": 3, "why": "Showing something practically is to demonstrate it.", "why_ar": "إظهار شيء عمليًا = يوضحه (demonstrate)."}, {"q": "The project was .......... successful, achieving all of its goals without a single delay or extra cost.", "options": ["entirely", "faintly", "profoundly", "increasingly"], "answer": 0, "why": "Completely/fully successful = entirely successful.", "why_ar": "ناجح بالكامل = ناجح تمامًا (entirely)."}, {"q": "Athletes must .......... a lot of pressure on themselves to maintain peak physical performance.", "options": ["restrict", "possess", "exert", "abandon"], "answer": 2, "why": "Putting pressure on something/someone is to exert pressure.", "why_ar": "ممارسة الضغط على شيء/شخص = بذل الضغط (exert)."}, {"q": "Having a positive .......... can help you find opportunities even in the most difficult situations.", "options": ["background", "context", "perspective", "landmark"], "answer": 2, "why": "An outlook/way of viewing things is a perspective.", "why_ar": "وجهة نظر/طريقة رؤية الأمور هي المنظور (perspective)."}, {"q": "The new marketing strategy was designed to .......... the brand to a much younger audience.", "options": ["restrict", "exert", "attribute", "promote"], "answer": 3, "why": "Marketing to reach a new audience is to promote the brand.", "why_ar": "التسويق للوصول لجمهور جديد = الترويج للعلامة (promote)."}, {"q": "To protect the environment, the local council decided to .......... the use of plastic bags in shops.", "options": ["maintain", "restrict", "possess", "target"], "answer": 1, "why": "Limiting/banning something is to restrict it.", "why_ar": "تقييد/حظر شيء ما = تقييده (restrict)."}, {"q": "Living in a .......... apartment can be a great way for students to save money on rent and utilities.", "options": ["shared", "limited", "external", "professional"], "answer": 0, "why": "An apartment split between several people is a shared apartment.", "why_ar": "شقة يتقاسمها عدة أشخاص هي شقة مشتركة (shared)."}, {"q": "Despite her difficult .......... , she worked hard and eventually became a very successful surgeon.", "options": ["willpower", "upbringing", "failure", "background"], "answer": 1, "why": "How/where someone was raised is their upbringing.", "why_ar": "كيف/أين تربّى الشخص هو نشأته (upbringing)."
