<script>
const LT=['A','B','C','D'];
const SECS=[{"s": 0, "e": 58, "n": "القسم 1: أزمنة الماضي (Past Tenses)"}, {"s": 59, "e": 68, "n": "القسم 2: اسم الفاعل والمفعول (Gerund & Participle)"}, {"s": 69, "e": 116, "n": "القسم 3: المضارع التام والمستقبل (Present Perfect & Future)"}, {"s": 117, "e": 177, "n": "القسم 4: المبني للمجهول والسببية (Passive & Causative)"}, {"s": 178, "e": 212, "n": "القسم 5: الكلام المباشر وغير المباشر (Reported Speech)"}, {"s": 213, "e": 243, "n": "القسم 6: أفعال الضرورة والاستنتاج (Modals)"}, {"s": 244, "e": 270, "n": "القسم 7: الأفعال المتبوعة بمصدر/gerund"}, {"s": 271, "e": 314, "n": "القسم 8: الصفات والظروف (Adjectives & Adverbs)"}, {"s": 315, "e": 346, "n": "القسم 9: الأسماء والموزعات (Countable/Uncountable & Distributive)"}, {"s": 347, "e": 372, "n": "القسم 10: أسماء الوصل (Relative Clauses)"}, {"s": 373, "e": 400, "n": "القسم 11: السؤال المذيل والضمائر (Question Tags & Pronouns)"}, {"s": 401, "e": 435, "n": "القسم 12: الجمل الشرطية والروابط (Conditionals & Conjunctions)"}, {"s": 436, "e": 450, "n": "القسم 13: أدوات النكرة والمعرفة (Articles)"}, {"s": 451, "e": 497, "n": "القسم 14: تدريبات عامة (General Training)"}];

/* === بنك الأسئلة الكامل === */
const Q=[{"pg": "48-50", "q": "We ........... dinner at 8 p.m. yesterday.", "o": ["have", "had", "were having", "has"], "c": 2, "e": "الحدث كان مستمرًا في لحظة محددة بالماضي (8 p.m. yesterday)، فنستخدم Past Continuous: were having."}, {"pg": "48-50", "q": "“While we watched TV, the phone rang.” Which of the following corrects the mistake in this sentence?", "o": ["While -> after", "rang -> was ringing", "While -> before", "watched -> were watching"], "c": 3, "e": "بعد While نحتاج فعلًا مستمرًا (خلفية) قاطعه فعل قصير (rang)، لذا يصبح: While we were watching TV."}, {"pg": "48-50", "q": "Which sentence shows an action interrupted by another action?", "o": ["I finished my work early but I didn't go out.", "He washed the car and set off.", "I was cooking when the lights went out.", "I was revising the reports as Ali was trying to fix the machine"], "c": 2, "e": "Past Continuous + when + Past Simple هو الصيغة القياسية لحدث طويل قاطعه حدث قصير مفاجئ."}, {"pg": "48-50", "q": "........... his homework, Adam went to the club.", "o": ["Been finishing", "Had finished", "Having finished", "Would finish"], "c": 2, "e": "Having + P.P. تدل على إتمام فعل قبل فعل آخر في الماضي (Perfect Participle للتعبير عن السبق الزمني)."}, {"pg": "48-50", "q": "To remain employed I wish you ........... everything you are asked to, willingly and responsibly.", "o": ["have done", "would do", "had done", "could do"], "c": 1, "e": "Wish + would تُستخدم للتعبير عن رغبة في تغيير سلوك/عادة مستقبلية مزعجة."}, {"pg": "48-50", "q": "How long ........... her before you got married?", "o": ["had you known", "have you known", "had you been knowing", "have you been knowing"], "c": 0, "e": "before you got married فعل ماضي، والحدث الآخر سابق له، لذا Past Perfect: had you known."}, {"pg": "48-50", "q": "She ........... the table before the guests’ arrival.", "o": ["has laid", "was laid", "had laid", "is lied"], "c": 2, "e": "before the guests' arrival: حدث سبق حدثًا آخر في الماضي = Past Perfect: had laid."}, {"pg": "48-50", "q": "I’d rather he ........... for such a trivial matter. It was a big mistake.", "o": ["fought", "hadn't fought", "didn't fight", "had fought"], "c": 1, "e": "I'd rather + فاعل آخر + Past Perfect (منفي هنا) للتعبير عن ندم على أمر حدث في الماضي."}, {"pg": "48-50", "q": "I just wish I ........... harder this year. I really didn't work hard.", "o": ["had worked", "work", "worked", "could work"], "c": 0, "e": "Wish + Past Perfect للتعبير عن ندم على شيء لم يحدث في الماضي."}, {"pg": "48-50", "q": "Which sentence is grammatically correct to express a habit in the past?", "o": ["I wouldn't (would) work for ten hours a day.", "I don't use to work hard in the past.", "I get used to working for the company.", "I'm used to working for ten hours a day."], "c": 0, "e": "Would تُستخدم للعادات المتكررة في الماضي (وليس used to الوصفية هنا)، والجملة الصحيحة الوحيدة في الصياغة هي (a)."}, {"pg": "48-50", "q": "She’d rather ........... with the housework.", "o": ["to help", "helped", "help", "helps"], "c": 2, "e": "would rather + مصدر بدون to عندما يكون الفاعل نفسه."}, {"pg": "48-50", "q": "I couldn't get on board because I ........... my passport at home.", "o": ["had forgotten", "had been forgetting", "was forgotten", "have already forgotten"], "c": 0, "e": "نسيان الجواز سبق عدم الصعود للطائرة (كلاهما ماضٍ) = Past Perfect: had forgotten."}, {"pg": "48-50", "q": "Which sentence is structurally correct?", "o": ["No sooner had we arrived at the cinema than the lights went out.", "We no sooner had arrived at the cinema, than the lights went out.", "We had no sooner arrived at the cinema, when the lights went out.", "No sooner we had arrived at the cinema, when the lights went out."], "c": 0, "e": "التركيب الثابت: No sooner + had + فاعل + p.p. + than + جملة الماضي البسيط."}, {"pg": "48-50", "q": "While Hamza ........... , he had lunch at the nearest restaurant.", "o": ["has got his car to service", "has got his car serviced", "was getting his car serviced", "was getting his car servicing"], "c": 2, "e": "While + Past Continuous للخلفية، والسببية Causative: get something done (المفعول به يتلقى الفعل) = was getting his car serviced."}, {"pg": "48-50", "q": "Having ........... , the play was a great success.", "o": ["been performed", "performed", "being performed", "to be performed"], "c": 0, "e": "المسرحية (مفعول) تم عرضها من الآخرين = Perfect Passive Participle: Having been performed."}, {"pg": "48-50", "q": "Not until the 1990s ........... .", "o": ["the cell phone was invented", "was the cell phone invented", "did the cell phone invent", "the cell phone invented"], "c": 1, "e": "بعد Not until في بداية الجملة يجب قلب الفعل والفاعل (Inversion) + الجملة هنا مبنية للمجهول: was the cell phone invented."}, {"pg": "48-50", "q": "........... the food on the table did we start to eat.", "o": ["No sooner had we placed", "When we had placed", "Before we had placed", "Not until we had placed"], "c": 3, "e": "Not until... did + فاعل + فعل: قلب الفعل والفاعل بعد Not until في بداية الجملة."}, {"pg": "48-50", "q": "Having ........... , the criminal was taken to prison.", "o": ["arrested", "arresting", "being arrested", "been arrested"], "c": 3, "e": "المجرم تلقى فعل القبض عليه (مبني للمجهول) وسابق للفعل الرئيسي = Having been arrested."}, {"pg": "48-50", "q": "Which sentence doesn't express a habit in the past?", "o": ["I'd believe you if you told me everything.", "I would work hard when I was at secondary school.", "I used to ride a bike to school.", "I always visited grandpa in summer."], "c": 0, "e": "الجملة (a) هي جملة شرطية (would للنتيجة الافتراضية) وليست تعبيرًا عن عادة ماضية."}, {"pg": "48-50", "q": "My sister was suffering from insomnia. She ........... well for four days.", "o": ["hasn't slept", "hasn't been sleeping", "won't sleep", "hadn't been sleeping"], "c": 3, "e": "الفعل الرئيسي was suffering ماضٍ، والمدة (for four days) تسبقه وتستمر حتى تلك اللحظة = Past Perfect Continuous."}, {"pg": "48-50", "q": "I wish I ........... my teacher’s advice before I joined this college.", "o": ["had considered", "consider", "considered", "would consider"], "c": 0, "e": "Wish + Past Perfect للندم على حدث سابق (before I joined) لم يحدث."}, {"pg": "48-50", "q": "I met one of my best friends while I ........... in Canada.", "o": ["were", "was being", "was", "had been"], "c": 2, "e": "While + Past Continuous للخلفية المستمرة وقت حدوث فعل آخر (met) = was."}, {"pg": "48-50", "q": "I met Sally yesterday. I ........... her since she left our village.", "o": ["hadn't seen", "haven't seen", "won't see", "didn't see"], "c": 0, "e": "الفعل الرئيسي (met) ماضٍ، والمدة (since) تسبقه = Past Perfect: hadn't seen."}, {"pg": "48-50", "q": "\"The cowboy put the saddle on the horse, ........... him from the fence waved goodbye and rode off.\" Which tense form of the verb \"untie\" can be used to complete the previous story?", "o": ["Present perfect", "Past simple", "Past perfect", "Past continuous"], "c": 1, "e": "الأحداث متتابعة في سرد قصصي بسيط = Past Simple: untied."}, {"pg": "48-50", "q": "Having ........... all the reports, Ahmad was greatly exhausted.", "o": ["been finishing", "finished", "been finished", "to finish"], "c": 1, "e": "أحمد (الفاعل) هو من أنهى التقارير فعليًا (مبني للمعلوم) وسابق للفعل الرئيسي = Having finished."}, {"pg": "48-50", "q": "The convict was unaware that he ........... closely watched for two weeks before being arrested.", "o": ["had been", "has been", "had", "was"], "c": 0, "e": "المدة (for two weeks) سابقة على القبض عليه (before being arrested)، والمجرم كان يُراقَب (مبني للمجهول) = Past Perfect Passive: had been."}, {"pg": "48-50", "q": "This is the first time I ........... Mr. president face to face.", "o": ["saw", "'ve ever seen", "was seen", "had seen"], "c": 1, "e": "This is the first time + Present Perfect: 've ever seen (الفعل الرئيسي في المضارع is)."}, {"pg": "48-50", "q": "It was the first time I ........... Mr. president face to face.", "o": ["saw", "'ve ever seen", "was seen", "had seen"], "c": 3, "e": "It was the first time + Past Perfect: had seen (الفعل الرئيسي في الماضي was)."}, {"pg": "48-50", "q": "........... guarding shifts, a guard overslept, so one of the prisoners managed to escape.", "o": ["As", "When", "While", "During"], "c": 3, "e": "During + اسم (guarding shifts) لبيان الظرف الزمني، بينما While تحتاج جملة فعلية."}, {"pg": "48-50", "q": "The police ........... the suspect until they had questioned him thoroughly.", "o": ["won't release", "didn't release", "wasn't released", "released"], "c": 1, "e": "until + Past Perfect (had questioned) يقتضي فعلًا رئيسيًا في الماضي البسيط مبنيًا للمعلوم (الشرطة فاعل الفعل): didn't release."}, {"pg": "48-50", "q": "The convict ........... from jail until he had served his full sentence.", "o": ["won't release", "didn't release", "wasn't released", "released"], "c": 2, "e": "المجرم هو من يتلقى فعل الإفراج (مبني للمجهول) والزمن ماضٍ = wasn't released."}, {"pg": "48-50", "q": "The police ........... the suspect until they have questioned him thoroughly.", "o": ["won't release", "didn't release", "wasn't released", "released"], "c": 0, "e": "until + Present Perfect (have questioned) يقتضي فعلًا رئيسيًا في المستقبل = won't release."}, {"pg": "48-50", "q": "It wasn't until the team ........... the project that they took a break.", "o": ["complete", "completed", "had completed", "have completed"], "c": 2, "e": "It wasn't until + Past Perfect (سبق فعل took break الماضي) = had completed."}, {"pg": "48-50", "q": "They didn't go to the park ........... it had started to rain.", "o": ["until", "before", "since", "due to"], "c": 2, "e": "since + Past Perfect لبيان السبب الزمني السابق لعدم الذهاب."}, {"pg": "48-50", "q": "Not until the scientists had finished their experiments ........... the results.", "o": ["they did announced", "they announced", "did they announce", "had they announced"], "c": 2, "e": "بعد Not until...had في بداية الجملة، تُقلب الجملة الرئيسية: did they announce."}, {"pg": "48-50", "q": "She ........... dinner when her guests suddenly arrived.", "o": ["has cooked", "was cooking", "cooks", "had cooked"], "c": 1, "e": "حدث طويل (تحضير العشاء) قاطعه حدث قصير مفاجئ (arrived) = Past Continuous."}, {"pg": "48-50", "q": "The moment she heard the news, she ........... in tears.", "o": ["broke", "was breaking", "had broken", "breaks"], "c": 0, "e": "The moment + Past Simple + Past Simple لحدثين متتابعين فوريين."}, {"pg": "48-50", "q": "When the lady returned home, she realized her wallet ........... .", "o": ["had lost", "had been lost", "was being lost", "was losing"], "c": 1, "e": "المحفظة (مفعول) فُقدت (مبني للمجهول) قبل عودتها = Past Perfect Passive: had been lost."}, {"pg": "48-50", "q": "As soon as they arrived, we ........... the refreshments.", "o": ["had served", "have served", "will serve", "served"], "c": 3, "e": "As soon as + Past Simple + Past Simple لحدثين متتابعين مباشرة في الماضي."}, {"pg": "48-50", "q": "No sooner ........... the medicine than he left.", "o": ["has he taken", "he took", "he had taken", "had he taken"], "c": 3, "e": "No sooner + had + فاعل + p.p. + than + Past Simple: had he taken."}, {"pg": "48-50", "q": "Having ........... the Nobel Prize for literature, Naguib Mahfouz became one of the most famous writers all over the world.", "o": ["been awarded", "awarded", "awarding", "being awarded"], "c": 0, "e": "نجيب محفوظ تلقى الجائزة (مبني للمجهول) وسابق للفعل الرئيسي = Having been awarded."}, {"pg": "48-50", "q": "I would rather ........... to Scotland.", "o": ["not going", "not go", "to not go", "do not go"], "c": 1, "e": "would rather + not + مصدر بدون to للنفي."}, {"pg": "48-50", "q": "Mona got bored ........... herself alone, she decided to read a science fiction story.", "o": ["finding", "to find", "found", "to find"], "c": 0, "e": "Participle Clause: فعل مصاحب/سبب (Finding herself alone) في بداية الجملة يأخذ صيغة ing."}, {"pg": "48-50", "q": "He ........... for ten years before he finally got promoted.", "o": ["was working", "worked", "had been working", "had worked"], "c": 2, "e": "قبل حدث ماضٍ آخر (got promoted) مع التأكيد على استمرارية المدة (for ten years) = Past Perfect Continuous."}, {"pg": "48-50", "q": "She wishes she ........... in my place now.", "o": ["is", "were", "was being", "has been"], "c": 1, "e": "Wish + Past Simple (were مع كل الضمائر في الافتراض) للتمني في الحاضر."}, {"pg": "48-50", "q": "She walks as if she ........... a queen.", "o": ["is", "had", "were", "has"], "c": 2, "e": "as if + Past Simple (were) للتعبير عن حالة غير حقيقية في الحاضر."}, {"pg": "48-50", "q": "We ........... for half an hour before the bus arrived.", "o": ["are waiting", "will have waited", "had been waiting", "will be waiting"], "c": 2, "e": "قبل حدث ماضٍ آخر (arrived) مع مدة مستمرة = Past Perfect Continuous."}, {"pg": "48-50", "q": "Mom is tired because she ........... the house all the morning.", "o": ["has cleaned", "had cleaned", "had been cleaning", "has been cleaning"], "c": 3, "e": "الفعل الرئيسي في المضارع (is tired) والنتيجة مستمرة حتى الآن = Present Perfect Continuous."}, {"pg": "48-50", "q": "Mom was tired because she ........... the house all the morning.", "o": ["has been cleaning", "had cleaned", "had been cleaning", "has cleaned"], "c": 2, "e": "الفعل الرئيسي في الماضي (was tired) = Past Perfect Continuous."}, {"pg": "48-50", "q": "She ........... three reviews on YouTube on the phone before she bought it.", "o": ["has watched", "had watched", "had been watching", "has been watching"], "c": 1, "e": "before she bought it: سبق شراء الهاتف (ماضٍ) بعدد محدد من المرات = Past Perfect: had watched."}, {"pg": "48-50", "q": "I wish I ........... where I left my jacket.", "o": ["know", "could know", "had known", "knew"], "c": 3, "e": "Wish + Past Simple للتمني في أمر حاضر (معرفة مكان الآن)."}, {"pg": "48-50", "q": "I wish I ........... go to the stadium tomorrow.", "o": ["will", "can", "could", "may"], "c": 2, "e": "Wish + could للتعبير عن رغبة في القدرة على فعل شيء مستقبلي."}, {"pg": "48-50", "q": "The fans were disappointed after ........... the final match.", "o": ["losing", "were losing", "lost", "had lost"], "c": 0, "e": "after + Gerund (losing) بعد حرف الجر after."}, {"pg": "48-50", "q": "He used to be shy, but now he ........... .", "o": ["was", "has been", "isn't", "is"], "c": 3, "e": "used to + مصدر تدل على حالة ماضية تغيرت، والمقابل الحالي في المضارع البسيط: is."}, {"pg": "48-50", "q": "She ........... the cold weather after living in Canada for many years.", "o": ["is used to", "get used to", "related to", "used to"], "c": 0, "e": "be used to + اسم/ing تعني معتاد على (حالة حالية)."}, {"pg": "48-50", "q": "I wasn't used to ........... coffee, but now I drink it every morning.", "o": ["drink", "drinks", "drank", "drinking"], "c": 3, "e": "be used to + Gerund: drinking."}, {"pg": "48-50", "q": "Adel ........... help his father on the farm when he was young.", "o": ["always would", "wouldn't", "always used to", "use always to"], "c": 2, "e": "always تُستخدم مع used to (وليس مع would) للتعبير عن عادة ماضية متكررة."}, {"pg": "48-50", "q": "Heba doesn't go shopping on Fridays ........... .", "o": ["after that", "anymore", "then", "no longer"], "c": 1, "e": "anymore تأتي في نهاية الجملة المنفية للدلالة على توقف عادة."}, {"pg": "48-50", "q": "I ........... have a bicycle when I was a kid.", "o": ["used to", "would", "both a and b", "neither a nor b"], "c": 0, "e": "have (فعل حالة وليس فعل حركة) لا تُستخدم مع would للعادة، بل مع used to فقط."}, {"pg": "52", "q": "........... exhausted after the journey, I went to bed.", "o": ["Felt", "Feeling", "To feel", "Feel"], "c": 1, "e": "Participle Clause في بداية الجملة (فاعل الشعور هو نفسه) = صيغة Feeling + مبني للمعلوم."}, {"pg": "52", "q": "........... the publication deadline, the editor will have the final draft professionally proofread this evening.", "o": ["Meeting", "Meet", "To meet", "Having met"], "c": 2, "e": "to + مصدر يعبّر عن الغرض/الهدف (in order to meet) قبل الفعل الرئيسي المستقبلي."}, {"pg": "52", "q": "........... on her future, Sohila learns to be tolerant and persistent.", "o": ["Focusing", "Having been focused", "Focused", "To be focused"], "c": 3, "e": "to be + p.p. يعبر عن الغرض (in order to be focused) في بداية الجملة."}, {"pg": "52", "q": "Which sentence is correctly structured?", "o": ["Running through the park, the rain started to fall.", "Running through the park, I saw the rain starting to fall.", "The rain started to fall, running through the park.", "Running through the park, raining was started."], "c": 1, "e": "فاعل الـ Participle Clause (Running) يجب أن يطابق فاعل الجملة الرئيسية؛ في (b) الفاعل \"I\" هو من كان يجري."}, {"pg": "52", "q": "........... by the rude cashier, Karima complained to the manager.", "o": ["Annoyed", "Annoys", "Annoy", "Annoying"], "c": 0, "e": "كريمة (الفاعل) تلقت فعل الإزعاج من الآخر (مبني للمجهول) = Annoyed (Past Participle)."}, {"pg": "52", "q": "........... out of the window, I saw the beautiful mountain.", "o": ["Look", "Looking", "Being looked", "Having looked"], "c": 1, "e": "فاعل الجملة (I) هو من نظر (مبني للمعلوم ومتزامن) = Looking."}, {"pg": "52", "q": "........... herself alone, Heba decided to read a science fiction book.", "o": ["Found", "Finding", "Finds", "Find"], "c": 1, "e": "Participle Clause متزامن مع الفعل الرئيسي وفاعله (Heba) قام بالفعل = Finding."}, {"pg": "52", "q": "........... troubles and clashes with his neighbors and colleagues, my brother enjoys a peaceful life.", "o": ["Avoiding", "Avoid", "Having avoided", "Avoids"], "c": 0, "e": "فعل مصاحب ومستمر مع الفعل الرئيسي (enjoys) وفاعله يقوم بالفعل بنفسه = Avoiding."}, {"pg": "52", "q": "I was surprised by Hala's ........... to resolve global challenges.", "o": ["wanted", "wanting", "has wanted", "wants"], "c": 1, "e": "بعد صفة الملكية (Hala's) يأتي Gerund (اسم مصدر): wanting."}, {"pg": "52", "q": "Once ......., the city turned to be a town of ghosts.", "o": ["evacuated", "evacuating", "evacuate", "to evacuate"], "c": 0, "e": "Once + p.p. (مبني للمجهول: المدينة تم إخلاؤها) = evacuated."}, {"pg": "54-56", "q": "The students ........... well for this event so it is getting everyone's admiration.", "o": ["has prepared", "had been preparing", "have been preparing", "have prepared"], "c": 2, "e": "النتيجة مستمرة وواضحة الآن (is getting) وهناك جهد مستمر = Present Perfect Continuous."}, {"pg": "54-56", "q": "Hisham ........... this car for five years.", "o": ["is having", "has had", "has", "had had"], "c": 1, "e": "have بمعنى \"يمتلك\" فعل حالة، فلا تُستخدم مستمرة؛ والمدة (for five years) حتى الآن = has had."}, {"pg": "54-56", "q": "I haven't seen Amr ........... the last conference.", "o": ["since", "just", "for", "yet"], "c": 0, "e": "since + نقطة زمنية محددة (the last conference) مع Present Perfect."}, {"pg": "54-56", "q": "I ........... take my certificate until I have passed the oral test.", "o": ["didn't", "wouldn't", "won't", "don't"], "c": 2, "e": "until + Present Perfect (have passed) يقتضي فعلًا رئيسيًا مستقبليًا: won't."}, {"pg": "54-56", "q": "When was the last time that you ........... your cousins?", "o": ["have seen", "seeing", "saw", "see"], "c": 2, "e": "When was the last time + Past Simple (سؤال عن نقطة زمنية محددة في الماضي)."}, {"pg": "54-56", "q": "We ........... for the bus for over an hour, and it still hasn't arrived.", "o": ["wait", "have waited", "have been waiting", "are waiting"], "c": 2, "e": "فعل مستمر منذ الماضي حتى الآن مع مدة (for over an hour) = Present Perfect Continuous."}, {"pg": "54-56", "q": "My father's been quite different ........... coming back from America.", "o": ["for", "since", "during", "while"], "c": 1, "e": "since + نقطة زمنية بداية التغيير مع Present Perfect."}, {"pg": "54-56", "q": "My family haven't ........... been to London before. That is my first time.", "o": ["already", "never", "yet", "ever"], "c": 3, "e": "ever تُستخدم في الجمل المنفية والاستفهامية مع Present Perfect."}, {"pg": "54-56", "q": "Huda has read two chapters of \"Great Expectations\" since she ........... back home.", "o": ["came", "has come", "was coming", "come"], "c": 0, "e": "since + Past Simple (نقطة بداية محددة) مع الفعل الرئيسي في Present Perfect."}, {"pg": "54-56", "q": "It's a long time ........... I last saw her.", "o": ["since", "when", "for", "ago"], "c": 0, "e": "It's a long time + since + Past Simple تعبير قياسي."}, {"pg": "54-56", "q": "Sorry for being late for the meeting, Sir. Please, let me in. I ........... the clinic.", "o": ["had been to", "have been in", "have gone to", "have been to"], "c": 3, "e": "have been to تعني ذهب وعاد (خبرة/سبب التأخر لحظة الكلام) = Present Perfect."}, {"pg": "54-56", "q": "Which sentence tells us that Tom is still working in the factory?", "o": ["Tom worked in that factory for ten years.", "Tom has worked in that factory for ten years.", "Tom was working in that factory.", "Tom used to work in that factory."], "c": 1, "e": "Present Perfect (has worked) يدل على استمرار الحالة حتى الآن، بعكس الماضي البسيط الذي يدل على انتهائها."}, {"pg": "54-56", "q": "How long ........... computer science?", "o": ["you have been studying", "have you been studying", "you had studied", "are you studying"], "c": 1, "e": "سؤال بـ How long يتطلب قلب الفعل المساعد: have you been studying (Present Perfect Continuous)."}, {"pg": "54-56", "q": "Matrouh is the most peaceful town I have ........... been to.", "o": ["never", "ever", "lately", "so far"], "c": 1, "e": "ever تُستخدم بعد صيغة التفضيل العليا (the most peaceful) مع Present Perfect."}, {"pg": "54-56", "q": "Have you ........... been to a foreign country?", "o": ["already", "yet", "just", "ever"], "c": 3, "e": "ever في السؤال مع Present Perfect للسؤال عن الخبرة."}, {"pg": "54-56", "q": "He ........... at the university since 2015, but now he's looking for a new job.", "o": ["worked", "has been working", "had worked", "was working"], "c": 0, "e": "السياق يوضح أن العمل انتهى (but now he's looking for a new job)، فيُستخدم الماضي البسيط: worked."}, {"pg": "54-56", "q": "You look scared ........... anything frightening?", "o": ["Do you see", "Had you seen", "Did you see", "Have you seen"], "c": 3, "e": "أثر لحظي مستمر حتى الآن (you look scared now) = Present Perfect: Have you seen."}, {"pg": "54-56", "q": "Although he ........... to France twice this year, he's going again next week.", "o": ["has been", "will have gone", "goes", "has gone"], "c": 0, "e": "this year فترة زمنية لم تنته بعد، مع تكرار (twice) = Present Perfect: has been."}, {"pg": "54-56", "q": "She ........... to the market. She will be here soon.", "o": ["had been", "has been", "was going", "has gone"], "c": 3, "e": "has gone to تعني ذهبت ولم تعد بعد (ستأتي قريبًا) = Present Perfect."}, {"pg": "54-56", "q": "She ........... any meetings since she came here.", "o": ["hasn't attended", "wasn't attending", "doesn't attend", "won't attend"], "c": 0, "e": "since + Past Simple مع الفعل الرئيسي في Present Perfect المنفي."}, {"pg": "54-56", "q": "It ........... three weeks since I last visited my grandparents.", "o": ["is", "has had", "was being", "had"], "c": 0, "e": "It is + مدة + since + Past Simple تعبير قياسي في المضارع."}, {"pg": "54-56", "q": "I ........... this secret for a week now.", "o": ["will know", "have been known", "had known", "have known"], "c": 3, "e": "know فعل حالة (لا يُستخدم مستمرًا)؛ مدة حتى الآن (for a week now) = have known."}, {"pg": "54-56", "q": "I last saw Ahmed yesterday. I ........... him since 2016.", "o": ["haven't seen", "didn't see", "hadn't seen", "don't see"], "c": 2, "e": "الفعل الرئيسي (saw) ماضٍ، والمدة (since 2016) سابقة عليه = Past Perfect: hadn't seen."}, {"pg": "54-56", "q": "He said he ........... her since he moved to the city.", "o": ["haven't met", "didn't meet", "hadn't met", "don't meet"], "c": 2, "e": "كلام منقول في سياق ماضٍ (said) مع since = Past Perfect: hadn't met."}, {"pg": "54-56", "q": "In the last two hours, I ........... my lessons.", "o": ["revised", "have revised", "had revised", "revise"], "c": 1, "e": "In the last + مدة زمنية تُستخدم مع Present Perfect."}, {"pg": "54-56", "q": "I haven't met him ........... , but perhaps we'll meet tomorrow.", "o": ["just", "already", "still", "yet"], "c": 3, "e": "yet في نهاية الجملة المنفية مع Present Perfect."}, {"pg": "54-56", "q": "She ........... emails all morning and hasn't even taken a break.", "o": ["was writing", "has been writing", "had written", "wrote"], "c": 1, "e": "نشاط مستمر منذ الصباح حتى الآن (hasn't even taken a break) = Present Perfect Continuous."}, {"pg": "54-56", "q": "Your mobile ........... by next Friday.", "o": ["will have fixed", "is going to be fixed", "is going to fix", "will have been fixed"], "c": 3, "e": "by + نقطة زمنية مستقبلية + الهاتف يتلقى الفعل (مبني للمجهول) = Future Perfect Passive: will have been fixed."}, {"pg": "54-56", "q": "By 2030, a lot of things in our life ........... thanks to modern technology.", "o": ["had changed", "had been changed", "will be changed", "will have been changed"], "c": 3, "e": "By + تاريخ مستقبلي + مبني للمجهول = Future Perfect Passive: will have been changed."}, {"pg": "54-56", "q": "As soon as he ........... home, we will eat together.", "o": ["have arrived", "will arrive", "arrives", "had arrived"], "c": 2, "e": "بعد ظرف زمني (As soon as) يُستخدم المضارع البسيط للدلالة على المستقبل: arrives."}, {"pg": "54-56", "q": "........... next summer, my brother will have finished the course.", "o": ["In", "The", "At", "By"], "c": 3, "e": "By + وقت مستقبلي محدد مع Future Perfect."}, {"pg": "54-56", "q": "He promised ........... us with this problem.", "o": ["to help", "helping", "would help", "will help"], "c": 0, "e": "promise + to + مصدر (بدون تغيير الفاعل)."}, {"pg": "54-56", "q": "He promised he ........... us with this problem.", "o": ["to help", "would help", "helping", "will help"], "c": 1, "e": "في الكلام المنقول (Reported Speech) will تتحول إلى would."}, {"pg": "54-56", "q": "Between 8 a.m. and 4 p.m. tomorrow, my father ........... .", "o": ["is going to work", "will work", "will be working", "will have worked"], "c": 2, "e": "فعل مستمر خلال فترة زمنية مستقبلية محددة = Future Continuous: will be working."}, {"pg": "54-56", "q": "He promises he ........... us with this problem.", "o": ["helping", "to help", "would help", "will help"], "c": 3, "e": "الفعل الرئيسي في المضارع (promises)، فلا تحويل زمني: will help."}, {"pg": "54-56", "q": "I ........... 60 next month.", "o": ["will be", "am going to be", "have been", "am"], "c": 0, "e": "توقع/حقيقة مستقبلية مؤكدة بدون نية أو دليل حالي = will."}, {"pg": "54-56", "q": "We ........... my little sister birthday at a famous hotel tomorrow.", "o": ["will celebrate", "are going to celebrate", "are celebrating", "will have celebrated"], "c": 2, "e": "خطة/ترتيب مسبق مؤكد (حجز فندق) = Present Continuous للمستقبل المرتب."}, {"pg": "54-56", "q": "After the car ........... , we will travel at once.", "o": ["had been repaired", "has repaired", "has been repaired", "had repaired"], "c": 2, "e": "بعد ظرف زمني (After) يُستخدم Present Perfect للدلالة على اكتمال فعل قبل المستقبل، والسيارة تتلقى الفعل = has been repaired."}, {"pg": "54-56", "q": "We can't meet at 3 PM because I ........... a meeting with my manager.", "o": ["will be having", "will have", "have", "will have had"], "c": 0, "e": "فعل مستمر في لحظة مستقبلية محددة (at 3 PM) = Future Continuous."}, {"pg": "54-56", "q": "It's getting dark. I think it ........... soon.", "o": ["will rain", "is going to rain", "will be raining", "rains"], "c": 1, "e": "توقع مبني على دليل حالي واضح (it's getting dark) = be going to."}, {"pg": "54-56", "q": "The train from Tanta ........... at 2 o’clock.", "o": ["will be arriving", "going to arrive", "will have arrived", "arrives"], "c": 3, "e": "جدول زمني ثابت (مواعيد قطارات) = Present Simple للمستقبل."}, {"pg": "54-56", "q": "We hope he ........... the championship next year.", "o": ["will win", "will have won", "will be winning", "is going to win"], "c": 0, "e": "hope + will للتعبير عن أمل/توقع بسيط في المستقبل."}, {"pg": "54-56", "q": "It's his intention that he ........... on a summer course to improve his English.", "o": ["will be enrolling", "is going to enroll", "will have enrolled", "will enroll"], "c": 1, "e": "intention (نية) تُستخدم مع be going to."}, {"pg": "54-56", "q": "Doctors predict they ........... chronic diseases.", "o": ["are going to treat", "will treat", "will have treated", "are treating"], "c": 1, "e": "predict (توقع علمي/رأي) يُستخدم مع will."}, {"pg": "54-56", "q": "It's planned that Mona ........... money to help homeless children.", "o": ["is collecting", "is going to collect", "will collect", "had collected"], "c": 1, "e": "planned (خطة مقررة) تُستخدم مع be going to."}, {"pg": "54-56", "q": "Don't visit me tomorrow morning. I ........... a meeting from 8 to 12.", "o": ["will be attending", "am going to attend", "will have attended", "attend"], "c": 0, "e": "فعل مستمر خلال فترة مستقبلية محددة (from 8 to 12) = Future Continuous."}, {"pg": "54-56", "q": "........... vegetarians, they don't eat meat.", "o": ["Been", "Being", "Not being", "Having been"], "c": 1, "e": "Participle Clause للسبب في الحاضر (لأنهم نباتيون) = Being."}, {"pg": "54-56", "q": "He will inform us of the new date after he ........... it.", "o": ["knew", "had known", "will know", "knows"], "c": 3, "e": "بعد ظرف زمني (after) يُستخدم المضارع البسيط للدلالة على المستقبل: knows."}, {"pg": "58-62", "q": "He is furious because he ........... included in the team.", "o": ["hadn't been", "hasn't been", "has", "had"], "c": 1, "e": "الفاعل (he) يتلقى الفعل (مبني للمجهول)، والزمن مضارع تام لأثر لحظي حالي (furious الآن) = hasn't been."}, {"pg": "58-62", "q": "Do you really think that a lot of things in our life ........... changed by this time next year?", "o": ["have", "have been", "will be", "will have been"], "c": 3, "e": "by this time next year: زمن مستقبلي محدد + مبني للمجهول = Future Perfect Passive."}, {"pg": "58-62", "q": "Which sentence is correctly structured?", "o": ["A new set of environmental regulations implements to reduce industrial waste.", "A new set of environmental regulations implemented to reduce industrial waste.", "A new set of environmental regulations are implemented to reduce industrial waste.", "A new set of environmental regulations is implemented to reduce industrial waste."], "c": 3, "e": "الفاعل الحقيقي (A new set) اسم مفرد، والقوانين تتلقى الفعل (مبني للمجهول) = is implemented."}, {"pg": "58-62", "q": "The amazingly shaped statue of the king ........... everyone of the visitors.", "o": ["admired", "was admired by", "had admired", "admires"], "c": 1, "e": "التمثال (فاعل نحوي) لا \"يُعجب\" بالمعنى الفاعلي هنا، بل هو مصدر الإعجاب من الزوار = مبني للمجهول: was admired by."}, {"pg": "58-62", "q": "All my friends ........... to a big party the other day.", "o": ["have invited", "are invited", "were invited", "have been invited"], "c": 2, "e": "the other day ظرف زمني ماضٍ محدد + الأصدقاء يتلقون الفعل = Past Simple Passive: were invited."}, {"pg": "58-62", "q": "What the problem is ........... by tomorrow.", "o": ["will have discovered", "has been discovering", "being discovered", "will have been discovered"], "c": 3, "e": "by tomorrow + مبني للمجهول = Future Perfect Passive."}, {"pg": "58-62", "q": "But for his support, the project ........... .", "o": ["wouldn't have been completed", "wouldn't have completed", "was completing", "may be completing"], "c": 0, "e": "But for (لولا) + جملة شرطية من النوع الثالث (نتيجة ماضية افتراضية) والمشروع يتلقى الفعل = wouldn't have been completed."}, {"pg": "58-62", "q": "The new system ........... regularly to prevent any technical failure.", "o": ["is maintained", "was maintaining", "can maintain", "are maintained"], "c": 0, "e": "حقيقة/عادة روتينية + النظام يتلقى الفعل (مفرد) = Present Simple Passive: is maintained."}, {"pg": "58-62", "q": "I don't like ........... what to do.", "o": ["be told", "be telling", "being told", "to be telling"], "c": 2, "e": "بعد like تأتي Gerund، والفاعل يتلقى الفعل (مبني للمجهول) = being told."}, {"pg": "58-62", "q": "Adham said that his novel ........... carefully before he published it.", "o": ["had been checked", "had been checking", "has been checked", "has been checking"], "c": 0, "e": "before he published it: سبق فعلًا ماضيًا آخر، والرواية تتلقى الفعل = Past Perfect Passive: had been checked."}, {"pg": "58-62", "q": "One reason for dams ........... is to produce electricity.", "o": ["are built", "have built", "being built", "were built"], "c": 2, "e": "بعد حرف الجر (for) تأتي Gerund في صيغة مبنية للمجهول = being built."}, {"pg": "58-62", "q": "He should keep in mind that his final report ........... by next week.", "o": ["will have been delivered", "would be delivered", "will have delivered", "is going to deliver"], "c": 0, "e": "by next week + التقرير يتلقى الفعل = Future Perfect Passive: will have been delivered."}, {"pg": "58-62", "q": "I was made ........... my room by my mother.", "o": ["clean", "cleaning", "to cleaning", "to clean"], "c": 3, "e": "في صيغة السببية المبنية للمجهول be made يليها to + مصدر: to clean."}, {"pg": "58-62", "q": "Many modern roads ........... recently.", "o": ["have built", "were built", "have been built", "are building"], "c": 2, "e": "recently + الطرق تتلقى الفعل وأثره مستمر = Present Perfect Passive: have been built."}, {"pg": "58-62", "q": "It ........... that Salah is one of the best players in the world.", "o": ["said", "is saying", "has said", "has been said"], "c": 3, "e": "تركيب It + is said/has been said + that لنقل رأي شائع."}, {"pg": "58-62", "q": "Salah is said to ........... one of the best players in the world.", "o": ["has been", "be", "have been", "being"], "c": 1, "e": "S + is said + to + مصدر بسيط عند تطابق زمن الفعلين (حالة حالية): be."}, {"pg": "58-62", "q": "Salah is believed to ........... many people last year.", "o": ["have helped", "be helped", "help", "helped"], "c": 0, "e": "زمن الفعل الثاني سابق على الفعل الأول (last year) = to have + p.p.: have helped."}, {"pg": "58-62", "q": "The match was said ........... due to the bad weather week.", "o": ["to be canceled", "to have been cancelled", "be canceled", "to cancel"], "c": 1, "e": "زمن الإلغاء سابق على القول، والمباراة تتلقى الفعل = to have been cancelled."}, {"pg": "58-62", "q": "Dinner ........... before dad arrived home.", "o": ["had cooked", "had been cooked", "was cooking", "has been cooked"], "c": 1, "e": "before dad arrived: سبق حدثًا ماضيًا، والعشاء يتلقى الفعل = Past Perfect Passive: had been cooked."}, {"pg": "58-62", "q": "Did you go to Mona’s birthday party? No, I ........... .", "o": ["wasn't invited", "don't invite", "didn't invite", "weren't invited"], "c": 0, "e": "الفاعل (I) مفرد ويتلقى الفعل في الماضي = wasn't invited."}, {"pg": "58-62", "q": "They expected the match ........... due to bad weather.", "o": ["be canceled", "canceled", "to be canceled", "to cancel"], "c": 2, "e": "expect + مفعول + to + مصدر (مبني للمجهول هنا لأن المباراة تتلقى الفعل) = to be canceled."}, {"pg": "58-62", "q": "After Ahmed has filled in the application form, he will ........... .", "o": ["interviewed", "be interviewed", "have interviewed", "be interviewing"], "c": 1, "e": "أحمد يتلقى فعل المقابلة (مبني للمجهول) في المستقبل = will be interviewed."}, {"pg": "58-62", "q": "While the speech ........... , the audience remained silent.", "o": ["was being delivered", "had delivered", "delivered", "was delivering"], "c": 0, "e": "While + فعل مستمر خلفي والخطاب يتلقى الفعل = Past Continuous Passive: was being delivered."}, {"pg": "58-62", "q": "........... of the terrible news, she fainted.", "o": ["Been informed", "Having been informed", "Having informed", "After informing"], "c": 1, "e": "هي تلقت الخبر (مبني للمجهول) وسابق للفعل الرئيسي = Having been informed."}, {"pg": "58-62", "q": "How often ........... the Olympic Games held?", "o": ["do", "are", "is", "does"], "c": 1, "e": "الألعاب الأولمبية (جمع من حيث الشكل Games) تتلقى الفعل = are held."}, {"pg": "58-62", "q": "She objects ........... without her permission.", "o": ["to photograph", "being photographed", "to be photographed", "to being photographed"], "c": 3, "e": "object to + Gerund، وهي تتلقى الفعل (مبني للمجهول) = to being photographed."}, {"pg": "58-62", "q": "My brother doesn’t let himself ........... easily by his classmates.", "o": ["to be teased", "be teased", "being teased", "tease"], "c": 1, "e": "let + مفعول + مصدر بدون to (مبني للمجهول لأنه يتلقى الفعل) = be teased."}, {"pg": "58-62", "q": "Where ........... to? To prison.", "o": ["the thieves were taken", "were the thieves taken", "the thieves have been taken", "have the thieves taken"], "c": 1, "e": "سؤال يتطلب قلب الفعل المساعد والفاعل، واللصوص يتلقون الفعل = were the thieves taken."}, {"pg": "58-62", "q": "I heard the children ........... at by their parents.", "o": ["were yelling", "yelled", "yelling", "being yelled"], "c": 3, "e": "hear + مفعول + يتلقى الفعل (مبني للمجهول ومستمر/متزامن) = being yelled."}, {"pg": "58-62", "q": "I’d like ........... to the party next Saturday.", "o": ["to invite", "be invited", "being invited", "to be invited"], "c": 3, "e": "would like + to + مصدر، والفاعل يتلقى الفعل = to be invited."}, {"pg": "58-62", "q": "........... your laptop repaired before you left the office?", "o": ["Had you had", "Have you had", "Will you have", "Do you have"], "c": 0, "e": "before you left (ماضٍ) يقتضي Past Perfect في تركيب السببية (have something done): Had you had."}, {"pg": "58-62", "q": "The manager had the report checked before sending it to the director. What does this sentence mean?", "o": ["The manager checked the report personally.", "Someone else checked the report for the manager.", "The manager forgot to check the report.", "The report was not checked at all."], "c": 1, "e": "تركيب السببية have something done يعني أن شخصًا آخر قام بالفعل نيابة عن الفاعل."}, {"pg": "58-62", "q": "I had ........... the room again as it was messy.", "o": ["him tidied", "him tidy", "he to tidy", "his tidying"], "c": 1, "e": "have + شخص + مصدر بدون to (يقوم الشخص بنفسه بالفعل، وليس تلقي الفعل): have him tidy."}, {"pg": "58-62", "q": "Do you really know how to sign up for an e-mail account or shall I ........... ?", "o": ["have you to make one", "get someone make it", "have it to be made", "get it made for you"], "c": 3, "e": "get something done (تركيب سببية مبني للمجهول): get it made for you."}, {"pg": "58-62", "q": "While my father ........... , I was having lunch at a nearby restaurant.", "o": ["has got his car to service", "was getting his car servicing", "was getting his car serviced", "has got his car serviced"], "c": 2, "e": "While + Past Continuous + تركيب سببية مبني للمجهول (السيارة تتلقى الخدمة) = was getting his car serviced."}, {"pg": "58-62", "q": "Part of the secretary’s daily tasks is to get all reports ........... before the manager’s arrival.", "o": ["typing", "type", "typed", "to type"], "c": 2, "e": "get something done: التقارير تتلقى الفعل = typed."}, {"pg": "58-62", "q": "The presentation looked too ........... , so the professor decided ........... it redesigned.", "o": ["simple / to get", "simplicity / to have", "simply / get", "simplistic / make"], "c": 0, "e": "الفراغ الأول صفة بعد look (simple)، والثاني فعل سببية بعد decide + to: to get."}, {"pg": "58-62", "q": "A strict policeman doesn’t allow ........... .", "o": ["the law be violated", "anyone violate the law", "the law being violate", "anyone to violate the law"], "c": 3, "e": "allow + مفعول + to + مصدر: anyone to violate the law."}, {"pg": "58-62", "q": "She ........... to clean the house yesterday.", "o": ["got the maid", "had been", "has the maid", "got"], "c": 0, "e": "تركيب السببية get someone to do something: got the maid (to clean)."}, {"pg": "58-62", "q": "Mr. Ali is such an amazing person. He had us ........... all through the meal.", "o": ["to laugh", "laughed", "laughs", "laughing"], "c": 3, "e": "have + شخص + Gerund تعبر عن إبقاء شخص في حالة مستمرة (يضحكنا طوال الوقت) = laughing."}, {"pg": "58-62", "q": "I used to have the mechanic ........... my car.", "o": ["to repair", "repaired", "repairing", "repair"], "c": 3, "e": "have + شخص + مصدر بدون to (يقوم بالفعل بنفسه): repair."}, {"pg": "58-62", "q": "I ........... at the garage once a month.", "o": ["have checked my car", "have my car checked", "have my car is checked", "check my car"], "c": 1, "e": "تركيب سببية: have + شيء + مبني للمجهول (السيارة تتلقى الفحص) = have my car checked."}, {"pg": "58-62", "q": "........... someone to clean up this mess at once!", "o": ["Had", "Have", "Got", "Get"], "c": 3, "e": "Get someone to do something (أمر بجعل شخص يقوم بفعل): Get."}, {"pg": "58-62", "q": "I'm sorry, I can't hang out with you; I have a lot of work ........... .", "o": ["do", "to do", "doing", "done"], "c": 1, "e": "have + عمل + to + مصدر (عمل يجب القيام به): work to do."}, {"pg": "58-62", "q": "I had my room ........... by my mother.", "o": ["tidy", "tidying", "tidied", "to tidy"], "c": 2, "e": "تركيب السببية have something done: الغرفة تتلقى الفعل = tidied."}, {"pg": "58-62", "q": "He washes his car by himself. That means he ........... .", "o": ["he washes it", "has someone to wash it", "he gets a worker to wash it", "he has it washed"], "c": 0, "e": "by himself تعني يقوم بالفعل بنفسه (وليس تركيب سببية): he washes it."}, {"pg": "58-62", "q": "She ........... the hairdresser to cut her hair.", "o": ["lets", "has", "gets", "makes"], "c": 2, "e": "get someone to do something (تُقنع/تجعل شخصًا يقوم بفعل بطلب): gets."}, {"pg": "58-62", "q": "We ........... the house painted nowadays.", "o": ["had had", "are having", "have had", "were having"], "c": 1, "e": "nowadays (الآن/في الوقت الحالي) + تركيب سببية مستمر = are having."}, {"pg": "58-62", "q": "I always depend on myself. I ........... .", "o": ["make others help me do my jobs", "always ask other to do my jobs", "have other do my jobs for me", "always do my jobs on my own"], "c": 3, "e": "depend on myself تعني الاعتماد على النفس دون الاستعانة بالآخرين = always do my jobs on my own."}, {"pg": "58-62", "q": "The boss had his secretary ........... emails to all the employees.", "o": ["to send", "send", "sent", "sending"], "c": 1, "e": "have + شخص + مصدر بدون to: send."}, {"pg": "58-62", "q": "He got his assistant ........... calls while he was out of the office.", "o": ["answering", "to answer", "answer", "answered"], "c": 1, "e": "get someone to do something: to answer."}, {"pg": "58-62", "q": "She got the technician ........... the software before the system crashed.", "o": ["to install", "install", "installed", "installing"], "c": 0, "e": "get someone to do something: to install."}, {"pg": "58-62", "q": "He got his car ........... at the garage while he was in a meeting.", "o": ["fixing", "fix", "fixed", "to fix"], "c": 2, "e": "get something done: السيارة تتلقى الفعل = fixed."}, {"pg": "58-62", "q": "The manager had the employees ........... extra hours due to the workload.", "o": ["worked", "work", "working", "to work"], "c": 1, "e": "have + شخص + مصدر بدون to: work."}, {"pg": "58-62", "q": "The teacher made us ........... the classroom.", "o": ["to clean", "clean", "cleaned", "cleaning"], "c": 1, "e": "make + مفعول + مصدر بدون to (إجبار): clean."}, {"pg": "58-62", "q": "She hasn't had her knives ........... yet.", "o": ["sharpen", "sharpened", "to sharpen", "sharpening"], "c": 1, "e": "have something done: السكاكين تتلقى الفعل = sharpened."}, {"pg": "58-62", "q": "I got her ........... the room.", "o": ["tidying", "to tidy", "tidy", "tidied"], "c": 1, "e": "get someone to do something: to tidy."}, {"pg": "58-62", "q": "Have you ever ........... someone to clean your flat?", "o": ["made", "got", "done", "had"], "c": 1, "e": "get someone to do something: got."}, {"pg": "58-62", "q": "I ........... a plumber to fix the pipe last week.", "o": ["got", "get", "had", "have"], "c": 0, "e": "زمن الجملة ماضٍ (last week) + get someone to do something: got."}, {"pg": "58-62", "q": "Nothing can stop us ........... what we want to achieve.", "o": ["from achieving", "to achieve", "of achieving", "achieve"], "c": 0, "e": "stop someone from doing something تركيب ثابت: from achieving."}, {"pg": "58-62", "q": "The boss made the employees stay for another 3 hours after work. This means he ........... them", "o": ["begged", "asked", "persuaded", "forced"], "c": 3, "e": "made + مفعول + مصدر تدل على الإجبار وليس الطلب اللطيف = forced."}, {"pg": "63-65", "q": "Which of the following is the correct form of the reported speech of this sentence? She said, “I am tired.”", "o": ["She said that she was tired.", "She said that she is tired.", "She said she will be tired.", "She said she had been tired."], "c": 0, "e": "am تتحول إلى was في الكلام المنقول (Present Simple -> Past Simple)، و I تتحول إلى she."}, {"pg": "63-65", "q": "She reminded him ........... his passport.", "o": ["don't forget", "not forget", "not to forget", "doesn't forget"], "c": 2, "e": "remind someone + not + to + مصدر لنقل أمر منفي."}, {"pg": "63-65", "q": "He asked me when I'd be ready for the journey to France. Which of the following is the direct form for the above reported sentence?", "o": ["He said to me, “When you’ll be ready for the journey to France?”", "He said to me, “When will you be ready for the journey to France?”", "He said to me, “When have you been ready for the journey to France?”", "He said to me, “When will he be ready for the journey to France?”"], "c": 1, "e": "في الكلام المباشر يعود ترتيب السؤال (فعل مساعد + فاعل) و would تعود will، و I تعود you."}, {"pg": "63-65", "q": "Amal's boss ordered that his instructions ........... be carried out literally the following day.", "o": ["might", "had to", "need", "has to"], "c": 1, "e": "must/have to تتحول إلى had to في الكلام المنقول."}, {"pg": "63-65", "q": "Mum wanted to know ........... to make the school request her presence.", "o": ["what I had done", "if I had done", "what have I done", "whether I have done"], "c": 0, "e": "سؤال بأداة استفهام (what) في كلام منقول، والفعل يتحول للماضي التام (سبق فعل الطلب): what I had done."}, {"pg": "63-65", "q": "Choose the correct reported form for the following sentence: She said, “Had I known he was coming, I would have prepared something special”.", "o": ["She said if she had known he was coming, she would prepare something special.", "She said that if she had known he was coming, she would have prepared something special.", "She said that had she known he was coming, she prepared something special.", "She said she had known he was coming, and she would have prepared something."], "c": 1, "e": "الجملة الشرطية النوع الثالث لا تتغير أزمنتها عند النقل، فقط الضمائر: that if she had known... would have prepared."}, {"pg": "63-65", "q": "Are you reading a story? Mazen has just asked if I ........... a story.", "o": ["was reading", "am reading", "have read", "had read"], "c": 1, "e": "الفعل الرئيسي في المضارع (has just asked)، فلا يتغير زمن الفعل المنقول: am reading."}, {"pg": "63-65", "q": "Which sentence is correctly structured?", "o": ["Can you tell me what your gloves is like?", "Can you tell me what is your gloves like?", "Can you tell me what your gloves are like?", "Can you tell me what are your gloves like?"], "c": 2, "e": "السؤال غير المباشر يحافظ على ترتيب الجملة الخبرية (فاعل ثم فعل)، وgloves جمع فتأخذ are."}, {"pg": "63-65", "q": "Do you know why she ........... the company?", "o": ["left", "leave", "was left", "is left"], "c": 0, "e": "سؤال غير مباشر بترتيب الجملة الخبرية، وحدث ماضٍ منتهٍ = left."}, {"pg": "63-65", "q": "The teacher insisted that they ........... present.", "o": ["will be", "were", "are", "be"], "c": 3, "e": "insist that + مصدر بدون to (Subjunctive) بعد أفعال الإصرار/الاقتراح: be."}, {"pg": "63-65", "q": "The manager demanded that every e-mail ........... double-checked before submission.", "o": ["is", "was", "be", "will be"], "c": 2, "e": "demand that + مصدر بدون to (Subjunctive): be."}, {"pg": "63-65", "q": "Choose the correct reported speech for the following sentence: He said, “You can solve your problems. Will you follow my advice?”", "o": ["He said that I could solve my problems and asked if I would follow his advice.", "He said that he could solve his problems and added if I would follow his advice.", "He said that I could solve his problems and asked if he would follow my advice.", "He said that he could solve my problems and warned if I would follow his advice."], "c": 0, "e": "you تتحول إلى I (المخاطَب الأصلي)، can إلى could، my إلى his، وسؤال will يُنقل بـ asked if... would."}, {"pg": "63-65", "q": "Everyone at the meeting suggested that Dina ........... the team leader during the expedition.", "o": ["assigns", "assigning", "should assign", "be assigned"], "c": 3, "e": "suggest that + مصدر بدون to (Subjunctive)، ودينا تتلقى الفعل (مبني للمجهول) = be assigned."}, {"pg": "63-65", "q": "I suggest that he ........... to the nearest agency for that.", "o": ["going", "goes", "go", "went"], "c": 2, "e": "suggest that + مصدر بدون to (Subjunctive): go."}, {"pg": "63-65", "q": "Can you tell me ........... now?", "o": ["what time is it", "what time it is", "what time is", "what time it is being"], "c": 1, "e": "سؤال غير مباشر يحافظ على ترتيب الجملة الخبرية: what time it is."}, {"pg": "63-65", "q": "Maria said she had not visited her aunt ........... .", "o": ["yesterday", "the day after", "the previous day", "the following day"], "c": 2, "e": "yesterday تتحول إلى the previous day/the day before في الكلام المنقول."}, {"pg": "63-65", "q": "I suggest that this room ........... for the children.", "o": ["leave", "be left", "was left", "is leaving"], "c": 1, "e": "suggest that + مصدر بدون to (مبني للمجهول لأن الغرفة تتلقى الفعل): be left."}, {"pg": "63-65", "q": "He didn't understand ........... .", "o": ["what his teacher had explained.", "what his teacher had explained?", "what had his teacher explained?", "what has teacher had explained!"], "c": 0, "e": "سؤال غير مباشر داخل جملة خبرية ينتهي بنقطة وليس علامة استفهام، مع ترتيب الجملة الخبرية."}, {"pg": "63-65", "q": "My father suggests that Heba ........... the instructions of her doctor to get better.", "o": ["follows", "follow", "followed", "following"], "c": 1, "e": "suggest that + مصدر بدون to (Subjunctive): follow."}, {"pg": "63-65", "q": "Mona was ........... when her father sold his old car, he would buy a new one.", "o": ["spoken", "said", "told", "asked"], "c": 2, "e": "tell (يليها مفعول به مباشر بدون حرف جر) هي الصحيحة هنا: was told."}, {"pg": "63-65", "q": "Could you just tell me what ........... by that.", "o": ["do you mean", "you meant", "did you mean", "you meaning"], "c": 1, "e": "سؤال غير مباشر يحافظ على ترتيب الجملة الخبرية، وتحول الزمن للماضي: you meant."}, {"pg": "63-65", "q": "Our teacher insists that the group ........... organized.", "o": ["being", "be", "are", "is"], "c": 1, "e": "insist that + مصدر بدون to (Subjunctive): be."}, {"pg": "63-65", "q": "He asked her ........... she was married or not.", "o": ["where", "when", "whether", "weather"], "c": 2, "e": "whether...or not تركيب ثابت للسؤال عن نعم/لا."}, {"pg": "63-65", "q": "He ........... his daughter why she had arrived home late.", "o": ["asked", "wanted to know", "wondered", "told"], "c": 0, "e": "asked + مفعول به + أداة استفهام هو التركيب الصحيح المباشر لنقل سؤال لشخص محدد."}, {"pg": "63-65", "q": "He ........... his daughter why he had arrived home late.", "o": ["asked", "wanted to know", "wondered", "told"], "c": 0, "e": "asked + مفعول به + أداة استفهام: asked."}, {"pg": "63-65", "q": "“Did you see my email?” he asked. -> He asked me ........... my email.", "o": ["had I seen", "if I see", "whether I had seen", "if I saw"], "c": 2, "e": "سؤال بنعم/لا (Did you see) يُنقل بـ if/whether + فاعل + فعل، والزمن يتحول لـ Past Perfect: whether I had seen."}, {"pg": "63-65", "q": "My doctor advised me ........... exercises every day.", "o": ["doing", "do", "to do", "to doing"], "c": 2, "e": "advise someone + to + مصدر."}, {"pg": "63-65", "q": "She said that she was decorating her flat ........... .", "o": ["today", "this week", "now", "then"], "c": 3, "e": "now تتحول إلى then في الكلام المنقول."}, {"pg": "63-65", "q": "Mother says she ........... for a new job soon.", "o": ["applied", "would apply", "will apply", "has applied"], "c": 2, "e": "الفعل الرئيسي في المضارع (says)، فلا يتغير زمن الفعل المنقول: will apply."}, {"pg": "63-65", "q": "A doctor warned me ........... smoke in order to keep healthy.", "o": ["to", "didn't", "don't", "not to"], "c": 3, "e": "warn someone + not + to + مصدر."}, {"pg": "63-65", "q": "Ahmed recommended me ........... on the new course.", "o": ["enrolling", "to enrol", "enrol", "should enrol"], "c": 1, "e": "recommend someone + to + مصدر."}, {"pg": "63-65", "q": "The police said just now that the windows ........... before the thieves went into the building.", "o": ["had broken", "had been broken", "have been broken", "were being broken"], "c": 1, "e": "before the thieves went in: سبق حدثًا ماضيًا آخر، والنوافذ تتلقى الفعل = Past Perfect Passive."}, {"pg": "63-65", "q": "He ........... where he had spent his weekend.", "o": ["said", "wondered", "ordered", "told"], "c": 1, "e": "wonder + أداة استفهام (سؤال ذاتي غير موجه لشخص محدد بمفعول): wondered."}, {"pg": "63-65", "q": "She hasn't decided where ........... her next holiday.", "o": ["to spend", "spends", "to spending", "spent"], "c": 0, "e": "decide + أداة استفهام + to + مصدر تركيب ثابت."}, {"pg": "63-65", "q": "She explained that Paris ........... the capital of France.", "o": ["is", "had been", "was", "would be"], "c": 0, "e": "الحقائق الثابتة (Paris is the capital of France) لا تتغير زمنيًا في الكلام المنقول: is."}, {"pg": "67-69", "q": "The lights are off and the door is locked; the office ........... for the day.", "o": ["must close", "should be closing", "should close", "must be closed"], "c": 3, "e": "استنتاج منطقي من دليل حالي (أضواء مطفأة وباب مغلق) + المكتب يتلقى الفعل = must be closed."}, {"pg": "67-69", "q": "No survivors have been recorded in the avalanche catastrophe. All the climbers ........... buried under thick layers of ice.", "o": ["must have", "can't have been", "must have been", "can't have"], "c": 2, "e": "استنتاج شبه مؤكد عن حدث ماضٍ بناءً على دليل قوي + مبني للمجهول = must have been."}, {"pg": "67-69", "q": "Lara got low marks; she ........... have joined the faculty she wanted.", "o": ["shouldn't", "must", "might", "couldn't"], "c": 3, "e": "نتيجة مؤكدة منطقيًا عن استحالة حدوث أمر في الماضي بسبب الدرجات المنخفضة = couldn't have."}, {"pg": "67-69", "q": "“I regret eating so much sweet.” This means, I ........... so much sweet.", "o": ["should eat", "shouldn't eat", "shouldn't have eaten", "should have eaten"], "c": 2, "e": "الندم على فعل حدث في الماضي (regret + Gerund) يُعبَّر عنه بـ shouldn't have + p.p."}, {"pg": "67-69", "q": "He has forgotten his passport, we ........... have reminded him.", "o": ["must", "could", "had to", "ought to"], "c": 3, "e": "لوم/نصيحة فائتة (كان ينبغي أن نذكّره ولم نفعل) = ought to have."}, {"pg": "67-69", "q": "We got lost in the desert. We ........... have used the GPS.", "o": ["should", "shouldn't", "could", "can't"], "c": 0, "e": "نصيحة فائتة/ندم على عدم فعل شيء كان صوابًا = should have used."}, {"pg": "67-69", "q": "I'm not sure what caused her illness. She ........... something bad.", "o": ["may eat", "must have eaten", "could have eaten", "might eat"], "c": 2, "e": "احتمال ضعيف/تخمين غير مؤكد عن حدث ماضٍ = could have eaten."}, {"pg": "67-69", "q": "He ........... be Arabian as he asks for an English guidebook. ", "o": ["must", "can't", "might", "shouldn't"], "c": 1, "e": "استنتاج منطقي بالنفي القاطع (طلب دليل إنجليزي ينفي كونه عربيًا) = can't."}, {"pg": "67-69", "q": "She doesn't usually drink coffee, but she does enjoy a cup in the morning sometimes. What is the function of the underlined word “does”?", "o": ["Auxiliary for forming questions", "Modal of ability", "Contrastive conjunction", "Emphatic"], "c": 3, "e": "does قبل الفعل الأصلي في جملة خبرية تُستخدم للتوكيد (Emphatic do)."}, {"pg": "67-69", "q": "The teacher said that the experiment must ........... carefully.", "o": ["done", "to do", "be done", "doing"], "c": 2, "e": "must + مصدر بدون to (مبني للمجهول لأن التجربة تتلقى الفعل) = be done."}, {"pg": "67-69", "q": "........... use this slow and old model laptop? There are other upgraded ones available.", "o": ["Do you have to", "Must you", "Should you", "Could you"], "c": 1, "e": "Must you...? يُستخدم للتساؤل عن ضرورة فعل أمر غير مرغوب (بمعنى تلميحي: هل يتحتم عليك؟)."}, {"pg": "67-69", "q": "Can I talk to you, please? Sorry, I ........... go. I'm late for a meeting.", "o": ["mustn't", "had to", "need", "must"], "c": 3, "e": "إلزام شخصي فوري (يجب أن أذهب الآن) = must."}, {"pg": "67-69", "q": "I ........... have taken a taxi to the stadium last Friday, but I rode my bike.", "o": ["must", "could", "need to", "should"], "c": 1, "e": "إمكانية فائتة لم تُستغل (كان بإمكاني ولكني لم أفعل) = could have taken."}, {"pg": "67-69", "q": "Drivers ........... wear a seat belt while driving into the city.", "o": ["need", "might", "must have", "have to"], "c": 3, "e": "إلزام خارجي (قانون) = have to."}, {"pg": "67-69", "q": "She shouldn't have stayed up late. She regrets ........... it.", "o": ["to do", "not doing", "not to do", "doing"], "c": 3, "e": "regret + Gerund (تتحدث عن الفعل نفسه الذي ارتكبته: السهر): doing."}, {"pg": "67-69", "q": "He ........... to the cinema, but he stayed at home to study his lessons.", "o": ["could have gone", "must have gone", "should go", "can go"], "c": 0, "e": "إمكانية فائتة لم تتحقق (كان بإمكانه ولكنه لم يذهب) = could have gone."}, {"pg": "67-69", "q": "Judy was lucky. She ........... herself when she fell, but she's OK.", "o": ["must have hurt", "should have hurt", "may be hurt", "could have hurt"], "c": 3, "e": "احتمال حدوث ضرر لم يقع فعليًا (لكنها بخير) = could have hurt."}, {"pg": "67-69", "q": "Never decide on anything when you are upset as later on you ........... it.", "o": ["would regret", "should have regretted", "must regret", "could not regret"], "c": 0, "e": "توقع مستقبلي لنتيجة قرار متسرع = would regret."}, {"pg": "67-69", "q": "\"I shouldn't have eaten so much\". This means ........... .", "o": ["I'm very hungry", "I wish I had eaten more", "I wish I hadn't eaten so much", "I'd be late not to eat enough"], "c": 2, "e": "shouldn't have + p.p. تعبر عن ندم على فعل حدث بالفعل، وهو ما يعادل: wish + hadn't + p.p."}, {"pg": "67-69", "q": "Much ........... done to regain residents’ confidence and meet their needs based on latest feedback.", "o": ["can be", "mustn't have", "are to be", "shouldn't have"], "c": 0, "e": "إمكانية عامة مبنية للمجهول (much يتلقى الفعل) = can be done."}, {"pg": "67-69", "q": "They missed the bus. They ........... at the station earlier.", "o": ["might have arrived", "shouldn't have arrived", "should have arrived", "must have arrived"], "c": 2, "e": "نصيحة فائتة/لوم على تفويت الأتوبيس = should have arrived."}, {"pg": "67-69", "q": "They ........... have finished the project by now, but I haven't checked.", "o": ["must", "can", "might", "couldn't"], "c": 2, "e": "احتمال غير مؤكد (لم يتحقق المتحدث بعد) = might have finished."}, {"pg": "67-69", "q": "He ........... be working late, but I'm not entirely sure.", "o": ["may", "can", "must", "should"], "c": 0, "e": "احتمال غير مؤكد صراحة (I'm not entirely sure) = may."}, {"pg": "67-69", "q": "You ........... seen him at the party last night. He was out of the country!", "o": ["can't have", "must have", "shouldn't have", "wouldn't have"], "c": 0, "e": "استنتاج بالنفي القاطع عن استحالة حدوث أمر ماضٍ (كان خارج البلاد) = can't have."}, {"pg": "67-69", "q": "It is raining. I wish it ........... .", "o": ["would stop", "will stop", "stops", "had stopped"], "c": 0, "e": "Wish + would للتعبير عن رغبة في تغيّر أمر مزعج مستمر في الحاضر (توقف المطر)."}, {"pg": "67-69", "q": "He ........... to apologize, but he refused.", "o": ["ought", "must", "should", "was supposed"], "c": 3, "e": "was supposed to تعبر عن التزام متوقع لم يتحقق (رفض الاعتذار)، وهي الصيغة المكتملة نحويًا هنا (تحتاج to)."}, {"pg": "67-69", "q": "There is much noise coming from the house. They ........... .", "o": ["must have left", "must leave", "can't leave", "can't have left"], "c": 3, "e": "استنتاج بالنفي (وجود ضوضاء ينفي مغادرتهم) عن حدث ماضٍ = can't have left."}, {"pg": "67-69", "q": "Have you ........... spending the weekend fishing at the lake?", "o": ["thought", "considered", "think", "consider"], "c": 1, "e": "consider + Gerund تركيب ثابت: considered."}, {"pg": "67-69", "q": "You ........... her. I've already phoned her.", "o": ["didn't have to phone", "needn't have phoned", "can't have phoned", "should have phoned"], "c": 1, "e": "needn't have + p.p. تعبر عن فعل قام به المتحدث بالفعل لكن دون داعٍ (اتصل هو بها بالفعل)."}, {"pg": "67-69", "q": "My flat is tidy. I ........... bother myself to get it cleaned today.", "o": ["don't have", "must", "needn't", "mustn't"], "c": 2, "e": "عدم وجود ضرورة حالية/مستقبلية للفعل (الشقة نظيفة بالفعل) = needn't."}, {"pg": "67-69", "q": "These keys ........... to my friend Omar. I am not sure.", "o": ["must have belonged", "might have belonged", "might belong", "must belong"], "c": 2, "e": "احتمال غير مؤكد في الحاضر (I am not sure الآن، لا سياق ماضٍ) = might belong."}, {"pg": "70-71", "q": "We were robbed as I remembered not ........... the door.", "o": ["locking", "to lock", "locked", "lock"], "c": 0, "e": "remember + Gerund تعني تذكّر فعل قام به الشخص بالفعل في الماضي (تذكر أنه لم يقفل الباب)."}, {"pg": "70-71", "q": "I was ........... by Heba's ........... the initiative to support her community, K.", "o": ["inspire / take", "inspired / taking", "inspired / took", "inspiring/ takes"], "c": 1, "e": "الفراغ الأول فعل مبني للمجهول (was + p.p.)، والثاني بعد صفة ملكية (Heba's) يأتي Gerund: inspired / taking."}, {"pg": "70-71", "q": "Students will have a break after they have finished ........... their test.", "o": ["to do", "doing", "to doing", "done"], "c": 1, "e": "finish + Gerund تركيب ثابت: doing."}, {"pg": "70-71", "q": "After completing his first draft, he went on ........... his essay.", "o": ["editing", "edit", "being edited", "to be edited"], "c": 0, "e": "go on + Gerund تعني الاستمرار في نفس النشاط (تحرير المقال): editing."}, {"pg": "70-71", "q": "We insisted ........... by the school principal to discuss our plans.", "o": ["on seeing", "on being seen", "to see", "in being seen"], "c": 1, "e": "insist on + Gerund، والفاعل يتلقى الفعل (مبني للمجهول: أن نُقابَل) = on being seen."}, {"pg": "70-71", "q": "I tried ........... up chocolate, but it was too hard.", "o": ["give", "given", "giving", "to give"], "c": 2, "e": "try + Gerund تعني حاول فعل شيء (وقد فشل، كما يوضح السياق): giving."}, {"pg": "70-71", "q": "I regretted ........... Samar the news when her face turned pale.", "o": ["to tell", "told", "telling", "tells"], "c": 2, "e": "regret + Gerund تعني الندم على فعل قام به بالفعل في الماضي: telling."}, {"pg": "70-71", "q": "I regretted ........... Samar the news when her face turned pale.", "o": ["to tell", "told", "telling", "tells"], "c": 2, "e": "regret + Gerund للندم على فعل تم بالفعل: telling."}, {"pg": "70-71", "q": "She is busy ........... her homework. You can text her if there is something urgent.", "o": ["do", "doing", "to do", "in doing"], "c": 1, "e": "busy + Gerund تركيب ثابت: doing."}, {"pg": "70-71", "q": "Ahmad is always the only student ........... the best marks.", "o": ["got", "gets", "to get", "has got"], "c": 2, "e": "the only + اسم + to + مصدر تركيب ثابت للوصف: to get."}, {"pg": "70-71", "q": "One should avoid ........... the same mistakes.", "o": ["repeating", "to repeat", "to repeating", "repeat"], "c": 0, "e": "avoid + Gerund تركيب ثابت: repeating."}, {"pg": "70-71", "q": "The doctor advised him to stop ........... sweets and lose weight.", "o": ["eat", "eating", "to eating", "to eat"], "c": 1, "e": "stop + Gerund تعني التوقف عن فعل (الإقلاع عن الحلويات): eating."}, {"pg": "70-71", "q": "After working hard for three months, I look forward ........... a vacation on the seaside.", "o": ["to having", "to have", "have", "having"], "c": 0, "e": "look forward to + Gerund تركيب ثابت (to حرف جر هنا): to having."}, {"pg": "70-71", "q": "The manager allows us ........... breakfast at the office.", "o": ["having", "have", "to have", "to having"], "c": 2, "e": "allow someone + to + مصدر: to have."}, {"pg": "70-71", "q": "I apologized for my mother because I forgot ........... the rice she asked for.", "o": ["buying", "to buy", "to buying", "buy"], "c": 1, "e": "forget + to + مصدر تعني نسيان القيام بفعل لم يحدث بعد (لم يشترِ الأرز): to buy."}, {"pg": "70-71", "q": "He recommended that we ........... the next weekend in Al Sokhna.", "o": ["spend", "to spend", "spending", "was spending"], "c": 0, "e": "recommend that + مصدر بدون to (Subjunctive): spend."}, {"pg": "70-71", "q": "He recommended ........... the weekend in Al Sokhna.", "o": ["spending", "spend", "to spend", "was spending"], "c": 0, "e": "recommend + Gerund (بدون that): spending."}, {"pg": "70-71", "q": "Remember ........... me an email when you arrive.", "o": ["to send", "sending", "send", "sent"], "c": 0, "e": "remember + to + مصدر تعني تذكّر القيام بفعل لم يحدث بعد (وصية مستقبلية): to send."}, {"pg": "70-71", "q": "He meant ........... her, but he didn't get the chance.", "o": ["calling", "called", "call", "to call"], "c": 3, "e": "mean + to + مصدر تعني كان ينوي فعل شيء (لم يحدث): to call."}, {"pg": "70-71", "q": "He stopped ........... a coffee before heading to work.", "o": ["to drink", "drank", "drink", "drinking"], "c": 0, "e": "stop + to + مصدر تعني توقف عن نشاط ليقوم بفعل آخر (توقف ليشرب قهوة): to drink."}, {"pg": "70-71", "q": "I expect ........... him next week.", "o": ["to see", "seeing", "see", "saw"], "c": 0, "e": "expect + to + مصدر: to see."}, {"pg": "70-71", "q": "I regret ........... you that your application has been rejected.", "o": ["informing", "to inform", "informed", "inform"], "c": 1, "e": "regret + to + مصدر تُستخدم لإبلاغ خبر سيئ رسميًا (وقت الفعل نفسه): to inform."}, {"pg": "70-71", "q": "It's no good ........... time convincing them with something they rejected before.", "o": ["spending", "to spend", "for spending", "spend"], "c": 0, "e": "it's no good + Gerund تركيب ثابت: spending."}, {"pg": "70-71", "q": "He asked me not to forget ........... him next week.", "o": ["telephoning", "to telephone", "telephone", "telephoned"], "c": 1, "e": "forget + to + مصدر لفعل مستقبلي لم يحدث بعد: to telephone."}, {"pg": "70-71", "q": "My parents never allow ........... to the cinema during exams.", "o": ["to go", "going", "go", "go to"], "c": 1, "e": "allow + Gerund (بدون مفعول محدد): going."}, {"pg": "70-71", "q": "The patient was made ........... in bed for three days.", "o": ["to stay", "staying", "stayed", "stay"], "c": 0, "e": "في الصيغة المبنية للمجهول be made يليها to + مصدر (بعكس المبني للمعلوم): to stay."}, {"pg": "70-71", "q": "We regret ........... that flight number 338 will be delayed.", "o": ["to announce", "announcing", "announce", "announced"], "c": 0, "e": "regret + to + مصدر لإعلان خبر سيئ رسميًا وقت الإعلان: to announce."}, {"pg": "74-76", "q": "The movie was ........... I almost fell asleep.", "o": ["bored", "boring", "bore", "boredom"], "c": 1, "e": "الصفة تصف الفيلم نفسه (مصدر الشعور) = ing: boring."}, {"pg": "74-76", "q": "Which sentence is correctly structured?", "o": ["They live in a three bedrooms apartment.", "They live in a three bedroom apartment.", "They live in a three-bedrooms apartment.", "They live in a three-bedroom apartment."], "c": 3, "e": "الصفة المركبة من رقم قبل الاسم تكون مفردة وموصولة بشرطة: a three-bedroom apartment."}, {"pg": "74-76", "q": "The narrower the space in the balcony is, the ........... the furniture it can accommodate.", "o": ["fewer", "less", "little", "more"], "c": 1, "e": "تركيب The + مقارنة..., the + مقارنة (كلما...كلما)، وfurniture اسم غير معدود فتُستخدم less."}, {"pg": "74-76", "q": "They spent a ........... trip in Spain. They enjoyed it very much.", "o": ["five - day", "five days", "five - days", "five day"], "c": 0, "e": "الصفة المركبة من رقم تكون مفردة وموصولة بشرطة: five-day."}, {"pg": "74-76", "q": "The team prepared a ........... schedule designed to complete the project efficiently and effectively.", "o": ["time-save", "saving-time", "time-saved", "time-saving"], "c": 3, "e": "صفة مركبة تعني \"موفر للوقت\" (اسم+ing كصفة فاعلة): time-saving."}, {"pg": "74-76", "q": "It's an ancient building but it's still ........... .", "o": ["lasting-long", "long-lasting", "last- long", "long- lasted"], "c": 1, "e": "صفة مركبة ثابتة تعني \"يدوم طويلًا\": long-lasting."}, {"pg": "74-76", "q": "You’ve made lots of mistakes. Please, work ........... next time.", "o": ["most carefully", "most careful", "more carefully", "more careful"], "c": 2, "e": "بعد فعل (work) نحتاج ظرفًا (carefully) وليس صفة، والمقارنة هنا نسبية بسيطة: more carefully."}, {"pg": "74-76", "q": "A lot of ........... people are glad for their appreciation.", "o": ["well-educated", "a well-educated", "a good-education", "good - education"], "c": 0, "e": "صفة مركبة قبل اسم جمع (people) بدون أداة نكرة: well-educated."}, {"pg": "74-76", "q": "........... , their project gained financial support from the sharks.", "o": ["Interestedly", "Interestingly", "Interested", "Interesting"], "c": 1, "e": "ظرف يصف الجملة كلها في بدايتها (تعليق المتحدث): Interestingly."}, {"pg": "74-76", "q": "Luckily ........... , the old cottage was well equipped just as we had hoped.", "o": ["enough", "too", "no more", "not enough"], "c": 0, "e": "Luckily enough تعبير ثابت يعني لحسن الحظ."}, {"pg": "74-76", "q": "My father is ........... All family members follow in his footsteps.", "o": ["really influential", "real influence", "really influenced", "reality influence"], "c": 0, "e": "بعد فعل الكينونة (is) نحتاج صفة (influential) مسبوقة بظرف تأكيد (really): really influential."}, {"pg": "74-76", "q": "He is ........... of the twins.", "o": ["more taller", "the taller", "the tallest", "much taller"], "c": 1, "e": "المقارنة بين اثنين فقط (twins) تستخدم صيغة التفضيل بـ the + المقارنة: the taller."}, {"pg": "74-76", "q": "........... navigation methods of birds are compared with others in the animal world.", "o": ["So", "Such", "None", "Each"], "c": 1, "e": "Such + اسم جمع (methods) للتعبير عن \"مثل هذه\": Such."}, {"pg": "74-76", "q": "The book was ........... interesting than I had expected.", "o": ["far more", "the most", "slightly much", "much least"], "c": 0, "e": "far more + صفة + than تركيب تفضيل تفوق قوي: far more."}, {"pg": "74-76", "q": "The harder you practice, the ........... you become.", "o": ["fitter", "fittest", "least fit", "fit"], "c": 0, "e": "The + مقارنة..., the + مقارنة (كلما...كلما): fitter."}, {"pg": "74-76", "q": "He is ........... intelligent than his brother.", "o": ["a lot", "much", "much more", "slightly"], "c": 2, "e": "قبل صفة في صيغة المقارنة (intelligent than) نحتاج much more: much more intelligent."}, {"pg": "74-76", "q": "The journey took ........... I expected, so I got very tired.", "o": ["as long", "longer than", "long as", "so longer"], "c": 1, "e": "مقارنة تفوق (استغرقت وقتًا أطول مما توقعت) = longer than."}, {"pg": "74-76", "q": "Mohamed Salah is ........... remarkable, Egyptian player I have ever seen.", "o": ["the most", "more", "most", "the more"], "c": 0, "e": "صيغة التفضيل العليا مع ever: the most remarkable."}, {"pg": "74-76", "q": "He lives two miles ........... away from the club than I do.", "o": ["farther", "furthest", "far", "farthest"], "c": 0, "e": "مقارنة بين شخصين (than I do) = farther."}, {"pg": "74-76", "q": "The man with a long moustache was ........... The little boy ran away when he saw him.", "o": ["frightening", "frightened", "fright", "frightens"], "c": 0, "e": "الرجل هو مصدر الخوف (وليس من يشعر به) = frightening."}, {"pg": "74-76", "q": "I was driving ........... when I noticed I had a flat tire.", "o": ["fast", "faster", "fastly", "more fast"], "c": 0, "e": "fast ظرف وصفة بنفس الصيغة (لا تُضاف لها ly): fast."}, {"pg": "74-76", "q": "She did the exam ........... than she had expected.", "o": ["easiest", "more easily", "more easy", "easy"], "c": 1, "e": "بعد فعل (did) نحتاج ظرف مقارنة: more easily."}, {"pg": "74-76", "q": "The driver was ........... hurt.", "o": ["seriously", "slight", "dangerous", "serious"], "c": 0, "e": "قبل صفة/تعبير حالة (hurt) نحتاج ظرفًا: seriously."}, {"pg": "74-76", "q": "The people living next door are neighbourly. The word “neighbourly” is a/an ........... .", "o": ["adverb", "adjective", "noun", "verb"], "c": 1, "e": "neighbourly رغم انتهائها بـ ly فهي صفة تصف السلوك (وليست ظرفًا)."}, {"pg": "74-76", "q": "........... cars are cheaper than new ones.", "o": ["Used", "Using", "Use", "Usage"], "c": 0, "e": "صفة (Past Participle) تصف السيارات (مستعملة): Used."}, {"pg": "74-76", "q": "What is the correct superlative form? Mohamed Salah is ........... player.", "o": ["Egypt's fastest", "Egypt fastest", "the fastest of Egypt", "more fast Egypt"], "c": 0, "e": "صيغة الملكية (Egypt's) + صفة تفضيل عليا (fastest): Egypt's fastest."}, {"pg": "74-76", "q": "The Great Wall of China is 6,400 kilometres in ........... .", "o": ["length", "long", "along", "lengthen"], "c": 0, "e": "in + اسم (length) لوصف البُعد/القياس."}, {"pg": "74-76", "q": "She felt ........... furious when the children broke the window.", "o": ["extreme", "very", "quite", "absolutely"], "c": 3, "e": "furious صفة غير قابلة للتدرج (extreme adjective)، فتُستخدم معها absolutely."}, {"pg": "74-76", "q": "Children prefer outdoor activities to ........... ones.", "o": ["indoor", "indoors", "outside", "outdoors"], "c": 0, "e": "قبل اسم (ones) نحتاج صفة: indoor."}, {"pg": "74-76", "q": "He is ........... that all people respect him.", "o": ["such a polite man", "so polite a man", "such polite man", "so a polite"], "c": 1, "e": "so + صفة + a + اسم مفرد تركيب ثابت: so polite a man."}, {"pg": "74-76", "q": "She runs ........... that she could win the race easily.", "o": ["such quick", "so quickly", "so quick", "such quickly"], "c": 1, "e": "so + ظرف (بعد فعل runs) + that: so quickly."}, {"pg": "74-76", "q": "He spoke in ........... a low voice that I couldn't hear him.", "o": ["such", "very", "so", "too"], "c": 0, "e": "such + a + صفة + اسم + that تركيب ثابت: such a low voice that."}, {"pg": "74-76", "q": "........... that he could work out in a minute.", "o": ["So intelligent is he", "So he is intelligent", "So is intelligent he", "So intelligent he is"], "c": 0, "e": "قلب الفعل والفاعل بعد So + صفة في بداية الجملة: So intelligent is he."}, {"pg": "74-76", "q": "There are ........... many options in this marvelous mobile that I can hardly deal with.", "o": ["such", "too", "very", "so"], "c": 3, "e": "so + many + اسم جمع + that تركيب ثابت: so many."}, {"pg": "74-76", "q": "She had ........... heavy luggage that I offered to help her.", "o": ["such", "enough", "such a", "so"], "c": 0, "e": "such + صفة + اسم غير معدود (luggage) + that: such heavy luggage that."}, {"pg": "74-76", "q": "My son isn't old ........... to drive a car.", "o": ["such", "too", "enough", "so"], "c": 2, "e": "صفة + enough + to + مصدر تركيب ثابت: old enough to."}, {"pg": "74-76", "q": "There are times when people can't work ........... to live comfortably.", "o": ["too hard", "such a hard", "hard enough", "so hard"], "c": 2, "e": "ظرف/صفة + enough + to + مصدر: hard enough to."}, {"pg": "74-76", "q": "In ........... time, I will have finished my exams.", "o": ["three months'", "three-months", "three month's", "three-month"], "c": 0, "e": "صيغة ملكية زمنية للجمع (three months') قبل time."}, {"pg": "74-76", "q": "I haven't visited London before ........... .", "o": ["So had Ahmed", "So has Ahmed", "Neither had Ahmed", "Neither has Ahmed"], "c": 3, "e": "بعد جملة منفية في Present Perfect، نستخدم Neither + has/have + فاعل للاتفاق: Neither has Ahmed."}, {"pg": "74-76", "q": "It was ........... dark outside that I could hardly see my way.", "o": ["such", "very", "too", "so"], "c": 3, "e": "so + صفة + that تركيب ثابت للنتيجة: so dark that."}, {"pg": "74-76", "q": "English is ........... language.", "o": ["a widely spoken", "widely-spoken", "a widely-spoken", "widely spoken"], "c": 2, "e": "صفة مركبة (widely-spoken) قبل اسم مفرد (language) تحتاج أداة نكرة: a widely-spoken."}, {"pg": "74-76", "q": "This woman is ........... and elegant.", "o": ["good looking", "a good-looking", "well looking", "well-looking"], "c": 0, "e": "بعد فعل الكينونة (is) نحتاج صفة مركبة بدون أداة نكرة: good looking (good-looking)."}, {"pg": "74-76", "q": "A ........... well has been dug in the desert to provide people with water.", "o": ["twenty-metres", "twenty-metre", "twenty metres’", "twenty metre's"], "c": 1, "e": "صفة مركبة من رقم قبل اسم تكون مفردة وموصولة بشرطة: twenty-metre."}, {"pg": "74-76", "q": "Do you think French is ........... .", "o": ["speaking", "speaking widely", "widely spoken", "widely-spoken"], "c": 2, "e": "بعد فعل الكينونة (is) بدون اسم تالٍ نستخدم الصفة المفككة: widely spoken (مبني للمجهول)."}, {"pg": "78-80", "q": "Sara was delighted as the news she received ........... promising.", "o": ["was", "were", "is", "are"], "c": 0, "e": "news اسم غير معدود يُعامل معاملة المفرد دائمًا: was."}, {"pg": "78-80", "q": "Walid as well as his friends ........... their community.", "o": ["supports", "support", "have supported", "are supporting"], "c": 0, "e": "as well as لا تُعامَل معاملة العطف؛ الفعل يطابق الفاعل الأول (Walid مفرد): supports."}, {"pg": "78-80", "q": "Five hundred pounds ........... too much for this pair of shoes.", "o": ["are", "have been", "were", "is"], "c": 3, "e": "المبالغ المالية تُعامَل ككتلة واحدة (مفرد): is."}, {"pg": "78-80", "q": "The researcher said that the results were ........... and needed to be reviewed because the data ........... incomplete.", "o": ["strong / was", "certain / are", "clear / were", "unclear / was"], "c": 3, "e": "dat
