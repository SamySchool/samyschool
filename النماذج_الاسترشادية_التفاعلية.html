القانوني الحالي)."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. The relocation of Abu Simbel is best described as …………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an example of complete cultural loss</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a protest movement against dams</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a mix of ancient artistry and modern engineering</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a rejection of modern construction</span>"], "c": 2, "e": "ذكر النص أن معابد أبو سمبل “are an amazing combination of ancient and modern engineering”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. The Chinese challenge in heritage conservation lies in ………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">avoiding exploitation while preserving cultural values</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">demolishing old sites for development</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">limiting tourism to historical areas</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">relying only on government funding</span>"], "c": 0, "e": "ذكر النص: “The challenge lies in finding methods that preserve these values while avoiding the dangers of commercial exploitation”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. The approach to heritage preservation in Egypt differ from the situation in Canada as Egypt………………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ignored its heritage sites, while Canada protected it through strict laws.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">used modern engineering to save a threatened monument, while Canada struggled with a lack of legal protection for heritage sites.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">relied only on community protests, while Canada depended on international organizations.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">prevented any modern construction, while Canada encouraged commercial development of historical landmarks.</span>"], "c": 1, "e": "استخدمت مصر الهندسة الحديثة لإنقاذ أبو سمبل المهدد بالغرق، بينما عانت كندا من غياب الحماية القانونية."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The suitable title for this passage is &ldquo;………….&rdquo;.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Teacher&rsquo;s Past</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">One Moment of Compassion</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">A Busy City Evening</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The Groceries on the Counter</span>"], "c": 1, "e": "تنتهي القصة بعبارة “all it takes is one moment of compassion to change someone's day”، وهي جوهر العنوان.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>The sun was beginning to dip below the horizon, casting long, dancing shadows across the bustling city street. Amid the throngs of people hurrying home from work, a young woman named Anya paused to tie her loose shoelace. As she knelt on the sidewalk, she noticed an elderly man nearby struggling to carry a heavy bag of groceries. His steps were slow and unsteady. He paused every few feet to catch his breath. Without hesitation, Anya stood up and offered to help. The man &mdash; surprised by her kindness &mdash; smiled gratefully and accepted.</p><p>As they walked together toward his apartment building, they struck up a warm conversation. Anya learned his name was Mr. Patel and that he lived alone since his wife had passed away two years earlier. He spoke fondly of his daughter, who lived across the country, and shared stories of his youth, his career as a teacher, and his enduring love for gardening. Anya listened with genuine interest, moved by his gentle spirit and quiet resilience.</p><p>When they arrived at his building, Anya insisted on carrying the groceries all the way to his door and even helped him unpack. As she watched him carefully place tomatoes and bread on the counter, she felt a deep sense of fulfillment &mdash; not only had she eased his burden, but she&rsquo;d also made a meaningful human connection.</p><p>Walking home under the soft glow of streetlights, Anya felt a quiet joy settle over her. She realized that even the smallest act of kindness could ripple outward in ways she might never see. From that day forward, she made a conscious effort to be more present, observant, and willing to help others &mdash; because sometimes, all it takes is one moment of compassion to change someone&rsquo;s day&hellip; or even their life.</p></div>"}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. The sentence that summarizes the third paragraph is ………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya helps Mr. Patel unpack his groceries and feels happy about their new friendship.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Mr. Patel invites Anya inside, and they cook dinner together using fresh groceries.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya refuses to leave until Mr. Patel promises to call her if he needs help again.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Mr. Patel shows Anya his garden, and they talk about planting vegetables next spring.</span>"], "c": 0, "e": "الفقرة الثالثة تصف مساعدة آنيا للسيد باتيل في حمل وترتيب المشتريات وشعورها بالرضا لذلك."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. How are Anya and Mr. Patel different at the start of the story?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya is in a hurry, while Mr. Patel moves slowly and seems tired.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya dislikes talking to strangers, but Mr. Patel loves meeting new people.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya lives alone, whereas Mr. Patel has a big family nearby.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Anya is elderly, and Mr. Patel is a young student returning from school.</span>"], "c": 0, "e": "كانت آنيا وسط الحشد المسرع للعودة من العمل، بينما كانت خطوات السيد باتيل بطيئة ومتعبة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. Mr. Patel carried a bag of groceries but struggled because ……………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">it was too heavy and he was unsteady</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the bag was torn and spilling food</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he had injured his arm earlier</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">he had just returned from a long trip</span>"], "c": 0, "e": "ذكر النص أنه كان يحمل كيسًا ثقيلًا وخطواته كانت بطيئة وغير ثابتة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. After her experience with Mr. Patel, what personal decision did Anya make for the future?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To avoid helping strangers again because she was afraid of being misunderstood.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To focus only on her own goals and stop paying attention to people around.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To be more present, observant, and willing to help other people around.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To spend less time outdoors since she felt too tired after the encounter.</span>"], "c": 2, "e": "ذكر النص حرفيًا أنها قررت أن تكون “more present, observant, and willing to help others”."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Anya felt deeply moved by Mr. Patel&rsquo;s …………….... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wealth and success</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">gentle spirit and quiet resilience</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">complaints about loneliness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">collection of gardening tools</span>"], "c": 1, "e": "ذكر النص أنها تأثرت بـ“his gentle spirit and quiet resilience”."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. The act of helping Mr. Patel gave Anya a sense of ……………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disappointment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">embarrassment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">regret</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fulfillment</span>"], "c": 3, "e": "ذكر النص أنها شعرت بـ“a deep sense of fulfillment” بعد مساعدته."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. Anya&rsquo;s actions can be described as ……………... .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">unnecessary and time-consuming</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compassionate and meaningful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">selfish and careless</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">careless but quick</span>"], "c": 1, "e": "تصرفات آنيا (مساعدة رجل مسن غريب دون مقابل) تعكس تعاطفًا حقيقيًا ومعنى إنسانيًا."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. She reminded him ……….. his passport.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">don&rsquo;t forget</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">not forget</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">not to forget</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">doesn&rsquo;t forget</span>"], "c": 2, "e": "remind someone + not + to + مصدر تركيب ثابت لنقل تحذير منفي."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. The teacher insisted that they….……present.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">be</span>"], "c": 3, "e": "insist that + مصدر بدون to (Subjunctive) بعد أفعال الإصرار: be."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. …………. exhausted after the journey, I went to bed.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Felt</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Feeling</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To feel</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Feel</span>"], "c": 1, "e": "Participle Clause في بداية الجملة (فاعل الشعور هو نفسه) = صيغة Feeling + مبني للمعلوم."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. The lights are off and the door is locked; the office ……… for the day.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must close</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should be closing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should close</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must be closed</span>"], "c": 3, "e": "استنتاج منطقي من دليل حالي (أضواء مطفأة وباب مغلق)، والمكتب يتلقى الفعل (مبني للمجهول) = must be closed."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. The movie was …………... I almost fell asleep.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bored</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">boring</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bore</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">boredom</span>"], "c": 1, "e": "الصفة تصف الفيلم نفسه (مصدر الشعور بالملل) = boring."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. Which sentence is correctly structured?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They live in a three bedrooms apartment.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They live in a three bedroom apartment.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They live in a three-bedrooms apartment.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">They live in a three-bedroom apartment.</span>"], "c": 3, "e": "الصفة المركبة من رقم قبل اسم تكون مفردة وموصولة بشرطة: a three-bedroom apartment."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. Which sentence is correctly punctuated?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">&ldquo;Are you coming to the party?&rdquo; she asked.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">&ldquo;Are you coming to the party?&rdquo; She asked.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">&ldquo;Are you coming to the party?&rdquo;, she asked.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">&ldquo;Are you coming to the party!&rdquo; she asked.</span>"], "c": 0, "e": "بعد علامة استفهام داخل الاقتباس، يبدأ الفعل التالي (she asked) بحرف صغير وبدون فاصلة إضافية."}, {"pg": "7-8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. In a/an …………… essay, you should present strong evidence and clear reasoning to influence the reader&rsquo;s opinion or actions.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">persuasive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">expository</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">descriptive</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">narrative</span>"], "c": 0, "e": "المقال persuasive (الإقناعي) هو الذي يقدم أدلة وحججًا لإقناع القارئ برأي أو فعل معين."}, {"pg": "9", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>People read newspapers selectively, focusing on headlines and articles that match their interests, rather than reading everything. What we choose to read depends on our personal preferences and curiosity.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقرأ الناس الصحف بدقة، مركزين على العناوين والمقالات التي تتعارض مع اهتماماتهم، بدلاً من قراءة كل شيء. ما نختار قراءته يعتمد على تفضيلاتنا الشخصية وفضولنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقرأ الناس الصحف بانتقائية، مركزين على العناوين والمقالات التي تناسب اهتماماتهم، بدلاً من قراءة كل شيء. ما نختار قراءته يعتمد على تفضيلاتنا الشخصية وفضولنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقرأ الناس الصحف باحترافية، مركزين على العناوين والمقالات التي تناسب اهتماماتهم، بدلاً من قراءة كل شيء. ما نختار قراءته يعتمد على تفضيلاتنا الشخصية وشغفنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">يقرأ الناس الصحف بسطحية، مركزين على العناوين أو المقالات التي تناسب اهتماماتهم، بدلاً من قراءة كل شيء. ما نختار قراءته يعتمد على أذواقنا الشخصية وشغفنا.</span>"], "c": 1, "e": "الخيار (b) وحده يترجم “selectively” بدقة (بانتقائية) و“match” بمعناها الصحيح (تناسب)؛ الخيار (a) يعكس المعنى بـ“تتعارض مع”، و(c) و(d) يستخدمان كلمات غير دقيقة (باحترافية/بسطحية)."}, {"pg": "9", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>The large-scale migration phenomenon, accompanied by rapid urban expansion, indicates significant potential demographic shifts in the coming decades. This trend reflects growing pressures on economic resources.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تشير ظاهرة الهجرة واسعة النطاق، المصحوبة بالتوسع الحضري السريع، إلى تحولات ديموغرافية محتملة كبيرة في القرون القادمة. يعكس هذا التوجه طلبًا متزايدًا على الموارد الاقتصادية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تؤكد ظاهرة الهجرة محدودة النطاق، المصحوبة بالتوسع الحضري السريع، إلى تكتلات ديموغرافية محتملة كبيرة في العقود القادمة. يمثل هذا التوجه ضغوطًا متزايدة على الموارد الاقتصادية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تؤكد ظاهرة الهجرة واسعة النطاق، المصحوبة بالتوسع الحضري السريع، إلى تحولات ديموغرافية محتملة كبيرة في القرون القادمة. يعبر هذا التوجه عن طلبًا متزايدًا على الموارد الاقتصادية.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">تشير ظاهرة الهجرة واسعة النطاق، المصحوبة بالتوسع الحضري السريع، إلى تحولات ديموغرافية محتملة كبيرة في العقود القادمة. يعكس هذا التوجه ضغوطًا متزايدة على الموارد الاقتصادية.</span>"], "c": 3, "e": "الخيار (d) هو الأدق: “indicates” = تشير (وليس تؤكد)، “decades” = عقود (وليس قرون)، و“reflects growing pressures” = يعكس ضغوطًا متزايدة (ترجمة حرفية دقيقة)."}, {"pg": "9", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>لقد حاول الناس لعدة قرون التنبؤ بالطقس، ولكن في الآونة الأخيرة فقط - بفضل التكنولوجيا والبيانات المتقدمة - تمكن خبراء الأرصاد الجوية من تحقيق قدر أعظم من الدقة في توقعاتهم.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">For centuries, people are trying to predict the weather, but it&rsquo;s only recently&mdash;with advanced technology and data&mdash;that meteorologists have achieved significantly great accurate in their forecasts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">For centuries, people had tried to predict the whether, but it&rsquo;s only recently&mdash;with advance technology and data&mdash;that meteorologists have achieved significant greater accuracy in their forecasts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">For centuries, people have tried to predict the weather, but it&rsquo;s only recently&mdash;with advanced technology and data&mdash;that meteorologists have achieved significantly greater accuracy in their forecasts.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">For centuries, people tried to predict the weather, but it&rsquo;s only recently&mdash;with advanced technology and data&mdash;that meteorologists have achieved significant greater accuracy in their forecasts.</span>"], "c": 2, "e": "الخيار (c) هو الوحيد السليم قواعديًا بالكامل: Present Perfect “have tried” يناسب “لقد حاول...لعدة قرون”، وباقي الخيارات بها أخطاء إملائية أو نحوية (whether/great accurate/simple past)."}, {"pg": "9", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>عند مقابلة شخص جديد أو في المناسبات الرسمية، خاطبه بلقبه واسم عائلته. استخدم اسمه الأول فقط إذا دعاك لذلك، أو بعد أن تتعرف عليه جيدًا.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When meeting someone new or in formal situations, address them using their title and nickname. Use first names only if they invite to, or after you&rsquo;ve become well acquainted.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When meeting someone new or in informal situations, address them using their title and last name. Use first names only if they invite you to, or after you&rsquo;ve became well acquainted.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When meeting someone new or in formal situations, address them using their title and last name. Use first names only if they invite you to, or after you&rsquo;ve become well acquainted.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When meeting someone new or in informal situations, address them using their title and last name. Use first names only if they invite you to, or after you&rsquo;ve become will acquainted.</span>"], "c": 2, "e": "الخيار (c) هو الترجمة الصحيحة تمامًا: “formal situations” (وليس informal، فالمعنى الأصلي عكس ذلك)، و“last name” (وليس nickname)، مع سلامة الصياغة النحوية الكاملة."}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. How does the novel represent the idea of justice through its characters, events or conflicts?</span>", "model": "The novel presents justice as something that eventually catches up with wrongdoers, even after many years. Edmond Dantès, wrongly imprisoned through the conspiracy of Danglars, Fernand, and Villefort, spends years planning a careful, calculated revenge once he escapes and gains immense wealth. Through the downfall of each of his former enemies &mdash; Danglars losing his fortune, Fernand losing his honour and family, and Villefort losing his sanity &mdash; the novel shows that betrayal and injustice ultimately have consequences. However, it also raises the question of whether personal revenge is the same as true justice, since Edmond's actions cause suffering to innocent people connected to his enemies as well.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. How do secondary characters reflect different moral perspectives? Mention two characters.</span>", "model": "Secondary characters in the novel represent different moral choices and values. Abbé Faria, the wise priest Edmond meets in prison, represents wisdom, patience, and mentorship; he educates Edmond and gives him the knowledge and hope that later allow him to transform his life. In contrast, Danglars represents pure greed and self-interest, as his jealousy over Edmond's success drives him to help destroy an innocent man's life purely for personal gain. Together, these two characters show the novel's contrast between moral integrity and selfish ambition.", "marks": 2}, {"pg": "11", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a concluding paragraph to end a descriptive essay titled &ldquo;The Local Library on a Rainy Day&rdquo;.</span>", "model": "As the rain continued to tap gently against the tall windows, the library remained a peaceful haven, untouched by the storm outside. The soft rustle of turning pages, the quiet murmur of hushed conversations, and the warm glow of the reading lamps all combined to create a sense of comfort that no rainy day could dampen. Leaving that cosy corner felt almost reluctant, yet the memory of that calm, book-filled afternoon lingered long after the rain had stopped, reminding me that some of the simplest places hold the deepest sense of peace.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. A&hellip;.is the subjective experience like pain that indicates a disease or a condition.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sterilization</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">symptom</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">session</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">syndrome</span>"], "c": 1, "e": "symptom تعني “عرض مرضي”، وهو شعور ذاتي (كالألم) يدل على وجود مرض أو حالة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. Our captain …….. off the day with some exercise.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">takes</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">pays</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">puts</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">kicks</span>"], "c": 3, "e": "“kick off” تعبير ثابت يعني “يبدأ”، ويُستخدم غالبًا مع بداية اليوم أو النشاط."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. Besides traditional methods, artists are embracing new technology. The antonym of the underlined word &ldquo;embracing&rdquo; is ………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">defining</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">diagnosing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rejecting</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">supporting</span>"], "c": 2, "e": "embracing تعني “يتبنى/يحتضن”، وعكسها rejecting (يرفض)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. New factories are being modernized to……. productivity.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">implement</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">immerse</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">surround</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">enhance</span>"], "c": 3, "e": "enhance تعني “يعزز/يحسّن”، وهي المناسبة مع تحديث المصانع لزيادة الإنتاجية."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. When the injured arrived, the doctors………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sprang into action</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">laid the groundwork</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">soaked to the skin</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">came to a standstill</span>"], "c": 0, "e": "“spring into action” تعبير اصطلاحي يعني “يتحرك بسرعة لفعل شيء”، وهو المناسب مع وصول المصابين."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. The ancient Egyptians were masters of mechanics before the modern………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">season</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">century</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decade</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">era</span>"], "c": 3, "e": "era تعني “عصر/حقبة”، وهي الأنسب للحديث عن العصر الحديث بشكل عام."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. Young children are particularly vulnerable to flu. The synonym of the word vulnerable is………...</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">exiled</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">extracted</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">exempted</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">exposed</span>"], "c": 3, "e": "vulnerable تعني “عرضة للخطر/الأذى”، ومرادفها هنا exposed (معرَّض)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. Our grandfather&rsquo;s judgment and opinions are always wise and……...………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">insightful</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">trivial</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shallow</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">powerful</span>"], "c": 0, "e": "insightful تعني “ثاقب/عميق الفهم”، وهي صفة إيجابية تتماشى مع “wise”."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. He is furious because he………. included in the team.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hadn&rsquo;t been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">hasn&rsquo;t been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had</span>"], "c": 1, "e": "الفاعل (he) يتلقى الفعل (مبني للمجهول)، والزمن مضارع تام لأثر لحظي حالي (furious الآن) = hasn't been."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. Sara was delighted as the news she received………promising.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are</span>"], "c": 0, "e": "news اسم غير معدود يُعامل معاملة المفرد دائمًا: was."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. I haven&rsquo;t seen Amr……...the last conference.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">since</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">just</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">for</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">yet</span>"], "c": 0, "e": "since + نقطة زمنية محددة (the last conference) مع Present Perfect."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The main idea of the passage is that………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim was lucky to be born rich</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim&rsquo;s hard work and perseverance led to success</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim didn&rsquo;t like studying due to his poverty</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim&rsquo;s success came only from talent</span>"], "c": 1, "e": "النص كله يبرز كيف أدى اجتهاد كريم ومثابرته لتحقيق النجاح رغم الفقر.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Success stories often begin with struggle, and Karim&rsquo;s journey is no exception. Born into a poor neighborhood, Karim faced many challenges from a young age. His parents worked multiple jobs just to make ends meet, and there were times when they couldn&rsquo;t even afford basic school supplies. Despite these hardships, he never gave up on his dream of becoming an engineer.</p><p>During high school, Karim spent countless hours studying, often using old books and online resources because he couldn&rsquo;t afford tutoring. His grades were excellent, but getting into university was still a huge obstacle due to financial difficulties. Determined not to let poverty define his future, he applied for dozens of scholarships. After many rejections, he finally received a full scholarship. Even at university, life wasn&rsquo;t easy. Karim worked part-time jobs to support his living expenses and continued to face academic and personal challenges. But he stayed focused, motivated by the belief that his hard work would eventually pay off.</p><p>Years later, Karim graduated with honors and was offered a job at a top engineering firm. Today, he is a well-known engineer and mentors students who come from similar backgrounds. His journey proves that success is possible with determination, perseverance, and self-belief. Karim's story is a powerful reminder that dreams can come true, no matter how difficult the path may seem. His life teaches us that true success is not just about talent, but also about the strength to keep going when everything seems against you.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. Karim tried to overcome his ………………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ignorance</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">poverty</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lack of confidence</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">greed for money</span>"], "c": 1, "e": "واجه كريم تحديات مادية بسبب فقر أسرته، وحاول التغلب على الفقر بالتفوق الدراسي والمنح."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. Which sentence summarizes the last paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim graduated with honors and was offered a job at a leading company.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim learned that success is only about talent but not perseverance.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim now mentors students who come from different backgrounds.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Karim&rsquo;s success shows that determination and self-belief lead to achievement.</span>"], "c": 3, "e": "الفقرة الأخيرة تؤكد أن قصة كريم دليل على أن التصميم والثقة بالنفس يؤديان للنجاح."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. Which event shows the turning point in Karim&rsquo;s life?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When he was born in a poor neighborhood.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When he got rejected for a scholarship.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When he received a full scholarship to university.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">When he started working part-time jobs.</span>"], "c": 2, "e": "حصوله على المنحة الكاملة كان نقطة التحول التي مكّنته من دخول الجامعة رغم الصعوبات المادية."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. Through reading the passage we can infer that Karim ……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">gives up easily when facing challenge</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is indifferent about his goals</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">is determined, and hardworking</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">show little interest in education</span>"], "c": 2, "e": "استمراره في الدراسة والعمل رغم كل الصعوبات يدل على أنه مصمم ومجتهد."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. What is Karim most likely to do in the future?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Retire early and live a life of leisure.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Continue helping and inspiring other students.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Quiet his engineering career.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Completely forget his difficult past.</span>"], "c": 1, "e": "ذكر النص أنه “mentors students who come from similar backgrounds”، فمن المرجح أن يستمر في ذلك."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. How was Karim&rsquo;s life before and after his success?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was rich but he became extravagant.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was poor and later became a successful engineer.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was indifferent, later he became curious.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">He was lazy at first, but later he became an energetic person.</span>"], "c": 1, "e": "كان كريم فقيرًا، ثم أصبح مهندسًا ناجحًا ومعروفًا بعد كفاحه الطويل."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. Karim&rsquo;s feelings evolved over the course of the story as he became ……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">curious and nervous</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">confident and proud</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">confident but greedy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">bored and frustrated</span>"], "c": 1, "e": "مع تحقيق نجاحاته المتتالية، أصبح كريم واثقًا بنفسه وفخورًا بما حققه."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the passage is that ………………..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">health care is mainly about preventing and curing different kinds of diseases in people</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">health care focuses on making more money for modern hospital</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">there are many ways to explain the fact that health care is one of main pillars of a developed society</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">health care only helps poor people to live longer and healthier life</span>"], "c": 2, "e": "يستعرض النص عدة جوانب (الوقاية، العلاج، التكنولوجيا، العدالة) توضح أن الرعاية الصحية ركيزة أساسية للمجتمع المتقدم.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>Health care is one of the main pillars of a developed society. It goes beyond treating diseases; it focuses on promoting wellness, preventing illness, and improving the quality of life for all individuals. A strong health care system reflects a nation&rsquo;s values, priorities, and sense of responsibility toward its people.</p><p>Today, health care, supported by modern technology, has become more complex and more essential than ever. With the rapid spread of new diseases and global health challenges, such as pandemics and pollution, nations must invest heavily in medical research, public hospitals, and health education. Good health care is not a luxury; it is a human right that should be available to everyone, regardless of income or social class.</p><p>To further develop and enhance health care, developed societies are now turning to technology-driven solutions. Artificial intelligence, telemedicine, and advanced medical equipment have transformed the way doctors diagnose and treat patients. For example, online medical consultations allow people in remote areas to receive expert advice without traveling long distances.</p><p>However, despite all the progress, many people around the world still suffer from poor medical services. Lack of funding and low awareness remain serious problems. Therefore, both governments and individuals must work together. In conclusion, the health of a nation determines its strength and future. Investing in health care is not just about curing the sick&mdash;it is about creating a society where every person has the chance to live a healthy, dignified, and productive life.</p></div>"}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. The passage explains that applying technology in health care……....</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">worsens the communication between patients and doctors adding no value</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has made diagnosis and treatment faster, easier and more accurate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has no role or positive impact in the progress of modern health care systems</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">completely replaces the work of doctors in hospitals</span>"], "c": 1, "e": "ذكر النص أن الذكاء الاصطناعي والتطبيب عن بُعد جعلا التشخيص والعلاج أسرع وأدق."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. Which sentence summarizes the last paragraph?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Health care is expensive and not important.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Health care combines prevention, treatment, and technology to improve people&rsquo;s lives.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Governments around the world should invest in health care to make the sick lead a healthy life.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Health care is a problem only in poor countries.</span>"], "c": 2, "e": "دعا النص في خاتمته الحكومات والأفراد للتعاون والاستثمار في الرعاية الصحية لتحسين حياة الجميع."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. Health care concept as a human right is developed in the text by…… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">showing how only rich people receive proper health care</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">giving examples of modern hospitals and their advanced facilities</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">explaining that everyone deserves access to health services regardless of income or social class</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">describing the history of medicine and the way hospitals were developed over time</span>"], "c": 2, "e": "أوضح النص أن الرعاية الصحية حق للجميع بغض النظر عن الدخل أو الطبقة الاجتماعية."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. What can we infer about the writer&rsquo;s opinion of global health?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer thinks the world has already solved all health problems.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer believes inequality in health care still exists across the world.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer thinks progress has been made, so global concern is no longer a serious concern.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer believes that only doctors are responsible for improving health care systems.</span>"], "c": 1, "e": "أشار النص إلى أن كثيرين ما زالوا يعانون من ضعف الخدمات الطبية، مما يدل على استمرار عدم المساواة."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. If governments do not invest in health care, what might happen?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People will still receive the same high-quality treatment everywhere.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Medical technology will continue to improve automatically.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The quality of life will decline, and diseases will spread more widely.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Nothing significant will change in people&rsquo;s health or well being.</span>"], "c": 2, "e": "عدم الاستثمار في الرعاية الصحية سيؤدي منطقيًا لتراجع جودة الحياة وانتشار أوسع للأمراض."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. How does the passage compare past and modern health care?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Both depend equally on the use of modern technology.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Modern health care uses advanced technology, unlike the past.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Health care in the past was more scientific and effective.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Health care in the past was trusted by people more than today.</span>"], "c": 1, "e": "يوضح النص أن الرعاية الصحية الحديثة تعتمد على تقنيات متطورة (الذكاء الاصطناعي، التطبيب عن بُعد) لم تكن متاحة في الماضي."}, {"pg": "4-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. Which statement best evaluates the writer&rsquo;s attitude toward health care?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer expresses frustration at how slowly medical systems develop.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer conveys hopefulness and moral commitment toward improving global health.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer shows anxiety about technological dependence in modern medicine.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The writer adopts a detached, factual tone without any emotional engagement.</span>"], "c": 1, "e": "نبرة النص متفائلة وتحث على المسؤولية الأخلاقية لتحسين الرعاية الصحية عالميًا."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. ………. the project on time, he would have been awarded.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">If he presented</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">If he presents</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Were he to present</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Had he presented</span>"], "c": 3, "e": "الجملة الرئيسية (would have been awarded) شرطي ثالث، وصيغة القلب المقابلة: Had he presented."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. ………..your laptop repaired before you left the office?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Had you had</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Have you had</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Will you have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Do you have</span>"], "c": 0, "e": "before you left (ماضٍ) يقتضي Past Perfect في تركيب السببية (have something done): Had you had."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Are you reading a story?<br>Mazen has just asked if I………a story.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was reading</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">am reading</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have read</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had read</span>"], "c": 1, "e": "الفعل الرئيسي في المضارع (has just asked)، فلا يتغير زمن الفعل المنقول: am reading."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. I……. take my certificate until I have passed the oral test.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">didn&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wouldn&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">won&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">don&rsquo;t</span>"], "c": 2, "e": "until + Present Perfect (have passed) يقتضي فعلًا رئيسيًا مستقبليًا: won't."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. He has forgotten his passport, we……... have reminded him.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">must</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had to</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ought to</span>"], "c": 3, "e": "لوم/نصيحة فائتة (كان ينبغي أن نذكّره ولم نفعل) = ought to have."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. Walid as well as his friends………. their community.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">supports</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">support</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have supported</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are supporting</span>"], "c": 0, "e": "as well as لا تُعامَل معاملة العطف؛ الفعل يطابق الفاعل الأول (Walid مفرد): supports."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">34. &ldquo;I regret eating so much sweet.&rdquo; This means, I……….so much sweet.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should eat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shouldn&rsquo;t eat</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shouldn&rsquo;t have eaten</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should have eaten</span>"], "c": 2, "e": "الندم على فعل حدث في الماضي (regret + Gerund) يُعبَّر عنه بـ shouldn't have + p.p."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">35. Which transition indicates an opposing idea?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">To sum up, &hellip;.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Another reason is&hellip;</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">For example, &hellip;</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">However, &hellip;</span>"], "c": 3, "e": "However تُستخدم للتعبير عن فكرة متضادة أو تناقض مع ما سبق ذكره."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">36. Choose the correct Arabic translation:<br>Altruism means putting others before yourself. It also means sacrificing personal needs, and helping others without expecting anything in return. Moreover, true self-denial shows great strength and kindness.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">إن الإيثار يعني تقديم الآخرين على نفسك كما أنه يعني التضحية بالاحتياجات الشخصية والآخرين دون توقع أي شيء. علاوة على ذلك فعدم الأنانية يخفي قوة عظيمة وعطفًا بالغًا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">إن الإيثار يعني تقديم الآخرين على نفسك كما أنه يعني التضحية بالاحتياجات الشخصية ومساعدة الآخرين دون توقع أي شيء في المقابل. علاوة على ذلك فإنكار الذات يظهر قوة عظيمة وعطفًا بالغًا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">إن الإيثار يعني تقديم الآخرين على نفسك كما أنه يعني الانتفاع بالاحتياجات الشخصية ومساعدة الآخرين دون توقع أي شيء. ونتيجة لذلك فإنكار الذات يظهر قوة عظيمة وعطفًا بالغًا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">إن الإيثار يعني تقديم الآخرين على شخصك كما أنه يعني التضحية بالاحتياجات الشخصية ومساعدة الآخرين دون توقع أي شيء. علاوة على ذلك فتفضيل الذات يظهر قوة عظيمة وعطفًا بالغًا.</span>"], "c": 1, "e": "الخيار (b) هو الترجمة الدقيقة الكاملة (تتضمن “مساعدة الآخرين” و“يُظهر” بشكل صحيح)؛ باقي الخيارات تحذف كلمات أو تعكس المعنى (مثل “تفضيل الذات” بدلاً من “إنكار الذات”)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">37. Choose the correct Arabic translation:<br>Nature is a wonderful gift that inspires peace and hope. Its mountains, rivers, and forests remind us how beautiful our planet is. Protecting nature means protecting our future.</span>", "o": ["<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطبيعة هبة رائعة تنشر السلام والأمل. جبالها وأنهارها وغاباتها تذكرنا بجمال كوكبنا. حماية الطبيعة تعني الحفاظ على مستقبلنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطبيعة هبة رائعة تُلهم السلام والأمل. جبالها وبحارها وغاباتها تذكرنا بجمال كوكبنا. حماية الطبيعة تعني حماية مستقبلنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطبيعة هبة رائعة تبعث فينا السلام والأمل. فجبالها وأنهارها وغاباتها تذكرنا بجمال كوكبنا. حماية الطبيعة تعني حماية مستقبلنا.</span>", "<span dir=\"rtl\" style=\"unicode-bidi:isolate\">الطبيعة هبة رائعة تُلهم السلام والأمل. جبالها وأنهارها وغاباتها تذكرنا بجمال الكون. حماية الطبيعة تعني حماية مستقبلنا.</span>"], "c": 2, "e": "الخيار (c) هو الأدق: يحافظ على تكرار “حماية...حماية” كما في الأصل، ويستخدم الكلمات الصحيحة (أنهارها/كوكبنا)؛ الخيار (b) يستخدم “بحارها” خطأ بدل “أنهارها”، و(d) يستخدم “الكون” خطأ بدل “كوكبنا”."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">38. Choose the correct English translation:<br>يعد تحديد الأولويات في حياة الإنسان من الأمور الأساسية التي تساعد على تحقيق الأهداف. عندما يحدد أولوياته بوضوح، يستطيع أن يركز على الأمور الضرورية ويقلل من التشتت والضغوط النفسية.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Prioritizing in an individual's life is one of the fundamental aspects that help achieve goals. When a person clearly defines their priorities, they can focus in important matters and reduce distractions and psychological stress.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Prioritizing in a person's life is one of the fundamental aspects that help achieve goals. When a person clearly defines his priorities, they can focus on necessary matters and reduce distractions and psychological stress.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Prioritizing in a person's life is one of the fundamental aspects that help score goals. When a person defines their priorities, it can focus on important matters and reduce distractions and psychological stress.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Prioritizing in a person's life is one of the fundamental aspects that help achieve goals. When a person accurately defines their priorities, they can focus on important matters and reduces distractions and psychological stress.</span>"], "c": 1, "e": "الخيار (b) هو التطابق شبه الحرفي والسليم نحويًا مع النص الأصلي (help achieve goals / focus on necessary matters)، بينما باقي الخيارات بها أخطاء (focus in، help score goals، عدم توافق reduces مع الفاعل الجمع)."}, {"pg": "8", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">39. Choose the correct English translation:<br>يساعدنا الثبات الانفعالي على مواجهة التحديات بثقة وقوة. فعندما نتحكم في مشاعرنا، نستطيع اتخاذ قرارات صحيحة ونتغلب على الصعوبات بفعالية ونتجنب ارتكاب الأخطاء.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emotional stability helps us face challenges with confidence and strength. When we control our emotions, we can make strict decisions, overcome difficulties effectively and avoiding making mistakes.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emotional stability helps us struggle challenges with confidence and strength. When we control our emotions, we can make the right decisions, combat difficulties effectively and avoid making mistakes.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emotional stability helps us face challenges with obedience and strength. When we control our emotions, we can make the right decisions, overcome difficulties effectively and avoid doing mistakes.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Emotional stability helps us face challenges with confidence and strength. When we control our emotions, we can make the right decisions, overcome difficulties effectively and avoid making mistakes.</span>"], "c": 3, "e": "الخيار (d) هو الترجمة السليمة تمامًا نحويًا ومعنى؛ باقي الخيارات بها كلمات خاطئة (strict بدل right، struggle بدل face، obedience بدل confidence) أو أخطاء نحوية (avoiding بدل avoid)."}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">40. The novel presents the themes of hatred and envy. Give two examples from the story that illustrate these emotions. For each example, describe the situation and explain how it demonstrates hatred or envy.</span>", "model": "One clear example of envy in the novel is Fernand's jealousy of Edmond Dantès. Fernand was in love with Mercédès, but she chose Edmond instead, which filled Fernand with such intense envy that he conspired with Danglars to have Edmond falsely accused of treason. Another example is Danglars' hatred rooted in professional jealousy: resentful that the young and talented Edmond was about to be promoted to captain ahead of him, Danglars plotted to destroy Edmond's reputation and future out of pure spite. Both examples show how envy over love and status can drive people to commit cruel and unjust acts against someone who has done them no real harm.", "marks": 2}, {"pg": "9", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">41. &ldquo;Edmund was a grateful person.&rdquo; Describe two situations from the novel that show his gratitude. For each situation, explain what Edmund did or said and why it shows he is grateful.</span>", "model": "Edmond shows deep gratitude toward Abbé Faria, the old priest who taught him for years in prison. In recognition of everything Faria gave him &mdash; education, hope, and eventually the secret of the treasure &mdash; Edmond cared for him faithfully until his death and carried out his final wishes, showing how much he valued Faria's mentorship. Edmond also shows gratitude toward Morrel, the ship owner who had always treated his father kindly and tried to help him. Once Edmond becomes wealthy under a new identity, he secretly saves Morrel's business from bankruptcy and restores his fortune, repaying his old kindness generously and anonymously.", "marks": 2}, {"pg": "10", "type": "essay", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">42. Write a paragraph of not less than SIX (6) lines on the following topic: &ldquo;Teamwork makes the dream work&rdquo;<br>In your paragraph, give an example of a situation where teamwork helps achieve a goal, and mention two benefits of working together. Make sure your ideas are clear and connected.</span>", "model": "Teamwork is one of the most powerful tools for achieving success, as the saying “teamwork makes the dream work” suggests. For example, when a group of students works together on a school project, they can divide tasks according to each member's strengths, finishing the work faster and to a higher standard than any one student could alone. One major benefit of teamwork is that it combines different skills and perspectives, leading to more creative and effective solutions to problems. Another benefit is that it builds strong relationships and mutual support, motivating team members to keep going even when the task becomes difficult. In conclusion, whether in school, sports, or the workplace, real achievements are almost always the result of people working together toward a shared goal.", "marks": 5}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">1. After the flood, the villagers showed great …………… by rebuilding their homes and continuing their lives with hope.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">weakness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">sadness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">resilience</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">anger</span>"], "c": 2, "e": "resilience تعني “صمود/قدرة على تجاوز الصعاب”، وهذا واضح من إعادة البناء والاستمرار بأمل."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">2. The president always emphasizes the importance of work. The antonym of the underlined word &ldquo;emphasize&rdquo; is………………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">understate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">assure</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">highlight</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">underestimate</span>"], "c": 0, "e": "emphasize تعني “يؤكد على/يبرز أهمية”، وعكسها المباشر understate (يقلل من شأن الشيء عند وصفه)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">3. They will implement the new policy next week. The synonym of implement is………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">enforce</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">neglect</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">disregard</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">carry on</span>"], "c": 0, "e": "implement تعني “ينفذ”، ومرادفها هنا enforce (يطبق/ينفذ بقوة القانون)."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">4. Before the final performance of the play, the actors met every afternoon for a / an……….to practice their roles.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">audition</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">celebration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">discussion</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">rehearsal</span>"], "c": 3, "e": "rehearsal تعني “بروفة/تدريب”، وهي الأنسب لممارسة الأدوار قبل العرض النهائي."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">5. Scientists explained the strange natural ............. to the public who misunderstood it.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">expedition</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">problem</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">phenomenon</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">project</span>"], "c": 2, "e": "phenomenon تعني “ظاهرة”، وهي المناسبة لوصف أمر طبيعي غريب يحتاج تفسيرًا علميًا."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">6. The task was too.................. for all of us but we were happy to perform it.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fantastic</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">overwhelming</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">compromising</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">interactive</span>"], "c": 1, "e": "overwhelming تعني “مرهق/ساحق”، وهي المناسبة مع مهمة صعبة رغم السعادة بأدائها."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">7. Aswan has a strong …………. for being one of the cleanest and safest places in the world.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">celebration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">reputation</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">decoration</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">invitation</span>"], "c": 1, "e": "reputation تعني “سمعة”، وهي المناسبة لوصف شهرة أسوان بالنظافة والأمان."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">8. During the debate, each student had to ……. a point clearly and respectfully.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">score</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">suggest</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">argue</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">say</span>"], "c": 2, "e": "argue a point تعبير ثابت يعني “يطرح وجهة نظر بالحجة والدليل”، وهو المناسب لسياق المناظرة."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">9. My friend sent me ………….SMS to invite me to the betrothal next Friday.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">a</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">an</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">no article</span>"], "c": 2, "e": "SMS تُنطق بحرف صوتي (إس)، فتسبقها أداة النكرة an."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">10. We got lost in the desert. We………………. have used the GPS.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">should</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">shouldn&rsquo;t</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">could</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">can&rsquo;t</span>"], "c": 0, "e": "نصيحة فائتة/ندم على عدم فعل شيء كان صوابًا (لم نستخدم الـ GPS ويجب أن نكون قد استخدمناه) = should have used."}, {"pg": "1", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">11. My family haven&rsquo;t ..................... been to London before. That is my first time.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">already</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">never</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">yet</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ever</span>"], "c": 3, "e": "ever تُستخدم في الجمل المنفية مع Present Perfect؛ استخدام never هنا يسبب نفيًا مزدوجًا خاطئًا مع haven't."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">12. The main idea of the passage is that …………………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Laila was afraid of birds and hated seeing them</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">helping others brings happiness and meaning to life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Laila preferred to stay home rather than go outside</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the bird was dangerous and caused problems</span>"], "c": 1, "e": "القصة كلها تبرز أن مساعدة الآخرين (حتى لو كانوا طيورًا صغيرة) تجلب السعادة والمعنى للحياة.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>It was a quiet Saturday afternoon when Laila decided to stay home and study for her final exams. The streets outside were empty, and the only sound was the soft ticking of the old wall clock. As she turned another page of her science book, she suddenly heard a scratching sound near the window. Thinking it was just the wind, she ignored it and continued reading. But the sound grew louder. Curious and a little nervous, Laila walked to the window and gently pulled the curtain aside.</p><p>To her surprise, a small injured bird was sitting on the windowsill, its wing trembling. Without hesitation, Laila opened the window and carefully picked up the tiny creature. She placed it in a small box lined with an old towel and brought it some water. The bird drank a little and then closed its eyes. Laila smiled, feeling both proud and responsible.</p><p>The next morning, she woke up early to check on her new friend. The bird looked stronger and even tried to flap its wings. Laila opened the window again, and this time the bird hopped to the edge and flew away into the bright morning sky. She watched it disappear among the trees, feeling a strange warmth in her heart.</p><p>That day, Laila realized that small acts of kindness could bring great joy. The little bird had come into her life unexpectedly, but it left her with a lesson she would never forget &mdash; compassion can turn ordinary moments into something truly meaningful.</p></div>"}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">13. The story took place…………………………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">during a school day</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">on a Friday evening</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">on a quiet Saturday afternoon</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">on a cold winter night</span>"], "c": 2, "e": "ذكر النص في بدايته: “It was a quiet Saturday afternoon”."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">14. The sentence that summarizes the last part of the story is that…………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">she found a bird, cared for it until it healed, and learned the joy of kindness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">she studied hard all day and took a nap</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">the bird built a nest in Laila&rsquo;s room and learned the joy of kindness</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">she was scared and called her neighbors for help to save the injured bird</span>"], "c": 0, "e": "هذا يلخص أحداث القصة كاملة: العثور على الطائر، رعايته حتى شفائه، وتعلم درس اللطف."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">15. ………………………………. changes Laila&rsquo;s day in the story.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The sound of rain outside</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The clock stopping suddenly</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">The appearance of the injured bird</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Unexpected visit from her friends</span>"], "c": 2, "e": "ظهور الطائر المصاب هو الحدث الذي غيّر مسار يوم ليلى الهادئ."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">16. According to Laila&rsquo;s reaction to the injured bird, what can be predicted about how she might respond to challenges in the future?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She will ignore problems and hope they solve themselves.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She will face difficulties with patience, care, and responsibility.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She will depend on others to fix every situation.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">She will avoid getting involved in emotional situations.</span>"], "c": 1, "e": "تعاملها الصبور والمسؤول مع الطائر المصاب يدل على أنها ستواجه التحديات المستقبلية بنفس الروح."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">17. We can infer that Laila is …………………….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">careless and impatient</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">kind and compassionate</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">lazy and sleepy</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">kind and depressed</span>"], "c": 1, "e": "تصرفات ليلى في رعاية الطائر المصاب تدل على أنها طيبة القلب ومتعاطفة."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">18. Laila changed her attitude when she…………………….. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">ignored the sound but later helped the bird.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">stayed inside and studied all day</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">called her teacher for advice</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">closed the window and went to sleep</span>"], "c": 0, "e": "تجاهلت ليلى الصوت في البداية ظنًا منها أنه الريح، ثم غيّرت موقفها وساعدت الطائر."}, {"pg": "3-4", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">19. We can note Laila&rsquo;s emotional transformation throughout the story when she……… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">became increasingly anxious and uncertain after helping the bird</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">moved from feeling isolated to feeling fulfilled through compassion and connection</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">felt proud at first but later regretted her decision to interfere</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">began with excitement but ended in disappointment and hating the experience</span>"], "c": 1, "e": "انتقلت ليلى من قضاء يوم هادئ بمفردها إلى الشعور بالامتلاء والدفء بعد تجربة التعاطف مع الطائر."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">20. The main idea of the passage is that automated machines …………………………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">make life harder for people to live</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are replacing all human workers</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are changing the way people live and work</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are only used in factories</span>"], "c": 2, "e": "يستعرض النص كيف غيّرت الأتمتة طريقة عيش الناس وعملهم في مجالات متعددة.", "passage": "<div class=\"rp\" dir=\"ltr\"><p>In today&rsquo;s world, automated machines play a major role in our daily lives. These machines are designed to perform tasks with little or no human control. They use sensors, computer programs, and artificial intelligence to complete jobs quickly and accurately. Automated machines can be found in many fields, from manufacturing and agriculture to healthcare and transportation.</p><p>In factories, robots work alongside people to assemble cars, pack products, or inspect items for defects. These machines can work continuously without getting tired, which increases production and reduces errors. In agriculture, automated machines help farmers plant seeds, water crops, and harvest food more efficiently. This technology saves time and labor while improving the quality of products.</p><p>Automated systems are also becoming more common in our everyday lives. For example, self-checkout machines in supermarkets allow customers to scan and pay for items without a cashier. Smart home devices can control lighting, temperature, and security automatically. In transportation, self-driving cars are being tested to make travel safer and easier.</p><p>However, automation also raises important questions. Some people worry that machines will replace human workers, leading to fewer job opportunities. Others believe that automation will create new kinds of jobs and improve living standards. As technology continues to advance, it is important for societies to find a balance between human skills and machine efficiency.</p><p>Automated machines are transforming the way we live and work. They offer speed, accuracy, and convenience, but they also challenge us to adapt to a rapidly changing world.</p></div>"}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">21. We can find the information needed about agriculture when scanning the text in the……… paragraph.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">introductory</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">second</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">fourth</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">concluding</span>"], "c": 1, "e": "ذُكرت الزراعة تحديدًا في الفقرة الثانية (In agriculture, automated machines help farmers...)."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">22. The concept of automation developed in the text by …………. .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">providing examples from different fields</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">comparing machines with animals</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">presenting one example only</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">telling details about the history of machines</span>"], "c": 0, "e": "استعرض النص أمثلة من مجالات متعددة (المصانع، الزراعة، المنازل، النقل) لشرح مفهوم الأتمتة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">23. According to the author&rsquo;s attitude toward automation, we can infer that he……….</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">believes automation is completely negative</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">supports automation but sees its challenges</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">dislikes technological progress</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">wants all jobs to be replaced by machines</span>"], "c": 1, "e": "يعرض الكاتب فوائد الأتمتة وتحدياتها معًا بموضوعية متوازنة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">24. If automation continues to grow in the future ,…………… .</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">machines will stop working in factories</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">people will avoid using technology in their lives</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">societies will need to adapt to new types of jobs</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">all machines will be removed from daily life</span>"], "c": 2, "e": "يشير النص إلى ضرورة إيجاد توازن بين المهارات البشرية وكفاءة الآلة مع استمرار تطور الأتمتة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">25. Which statement shows two conflicting arguments in the passage?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Machines are fast and people are slow.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Some fear job loss while others believe automation creates new jobs.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Farmers use automation but doctors don&rsquo;t.</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Automation only helps factories and people fear using them.</span>"], "c": 1, "e": "يعرض النص رأيين متعارضين: خوف من فقدان الوظائف مقابل اعتقاد بخلق فرص عمل جديدة."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">26. Through reading the passage we can say that ……………</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Automation improves efficiency but requires careful management</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Automation destroys the environment</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">Automated systems are not used in modern life</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">People should stop using machines and do most work manually</span>"], "c": 0, "e": "يوضح النص أن الأتمتة تحسّن الكفاءة لكنها تتطلب إدارة متوازنة بين المهارات البشرية والآلية."}, {"pg": "5-6", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">27. People&rsquo;s feelings and intentions toward automation changed throughout the text as they…..</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">move from excitement to complete rejection</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are described as balanced both hopeful and cautious</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">are angry and confused about new machines</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">become careless about technology</span>"], "c": 1, "e": "يعرض النص مزيجًا متوازنًا من الأمل (فرص جديدة) والحذر (فقدان وظائف) تجاه الأتمتة."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">28. What would you have done if you .................... asked to do the task several times?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were being</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">were</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">had been</span>"], "c": 3, "e": "الجملة الرئيسية (would have done) شرط ثالث، فجملة if تحتاج Past Perfect (مبني للمجهول: تلقيت الطلب): had been."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">29. While my father ................, I was having lunch at a nearby restaurant.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has got his car to service</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was getting his car servicing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">was getting his car serviced</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">has got his car serviced</span>"], "c": 2, "e": "While + Past Continuous للخلفية، والسببية Causative: get something done (المفعول به يتلقى الفعل) = was getting his car serviced."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">30. Do you really think that a lot of things in our life…………changed by this time next year?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have been</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will be</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">will have been</span>"], "c": 3, "e": "by this time next year: زمن مستقبلي محدد + مبني للمجهول = Future Perfect Passive: will have been."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">31. My father&rsquo;s been quite different.................coming back from America.</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">for</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">since</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">during</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">while</span>"], "c": 1, "e": "since + نقطة زمنية بداية التغيير مع Present Perfect."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">32. When was the last time that you……. your cousins?</span>", "o": ["<span dir=\"ltr\" style=\"unicode-bidi:isolate\">have seen</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">seeing</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">saw</span>", "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">see</span>"], "c": 2, "e": "When was the last time + Past Simple (سؤال عن نقطة زمنية محددة في الماضي)."}, {"pg": "7", "type": "mcq", "q": "<span dir=\"ltr\" style=\"unicode-bidi:isolate\">33. Yesterday, I played the final w
